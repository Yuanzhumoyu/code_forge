[workspace]
members = [
    ".",
    "crates/foundation/forge-ir",
    "crates/foundation/forge-mem",
    "crates/frontend/forge-grammar",
    "crates/frontend/forge-dsl",
    "crates/frontend/forge-hir",
    "crates/frontend/forge-hir-macro",
    "crates/middle/forge-opt",
    "crates/backend/forge-codegen",
    "crates/tools/forge-object",
    "crates/tools/forge-plugin",
    "crates/tools/forge-rustc",
    "crates/tools/forge-tests",
    "crates/tools/cargo-forge",
    "examples/mini_c",
]
resolver = "3"

[package]
name = "code-forge"
version = "0.2.0"
edition = "2024"
description = "Code Forge: specification-driven compiler infrastructure — write language grammars + ISA definitions, get a working compiler"

[dependencies]
forge-ir = { path = "crates/foundation/forge-ir" }
forge-mem = { path = "crates/foundation/forge-mem" }
forge-opt = { path = "crates/middle/forge-opt" }
forge-codegen = { path = "crates/backend/forge-codegen" }
forge-dsl = { path = "crates/frontend/forge-dsl" }
forge-grammar = { path = "crates/frontend/forge-grammar" }
smallvec = "1.16.0"

# Optional tools crates
forge-object = { path = "crates/tools/forge-object", optional = true }
forge-plugin = { path = "crates/tools/forge-plugin", optional = true }

[features]
default = ["jit"]
# JIT 运行时 gate：转发到 forge-codegen/jit（JitCompiler 模块 + 根门面 re-export）
jit = ["forge-codegen/jit"]
object-file = ["dep:forge-object"]
plugins = ["dep:forge-plugin"]

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "compile_bench"
harness = false
