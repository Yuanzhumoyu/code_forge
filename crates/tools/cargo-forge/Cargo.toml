[package]
name = "cargo-forge"
version = "0.1.0"
edition = "2024"
description = "cargo 子命令：把 forge-rustc codegen backend 融进 rust 工具链（build/run/init/doctor/backend）"

[[bin]]
name = "cargo-forge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }

# 主 workspace 成员（见根 Cargo.toml [workspace] members）
