[package]
license = "MIT OR Apache-2.0"
publish = false
name = "forge-rustc"
version = "0.1.0"
edition = "2024"
description = "Forge rustc backend: use code-forge as a rustc codegen backend"

[lib]
crate-type = ["dylib"]

[dependencies]
code-forge = { path = "../../..", features = ["object-file", "plugins"] }
