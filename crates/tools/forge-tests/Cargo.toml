[package]
name = "forge-tests"
version = "0.1.0"
edition = "2024"
description = "Forge Tests: generic integration test framework for ISA backends (coverage / exec), v12-only (x86_v12)"

[dependencies]
# 执行测试依赖 JitCompiler——显式启用 jit feature（默认构建即含）
code-forge = { path = "../../..", features = ["jit"] }
forge-rustc = { path = "../forge-rustc", optional = true }

[features]
default = []

# ── nightly：forge-rustc 后端集成测试（rustc_private，需 nightly + rustc-dev）──
nightly = ["forge-rustc"]
