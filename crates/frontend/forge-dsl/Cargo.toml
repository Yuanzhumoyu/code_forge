[package]
name = "forge-dsl"
version = "0.2.0"
edition = "2024"
description = "ISA-DSL v10: TOML-driven ISA code generator with proc macros"

[lib]
proc-macro = true

[dependencies]
forge-grammar = { path = "../forge-grammar" }
toml = "1.1.3"
serde = { version = "1", features = ["derive"] }
syn = { version = "3.0.3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
thiserror = "2"
