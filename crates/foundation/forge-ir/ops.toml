# forge-ir 指令元数据单一事实源（v3 方案 S1）
#
# `build.rs` 读本文件生成 `$OUT_DIR/opcode_gen.rs`：`Opcode` 枚举、`Opcode::ALL`、
# `Opcode::INFOS`（名称/助记符/类别/操作数元数/结果数/UB/副作用/条件通道/LLVM 文本名）、
# `name()`/`from_name()`/`mnemonic()`/`from_mnemonic()`/`from_llvm_name()`/
# `result_count()`/`may_ub()`/`has_side_effect()`/`expected_operand_count()`。
# **新增一个 opcode = 在本文件加一行**（生成代码不可能与枚举漂移：两者同源）。
#
# 字段（缺省值见括号；`name`/`mnemonic`/`category`/`doc`/`operands`/`llvm` 必填）：
#   name        变体名（PascalCase；ISA TOML 的 `op = "Iadd"` 契约）
#   mnemonic    规范助记符（display 用；须唯一，`from_mnemonic` 的逆）
#   category    分组（生成枚举时作分节注释）
#   doc         变体文档（生成 `#[doc = ...]`）
#   operands    值操作数个数：非负整数 | "variadic"（个数不定，不检查）
#   results     结果值个数（1）
#   may_ub      是否可能有未定义行为（false）
#   side_effect 是否有副作用 ⇒ 不可被 DCE 删除（false）
#   cond        该指令携带**比较条件 immediate**：IntCC | FloatCC（无）
#   llvm        LLVM 文本指令名（display 输出用；单个词、无空格）
#   llvm_parse  该文本名是否可解析回本 opcode（true）。`false` = 仅 display 用
#               （别名/向量精化/常量内联/需要条件等）——有损对从此**声明**在这里，
#               不再靠"读者自己比对正反两张表"
#   llvm_alias  额外的可解析名（字符串数组；旧名/宽松名，如 callbr/ptrtoaddr）
#   type_rule   **verifier 的逐指令类型规则族**（必填）：
#               none / binop_same / same3 / cmp_int / cmp_float / select /
#               convert / cmpxchg_pair / load / store / call / call_indirect
#               规则本体在 `verify.rs`（形状类规则在 `type_rules.rs`，verifier 与
#               builder 共用一份实现）；族名写错 → 构建期报错，新增族名 →
#               `verify.rs` 的穷举 match 编译失败（双向 fail-closed）。
#               `none` 有两种含义，注释里点名：① 确实没有类型规则；
#               ② 检查在 immediate 阶段（GEP 索引 / AtomicRmw 判别值 / 聚合索引）。
#               ⚠️ 这是 **verifier** 的规则，不是 builder 的构造约束：builder 刻意
#               允许"混合宽度操作数 + 结果类型 upcast"（`iadd(i8, i64) → i64`，见
#               `builder.rs` 的 5 个 upcast 测试），其类别断言比 verifier 更严。
#   convert     type_rule = "convert" 专用的事实表：
#               { src = "any|int|float|ptr|vector", dst = 同上,
#                 width = "any|widen|narrow|equal_bytes|equal_total_bits" }
#
# 名字唯一性都在生成期断言：变体名、助记符，以及"解析名集合
# （`llvm_parse` 的 llvm 名 ∪ 全部别名）"——后者若冲突会让 `from_llvm_name`
# 变成"查第一个"的隐式优先级，正是要消灭的那种约定。
#
# 关于条件：`Icmp`/`Fcmp` 曾经把条件放在**变体载荷**里（`Icmp { cond }`），
# 与其它指令"属性走 immediate 通道"的表示并存；2026-09-14 归一为
# `Immediate::IntCC`/`FloatCC`（宿主 lowering 用 `IntCC::code()`/`FloatCC::code()`
# 喂 `current_immediates`，ISA TOML 的 `cond` 谓词读同一个数字）。
#
# 口径：这些字段此前散在 `opcode.rs` 的 6 张手写表 + `ir_parser/llvm_mapping.rs`
# 的正/反两张文本名表里，逐项搬迁、由 `tests/opcode_table.rs` 守卫。

