mnemonic = "fmul"
type_rule = "binop_same"
llvm = "fmul"
category = "float-arith"
doc = "浮点乘法：按 IEEE-754 舍入，NaN 与 Inf 依 IEEE 传播，不 trap。"
operands = 2

[[op]]
name = "Fdiv"
mnemonic = "fdiv"
type_rule = "binop_same"
llvm = "fdiv"
category = "float-arith"
doc = "浮点除法：a 除以 b，除零得 Inf 或 NaN（IEEE 语义），不 trap。"
