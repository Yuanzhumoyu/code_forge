# ── 终结符（v3 方案 S4 主体：终结符并入指令流）────────────────────────
#
# 终结符不再是独立枚举：它就是**一条指令**——存进 `dfg.insts`，块经
# `BlockData.terminator: Option<Inst>` 引用，**不进 `inst_order`**
# （因此"块内指令列表"的既有语义与全部迭代点不变）。
#
# 编码约定（唯一事实源 = `dfg.rs` 的 `encode_terminator` 与解码访问器）：
#   Ret          operands = 返回值（0 个 = void）
#   Jmp          operands = 目标块实参；immediates = [Block(target)]
#   Br           operands = [cond, then_args…, else_args…]；
#                immediates = [Block(then), Block(else), Uint(then_argc), Uint(else_argc)]
#   Switch       operands = [disc, default_args…, case0_args…, …]；
#                immediates = [Block(default), Uint(default_argc), Uint(case_count),
#                              (Int(val), Block(target), Uint(argc))…]
#   Unreachable  operands = []；immediates = []
#   Invoke       operands = [args…, normal_args…, unwind_args…]；
#                immediates = [Func(callee), Block(normal), Block(unwind), Uint(argc),
#                              Uint(normal_argc), Uint(unwind_argc), Type(ret_ty)]
#   Resume       operands = [value]；immediates = []
#
# 一律 variadic + `results = 0` + `type_rule = "none"`：终结符的操作数形状由
# 上面这套约定（以及解码访问器）保证，不走逐指令类型规则族。
[[op]]
name = "Ret"
mnemonic = "ret"
type_rule = "none"
llvm = "ret"
category = "terminator"
doc = "函数返回：操作数是返回值，void 函数没有操作数，属于终结指令。"
operands = "variadic"
results = 0

[[op]]
name = "Jmp"
mnemonic = "jmp"
type_rule = "none"
llvm = "jmp"
category = "terminator"
doc = "无条件跳转：立即数给目标块，属于终结指令，不带任何条件。"
operands = "variadic"
results = 0

[[op]]
name = "Br"
mnemonic = "br"
type_rule = "none"
llvm = "br"
category = "terminator"
doc = "条件分支：操作数 0 是 i1 条件，立即数给 then 与 else 两个块；终结指令。"
operands = "variadic"
results = 0

[[op]]
