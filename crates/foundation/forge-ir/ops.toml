# ── 变参取参（v20 变参 V2）──────────────────────────────────────────────
#
# `va_start`：**被调方**取"未命名实参区"的地址（结果类型 = 指针）。它是**约定相关**的
# 取值：落点由 `AbiPlan::va_area`/`CallLayout` 给（win64 = 栈指针 ⇒ 就是帧内那段栈地址；
