# forge-ir 指令元数据单一事实源（v3 方案 S1）
#
# `build.rs` 读本文件生成 `$OUT_DIR/opcode_gen.rs`：`Opcode` 枚举、`Opcode::ALL`、
# `Opcode::INFOS`（名称/助记符/类别/操作数元数/结果数/UB/副作用）、`name()`/
# `from_name()`/`mnemonic()`/`from_mnemonic()`/`result_count()`/`may_ub()`/
# `has_side_effect()`/`expected_operand_count()`。**新增一个 opcode = 在本文件加一行**
# （生成代码不可能与枚举漂移：两者同源）。
#
# 字段（缺省值见括号；`operands` 必填）：
#   name        变体名（PascalCase；ISA TOML 的 `op = "Iadd"` 契约）
#   mnemonic    规范助记符（display 用；须唯一，`from_mnemonic` 的逆）
#   category    分组（生成枚举时作分节注释）
#   doc         变体文档（生成 `#[doc = ...]`）
#   operands    值操作数个数：非负整数 | "variadic"（个数不定，不检查）
#   results     结果值个数（1）
#   may_ub      是否可能有未定义行为（false）
#   side_effect 是否有副作用 ⇒ 不可被 DCE 删除（false）
#   payload     变体载荷类型（无）——目前只有 Icmp/Fcmp 带条件载荷
#   payload_default  载荷的默认变体名（声明 payload 时必填，`ALL` 里用）
#
# 口径：这些字段此前散在 `opcode.rs` 的 6 张手写表里（枚举/`result_count`/
# `may_ub`/`has_side_effect`/`mnemonic`/`expected_operand_count`），逐项搬迁、
# 由 `tests/opcode_table.rs` 与 `tests/ops_toml.rs` 守卫。

