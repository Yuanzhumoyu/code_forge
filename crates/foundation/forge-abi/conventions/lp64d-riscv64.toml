# (ISA, 约定) 寄存器绑定：RISC-V LP64D → riscv64_v12
#
# 按**类**计数：整数序列 a0-a7 与浮点序列 fa0-fa7 各自推进（与 Win64 的
# "按位置共享游标"相反）。浮点参数走 F 寄存器组（D 扩展；f32 也占一个槽）。

isa = "riscv64_v12"
conv = "lp64d"

[pools]

# a0-a7 = X10-X17。sret 指针占 a0（规则侧 `hidden = { sret_pool = "int", sret_slot = 0 }`）。
int = ["X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17"]

# fa0-fa7 = F10-F17。
float = ["F10", "F11", "F12", "F13", "F14", "F15", "F16", "F17"]

# s0/s1 + s2-s11 = X9 + X18-X27（ra 由 `includes_link = true` 表达，不入此表）。
cs_gpr = ["X9", "X18", "X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27"]

# 返回寄存器：a0:a1 = X10:X11（psABI 的返回值就在 a0/a1——与参数池**同号**是这份约定
# 的事实，但仍然是两套位置序列，所以单独声明）。
ret_int = ["X10", "X11"]
ret_float = ["F10", "F11"]
