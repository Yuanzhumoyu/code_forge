# (ISA, 约定) 寄存器绑定：AAPCS64 → arm64_v12
#
# v20 A5 起 arm64 谱已有 `[reg.fpr8]`（V0..V31）与 `fpr_mov` 角色，
# 因此浮点/HFA 参数与返回都有寄存器可落。

isa = "arm64_v12"
conv = "aapcs64"

[pools]

# 整数/指针参数 x0-x7（按类计数）。
int = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7"]

# AAPCS64 用**独立的 x8** 持有间接结果指针（这是旧实现最容易写错的一处：
# x86 的 sret 语义是"首 int 参数槽"= RCX，直接照搬到 AArch64 会占掉 x0）。
# 独立池 + `sret_slot = 0` 表达"x8 不在用户参数序列里"。
sret = ["X8"]

# x19-x28（x29 fp / x30 lr 由帧件保存，规则侧 `includes_link = true` 表达 lr）。
cs_gpr = ["X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27", "X28"]

# 浮点/HFA 参数池：v0-v7（AAPCS64 的浮点参数序列，按类计数）。
float = ["V0", "V1", "V2", "V3", "V4", "V5", "V6", "V7"]

# 返回寄存器：X0/X1（整数与 ≤16B 聚合的 x0:x1）+ V0（浮点/HFA 返回）。
ret_int = ["X0", "X1"]
# HFA（≤4 成员）的返回落在连续的 v0-v3（`Placement::RegGroup`；发射侧 ≥3 槽的搬运还在 A6）。
ret_float = ["V0", "V1", "V2", "V3"]
