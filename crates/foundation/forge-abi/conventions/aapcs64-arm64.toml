# (ISA, 约定) 寄存器绑定：AAPCS64 → arm64
#
# v20 A5 起 arm64 谱已有 `[reg.fpr8]`（V0..V31）与 `fpr_mov` 角色，
# 因此浮点/HFA 参数与返回都有寄存器可落。

isa = "arm64"
conv = "aapcs64"

# 对象层链接器重定位（v27 M6-98）：**目标工具链事实**，不是 ISA 编码事实。
# key = ISA `[asm.reloc.<名>]` 的语义名；对象层按 (格式, 名字) 查表——
# `forge-object` 只按数据落类型、清位段，没有任何 `Architecture` 分支。
#   call26 = A64 `BL` 的 imm26 位段；ELF 的 R_AARCH64_CALL26 = 283，
#            链接器重写低 26 位（`clear_mask` = 写对象前要清零的位段；
#            ELF 用 RELA ⇒ addend 在重定位项，指令位段写 0）。
[link.elf]
call26 = { type = 283, clear_mask = 0x03FF_FFFF }
# 全局地址（MOVZ/MOVK 的 16 位立即数，`hw` 选片）：R_AARCH64_MOVW_UABS_G0..G3 =
# 262/264/266/268；补丁位段 = 指令字 [20:5]（clear_mask 让 RELA 的 addend 独自成值）。
# 正确的 ELF 编号（AArch64）：PREL16=262、MOVW_UABS_G0=263、G0_NC=264、
# G1=265、G1_NC=266、G2=267、G2_NC=268、G3=269。MOVZ 取 G3（溢出检查档），
# 三条 MOVK 取对应的 _NC 档（movk 无溢出检查语义）。
abs_g0 = { type = 264, clear_mask = 0x001F_FFE0 }
abs_g1 = { type = 266, clear_mask = 0x001F_FFE0 }
abs_g2 = { type = 268, clear_mask = 0x001F_FFE0 }
abs_g3 = { type = 269, clear_mask = 0x001F_FFE0 }

[pools]

# 整数/指针参数 x0-x7（按类计数）。
int = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7"]

# AAPCS64 用**独立的 x8** 持有间接结果指针（这是旧实现最容易写错的一处：
# x86 的 sret 语义是"首 int 参数槽"= RCX，直接照搬到 AArch64 会占掉 x0）。
# 独立池 + `sret_slot = 0` 表达"x8 不在用户参数序列里"。
sret = ["X8"]

# x19-x28（x29 fp / x30 lr 由帧件保存，规则侧 `includes_link = true` 表达 lr）。
cs_gpr = ["X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27", "X28"]

# AAPCS64 还要保 v8-v15 的**低 64 位**。**注意现状**：这一步目前只落在
# `AbiPlan.callee_saved`（引擎侧的事实，`clobbers` 因此不再把它们算作被破坏）；
# **发射侧还没按类分派保存指令**（`callee_save` 角色目前唯一指向 STURX，是 GPR 视图）
# ⇒ regalloc 仍按谱里的 clobber 集把它们当"跨调用不安全"（保守、安全方向）。
# 让帧件按寄存器类选 STURD/STURX 是 A6 的活（role 需要能带类限定）。
cs_fpr = ["V8", "V9", "V10", "V11", "V12", "V13", "V14", "V15"]

# 浮点/HFA 参数池：v0-v7（AAPCS64 的浮点参数序列，按类计数）。
float = ["V0", "V1", "V2", "V3", "V4", "V5", "V6", "V7"]

# 返回寄存器：X0/X1（整数与 ≤16B 聚合的 x0:x1）+ V0（浮点/HFA 返回）。
ret_int = ["X0", "X1"]
# HFA（≤4 成员）的返回落在连续的 v0-v3（`Placement::RegGroup`；发射侧 ≥3 槽的搬运还在 A6）。
ret_float = ["V0", "V1", "V2", "V3"]
