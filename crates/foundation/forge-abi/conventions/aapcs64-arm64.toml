# (ISA, 约定) 寄存器绑定：AAPCS64 → arm64_v12
#
# **已知缺口（A5/A6 补）**：arm64 谱目前**没有 FPR/VEC 寄存器组**，也没有
# `fpr_mov`/`vec_mov`/`wide_vec_*` 角色，因此本文件**不给 `float` 池**——
# 一旦真的规划出浮点/HFA 落点，引擎会明确报 `MissingPool`（fail-closed），
# 而不是悄悄把浮点值当整数塞进 X 寄存器。补齐路径：谱里加 `[reg.fpr8]`
# （`V0..V31`）+ 浮点搬运指令的角色声明。

isa = "arm64_v12"
conv = "aapcs64"

[pools]

# 整数/指针参数 x0-x7（按类计数）。
int = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7"]

# AAPCS64 用**独立的 x8** 持有间接结果指针（这是旧实现最容易写错的一处：
# x86 的 sret 语义是"首 int 参数槽"= RCX，直接照搬到 AArch64 会占掉 x0）。
# 独立池 + `sret_slot = 0` 表达"x8 不在用户参数序列里"。
sret = ["X8"]

# x19-x28（x29 fp / x30 lr 由帧件保存，规则侧 `includes_link = true` 表达 lr）。
cs_gpr = ["X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27", "X28"]

# 返回寄存器：X0/X1（整数与 ≤16B 聚合的 x0:x1）。**浮点返回池同样缺**——
# `float` 池都没有，`ret_float` 自然也无从谈起（同一个缺口）。
ret_int = ["X0", "X1"]
