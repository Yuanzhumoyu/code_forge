# demo_include（base 片段）—— `include` 组合的**被包含**部分（v18 S7d）
#
# 与 `include_root.toml` 一起验证：数组节按 include 序追加、表节跨文件合并、
# 以及 `[[override]]` 显式覆盖（根文件把 base 的 `[meta].version` 改掉）。

[reg.gpr32]
names = ["R0", "R1", "R2", "R3"]

[[operand_slots]]
name = "r"
kind = "reg"
class = "gpr32"
roles = "inout"

[[forms]]
name = "RR"
fields = [
  "u4[15:12]:opcode",
  "u4[11:8]:rd",
  "u4[7:4]:rs1",
]

[[instructions]]
name = "IADD"
form = "RR"
opcode = 1
ops = ["dst:r:out", "src:r"]
asm = "iadd {dst}, {src}"
