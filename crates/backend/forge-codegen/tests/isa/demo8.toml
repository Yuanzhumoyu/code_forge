#:schema ../../../isa-dsl.schema.json
# ============================================================
# demo8 — 1 字节寄存器 ISA（去「宽度写死」回归夹具）
# ============================================================
#
# 目的：证明「寄存器宽度写死」已从 DSL 生成期与宿主流水线中消除——
# 本 ISA **只有一个 1 字节 GPR 组** `[reg.gpr8]`（没有 gpr16/gpr32/gpr64），
# 历史实现（主 GPR 组锚定 `GPR(8).or(GPR(4))`、地址/槽宽内置 8 字节）在
# 这个文件上会退化成"生成成功但语义错误"或构造不存在的类：
#
# - 主 GPR 类 → `GPR(1)`（`[meta].default_gpr_width` 派生自最宽已声明组）
# - 地址类 → `GPR(1)`（`[meta].addr_width = 1`）
# - 值池 → `GPR(1)`（`[meta].value_gpr_width = 1`）——宿主编译 i16/i32/i64
#   会被 `class_for_type` 值池门**编译期拒绝**（Unsupported）；本 ISA 未声明
#   任何浮点寄存器组，故 f32/f64/v64/v128/v256 同样被拒（值池门判据 =
#   寄存器文件存在性 + 池宽，不只是比宽度），不再按 8 字节池生成不存在的类
# - 栈槽单位 / 帧指针保存槽 → 1 字节（`slot_bytes` / `fp_overhead_bytes`）
# - decode 缺省 opsize → 8 位（`[meta].default_opsize = 8`，生成代码里的
#   `__opsize` 单位是**字节** = 1）
#
# 指令字宽是**另一条轴**：本夹具刻意保持 32 位字（与 demo 一致），把
# 「1 字节寄存器」单独隔离验证。「8 / 12 / 100 位指令字」的回归夹具分别是
# demo_inst8 / demo_inst12 / demo_inst100
# （`[meta].default_inst_width` 无白名单/上限，见 docs/reference/isa-dsl.md）。
#
# 验证：crates/backend/forge-codegen/tests/demo8_tests.rs

[meta]
name = "demo8"
version = "15.0"
endian = "little"
mode = 8
# 位（= 生成代码里 __opsize 的 1 字节）
case_insensitive_regs = true
comment_char = "#"
label_suffix = ":"
mnemonic_case = "insensitive"

# ─────────────────────────── 寄存器组（唯一，1 字节）───────────────────────────
[encoding]
kind = "fixed"
bits = 32
default_opsize = 8

[reg.gpr8]
base_index = 0
names = ["A0", "A1", "A2", "A3", "A4", "A5", "A6", "A7"]

# ─────────────────────── 命名位域 ───────────────────────

[types]
ptr = "gpr8"

[operand.a8]
kind = "reg"
class = "gpr8"
roles = "inout"

[operand.lab]
kind = "label"
signed = true
bits = 8

[operand.imm8]
kind = "imm"
signed = true
bits = 8

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "R"
fields = [
  "u8[7:0]:opcode",
  "u3[10:8]:rd",
  "u3[13:11]:rs1",
  "u3[16:14]:rs2",
]

[[forms]]
name = "RR"
fields = [
  "u8[7:0]:opcode",
  "u3[10:8]:rd",
  "u3[13:11]:rs1",
]

[[forms]]
name = "RI"
fields = [
  "u8[7:0]:opcode",
  "u3[10:8]:rd",
  "u3[13:11]:rs1",
  "u8[23:16]:imm8",
]

[[forms]]
name = "RI2"
fields = [
  "u8[7:0]:opcode",
  "u3[10:8]:rd",
  "u8[23:16]:imm8",
]

[[forms]]
name = "B"
fields = [
  "u8[7:0]:opcode",
  "u3[13:11]:rs1",
  "u8[23:16]:imm8",
]

[[forms]]
name = "W"
fields = [
  "u32[31:0]:opcode",
]

# ─────────────────────────── 指令 ───────────────────────────

[[instructions]]
name = "ADD8"
group = "add"
form = "R"
opcode = 0x10
ops = ["dst:a8:out", "src:a8", "src2:a8"]
asm = "add {dst}, {src}, {src2}"

[[instructions]]
name = "SUB8"
group = "sub"
form = "R"
opcode = 0x11
ops = ["dst:a8:out", "src:a8", "src2:a8"]
asm = "sub {dst}, {src}, {src2}"

[[instructions]]
name = "MOV8"
group = "mov"
data_width = 8
form = "RR"
opcode = 0x20
ops = ["dst:a8:out", "src:a8"]
asm = "mov {dst}, {src}"

[[instructions]]
name = "MOV8_R_IMM8"
group = "mov"
form = "RI2"
opcode = 0x21
ops = ["dst:a8:out", "imm:imm8"]
asm = "mov {dst}, {imm}"

# 加载/存储（地址 = 基址寄存器 + 8 位偏移；不做独立 mem 槽，与 riscv 同形）
[[instructions]]
name = "LD8"
form = "RI"
opcode = 0x30
ops = ["dst:a8:out", "base:a8", "imm:imm8"]
asm = "ld {dst}, {base}, {imm}"

[[instructions]]
name = "ST8"
form = "RI"
opcode = 0x31
ops = ["src:a8", "base:a8", "imm:imm8"]
asm = "st {src}, {base}, {imm}"

# 帧分配/释放（rd = rs1 ± imm8）
[[instructions]]
name = "SUBI8"
roles = ["frame_alloc"]
form = "RI"
opcode = 0x40
ops = ["dst:a8:out", "src:a8", "imm:imm8"]
asm = "subi {dst}, {src}, {imm}"

[[instructions]]
name = "ADDI8"
roles = ["frame_free"]
form = "RI"
opcode = 0x41
ops = ["dst:a8:out", "src:a8", "imm:imm8"]
asm = "addi {dst}, {src}, {imm}"

# 返回（全字位域；word = 1，与 NOP 的 0 区分）
[[instructions]]
name = "RET"
roles = ["ret"]
form = "W"
opcode = 1
effect = ["Ret"]
asm = "ret"

# 分支（标签槽）
[[instructions]]
name = "BRZ"
form = "B"
opcode = 0x50
effect = ["Branch"]
ops = ["src:a8", "target:lab"]
asm = "brz {src}, {target}"

# 无操作数（全字位域，避免与 opcode 0x10 撞车）
[[instructions]]
name = "NOP"
form = "W"
opcode = 0
asm = "nop"

# ════════════════════════════════════════════════════════════
# TargetMachine 接入：调用约定 + 帧 + 序言/尾声 + lowering
# ════════════════════════════════════════════════════════════

[stack]
# 1 字节寄存器 → 槽单位 / 栈对齐 / 帧保存槽全 = 1（不写死 x86 的 8/16）
slot = 1
align = 1
fp_save = 1

# 返回寄存器 A0；Return/调用方返回值移动目标


[machine]
addr = "gpr8"
value_gpr = "gpr8"
# 机器事实（v20 A5-3 起是正式位置，旧 `[abi]` 同名键已删除）：
# spill 搬运临时寄存器（regalloc 不可分配）+ A6/A7 是 fp/sp（已在 RegInfo 排除；
# 显式列出以验证名字解析）+ 帧件会保存的那组 GPR（本夹具不保存任何寄存器）。
spill_scratch = ["A4", "A5"]
fixed_regs = ["A6", "A7"]
callee_saved_gpr = []

[machine.frame]
sp = "A7"
fp = "A6"
# fp 保存槽 = 1 字节（不是 x86 的 8）
fp_push_bytes = 1

[emit]
align_pad = 0
# 无 JMP 指令：return block 直接 fall-through 到函数末尾的尾声（单 return 安全）
epilogue_label = false


# 溢出模板（基址 = A6 帧指针；LD8/ST8 = Reg + Reg + imm8）
[spill.GPR]
load = "LD8 {0}, A6, {1}"
store = "ST8 {0}, A6, {1}"
base = "A6"

# ── 显式别名（多态引用名 → 指令名列表）──
[[lowering]]
op = "Iadd"
insts = ["add {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
insts = ["sub {out}, {0}, {1}"]

[[lowering]]
op = "Iconst"
insts = ["mov {out}, {iconst}"]

[[lowering]]
op = "Copy"
insts = ["mov {out}, {0}"]
