[package]
name = "mini_c"
version = "0.1.0"
edition = "2024"
description = "Mini C subset compiler — demonstrates forge-grammar frontend + forge-codegen backend"

[lib]
name = "mini_c"
path = "src/lib.rs"

[[bin]]
name = "mini_c"
path = "src/main.rs"

[dependencies]
# mini_c 是 JIT 演示——显式启用 jit feature（即使根 crate 以 --no-default-features 构建）
code-forge = { path = "../..", features = ["jit"] }
forge-hir = { path = "../../crates/frontend/forge-hir" }
