# x86-64 ISA v11 — Unified width-aware model, Intel SDM compliant
#
# 每条指令通过 opsize 字段原生支持 16/32/64-bit 操作数:
#   opsize=16: 0x66 prefix  |  opsize=32: default  |  opsize=64: REX.W=1
#
# 所有操作均为 register-direct (ModRM.mod=3).

[meta]
name = "x86_64"
version = "10.0"
endian = "little"
mode = 64
max_inst_len = 15
no_default_lowering = true

[meta.capabilities]
variable_length = true
prefix_layers = 4

# ═══════════════════════════════════════════════
# 寄存器组
# ═══════════════════════════════════════════════

[reg.gpr]
count = 16
width = 64
names = ["RAX","RCX","RDX","RBX","RSP","RBP","RSI","RDI","R8","R9","R10","R11","R12","R13","R14","R15"]

[reg.xmm]
count = 16
width = 128
prefix = "XMM"

# ═══════════════════════════════════════════════
# ABI 配置 (System V AMD64)
# ═══════════════════════════════════════════════

[abi]
stack_align = 16
red_zone = 128

[abi.frame]
sp = "RSP"
fp = "RBP"

[abi.callee_saved]
gpr = ["RBX","R12","R13","R14","R15"]
xmm = []

[abi.arg_regs]
gpr = ["RCX","RDX","R8","R9"]
xmm = []

[abi.ret_regs]
gpr = ["RAX","RDX"]
xmm = []

[abi.precolor]
VReg0 = "RAX"
VReg2 = "RDX"
VReg96 = "R10"
VReg97 = "R11"

[abi.scratch]
TMP0 = 96   # R10 — general-purpose temporary
CL   = 97   # R11 — shift count register

# ═══════════════════════════════════════════════
# 动态类型 (Dynamic Types)
#
# Opsize: 操作数宽度，x86-64 支持 8/16/32/64-bit。
# 此类型作为指令字段，驱动编码宏的条件前缀/REX 发射。
# ═══════════════════════════════════════════════

[dyn.opsize]
kind = "u8"
values = [8, 16, 32, 64]
default = 64

# ═══════════════════════════════════════════════
# REX 前缀位布局 & 条件段逻辑
#
#   REX byte: [7:4]=0100  [3]=W(64-bit)  [2]=R(reg.hi)  [1]=X  [0]=B(rm.hi)
#
#   Width-aware 编码规则:
#     opsize=16: 始终发射 0x66 (Operand Size Override)
#                若 reg≥8 或 rm≥8: 额外发射 REX (W=0, R/B set)
#     opsize=32: 默认。仅当 reg≥8 或 rm≥8 时发射 REX (W=0)
#     opsize=64: 始终发射 REX.W=1 + R/B 位
#
#   条件段语法: ?condition { ... }
#     ${opsize} → opsize 字段值
#     ${reg}    → ModRM.reg 寄存器编号
#     ${rm}     → ModRM.r/m 寄存器编号
# ═══════════════════════════════════════════════

# ═══════════════════════════════════════════════
# 编码宏 (Encoding Macros) — Width-Aware
# ═══════════════════════════════════════════════

# $modrm_rr — Width-aware opcode + ModRM(mod=3, reg, rm)
# 3 个条件段 + 1 个无条件段:
#   opsize=16:          0x66 prefix
#   opsize=64:          REX.W=1 (含 R/B 扩展)
#   opsize≠64, reg≥8 或 rm≥8: REX.W=0 (仅扩展位)
#   无条件:             opcode + ModRM(mod=3, reg, rm)
[enc_macros.modrm_rr]
params = ["opsize", "opcode", "reg", "rm"]
pattern = "?${opsize}==16 {0x66:[0;8]} ?${opsize}==64 {0x4:[4;4]}{1:[3;1]}{${reg}:[2;1;3]}{0:[1;1]}{${rm}:[0;1;3]} ?${opsize}!=64&&(${reg}>=8||${rm}>=8) {0x4:[4;4]}{0:[3;1]}{${reg}:[2;1;3]}{0:[1;1]}{${rm}:[0;1;3]} {${opcode}:[0;8]} {${rm}:[0;3]}{${reg}:[3;3]}{3:[6;2]}"

# $modrm_0f_rr — Width-aware two-byte opcode (0x0F escape) + ModRM
# 与 modrm_rr 相同，但在 opcode 前插入 0x0F 字节
[enc_macros.modrm_0f_rr]
params = ["opsize", "opcode", "reg", "rm"]
pattern = "?${opsize}==16 {0x66:[0;8]} ?${opsize}==64 {0x4:[4;4]}{1:[3;1]}{${reg}:[2;1;3]}{0:[1;1]}{${rm}:[0;1;3]} ?${opsize}!=64&&(${reg}>=8||${rm}>=8) {0x4:[4;4]}{0:[3;1]}{${reg}:[2;1;3]}{0:[1;1]}{${rm}:[0;1;3]} {0x0F:[0;8]} {${opcode}:[0;8]} {${rm}:[0;3]}{${reg}:[3;3]}{3:[6;2]}"

# $op_rm — Width-aware single-operand (F7 /digit + ModRM)
# 三段条件:
#   opsize=16:           0x66 prefix
#   opsize=64:           REX.W=1 + REX.B (if rm≥8)
#   opsize≠64, rm≥8:     REX (W=0, B=1) for extended regs
#   无条件:              F7 opcode + ModRM(mod=3, ext, rm)
[enc_macros.op_rm]
params = ["opsize", "ext", "rm"]
pattern = "?${opsize}==16 {0x66:[0;8]} ?${opsize}==64 {0x4:[4;4]}{1:[3;1]}{0:[2;1]}{0:[1;1]}{${rm}:[0;1;3]} ?${opsize}!=64&&${rm}>=8 {0x4:[4;4]}{0:[3;1]}{0:[2;1]}{0:[1;1]}{${rm}:[0;1;3]} {0xF7:[0;8]} {${ext}:[3;3]}{${rm}:[0;3]}{3:[6;2]}"

# $op_rm_imm32 — REX.W + 81 /digit + ModRM + imm32 (frame management)
# 专用于 SUB/ADD r/m64, imm32 (始终 64-bit, dest=Reg 类型)
[enc_macros.op_rm_imm32]
params = ["ext", "rm", "imm"]
pattern = "?${rm}>=8 {0x49:[0;8]} ?${rm}<8 {0x48:[0;8]} {0x81:[0;8]} {${ext}:[3;3]}{${rm}:[0;3]}{3:[6;2]} {${imm}:[0;8]} {${imm}:[0;8;8]} {${imm}:[0;8;16]} {${imm}:[0;8;24]}"

# ── SSE / 栈 / 立即数 宏 (不变) ──

[enc_macros.sse_rr]
params = ["prefix", "opcode", "w", "reg", "rm"]
pattern = "{${prefix}:[0;8]} ?${reg}>=8||${rm}>=8 {0x4:[4;4]}{${w}:[3;1]}{${reg}:[2;1;3]}{0:[1;1]}{${rm}:[0;1;3]} {0x0F:[0;8]} {${opcode}:[0;8]} {${rm}:[0;3]}{${reg}:[3;3]}{3:[6;2]}"

[enc_macros.push_reg]
params = ["reg"]
pattern = "?${reg}>=8 {0x41:[0;8]} {0x5:[4;3]}{${reg}:[0;3]}"

[enc_macros.pop_reg]
params = ["reg"]
pattern = "?${reg}>=8 {0x41:[0;8]} {0x5:[4;3]}{1:[3;1]}{${reg}:[0;3]}"

[enc_macros.mov_imm64]
params = ["reg", "imm"]
pattern = "?${reg}>=8 {0x49:[0;8]} ?${reg}<8 {0x48:[0;8]} {0xB8:[3;5;3]}{${reg}:[0;3]} {${imm}:[0;8;0]} {${imm}:[0;8;8]} {${imm}:[0;8;16]} {${imm}:[0;8;24]} {${imm}:[0;8;32]} {${imm}:[0;8;40]} {${imm}:[0;8;48]} {${imm}:[0;8;56]}"

[enc_macros.setcc]
params = ["dest", "cond"]
pattern = "?${dest}>=8 {0x41:[0;8]} ?${dest}>=4&&${dest}<8 {0x40:[0;8]} {0x0F:[0;8]} {0x90:[4;4;4]}{${cond}:[0;4]} {${dest}:[0;3]}{0:[3;3]}{3:[6;2]}"

# $modrm_r_imm32 — Width-aware 81 /digit + ModRM(mod=3, digit, rm) + imm32
# 用于 ADD/SUB/AND/OR/XOR/CMP r, imm32
# opsize=16: 66 + 81 /digit + ModRM + imm16 (2 bytes, little-endian)
# opsize=32: 81 /digit + ModRM + imm32 (4 bytes, little-endian)
# opsize=64: REX.W + 81 /digit + ModRM + imm32 (sign-extended to 64)
[enc_macros.modrm_r_imm32]
params = ["opsize", "ext", "dest", "imm"]
pattern = "?${opsize}==16 {0x66:[0;8]} ?${opsize}==64 {0x4:[4;4]}{1:[3;1]}{0:[2;1]}{0:[1;1]}{${dest}:[0;1;3]} ?${opsize}!=64&&${dest}>=8 {0x4:[4;4]}{0:[3;1]}{0:[2;1]}{0:[1;1]}{${dest}:[0;1;3]} {0x81:[0;8]} {${ext}:[3;3]}{${dest}:[0;3]}{3:[6;2]} {${imm}:[0;8]} {${imm}:[0;8;8]} {${imm}:[0;8;16]} {${imm}:[0;8;24]}"

# $cmovcc_rr — Width-aware conditional move (0F 4x /r)
# 条件码嵌入在 opcode 低 4 位: 0F 4{cc} /r
# ModRM.mod=3, reg=dest, r/m=src → dest=src if condition
[enc_macros.cmovcc_rr]
params = ["opsize", "cc", "dest", "src"]
pattern = "?${opsize}==16 {0x66:[0;8]} ?${opsize}==64 {0x4:[4;4]}{1:[3;1]}{${dest}:[2;1;3]}{0:[1;1]}{${src}:[0;1;3]} ?${opsize}!=64&&(${dest}>=8||${src}>=8) {0x4:[4;4]}{0:[3;1]}{${dest}:[2;1;3]}{0:[1;1]}{${src}:[0;1;3]} {0x0F:[0;8]} {0x4:[4;4]}{${cc}:[0;4]} {${src}:[0;3]}{${dest}:[3;3]}{3:[6;2]}"


# ═══════════════════════════════════════════════
# Ch.3 — 通用指令 (Width-Aware, Unified)
#
# 每条指令通过 opsize 字段支持 16/32/64-bit 操作数。
# Lowering 默认 opsize=64。
#
# 编码矩阵 (以 MOV r/m, r 为例):
#   opsize=16: 66 89 /r      opsize=32: 89 /r      opsize=64: REX.W 89 /r
# ═══════════════════════════════════════════════

# ───────────────────────────────────────────────
# 数据传送 (Data Transfer)
# ───────────────────────────────────────────────

# MOV r, r/m — REX.W + 8B /r (or 66 8B /r, or 8B /r)  |  Op/En: RM
[inst.MOV_R_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x8B dest src"
asm = "mov {dest}, {src}"

# MOV r/m, r — REX.W + 89 /r (or 66 89 /r, or 89 /r)  |  Op/En: MR
[inst.MOV_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x89 src dest"
asm = "mov {dest}, {src}"

# MOV r64, imm64 — REX.W + B8+rd io  |  Op/En: OI
[inst.MOV_REG_IMM64]
fields = [
    { name = "reg", type = "VReg" },
    { name = "imm", type = "I64" },
]
encoding = "$mov_imm64 reg imm"
asm = "mov_imm {reg}, 0x{imm:x}"
effect = "Read+Write"

# MOVSXD r64, r/m32 — REX.W + 63 /r  (always 64-bit sign-extend from 32-bit)
# Always uses REX.W=1 regardless of IR type — sign-extension is always to 64-bit.
[inst.MOVSXD_R_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
]
encoding = "$modrm_rr 64 0x63 dest src"
asm = "movsxd {dest}, {src}"

# ───────────────────────────────────────────────
# 二进制算术 (Binary Arithmetic)
# ───────────────────────────────────────────────

# ADD r/m, r — REX.W + 01 /r  |  Op/En: MR
[inst.ADD_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x01 src dest"
asm = "add {dest}, {src}"

# SUB r/m, r — REX.W + 29 /r  |  Op/En: MR
[inst.SUB_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x29 src dest"
asm = "sub {dest}, {src}"

# IMUL r, r/m — REX.W + 0F AF /r  |  Op/En: RM
[inst.IMUL_R_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xAF dest src"
asm = "imul {dest}, {src}"

# NOT r/m — REX.W + F7 /2  |  Op/En: M
[inst.NOT_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$op_rm opsize 2 dest"
asm = "not {dest}"

# NEG r/m — REX.W + F7 /3  |  Op/En: M
[inst.NEG_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$op_rm opsize 3 dest"
asm = "neg {dest}"

# DIV r/m — REX.W + F7 /6  |  Op/En: M
[inst.DIV_RM]
fields = [
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$op_rm opsize 6 src"
asm = "div {src}"
effect = "Read+Write"

# IDIV r/m — REX.W + F7 /7  |  Op/En: M
[inst.IDIV_RM]
fields = [
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$op_rm opsize 7 src"
asm = "idiv {src}"
effect = "Read+Write"

# ───────────────────────────────────────────────
# 逻辑指令 (Logical Instructions)
# ───────────────────────────────────────────────

# XOR r/m, r — REX.W + 31 /r  |  Op/En: MR
[inst.XOR_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x31 src dest"
asm = "xor {dest}, {src}"

# AND r/m, r — REX.W + 21 /r  |  Op/En: MR
[inst.AND_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x21 src dest"
asm = "and {dest}, {src}"

# OR r/m, r — REX.W + 09 /r  |  Op/En: MR
[inst.OR_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x09 src dest"
asm = "or {dest}, {src}"

# ───────────────────────────────────────────────
# 移位指令 (@shift_cl 原语 — 不支持 opsize, 固定 64-bit)
# ╔══════════════════════════════════════════════╗
# ║ @shift_cl — 硬编码原语 (bitstring.rs)         ║
# ║ 实现可变计数移位, 编码: D1/D3 /digit           ║
# ║ 始终使用 REX.W (64-bit).                      ║
# ╚══════════════════════════════════════════════╝
# ───────────────────────────────────────────────

[inst.SHL_RM_CL]
fields = { dest = "VReg", src = "VReg" }
encoding = "@shift_cl dest src 4"
asm = "shl {dest}, {src}"

[inst.SHR_RM_CL]
fields = { dest = "VReg", src = "VReg" }
encoding = "@shift_cl dest src 5"
asm = "shr {dest}, {src}"

[inst.SAR_RM_CL]
fields = { dest = "VReg", src = "VReg" }
encoding = "@shift_cl dest src 7"
asm = "sar {dest}, {src}"

# ───────────────────────────────────────────────
# 比较与测试 (Compare and Test)
# ───────────────────────────────────────────────

# CMP r/m, r — REX.W + 39 /r  |  Op/En: MR
[inst.CMP_RM_R]
fields = [
    { name = "src1", type = "VReg" },
    { name = "src2", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x39 src2 src1"
asm = "cmp {src1}, {src2}"
effect = "Read+Write"

# TEST r/m, r — REX.W + 85 /r  |  Op/En: MR
[inst.TEST_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x85 src dest"
asm = "test {dest}, {src}"
effect = "Read+Write"

# ───────────────────────────────────────────────
# SETcc (条件设置, 8-bit only)
# ───────────────────────────────────────────────

[inst.SETCC_RM8]
fields = { dest = "VReg", cond = "CondCode" }
encoding = "$setcc dest cond"
asm = "set{cond} {dest}"
effect = "Read+Write"

# ───────────────────────────────────────────────
# LEA (SIB addressing, @lea_sib 原语)
# ╔══════════════════════════════════════════════╗
# ║ @lea_sib — 硬编码原语 (bitstring.rs)          ║
# ║ REX.W + 8D /r + ModRM + SIB + disp          ║
# ║ ModRM.mod 选择 / disp8-disb32 优化            ║
# ╚══════════════════════════════════════════════╝
# ───────────────────────────────────────────────

[inst.LEA_R64_SIB]
fields = { dest = "VReg", base = "VReg", index = "VReg", scale = "U8", disp = "I64" }
encoding = "@lea_sib dest base index scale disp"
asm = "lea {dest}, [{base}+{index}*{scale}+{disp}]"

# ───────────────────────────────────────────────
# 扩展 / 截断 (Extension / Truncation) — MOVZX / MOVSX
# ───────────────────────────────────────────────

# MOVZX r, r/m8 — REX.W + 0F B6 /r  |  Op/En: RM
[inst.MOVZX_R8_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xB6 dest src"
asm = "movzx {dest}, {src}"

# MOVZX r, r/m16 — REX.W + 0F B7 /r  |  Op/En: RM
[inst.MOVZX_R16_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xB7 dest src"
asm = "movzx {dest}, {src}"

# MOVSX r, r/m8 — REX.W + 0F BE /r  |  Op/En: RM
[inst.MOVSX_R8_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xBE dest src"
asm = "movsx {dest}, {src}"

# MOVSX r, r/m16 — REX.W + 0F BF /r  |  Op/En: RM
[inst.MOVSX_R16_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xBF dest src"
asm = "movsx {dest}, {src}"

# ───────────────────────────────────────────────
# 立即数算术 (Immediate Arithmetic) — 81 /digit + imm32
# ADD/SUB/AND/OR/XOR/CMP r, imm32  (width-aware)
# ───────────────────────────────────────────────

# ADD r, imm32 — REX.W + 81 /0 rd + imm32  |  Op/En: MI
[inst.ADD_R_IMM32]
fields = [
    { name = "dest", type = "VReg" },
    { name = "imm", type = "I64" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_r_imm32 opsize 0 dest imm"
asm = "add {dest}, {imm}"

# SUB r, imm32 — REX.W + 81 /5 rd + imm32  |  Op/En: MI
[inst.SUB_R_IMM32]
fields = [
    { name = "dest", type = "VReg" },
    { name = "imm", type = "I64" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_r_imm32 opsize 5 dest imm"
asm = "sub {dest}, {imm}"

# AND r, imm32 — REX.W + 81 /4 rd + imm32  |  Op/En: MI
[inst.AND_R_IMM32]
fields = [
    { name = "dest", type = "VReg" },
    { name = "imm", type = "I64" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_r_imm32 opsize 4 dest imm"
asm = "and {dest}, {imm}"

# OR r, imm32 — REX.W + 81 /1 rd + imm32  |  Op/En: MI
[inst.OR_R_IMM32]
fields = [
    { name = "dest", type = "VReg" },
    { name = "imm", type = "I64" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_r_imm32 opsize 1 dest imm"
asm = "or {dest}, {imm}"

# XOR r, imm32 — REX.W + 81 /6 rd + imm32  |  Op/En: MI
[inst.XOR_R_IMM32]
fields = [
    { name = "dest", type = "VReg" },
    { name = "imm", type = "I64" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_r_imm32 opsize 6 dest imm"
asm = "xor {dest}, {imm}"

# CMP r, imm32 — REX.W + 81 /7 rd + imm32  |  Op/En: MI
[inst.CMP_R_IMM32]
fields = [
    { name = "dest", type = "VReg" },
    { name = "imm", type = "I64" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_r_imm32 opsize 7 dest imm"
asm = "cmp {dest}, {imm}"
effect = "Read+Write"

# ───────────────────────────────────────────────
# 原子操作 (Atomic Operations) — CMPXCHG / XADD
# ───────────────────────────────────────────────

# CMPXCHG r/m, r — REX.W + 0F B1 /r  |  Op/En: MR
# 比较 RAX 与 dest; 若相等: dest←src, ZF=1; 不等: RAX←dest, ZF=0
[inst.CMPXCHG_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xB1 src dest"
asm = "cmpxchg {dest}, {src}"
effect = "Read+Write"

# XADD r/m, r — REX.W + 0F C1 /r  |  Op/En: MR
# temp = dest+src; dest←src; src←temp
[inst.XADD_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xC1 src dest"
asm = "xadd {dest}, {src}"
effect = "Read+Write"

# ───────────────────────────────────────────────
# 位操作 (Bit Manipulation) — BT / BTS / BTR / BTC
# ───────────────────────────────────────────────

# BT r/m, r — REX.W + 0F A3 /r  |  Op/En: MR
[inst.BT_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xA3 src dest"
asm = "bt {dest}, {src}"
effect = "Read+Write"

# BTS r/m, r — REX.W + 0F AB /r  |  Op/En: MR
[inst.BTS_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xAB src dest"
asm = "bts {dest}, {src}"
effect = "Read+Write"

# BTR r/m, r — REX.W + 0F B3 /r  |  Op/En: MR
[inst.BTR_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xB3 src dest"
asm = "btr {dest}, {src}"
effect = "Read+Write"

# BTC r/m, r — REX.W + 0F BB /r  |  Op/En: MR
[inst.BTC_RM_R]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_0f_rr opsize 0xBB src dest"
asm = "btc {dest}, {src}"
effect = "Read+Write"

# ───────────────────────────────────────────────
# 条件移动 (Conditional Move) — CMOVcc
# CMOVcc r, r/m — REX.W + 0F 4{cc} /r  |  Op/En: RM
# ───────────────────────────────────────────────

[inst.CMOVCC_R_RM]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "VReg" },
    { name = "cond", type = "CondCode" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$cmovcc_rr opsize cond dest src"
asm = "cmov{cond} {dest}, {src}"


# ═══════════════════════════════════════════════
# ═══════════════════════════════════════════════

# MOVSD xmm1, xmm2/m64 — F2 0F 10 /r  |  Op/En: RM
[inst.SD_FMOV]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x10 0 dest src"
asm = "movsd {dest}, {src}"

[inst.ADDSD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x58 0 dest src"
asm = "addsd {dest}, {src}"

[inst.SUBSD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x5C 0 dest src"
asm = "subsd {dest}, {src}"

[inst.MULSD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x59 0 dest src"
asm = "mulsd {dest}, {src}"

[inst.DIVSD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x5E 0 dest src"
asm = "divsd {dest}, {src}"

[inst.SQRTSD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x51 0 dest src"
asm = "sqrtsd {dest}, {src}"

# CVTSI2SD xmm, r/m64 — F2 0F 2A /r  |  Op/En: RM
[inst.CVTSI2SD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x2A 0 dest src"
asm = "cvtsi2sd {dest}, {src}"

# CVTSD2SI r64, xmm/m64 — F2 0F 2D /r  |  Op/En: RM
[inst.CVTSD2SI]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0xF2 0x2D 0 dest src"
asm = "cvtsd2si {dest}, {src}"

[inst.ANDPD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0x66 0x54 0 dest src"
asm = "andpd {dest}, {src}"

[inst.XORPD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0x66 0x57 0 dest src"
asm = "xorpd {dest}, {src}"

# COMISD xmm1, xmm2/m64 — 66 0F 2F /r  |  Op/En: RM
[inst.COMISD]
fields = { src1 = "VReg", src2 = "VReg" }
encoding = "$sse_rr 0x66 0x2F 0 src1 src2"
asm = "comisd {src1}, {src2}"
effect = "Read+Write"

# ╔══════════════════════════════════════════════╗
# ║ MOVQ 双向编码 (GPR↔XMM)                       ║
# ║                                              ║
# ║ MOVQ xmm, r/m64 — 66 REX.W 0F 6E /r         ║
# ║ MOVQ r/m64, xmm — 66 REX.W 0F 7E /r         ║
# ║                                              ║
# ║ MOVQ_R64_XMM (XMM→GPR) 使用独立 asm          ║
# ║ "movq.to_gpr" 以避免 AsmResolver 歧义。      ║
# ║ 该变体未在任何 lowering 规则中使用。          ║
# ╚══════════════════════════════════════════════╝

[inst.MOVQ_XMM_R64]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0x66 0x6E 1 dest src"
asm = "movq {dest}, {src}"

[inst.MOVQ_R64_XMM]
fields = { dest = "VReg", src = "VReg" }
encoding = "$sse_rr 0x66 0x7E 1 src dest"
asm = "movq_to_gpr {dest}, {src}"


# ═══════════════════════════════════════════════
# Ch.5 — 控制转移 & 栈操作
# ═══════════════════════════════════════════════

[inst.RET]
encoding = "{0xC3:[0;8]}"
asm = "ret"
effect = "Ret"

[inst.NOP]
encoding = "{0x90:[0;8]}"
asm = "nop"

[inst.JMP_REL32]
fields = { rel = "BlockTarget" }
encoding = "{0xE9:[0;8]} !rel4"
asm = "jmp .L{rel}"
effect = "Jump"

[inst.JCC_REL32]
fields = { cond = "CondCode", rel = "BlockTarget" }
encoding = "{0x0F:[0;8]} {cond:[0;8]} !rel4"
asm = "j{cond} .L{rel}"
effect = "Branch"

[inst.UD2]
encoding = "{0x0F:[0;8]} {0x0B:[0;8]}"
asm = "ud2"
effect = "Trap"

[inst.PUSH_REG]
fields = { reg = "VReg" }
encoding = "$push_reg reg"
asm = "push {reg}"
effect = "Write"

[inst.POP_REG]
fields = { reg = "VReg" }
encoding = "$pop_reg reg"
asm = "pop {reg}"
effect = "Read+Write"

[inst.PUSH64_R]
fields = { reg = "Reg" }
encoding = "$push_reg reg"
asm = "push {reg}"
effect = "Write"

[inst.POP64_R]
fields = { reg = "Reg" }
encoding = "$pop_reg reg"
asm = "pop {reg}"
effect = "Read+Write"

[inst.MOV64_RR]
fields = { dest = "Reg", src = "Reg" }
# 0x89 /r = MOV r/m64, r64: ModRM.rm=dest, ModRM.reg=src → data flows src→dest
encoding = "{0x48:[0;8]} {0x89:[0;8]} {dest:[0;3]}{src:[3;3]}{3:[6;2]}"
asm = "movrr {dest}, {src}"

[inst.MOV_RM8_R64]
fields = [
    { name = "dest", type = "VReg" },
    { name = "src", type = "Reg" },
    { name = "opsize", type = "Opsize" },
]
encoding = "$modrm_rr opsize 0x89 src dest"
asm = "movrm {dest}, {src}"

[inst.CQO]
encoding = "{0x48:[0;8]} {0x99:[0;8]}"
asm = "cqo"


# ═══════════════════════════════════════════════
# 帧管理 (Frame Management)
#
# SUB64_R_IMM32 / ADD64_R_IMM32 — @frame_alloc/@frame_free 使用
# REX.W + 81 /digit + ModRM(mod=3, digit, rm) + imm32
# ═══════════════════════════════════════════════

[inst.SUB64_R_IMM32]
fields = { dest = "Reg", imm = "U32" }
encoding = "$op_rm_imm32 5 dest imm"
asm = "sub {dest}, {imm}"

[inst.ADD64_R_IMM32]
fields = { dest = "Reg", imm = "U32" }
encoding = "$op_rm_imm32 0 dest imm"
asm = "add {dest}, {imm}"


# ═══════════════════════════════════════════════
# 条件码名称 (CC Names) — JCC opcode → asm suffix
# ═══════════════════════════════════════════════

[cc_names]
"0x84" = "e"
"0x85" = "ne"
"0x8C" = "l"
"0x8E" = "le"
"0x8F" = "g"
"0x8D" = "ge"
"0x82" = "b"
"0x86" = "be"
"0x87" = "a"
"0x83" = "ae"
"0x8A" = "p"
"0x8B" = "np"


# ═══════════════════════════════════════════════
# 序言 / 尾声 (Prologue / Epilogue)
# ═══════════════════════════════════════════════

[emit.prologue]
insts = ["@move_args", "push RBP", "movrr RBP, RSP", "@push_callee", "@frame_alloc"]

[emit.epilogue]
insts = ["@frame_free", "@pop_callee", "pop RBP", "ret"]


# ═══════════════════════════════════════════════
# Lowering 规则 (v11 AST 格式)
#
# 虚拟操作数: rd, rs1, rs2, iconst, fconst, VReg(N), val, target, cond, ...
# 所有 lowering 规则默认为 opsize=64.
# ═══════════════════════════════════════════════

# ── Integer ──

[lower.Iconst]
insts = ["mov_imm rd, iconst"]

[lower.Iadd]
insts = ["mov rd, rs1", "add rd, rs2"]

[lower.Isub]
insts = ["mov rd, rs1", "sub rd, rs2"]

[lower.Imul]
insts = ["mov rd, rs1", "imul rd, rs2"]

[lower.Band]
insts = ["mov rd, rs1", "and rd, rs2"]

[lower.Bor]
insts = ["mov rd, rs1", "or rd, rs2"]

[lower.Bxor]
insts = ["mov rd, rs1", "xor rd, rs2"]

[lower.Ishl]
insts = ["mov rd, rs1", "mov VReg(97), rs2", "shl rd, VReg(97)"]

[lower.Ushr]
insts = ["mov rd, rs1", "mov VReg(97), rs2", "shr rd, VReg(97)"]

[lower.Sshr]
insts = ["movsxd rd, rs1", "mov VReg(97), rs2", "sar rd, VReg(97)"]

[lower.Bnot]
insts = ["mov rd, rs1", "not rd"]

[lower.Udiv]
insts = ["xor VReg(2), VReg(2)", "mov VReg(0), rs1", "div rs2", "mov rd, VReg(0)"]

[lower.Sdiv]
insts = ["cqo", "mov VReg(0), rs1", "idiv rs2", "mov rd, VReg(0)"]

[lower.Urem]
insts = ["xor VReg(2), VReg(2)", "mov VReg(0), rs1", "div rs2", "mov rd, VReg(2)"]

[lower.Srem]
insts = ["cqo", "mov VReg(0), rs1", "idiv rs2", "mov rd, VReg(2)"]

# ── Identity ──

[lower.Copy]
insts = ["mov rd, rs1"]

[lower.Bitcast]
insts = ["mov rd, rs1"]

[lower.Sextend]
insts = ["movsxd rd, rs1"]

[lower.Uextend]
insts = ["mov rd, rs1"]

[lower.Ireduce]
insts = ["mov rd, rs1"]

# ── Memory ──

[lower.Load]
insts = ["mov rd, rs1"]

[lower.Store]
insts = ["mov rs2, rs1"]

# ── Icmp ──

[lower.Icmp.Equal]
insts = ["xor rd, rd", "cmp rs1, rs2", "sete rd"]

[lower.Icmp.NotEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setne rd"]

[lower.Icmp.SignedLessThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "setl rd"]

[lower.Icmp.SignedLessThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setle rd"]

[lower.Icmp.SignedGreaterThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "setg rd"]

[lower.Icmp.SignedGreaterThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setge rd"]

[lower.Icmp.UnsignedLessThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "setb rd"]

[lower.Icmp.UnsignedLessThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setbe rd"]

[lower.Icmp.UnsignedGreaterThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "seta rd"]

[lower.Icmp.UnsignedGreaterThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setae rd"]

# ── Float ──

[lower.Fadd]
insts = ["movsd rd, rs1", "addsd rd, rs2"]

[lower.Fsub]
insts = ["movsd rd, rs1", "subsd rd, rs2"]

[lower.Fmul]
insts = ["movsd rd, rs1", "mulsd rd, rs2"]

[lower.Fdiv]
insts = ["movsd rd, rs1", "divsd rd, rs2"]

[lower.Fconst]
insts = ["mov_imm VReg(96), fconst", "movq rd, VReg(96)"]

[lower.Fsqrt]
insts = ["movsd rd, rs1", "sqrtsd rd, rs1"]

[lower.Fabs]
insts = ["movsd rd, rs1", "mov_imm VReg(96), 0x7FFFFFFFFFFFFFFF", "movq VReg(100), VReg(96)", "andpd rd, VReg(100)"]

[lower.Fneg]
insts = ["movsd rd, rs1", "mov_imm VReg(96), 0x8000000000000000", "movq VReg(100), VReg(96)", "xorpd rd, VReg(100)"]

# ── Fcmp ──

[lower.Fcmp.Equal]
insts = ["xor rd, rd", "comisd rs1, rs2", "sete rd"]

[lower.Fcmp.NotEqual]
insts = ["xor rd, rd", "comisd rs1, rs2", "setne rd"]

[lower.Fcmp.LessThan]
insts = ["xor rd, rd", "comisd rs1, rs2", "setb rd"]

[lower.Fcmp.LessThanOrEqual]
insts = ["xor rd, rd", "comisd rs1, rs2", "setbe rd"]

[lower.Fcmp.GreaterThan]
insts = ["xor rd, rd", "comisd rs1, rs2", "seta rd"]

[lower.Fcmp.GreaterThanOrEqual]
insts = ["xor rd, rd", "comisd rs1, rs2", "setae rd"]

[lower.Fcmp.Unordered]
insts = ["xor rd, rd", "comisd rs1, rs2", "setp rd"]

[lower.Fcmp.Ordered]
insts = ["xor rd, rd", "comisd rs1, rs2", "setnp rd"]

# ── Select / StackAddr ──

[lower.Select]
insts = ["mov rd, rs2"]

[lower.StackAddr]
insts = ["mov rd, VReg(99)"]

# ── Pattern lowering (LEA optimization) ──

[lower_pattern.lea-merge-iadd-imul-1]
insts = ["LEA_R64_SIB rs1, rd, 0, rs2, 1"]

[lower_pattern.lea-merge-iadd-imul-2]
insts = ["LEA_R64_SIB rs1, rd, 0, rs2, 2"]

[lower_pattern.lea-merge-iadd-imul-4]
insts = ["LEA_R64_SIB rs1, rd, 0, rs2, 4"]

[lower_pattern.lea-merge-iadd-imul-8]
insts = ["LEA_R64_SIB rs1, rd, 0, rs2, 8"]

# ── Terminator lowering ──

[lower_term.Return]
insts = ["MOV_RM_R VReg(0), val", "MOV_RM_R VReg(2), val2"]

[lower_term.Jump]
insts = ["jmp target"]

[lower_term.Branch]
insts = ["test cond, cond", "je false_block", "jmp true_block"]

[lower_term.Unreachable]
insts = ["nop"]
