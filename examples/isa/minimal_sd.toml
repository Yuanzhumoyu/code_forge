[inst.SD_LOAD]
fields = { dest = "VReg", src = "VReg" }
encoding = "{0xA0:[0;8]}"
asm = "ld {dest}, [{src}]"
effect = "Read"

[inst.SD_STORE]
fields = { addr = "VReg", val = "VReg" }
encoding = "{0xA1:[0;8]}"
asm = "st [{addr}], {val}"
effect = "Write"

[inst.SD_JMP]
fields = { rel = "BlockTarget" }
encoding = "{0xB0:[0;8]}"
asm = "jmp {rel}"
effect = "Jump"

[inst.SD_JCC]
