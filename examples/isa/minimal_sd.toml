[inst.SD_POP]
fields = { reg = "VReg" }
encoding = "{0xE1:[0;8]}"
asm = "pop {reg}"
effect = "Pure"

[inst.SD_STACK_ADDR]
fields = { dest = "VReg", offset = "I64" }
encoding = "{0xF0:[0;8]}"
asm = "stackaddr {dest}, {offset}"
effect = "Pure"
