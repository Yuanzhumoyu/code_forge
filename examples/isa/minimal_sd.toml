# ============================================================
# 最小标准指令集 ISA — 验证默认 Lowering 机制 (v11)
# ============================================================

[meta]
name = "minimal_sd"
version = "11.0"
endian = "little"
mode = 64
max_inst_len = 1

[meta.capabilities]
variable_length = false
prefix_layers = 0
simd_widths = []
mask_registers = false
broadcast = false
rounding_mode = false

[reg.gpr]
count = 8
width = 64
prefix = "R"

[abi]
stack_align = 16
[abi.frame]
sp = "R7"
[abi.arg_regs]
gpr = ["R0", "R1", "R2", "R3"]
[abi.ret_regs]
gpr = ["R0"]
[abi.precolor]
VReg0 = "R0"
VReg2 = "R2"

# ═══════════════════════════════════════════════
# SD_* 指令 — 每条一个 stub opcode 字节
# ═══════════════════════════════════════════════

[inst.SD_MOV]
fields = { dest = "VReg", src = "VReg" }
encoding = "{0x10:[0;8]}"
asm = "mov {dest}, {src}"
effect = "Pure"

[inst.SD_MOV_IMM]
fields = { dest = "VReg", imm = "I64" }
encoding = "{0x11:[0;8]}"
asm = "mov {dest}, {imm}"
effect = "Pure"

[inst.SD_ADD]
fields = { dest = "VReg", src = "VReg" }
encoding = "{0x20:[0;8]}"
asm = "add {dest}, {src}"
effect = "Pure"

[inst.SD_SUB]
