# ============================================================
# AArch64 (ARM64) ISA v11 — migrated to encoding string DSL
# ============================================================
# 遵循 AAPCS64 调用约定，64-bit 模式，小端序。
# 固定宽度 32-bit 指令字。
# ============================================================

[meta]
name = "aarch64"
version = "11.0"
endian = "little"
mode = 64
max_inst_len = 4
no_default_lowering = true

[meta.capabilities]
variable_length = false
prefix_layers = 0
simd_widths = []
mask_registers = false
broadcast = false
rounding_mode = false

[reg.gpr]
count = 31
width = 64
names = [
    "X0",  "X1",  "X2",  "X3",  "X4",  "X5",  "X6",  "X7",
    "X8",  "X9",  "X10", "X11", "X12", "X13", "X14", "X15",
    "X16", "X17", "X18", "X19", "X20", "X21", "X22", "X23",
    "X24", "X25", "X26", "X27", "X28", "X29", "X30",
]
prefix = "X"

[reg.float]
count = 32
width = 128
names = [
    "V0",  "V1",  "V2",  "V3",  "V4",  "V5",  "V6",  "V7",
    "V8",  "V9",  "V10", "V11", "V12", "V13", "V14", "V15",
    "V16", "V17", "V18", "V19", "V20", "V21", "V22", "V23",
    "V24", "V25", "V26", "V27", "V28", "V29", "V30", "V31",
]
prefix = "V"

[abi]
stack_align = 16
red_zone = 0

[abi.frame]
sp = "SP"
fp = "X29"

[abi.arg_regs]
gpr = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7"]
xmm = ["V0", "V1", "V2", "V3", "V4", "V5", "V6", "V7"]

[abi.ret_regs]
gpr = ["X0", "X1"]
xmm = ["V0"]

[abi.callee_saved]
gpr = ["X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27", "X28", "X29", "X30"]
xmm = []

# ═══════════════════════════════════════════════
# Data Movement
# ═══════════════════════════════════════════════

[inst.SD_MOV]
fields = { dest = "VReg", src = "VReg" }
# ORR Xd, XZR, Xm  →  dest@0:5, src@5:5, XZR(31)@16:5, 0x22C@21:10, sf=1@31:1
encoding = "32 {dest:[0;5]}{src:[5;5]}{31:[16;5]}{0x22C:[21;10]}{1:[31;1]}"
asm = "mov {dest}, {src}"
effect = "Pure"

[inst.SD_MOV_IMM]
fields = { dest = "VReg", imm = "I64" }
# MOVZ Xd, #imm16, LSL #0  —  truncated to 16-bit; full 64-bit needs MOVK sequence
encoding = "32 {dest:[0;5]}{imm:[5;16]}{0xA5:[23;9]}{1:[31;1]}"
asm = "mov {dest}, #{imm}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Encoding Macros
# ═══════════════════════════════════════════════

[enc_macros.a64_rrr]
params = ["opcode", "dest", "src1", "src2"]
# R-type: dest@0:5, src1@5:5, 0@10:6, src2@16:5, opcode@21:10, sf=1@31:1
pattern = "32 {${dest}:[0;5]}{${src1}:[5;5]}{${src2}:[16;5]}{${opcode}:[21;10]}{1:[31;1]}"

[enc_macros.a64_rrr_rm]
params = ["opcode", "dest", "src1", "src2"]
# R-type with Rm@10 field: dest@0:5, src1@5:5, 31@10:5, src2@16:5, opcode@21:10, sf=1@31:1
pattern = "32 {${dest}:[0;5]}{${src1}:[5;5]}{31:[10;5]}{${src2}:[16;5]}{${opcode}:[21;10]}{1:[31;1]}"

[enc_macros.a64_shift]
params = ["ext", "dest", "src1", "src2"]
# Shift: dest@0:5, src1@5:5, ext@10:6, src2@16:5, 0x1AC@21:10, sf=1@31:1
pattern = "32 {${dest}:[0;5]}{${src1}:[5;5]}{${ext}:[10;6]}{${src2}:[16;5]}{0x1AC:[21;10]}{1:[31;1]}"

# ═══════════════════════════════════════════════
# Integer Arithmetic (R-type, 3-register)
# ═══════════════════════════════════════════════

[inst.SD_ADD]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr 0x22C dest src1 src2"
asm = "add {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_SUB]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr 0x32C dest src1 src2"
asm = "sub {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_MUL]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr_rm 0x06C dest src1 src2"
asm = "mul {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_SDIV]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr_rm 0x1AC dest src1 src2"
asm = "sdiv {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_UDIV]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr_rm 0x1AE dest src1 src2"
asm = "udiv {dest}, {src1}, {src2}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Bitwise (R-type, 3-register)
# ═══════════════════════════════════════════════

[inst.SD_AND]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr 0x228 dest src1 src2"
asm = "and {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_OR]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr 0x2A8 dest src1 src2"
asm = "orr {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_XOR]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
encoding = "$a64_rrr 0x328 dest src1 src2"
asm = "eor {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_SHL]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
# LSLV: UBFM with shift from register
encoding = "$a64_shift 0x8 dest src1 src2"
asm = "lsl {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_SHR]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
# LSRV
encoding = "$a64_shift 0x9 dest src1 src2"
asm = "lsr {dest}, {src1}, {src2}"
effect = "Pure"

[inst.SD_SAR]
fields = { dest = "VReg", src1 = "VReg", src2 = "VReg" }
# ASRV
encoding = "$a64_shift 0xA dest src1 src2"
asm = "asr {dest}, {src1}, {src2}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Comparison
# ═══════════════════════════════════════════════

[inst.SD_CMP]
fields = { src1 = "VReg", src2 = "VReg" }
# SUBS XZR, Xn, Xm  —  result discarded, flags set
encoding = "32 {31:[0;5]}{src1:[5;5]}{src2:[16;5]}{0x3AC:[21;10]}{1:[31;1]}"
asm = "cmp {src1}, {src2}"
effect = "Read"

[inst.SD_SETCC]
fields = { dest = "VReg", cond = "CondCode" }
# CSET Xd, cond  —  cond@12:4, 0x9B@24:8
encoding = "32 {dest:[0;5]}{cond:[12;4]}{0x9B:[24;8]}"
asm = "cset {dest}, {cond}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Control Flow — using !isa0 fixup for AArch64 branch offset
# ═══════════════════════════════════════════════

[inst.SD_JMP]
fields = { rel = "BlockTarget" }
# B <offset>  —  imm26@0:26, 0b000101@26:6
encoding = "32 {0b000101:[26;6]} !isa0"
asm = "b {rel}"
effect = "Jump"

[inst.SD_JCC]
fields = { cond = "CondCode", rel = "BlockTarget" }
# B.cond <offset>  —  cond@0:4, imm19@5:19, 0b01010100@24:8
encoding = "32 {cond:[0;4]}{0b01010100:[24;8]} !isa0"
asm = "b.{cond} {rel}"
effect = "Branch"

[inst.SD_CALL]
fields = { target = "VReg" }
# BLR Xn  —  target@5:5, 0xD63F@16:16
encoding = "32 {target:[5;5]}{0xD63F:[16;16]}"
asm = "blr {target}"
effect = "Call"

# ═══════════════════════════════════════════════
# Return / NOP / Trap
# ═══════════════════════════════════════════════

[inst.SD_RET]
fields = []
# RET  — X30@5:5, 0xD65F@16:16
encoding = "32 {30:[5;5]}{0xD65F:[16;16]}"
asm = "ret"
effect = "Ret"

[inst.SD_NOP]
fields = []
encoding = "32 {0xD503201F:[0;32]}"
asm = "nop"
effect = "Pure"

[inst.SD_UD2]
fields = []
# BRK #0
encoding = "32 {0xD4200000:[0;32]}"
asm = "brk #0"
effect = "Trap"

# ═══════════════════════════════════════════════
# Load / Store — LDR/STR (unsigned offset, scaled)
# ═══════════════════════════════════════════════

[inst.SD_LOAD]
fields = { dest = "VReg", src = "VReg" }
# LDR Xt, [Xn]  —  dest@0:5, addr@5:5, 0x1F9@22:10, sf=1@31:1
encoding = "32 {dest:[0;5]}{src:[5;5]}{0x1F9:[22;10]}{1:[31;1]}"
asm = "ldr {dest}, [{src}]"
effect = "Read"

[inst.SD_STORE]
fields = { val = "VReg", addr = "VReg" }
# STR Xt, [Xn]  —  val@0:5, addr@5:5, 0x1F8@22:10, sf=1@31:1
encoding = "32 {val:[0;5]}{addr:[5;5]}{0x1F8:[22;10]}{1:[31;1]}"
asm = "str {val}, [{addr}]"
effect = "Write"

# ═══════════════════════════════════════════════
# Prologue / Epilogue — AArch64 stack frame
# ═══════════════════════════════════════════════

# AArch64 prologue/epilogue — requires physical-register (Reg type) stack frame
# instructions: STP (store pair), LDP (load pair), MOV_SP, SUB_SP.
# These need Reg-type operands for SP (X31/XZR), FP (X29), LR (X30).
# Prologue: STP x29,x30,[sp,#-16]! ; MOV x29,sp ; SUB sp,sp,#frame
# Epilogue: MOV sp,x29 ; LDP x29,x30,[sp],#16 ; RET
# TODO: Add Reg-typed STP/LDP/SUB_SP/MOV_SP instructions.
[emit.prologue]
insts = []

[emit.epilogue]
insts = []
