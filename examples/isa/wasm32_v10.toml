# ============================================================
# WebAssembly (wasm32) ISA v11 — encoding-based via @leb128_reg + macros
# ============================================================

[meta]
name = "wasm32"
version = "11.0"
endian = "little"
mode = 32
max_inst_len = 16
no_default_lowering = false

[meta.capabilities]
variable_length = true
prefix_layers = 0

[reg.gpr]
count = 32
width = 32
prefix = "L"

[abi]
stack_align = 16
[abi.frame]
sp = "L1"
[abi.arg_regs]
gpr = ["L2", "L3", "L4", "L5", "L6", "L7", "L8", "L9"]
[abi.ret_regs]
gpr = ["L2"]
[abi.precolor]
VReg0 = "L2"

# ═══════════════════════════════════════════════
# Encoding Macros
# ═══════════════════════════════════════════════

[enc_macros.wasm_binop]
params = ["opcode", "dest", "src"]
pattern = "@leb128_reg 0x20 ${dest} @leb128_reg 0x20 ${src} {${opcode}:[0;8]} @leb128_reg 0x21 ${dest}"

[enc_macros.wasm_unop]
params = ["opcode", "dest"]
pattern = "@leb128_reg 0x20 ${dest} {${opcode}:[0;8]} @leb128_reg 0x21 ${dest}"

[enc_macros.wasm_mov]
params = ["dest", "src"]
pattern = "@leb128_reg 0x20 ${src} @leb128_reg 0x21 ${dest}"

[enc_macros.wasm_const]
params = ["dest", "imm"]
pattern = "{0x41:[0;8]} @sleb128 ${imm} @leb128_reg 0x21 ${dest}"

[enc_macros.wasm_load]
params = ["dest", "src"]
pattern = "@leb128_reg 0x20 ${src} {0x28:[0;8]} {0x02:[0;8]} {0x00:[0;8]} @leb128_reg 0x21 ${dest}"

[enc_macros.wasm_store]
params = ["addr", "val"]
pattern = "@leb128_reg 0x20 ${addr} @leb128_reg 0x20 ${val} {0x36:[0;8]} {0x02:[0;8]} {0x00:[0;8]}"

[enc_macros.wasm_unop_src]
params = ["opcode", "dest", "src"]
pattern = "@leb128_reg 0x20 ${src} {${opcode}:[0;8]} @leb128_reg 0x21 ${dest}"

# ═══════════════════════════════════════════════
# Data Movement
# ═══════════════════════════════════════════════

[inst.SD_MOV]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_mov dest src"
asm = "local.get {dest} ;; via {src}"
effect = "Pure"

[inst.SD_MOV_IMM]
fields = { dest = "VReg", imm = "I64" }
encoding = "$wasm_const dest imm"
asm = "i64.const {imm} ;; → {dest}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Integer Arithmetic (i32)
# ═══════════════════════════════════════════════

[inst.SD_ADD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x6A dest src"
asm = "i64.add {dest}, {src}"
effect = "Pure"

[inst.SD_SUB]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x6B dest src"
asm = "i64.sub {dest}, {src}"
effect = "Pure"

[inst.SD_MUL]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x6C dest src"
asm = "i64.mul {dest}, {src}"
effect = "Pure"

[inst.SD_UDIV]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x6E dest src"
asm = "i64.div_u {dest}, {src}"
effect = "Pure"

[inst.SD_SDIV]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x6D dest src"
asm = "i64.div_s {dest}, {src}"
effect = "Pure"

[inst.SD_UREM]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x8F dest src"
asm = "i64.rem_u {dest}, {src}"
effect = "Pure"

[inst.SD_SREM]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x8E dest src"
asm = "i64.rem_s {dest}, {src}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Bitwise (i32)
# ═══════════════════════════════════════════════

[inst.SD_AND]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x71 dest src"
asm = "i64.and {dest}, {src}"
effect = "Pure"

[inst.SD_OR]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x72 dest src"
asm = "i64.or {dest}, {src}"
effect = "Pure"

[inst.SD_XOR]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x73 dest src"
asm = "i64.xor {dest}, {src}"
effect = "Pure"

[inst.SD_SHL]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x74 dest src"
asm = "i64.shl {dest}, {src}"
effect = "Pure"

[inst.SD_SHR]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x76 dest src"
asm = "i64.shr_u {dest}, {src}"
effect = "Pure"

[inst.SD_SAR]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0x75 dest src"
asm = "i64.shr_s {dest}, {src}"
effect = "Pure"

[inst.SD_NOT]
fields = { dest = "VReg" }
encoding = "@leb128_reg 0x20 dest {0x41:[0;8]} {0x7F:[0;8]} {0x73:[0;8]} @leb128_reg 0x21 dest"
asm = "i64.not {dest}"
effect = "Pure"

[inst.SD_NEG]
fields = { dest = "VReg" }
encoding = "{0x41:[0;8]} {0x00:[0;8]} @leb128_reg 0x20 dest {0x6B:[0;8]} @leb128_reg 0x21 dest"
asm = "i64.neg {dest}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Comparison — simplified: always emits i32.eq (0x46)
# ═══════════════════════════════════════════════

[inst.SD_CMP]
fields = { src1 = "VReg", src2 = "VReg" }
encoding = "@leb128_reg 0x20 src1 @leb128_reg 0x20 src2 {0x46:[0;8]}"
asm = "i64.cmp {src1}, {src2}"
effect = "Read"

[inst.SD_SETCC]
fields = { dest = "VReg", cond = "CondCode" }
encoding = "@leb128_reg 0x21 dest"
asm = "i64.set{cond} {dest}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Float Operations (f64)
# ═══════════════════════════════════════════════

[inst.SD_FMOV]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_mov dest src"
asm = "f64.mov {dest}, {src}"
effect = "Pure"

[inst.SD_FMOV_BITS]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_mov dest src"
asm = "f64.reinterpret_i64 {dest}, {src}"
effect = "Pure"

[inst.SD_FADD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0xA0 dest src"
asm = "f64.add {dest}, {src}"
effect = "Pure"

[inst.SD_FSUB]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0xA1 dest src"
asm = "f64.sub {dest}, {src}"
effect = "Pure"

[inst.SD_FMUL]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0xA2 dest src"
asm = "f64.mul {dest}, {src}"
effect = "Pure"

[inst.SD_FDIV]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_binop 0xA3 dest src"
asm = "f64.div {dest}, {src}"
effect = "Pure"

[inst.SD_FSQRT]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_unop_src 0x9F dest src"
asm = "f64.sqrt {dest}, {src}"
effect = "Pure"

[inst.SD_FNEG]
fields = { dest = "VReg" }
encoding = "$wasm_unop 0x9A dest"
asm = "f64.neg {dest}"
effect = "Pure"

[inst.SD_FABS]
fields = { dest = "VReg" }
encoding = "$wasm_unop 0x99 dest"
asm = "f64.abs {dest}"
effect = "Pure"

[inst.SD_FCMP]
fields = { src1 = "VReg", src2 = "VReg" }
encoding = "@leb128_reg 0x20 src1 @leb128_reg 0x20 src2 {0x61:[0;8]}"
asm = "f64.cmp {src1}, {src2}"
effect = "Read"

# Type conversion
[inst.SD_I2F]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_unop_src 0xB7 dest src"
asm = "f64.convert_i64_s {dest}, {src}"
effect = "Pure"

[inst.SD_F2I]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_unop_src 0xA7 dest src"
asm = "i64.trunc_f64_s {dest}, {src}"
effect = "Pure"

[inst.SD_SEXT]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_unop_src 0xAD dest src"
asm = "i64.extend_i32_s {dest}, {src}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Load / Store
# ═══════════════════════════════════════════════

[inst.SD_LOAD]
fields = { dest = "VReg", src = "VReg" }
encoding = "$wasm_load dest src"
asm = "i64.load {dest}, [{src}]"
effect = "Read"

[inst.SD_STORE]
fields = { addr = "VReg", val = "VReg" }
encoding = "$wasm_store addr val"
asm = "i64.store {val}, [{addr}]"
effect = "Write"

# ═══════════════════════════════════════════════
# Control Flow
# ═══════════════════════════════════════════════

[inst.SD_JMP]
fields = { rel = "BlockTarget" }
encoding = "{0x0C:[0;8]} {0x00:[0;8]}"
asm = "br {rel}"
effect = "Jump"

[inst.SD_JCC]
fields = { cond = "CondCode", rel = "BlockTarget" }
encoding = "{0x0D:[0;8]} {0x00:[0;8]}"
asm = "br_if {rel}, {cond}"
effect = "Branch"

[inst.SD_CALL]
fields = { target = "VReg" }
encoding = "{0x10:[0;8]} {0x00:[0;8]}"
asm = "call {target}"
effect = "Call"

[inst.SD_RET]
fields = []
encoding = "{0x0F:[0;8]}"
asm = "return"
effect = "Ret"

[inst.SD_NOP]
fields = []
encoding = "{0x01:[0;8]}"
asm = "nop"
effect = "Pure"

[inst.SD_UD2]
fields = []
encoding = "{0x00:[0;8]}"
asm = "unreachable"
effect = "Trap"

[inst.SD_PUSH]
fields = { reg = "VReg" }
encoding = "{0x01:[0;8]}"
asm = "push {reg} ;; wasm stack"
effect = "Pure"

[inst.SD_POP]
fields = { reg = "VReg" }
encoding = "{0x01:[0;8]}"
asm = "pop {reg} ;; wasm stack"
effect = "Pure"

[inst.SD_STACK_ADDR]
fields = { dest = "VReg", offset = "I64" }
encoding = "{0x41:[0;8]} {0x00:[0;8]} @leb128_reg 0x21 dest"
asm = "stack.addr {dest}, {offset}"
effect = "Pure"

# ═══════════════════════════════════════════════
# Prologue / Epilogue
# ═══════════════════════════════════════════════

# wasm32 has no traditional prologue/epilogue
[emit.prologue]
insts = []

[emit.epilogue]
insts = []
