opcode_field = "vec_a"
operand_fields = ["rt", "rn", "rm"]

[[forms]]
name = "VEC3RA"   # NEON ???? + ???????????????? vq???????? fields ?????
opcode_field = "vec_a"
operand_fields = ["rt", "rn", "rm", "vq", "vq", "vq"]

[[instructions]]
name = "ABS8B"
form = "VEC2R"
opcode = 0x0E
fields = { vq = 0, vu = 0, vsize = 0, vec_c = 1, vec_d = 46, rm = 0 }
