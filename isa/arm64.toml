#:schema ../isa-dsl.schema.json
# ============================================================
# AArch64 (ARM64) — A64 — ISA-DSL 语法（P1 迭代 A1：全链最小可信集）
# ============================================================
#
# 严格遵循 ARM A-profile A64 指令集定义（developer.arm.com DDI0602；
# A64 指令定宽 32 位小端字）。编码位段以官方文档为准；每条 opcode/
# 固定常量由本机 LLVM clang --target=aarch64-none-elf + llvm-objdump
# 逐字 oracle 校验（tests/arm64_tests.rs 的 golden 来自该 oracle）。
#
# A1 实现（打通 编码/解码/汇编 全链的最小集，全部常量已 oracle 验证）：
#   NOP；ADD/ADDS/SUB/SUBS (immediate) × X/W；ADD/SUB (shifted register,
#   LSL#0 形式 = 三寄存器操作数) × X/W；B/BL（相对跳转）。
# A2+（后续迭代，逐个 oracle 验证后加入）：逻辑寄存器族、MOVZ/N/K、
#   CMP/CMN 别名、移位立即数、MADD/MSUB/SDIV/UDIV、CSEL、B.cond/CBZ、
#   内存 LD/ST 家族、ADR/ADRP、SP/XZR 语义、[abi]/[emit] 接入与 runner。

[meta]
name = "arm64"
version = "0.1.0"
endian = "little"
mode = 64
case_insensitive_regs = true
# A64 的 `#` 是**立即数前缀**（`add x0, x1, #5`、`ldr x0, [x1, #8]`），注释是 `//`
#（GAS 的 aarch64 模式也如此）。历史上这里写成 "#"，生成物于是对每行按 `#` 截断——
# 所有带立即数的写法都被砍成 `add x0, x1, ` 而解析失败（语料 parsed 长期只有 37/420 的主因）。
comment_char = "/"
label_suffix = ":"
mnemonic_case = "insensitive"
# 立即数前缀：模板写 `#{imm}` 时由字面段吃掉，而**分支目标**槽（`b {target}`）前没有
# 字面 `#`，得由 `[meta].imm_prefix` 来吃——否则真实写法 `b #28`、`cbz w1, #28` 不匹配。
imm_prefix = "#"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────
# X0-X30（gpr8，64 位）与 W0-W30（gpr4，32 位）共享物理编号 0-30
# （A64 中 Xn/Wn 是同一寄存器组的不同宽度视图）。SP/XZR（31 号上下
# 文语义）后续迭代。
[encoding]
kind = "fixed"
bits = 32

[reg.gpr8]
base_index = 0
names = [
    "X0","X1","X2","X3","X4","X5","X6","X7",
    "X8","X9","X10","X11","X12","X13","X14","X15",
    "X16","X17","X18","X19","X20","X21","X22","X23",
    "X24","X25","X26","X27","X28","X29","X30","SP",
]

[reg.gpr4]
base_index = 0
names = [
    "W0","W1","W2","W3","W4","W5","W6","W7",
    "W8","W9","W10","W11","W12","W13","W14","W15",
    "W16","W17","W18","W19","W20","W21","W22","W23",
    "W24","W25","W26","W27","W28","W29","W30","WSP",
]

# ─────────────────────── 命名位域（A64）───────────────────────
# 通用寄存器位域位置在全 A64 固定：Rd=[4:0]、Rn=[9:5]、Rm=[20:16]。

[conventions.bitfields]
rd    = { offset = 0,  width = 5 }
rn    = { offset = 5,  width = 5 }
rm    = { offset = 16, width = 5 }
imm12 = { offset = 10, width = 12 } # 加立即数（sh 在 [23:22]，A1 恒 0）
imm16 = { offset = 5,  width = 16 } # MOVZ/N/K 半字立即数（[20:5]）
hw    = { offset = 21, width = 2 }  # MOVZ/N/K 半字选择（A2 恒 0）
nbit  = { offset = 21, width = 1 }
# 逻辑（移位寄存器）族的移位字段：`shift` 是 2 位常量（LSL=0/LSR=1/ASR=2/ROR=3，逐指令给常量），
# 移位量 X 形式 6 位、W 形式 5 位——A64 规定 32 位形式 imm6<32，5 位槽就是这条约束本身
# （用 6 位槽收 `lsl #40` 会编出未分配的字，故 W 形式另设一槽）。
shift = { offset = 22, width = 2 }
imm6  = { offset = 10, width = 6 }
imm5  = { offset = 10, width = 5 }  # 逻辑族 NOT 位（BIC/ORN/EON=1）
# 顶层固定段：
#  - op8 = 位[31:24]（立即数 ALU 与寄存器 ALU 顶层 8 位；X(sf=1)/W(sf=0)
#    各自为不同 8 位常量，故 X/W 分立 family、opcode 各含 sf）
op8   = { offset = 24, width = 8 }
op9   = { offset = 23, width = 9 } # MOV 宽立即数族（含 bit23=1 的 100101）
#  - op6 = 位[31:26]（B/BL 的 6 位顶层常量；imm26 占 [25:0]）
op6   = { offset = 26, width = 6 }
imm26 = { offset = 0,  width = 26 } # B/BL 相对偏移（与 op6 互补覆盖全字）
word  = { offset = 0,  width = 32 } # 全字常量（NOP）
# A3 扩展
ra    = { offset = 10, width = 5 }   # MADD/MSUB 累加器
o0    = { offset = 15, width = 1 }   # madd=0 / msub=1
op2d  = { offset = 10, width = 6 }   # sdiv=000011 / udiv=000010（位[15:10]）
cond  = { offset = 12, width = 4 }   # CSEL/CSINC/CSINV/CSNEG 条件码（[15:12]）
bcond = { offset = 0,  width = 4 }   # B.cond 条件码（[3:0]；bit4 恒 0，未用位天然 0）
csop2 = { offset = 10, width = 2 }   # CSEL 族 op2（sel=0 inc=1）
mtop  = { offset = 21, width = 11 }  # 乘除/条件族顶层 [31:21]（含 sf）
b16   = { offset = 16, width = 16 }  # BR/BLR/RET 顶层 [31:16]
imm19 = { offset = 5,  width = 19 }  # CBZ/CBNZ/B.cond 相对偏移（[23:5]）
cbop  = { offset = 24, width = 8 }   # CBZ/CBNZ 顶层（含 sf/op 位）
rt    = { offset = 0,  width = 5 }   # CBZ/CBNZ 测试寄存器 Rt=[4:0]
op5   = { offset = 0,  width = 5 }   # 系统/异常指令的低 5 位（svc=1/hvc=2/smc=3/dcps1..3=1..3/brk,hlt=0）
op7   = { offset = 24, width = 7 }   # TBZ/TBNZ 顶层 [30:24]（bit31 让给位序号的高位 b5）
b5    = { offset = 31, width = 1 }   # TBZ/TBNZ 位序号第 5 位（32 位形式必须为 0）
b40   = { offset = 19, width = 5 }   # TBZ/TBNZ 位序号低 5 位（实测 [0xe3,0xff,0x2b,0x36]）
imm14 = { offset = 5,  width = 14 }  # TBZ/TBNZ 相对偏移（[18:5]；与 imm19 同段但不同顶层）

opc2  = { offset = 22, width = 2 }   # LS opc（00 store / 01 load / 10 符号载）
imm12s= { offset = 10, width = 12 }  # LDR/STR 无符号 imm12（与 ALU imm12 同段）
imm9  = { offset = 12, width = 9 }   # LDUR/STUR 符号偏移（真字节）
idx2  = { offset = 22, width = 2 }   # LDP/STP index 低位（bit24 由 op8 常量给：100 off STP/101 off LDP ⇒ idx2 = 0/1）
rt2   = { offset = 10, width = 5 }   # LDP/STP 第二寄存器
op8b  = { offset = 16, width = 8 }   # FMOV 的中间常量（S=0x20 / D=0x60）
zero6 = { offset = 10, width = 6 }   # FMOV 保留位（[15:10] = 0）
imm7  = { offset = 15, width = 7 }   # LDP/STP 偏移（对元素，缩放单元）

# A64 条件码（v18 S3c）：键 = 汇编/反汇编可见的条件名，code = 4 位编码。
# 这张表两处用：CSEL 族的 `cond` 槽（符号名）与下面 B.cond 模板的固定字段。
# 不写 `ir` = 不映射 IR 整数条件（本 ISA 的 lowering 目前不用 `{cc}`；
# 将来加 Icmp lowering 时再补 ir，validate 会强制补全 10 个）。
[conventions.cond]
eq = 0
ne = 1
cs = 2
hs = 2
cc = 3
lo = 3
mi = 4
pl = 5
vs = 6
vc = 7
hi = 8
ls = 9
ge = 10
lt = 11
gt = 12
le = 13
al = 14
nv = 15

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "r64"
kind = "reg"
class = "gpr8"
roles = "inout"

[[operand_slots]]
name = "r32"
kind = "reg"
class = "gpr4"
roles = "inout"

[[operand_slots]]
name = "imm12u"
kind = "imm"
signed = false
width = 12

[[operand_slots]]
name = "imm16u"
kind = "imm"
signed = false
width = 16

[[operand_slots]]
name = "imm6"
kind = "imm"
signed = false
width = 6

[[operand_slots]]
name = "imm5"
kind = "imm"
signed = false
width = 5

[[operand_slots]]
name = "off26"
kind = "label"
signed = true
width = 26
unit = 4    # 源文本/Inst 字段是**字节**偏移；字段数的是 4 字节字（`b #28` ⇒ imm26 = 7）

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "ALUIMM"   # ADD(S)/SUB(S) (imm)：rd/rn/imm12（[23:22] sh=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "imm12"]

[[forms]]
name = "ALUREG"   # ADD/SUB (shifted reg, LSL#0)：rd/rn/rm
                  #（[15:10] imm6=0、[23:22] shift=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "MOVR"     # MOV 别名：rd/rm（rn 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rd", "rm"]

[[forms]]
name = "MOVW16"   # MOVZ/MOVN/MOVK：rd/imm16（顶层 [31:23] 常量，hw 经 fields）
opcode_field = "op9"
operand_fields = ["rd", "imm16"]

[[forms]]
name = "CMPIMM"   # CMP/CMN(imm)：rn/imm12（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "imm12"]

[[forms]]
name = "CMPREG"   # CMP(reg)：rn/rm（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "rm"]

[[forms]]
name = "BREL"     # B/BL：imm26（[31:26] 为 op6 常量）
opcode_field = "op6"
operand_fields = ["imm26"]


[[forms]]
name = "SYSEXC"   # 系统/异常：**顶层是 11 位**（[31:21]，与 mtop 同段）+ imm16（[20:5]）+ op5（[4:0]）
# 顶层**不能**写成 `b16`（[31:16]）：那与 imm16 在 bit16-20 重叠，imm16 大值会把
# 顶层常量写坏（编得出、解不回——派生日志守卫实测 `SVC[imm16=65535]` 抓到）。
opcode_field = "mtop"
operand_fields = ["imm16"]

[[forms]]
name = "ALUSH6"   # 逻辑（移位寄存器，64 位）：rd/rn/rm/imm6（`shift` 是逐指令常量）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm", "imm6"]

[[forms]]
name = "ALUSH5"   # 同上，32 位形式：移位量 5 位（= 同一约束 imm6<32）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm", "imm5"]
[[forms]]
name = "NOPF"     # 全字常量
opcode_field = "word"
operand_fields = []

# ─────────────────────────── 指令 ───────────────────────────
# op8 常量 = 该指令 (word>>24)&0xFF（oracle 实测）：
#   add  x,w=0x91/0x11、adds=0xB1/0x31、sub=0xD1/0x51、subs=0xF1/0x71
#   add(reg) x,w=0x8B/0x0B、sub(reg)=0xCB/0x4B
# op6：b=0x05（0x14000000>>26）、bl=0x25（0x94000000>>26）

# ── 系统/异常生成与返回（A64 的 SYSTEM 族；常量按 corpus 的 `encoding:` 注释核对）──
# `op5` 指低 5 位常量、`b16` 指 [31:16] 常量、`imm16` 占 [20:5]；文本里的 `#imm` 是
# 立即数前缀（`[conventions.mem]` 之外，由操作数槽自己吃——见 `[meta].imm_prefix`）。
# **未实现**：GAS 允许 `dcps1` 省略立即数（默认 0）——那需要"可选操作数"这一新能力，
# 而声明成第二条第指令会与带立即数的那条**编码重叠**（解码 trie 直接拒），见 README 缺口清单。

[[instructions]]
name = "SVC"
form = "SYSEXC"
opcode = 0x6A0
fields = { op5 = 1 }
ops = ["imm:imm16"]
asm = "svc #{imm}"

[[instructions]]
name = "HVC"
form = "SYSEXC"
opcode = 0x6A0
fields = { op5 = 2 }
ops = ["imm:imm16"]
asm = "hvc #{imm}"

[[instructions]]
name = "SMC"
form = "SYSEXC"
opcode = 0x6A0
fields = { op5 = 3 }
ops = ["imm:imm16"]
asm = "smc #{imm}"

[[instructions]]
name = "BRK"
form = "SYSEXC"
opcode = 0x6A1
fields = { op5 = 0 }
ops = ["imm:imm16"]
asm = "brk #{imm}"

[[instructions]]
name = "HLT"
form = "SYSEXC"
opcode = 0x6A2
fields = { op5 = 0 }
ops = ["imm:imm16"]
asm = "hlt #{imm}"

[[instructions]]
name = "DCPS1"
form = "SYSEXC"
opcode = 0x6A5
fields = { op5 = 1 }
ops = ["imm:imm16"]
asm = "dcps1 #{imm}"

[[instructions]]
name = "DCPS2"
form = "SYSEXC"
opcode = 0x6A5
fields = { op5 = 2 }
ops = ["imm:imm16"]
asm = "dcps2 #{imm}"

[[instructions]]
name = "DCPS3"
form = "SYSEXC"
opcode = 0x6A5
fields = { op5 = 3 }
ops = ["imm:imm16"]
asm = "dcps3 #{imm}"

# 整字常量（无操作数）：ERET=0xD69F03E0、DRPS=0xD6BF03E0
[[instructions]]
name = "ERET"
form = "NOPF"
opcode = 0xD69F03E0
asm = "eret"

[[instructions]]
name = "DRPS"
form = "NOPF"
opcode = 0xD6BF03E0
asm = "drps"

# ── NOP（D503201F）──
[[instructions]]
name = "NOPFAM"
form = "NOPF"
opcode = 0xD503201F
asm = "nop"

# ── ADD/ADDS/SUB/SUBS (immediate) ──
# oracle 校验样本：add x5,x6,#42 = 9100A8C5；adds w5,w6,#42=3100A8C5；
#   sub x5,x6,#42=D100A8C5；subs x5,x6,#42=F100A8C5

[[instructions]]
name = "B"
roles = ["jump", "epilogue_jump"]
form = "BREL"
opcode = 0x05
ops = ["target:off26"]
asm = "b {target}"

[[instructions]]
name = "BL"
form = "BREL"
opcode = 0x25
ops = ["target:off26"]
asm = "bl {target}"

# ── 逻辑寄存器 AND/BIC/ORR/ORN/EOR/EON（寄存器三操作数）──
# oracle：and x0,x1,x2=8A020020（W=0A…）、bic x6,x7,x8=8A2800E6（N 位=1）、
#   orr=AA/2A、orn x6,x7,x8=AA2800E6、eor=CA/4A、eon x6,x7,x8=CA2800E6

[[instructions]]
name = "MOVZX1"   # movz x, #imm16, lsl #16
form = "MOVW16"
opcode = 0x1A5
fields = { hw = 1 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #16"

[[instructions]]
name = "MOVZX2"   # movz x, #imm16, lsl #32
form = "MOVW16"
opcode = 0x1A5
fields = { hw = 2 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #32"

[[instructions]]
name = "MOVZX3"   # movz x, #imm16, lsl #48
form = "MOVW16"
opcode = 0x1A5
fields = { hw = 3 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #48"

[[instructions]]
name = "MOVZW1"   # movz w, #imm16, lsl #16
form = "MOVW16"
opcode = 0xA5
fields = { hw = 1 }
ops = ["dst:r32:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #16"

[[instructions]]
name = "MOVKX1"   # movk x, #imm16, lsl #16
form = "MOVW16"
opcode = 0x1E5
fields = { hw = 1 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movk {dst}, #{imm}, lsl #16"

[[instructions]]
name = "MOVKX2"   # movk x, #imm16, lsl #32
form = "MOVW16"
opcode = 0x1E5
fields = { hw = 2 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movk {dst}, #{imm}, lsl #32"

# ─────────────────────────── 别名 ───────────────────────────

[[forms]]
name = "MULADD"   # MADD/MSUB：rd rn ra rm（位低→高）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "ra", "rm"]

[[forms]]
name = "MUL3"     # MUL 别名（ra=31 fields）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "DIV2A"    # SDIV/UDIV：rd rn rm（[15:10] op2d 经 fields）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "BRREG2"   # BR/BLR：rn（[31:16] b16 常量；[15:10]/[4:0] 零 guard）
opcode_field = "b16"
operand_fields = ["rn"]

[[forms]]
name = "RETF"     # RET：无操作数（rn=30 fields）
opcode_field = "b16"
operand_fields = []

[[forms]]
name = "CBZF"     # CBZ/CBNZ：rn + imm19
opcode_field = "cbop"
operand_fields = ["rt", "imm19"]

[[forms]]
name = "BCF"      # B.cond：imm19（cond 经 fields 常量）
opcode_field = "cbop"
operand_fields = ["imm19"]

[[forms]]
name = "TBZ"      # TBZ/TBNZ：rt + 位序号（b40[23:19] + b5[31]）+ imm14[18:5]
opcode_field = "op7"
operand_fields = ["rt", "b40", "imm14"]

[[forms]]
name = "CSEL4"    # CSEL 族：rd rn cond rm（位低→高；cond 在 rm 之下）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "cond", "rm"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "cond4"
kind = "cond"
signed = false
width = 4

[[operand_slots]]
name = "imm16"
kind = "imm"
signed = false
width = 16

[[operand_slots]]
name = "off19"
kind = "label"
signed = true
width = 19
unit = 4    # 源文本/Inst 字段是**字节**偏移；字段数的是 4 字节字（`b #28` ⇒ imm26 = 7）

[[operand_slots]]
name = "off14"
kind = "label"
signed = true
width = 14
unit = 4    # TBZ/TBNZ 的相对偏移（±32768 字节，步进 4）

# 位序号：6 位值被**切成两段**——低 5 位进 b40[23:19]、第 5 位进 b5[31]（不相邻！）。
# 槽声明 encode = "slice" + fields（声明序 = 从低位切起），编码/解码两侧同源。
[[operand_slots]]
name = "bitpos64"
kind = "imm"
signed = false
width = 6
encode = "slice"
fields = ["b40", "b5"]

[[operand_slots]]
name = "bitpos32"
kind = "imm"
signed = false
width = 5    # 32 位形式：第 5 位不存在（b5 必须为 0，由补集零 guard 保证）

# ── 乘法 MADD/MSUB/MUL（opcode_field=mtop [31:21]）──
# X madd word 9B020C20 → mtop=(>>21)&0x7FF=0x4D8；W=0xD8
# X msub 9B069CA4、W 1B069CA4（o0=1）；mul= madd ra=31（9B027C20/1B027C20）

[[instructions]]
name = "BR"
form = "BRREG2"
opcode = 0xD61F
ops = ["src:r64"]
asm = "br {src}"

[[instructions]]
name = "BLR"
form = "BRREG2"
opcode = 0xD63F
ops = ["src:r64"]
asm = "blr {src}"

[[instructions]]
name = "RET"
roles = ["ret"]
effect = ["Ret"]
form = "RETF"
opcode = 0xD65F
fields = { rn = 30 }
asm = "ret"

# ── 别名 ──

[[forms]]
name = "LSUI"     # LDR/STR(unsigned)：rt rn imm12s
opcode_field = "op8"
operand_fields = ["rt", "rn", "imm12s"]

[[forms]]
name = "LSUN"     # LDUR/STUR：rt rn imm9
opcode_field = "op8"
operand_fields = ["rt", "rn", "imm9"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "imm9s"
kind = "imm"
signed = true
width = 9

[[operand_slots]]
name = "imm7u"
kind = "imm"
signed = false
width = 7

# ─────────────────────────── 指令 ───────────────────────────

[[instructions]]
name = "LDRX"
