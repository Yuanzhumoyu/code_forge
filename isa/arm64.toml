# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "ALUIMM"   # ADD(S)/SUB(S) (imm)：rd/rn/imm12（[23:22] sh=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "imm12"]

[[forms]]
name = "ALUREG"   # ADD/SUB (shifted reg, LSL#0)：rd/rn/rm
                  #（[15:10] imm6=0、[23:22] shift=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "MOVR"     # MOV 别名：rd/rm（rn 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rd", "rm"]

[[forms]]
name = "MOVW16"   # MOVZ/MOVN/MOVK：rd/imm16（顶层 [31:23] 常量，hw 经 fields）
opcode_field = "op9"
operand_fields = ["rd", "imm16"]

[[forms]]
name = "CMPIMM"   # CMP/CMN(imm)：rn/imm12（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "imm12"]

[[forms]]
name = "CMPREG"   # CMP(reg)：rn/rm（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "rm"]

[[forms]]
name = "BREL"     # B/BL：imm26（[31:26] 为 op6 常量）
opcode_field = "op6"
operand_fields = ["imm26"]


[[forms]]
name = "SYSEXC"   # 系统/异常：**顶层是 11 位**（[31:21]，与 mtop 同段）+ imm16（[20:5]）+ op5（[4:0]）
# 顶层**不能**写成 `b16`（[31:16]）：那与 imm16 在 bit16-20 重叠，imm16 大值会把
# 顶层常量写坏（编得出、解不回——派生日志守卫实测 `SVC[imm16=65535]` 抓到）。
opcode_field = "mtop"
operand_fields = ["imm16"]

[[forms]]
name = "ALUSH6"   # 逻辑（移位寄存器，64 位）：rd/rn/rm/imm6（`shift` 是逐指令常量）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm", "imm6"]

[[forms]]
name = "ALUSH5"   # 同上，32 位形式：移位量 5 位（= 同一约束 imm6<32）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm", "imm5"]
[[forms]]
name = "NOPF"     # 全字常量
opcode_field = "word"
operand_fields = []

# ─────────────────────────── 指令 ───────────────────────────
# op8 常量 = 该指令 (word>>24)&0xFF（oracle 实测）：
#   add  x,w=0x91/0x11、adds=0xB1/0x31、sub=0xD1/0x51、subs=0xF1/0x71
#   add(reg) x,w=0x8B/0x0B、sub(reg)=0xCB/0x4B
# op6：b=0x05（0x14000000>>26）、bl=0x25（0x94000000>>26）

# ── 系统/异常生成与返回（A64 的 SYSTEM 族；常量按 corpus 的 `encoding:` 注释核对）──
# `op5` 指低 5 位常量、`b16` 指 [31:16] 常量、`imm16` 占 [20:5]；文本里的 `#imm` 是
# 立即数前缀（`[conventions.mem]` 之外，由操作数槽自己吃——见 `[meta].imm_prefix`）。
# **未实现**：GAS 允许 `dcps1` 省略立即数（默认 0）——那需要"可选操作数"这一新能力，
# 而声明成第二条第指令会与带立即数的那条**编码重叠**（解码 trie 直接拒），见 README 缺口清单。

[[instructions]]
name = "SVC"
form = "SYSEXC"
opcode = 0x6A0
fields = { op5 = 1 }
ops = ["imm:imm16"]
asm = "svc #{imm}"

[[instructions]]
name = "HVC"
form = "SYSEXC"
opcode = 0x6A0
fields = { op5 = 2 }
ops = ["imm:imm16"]
asm = "hvc #{imm}"

[[instructions]]
name = "SMC"
form = "SYSEXC"
opcode = 0x6A0
fields = { op5 = 3 }
ops = ["imm:imm16"]
asm = "smc #{imm}"

[[instructions]]
name = "BRK"
form = "SYSEXC"
opcode = 0x6A1
fields = { op5 = 0 }
ops = ["imm:imm16"]
asm = "brk #{imm}"

[[instructions]]
name = "HLT"
form = "SYSEXC"
opcode = 0x6A2
fields = { op5 = 0 }
ops = ["imm:imm16"]
asm = "hlt #{imm}"

[[instructions]]
name = "DCPS1"
form = "SYSEXC"
opcode = 0x6A5
fields = { op5 = 1 }
ops = ["imm:imm16"]
asm = "dcps1 #{imm}"

[[instructions]]
name = "DCPS2"
