[enum.cond]
# v21 W6+：条件码字段的类型是 IR 的 `IntCC` ⇒ **IR 能表达的条件必须写 `ir`**
# （短形式只在键名恰好等于 IR 助记符时才隐含 `ir`；`gt`/`le`/`ge`/`lt` 这些 A64 名
# 与 IR 名不同名，必须显式写）。`mi`/`pl`/`vs`/`vc`（符号/溢出）与 `al`/`nv`
# （恒真/恒假）在 `IntCC` 里没有对应谓词 ⇒ 留空：这些条件的汇编文本与字节**表达不了**
# （要表达得另开 `flag` 银行的表并给专用形态，见 x86 的 `[enum.flagcond]`），
# 解析/解码对这些条件 fail-closed。
eq = 0
ne = 1
cs = { code = 2, ir = "uge" }
hs = 2
cc = { code = 3, ir = "ult" }
lo = 3
mi = 4
pl = 5
vs = 6
vc = 7
hi = { code = 8, ir = "ugt" }
ls = { code = 9, ir = "ule" }
ge = { code = 10, ir = "sge" }
lt = { code = 11, ir = "slt" }
gt = { code = 12, ir = "sgt" }
le = { code = 13, ir = "sle" }
al = 14
nv = 15

# 标志位条件表（v21 W6+ 甲）：A64 条件码里**不是值比较谓词**的那 6 个 ✗ —— 符号
# （`mi`/`pl` ⇒ `FlagCC::S`/`Ns`）、溢出（`vs`/`vc` ⇒ `O`/`No`）、恒真恒假（`al`/`nv`）。
# 它们由 `cself`/`csincf`/`csinvf`/`csnegf` 这组**标志位形态**承接（见 CSEL 家族下方 ✗）。
[enum.flagcond]
mi = { code = 4, ir = "s" }
pl = { code = 5, ir = "ns" }
vs = { code = 6, ir = "o" }
vc = { code = 7, ir = "no" }
al = { code = 14, ir = "al" }
nv = { code = 15, ir = "nv" }

# ─────────────────────────── 操作数槽 ───────────────────────────

[operand.adr_off]
kind = "imm"
bits = 21
signed = true
encode = "slice"
fields = ["immlo", "immhi"]

[operand.adrp_off]
kind = "imm"
bits = 21
signed = true
unit = 4096
encode = "slice"
fields = ["immlo", "immhi"]

[operand.adr_sym]
kind = "imm"
bits = 21
signed = true
symbol = { allow = true, require = true }
encode = "slice"
fields = ["immlo", "immhi"]

[operand.varr_q]
kind = "imm"
bits = 1
enum = "arr_q"
encode = "slice"
fields = ["vq"]

[operand.varr]
kind = "imm"
bits = 3
enum = "arr"
encode = "slice"
fields = ["vq", "vsize"]

[operand.rz64]
kind = "reg"
class = "gpr64"
zero = true

[operand.rz32]
kind = "reg"
class = "gpr32"
zero = true

[operand.r64]
kind = "reg"
class = "gpr64"
roles = "inout"

[operand.r32]
kind = "reg"
class = "gpr32"
roles = "inout"

# ── 扩展寄存器操作数的三段：关键字（命名立即数）+ 量 ──
# `extw3`/`extx3` 是同一段位（option [15:13]）的两张表：前者收 W 寄存器的扩展、后者收 X 的。
[operand.extw3]
kind = "imm"
signed = false
bits = 3
enum = "extend_w"

[operand.extx3]
kind = "imm"
signed = false
bits = 3
enum = "extend_x"

[operand.amt3]
kind = "imm"
signed = false
bits = 3

# ── 重定位修饰的**符号位置**：unit == 1（校验硬要求）+ symbols + require_symbol ──
# `require_symbol` 把本槽收窄成"必须记到符号"——否则数值写法会被它抢走
# （unit 更细 ⇒ 接受域更窄 ⇒ 特异性裁决里优先命中），见 model.rs 的字段注释。
# `movz`/`movk`/`movn` 的符号立即数：**`hw` 由修饰名决定**，所以按 hw 分四个槽、
# 每个槽用 `imm_fns` 过滤修饰表（否则会把 `abs_g2` 的写法编成 `hw = 0`）。
[operand.imm16g0]
kind = "imm"
signed = false
bits = 16
symbol = { allow = true, require = true, modifiers = [
  "abs_g0",
  "abs_g0_nc",
  "abs_g0_s",
  "prel_g0",
  "prel_g0_nc",
  "gottprel_g0_nc",
  "tprel_g0",
  "tprel_g0_nc",
  "dtprel_g0",
  "dtprel_g0_nc",
] }

[operand.imm16g1]
kind = "imm"
signed = false
bits = 16
symbol = { allow = true, require = true, modifiers = [
  "abs_g1",
  "abs_g1_nc",
  "abs_g1_s",
  "prel_g1",
  "prel_g1_nc",
  "gottprel_g1",
  "tprel_g1",
  "tprel_g1_nc",
  "dtprel_g1",
  "dtprel_g1_nc",
] }

[operand.imm16g2]
kind = "imm"
signed = false
bits = 16
symbol = { allow = true, require = true, modifiers = [
  "abs_g2",
  "abs_g2_nc",
  "abs_g2_s",
  "prel_g2",
  "prel_g2_nc",
  "tprel_g2",
  "tprel_g2_nc",
  "dtprel_g2",
  "dtprel_g2_nc",
] }

[operand.imm16g3]
kind = "imm"
signed = false
bits = 16
symbol = { allow = true, require = true, modifiers = [
  "abs_g3",
  "prel_g3",
  "tprel_g3",
] }

[operand.imm12sym]
kind = "imm"
signed = false
bits = 12
symbol = { allow = true, require = true }

[operand.imm12u]
kind = "imm"
signed = false
bits = 12

# 访存族（LDR/STR）的 imm12 **单位是访问宽度**：真实汇编写**字节**偏移，字段存"字节 ÷ 访问尺寸"
# （`ldr x2, [sp, #32]` 的 imm12 = 4、`ldr w5, [x4, #20]` 的 = 5——语料 CHECK 行的期望字节直接量得）。
# 与上面的 `imm12u`（ALU/CMP/CMN 的立即数**不缩放**：`add x0, x1, #5` 就是 5）是同一段位的
# **两种解释**，所以分成两个槽——"单位"不是全局约定，而是每条指令的语义。
[operand.imm12x]
kind = "imm"
signed = false
bits = 12
unit = 8       # 64 位访问

# 字节/半字访存的 imm12：单位同样是"字节 ÷ 访问宽度"（`ldrb w5, [x4, #20]` ⇒ 字段 20；
# `ldrh w2, [sp, #32]` ⇒ 字段 16）。LDRSW 是 word 访问 ⇒ 复用 `imm12w`。
# FP 成对（LDP/STP）的 imm7：**有符号**（前/后索引会写 `#-64`），单位 = 元素尺寸。
[operand.imm7fp4]
kind = "imm"
signed = true
bits = 7
unit = 4

[operand.imm7fp8]
kind = "imm"
signed = true
bits = 7
unit = 8

[operand.imm7fp16]
kind = "imm"
signed = true
bits = 7
unit = 16

[operand.imm12fp1]
kind = "imm"
signed = false
bits = 12
unit = 1
# FP 访存（B 视图）

[operand.imm12fp2]
kind = "imm"
signed = false
bits = 12
unit = 2
# FP 访存（H 视图）

[operand.imm12fp4]
kind = "imm"
signed = false
bits = 12
unit = 4
# FP 访存（S 视图）

[operand.imm12fp8]
kind = "imm"
signed = false
bits = 12
unit = 8
# FP 访存（D 视图）

[operand.imm12fp16]
kind = "imm"
signed = false
bits = 12
unit = 16
# FP 访存（Q 视图）

[operand.imm12b]
kind = "imm"
signed = false
bits = 12
unit = 1

[operand.imm12h]
kind = "imm"
signed = false
bits = 12
unit = 2
[operand.imm12w]
kind = "imm"
signed = false
bits = 12
unit = 4       # 32 位访问

[operand.imm16u]
kind = "imm"
signed = false
bits = 16

[operand.imm6]
kind = "imm"
signed = false
bits = 6

[operand.imm5]
kind = "imm"
signed = false
bits = 5

[operand.off26]
kind = "label"
signed = true
bits = 26
unit = 4       # 源文本/Inst 字段是**字节**偏移；字段数的是 4 字节字（`b #28` ⇒ imm26 = 7）

# ─────────────────────────── 编码形式 ───────────────────────────

[form.ADR_F]
fields = [
  "u5[28:24]:opcode",
  "u5[4:0]:rd",
  "u2[30:29]:immlo",
  "u19[23:5]:immhi",
  "u1[31]:adr_op",
]

[inst.ADR]
form = "ADR_F"
opcode = 0x10
match = { adr_op = 0 }
asm = "adr {dst:r64:out}, {off:adr_off}"

[inst.ADRP]
form = "ADR_F"
opcode = 0x10
match = { adr_op = 1 }
asm = "adrp {dst:r64:out}, {off:adrp_off}"

[inst.ADR_SYM]
form = "ADR_F"
opcode = 0x10
match = { adr_op = 0 }
asm = "adr {dst:r64:out}, {sym:adr_sym}"

[inst.ADRP_SYM]
form = "ADR_F"
opcode = 0x10
match = { adr_op = 1 }
asm = "adrp {dst:r64:out}, {sym:adr_sym}"

[form.ALUIMM]
# ADD(S)/SUB(S) (imm)：rd/rn/imm12（[23:22] sh=0 → 零 guard）
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u12[21:10]:imm12",
  "u2[23:22]:shift",
]

[form.ALUREG]
# ADD/SUB (shifted reg, LSL#0)：rd/rn/rm
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u1[21]:nbit",
]
#（[15:10] imm6=0、[23:22] shift=0 → 零 guard）

[form.MOVR]
# MOV 别名：rd/rm（rn 经 fields=31 常量）
fields = ["u8[31:24]:opcode", "u5[4:0]:rd", "u5[20:16]:rm", "u5[9:5]:rn"]

[form.MOVW16]
# MOVZ/MOVN/MOVK：rd/imm16（顶层 [31:23] 常量，hw 经 fields）
fields = ["u9[31:23]:opcode", "u5[4:0]:rd", "u16[20:5]:imm16", "u2[22:21]:hw"]

[form.CMPIMM]
# CMP/CMN(imm)：rn/imm12（rd 经 fields=31 常量）
fields = ["u8[31:24]:opcode", "u5[9:5]:rn", "u12[21:10]:imm12", "u5[4:0]:rd"]

[form.CMPREG]
# CMP(reg)：rn/rm（rd 经 fields=31 常量）
fields = ["u8[31:24]:opcode", "u5[9:5]:rn", "u5[20:16]:rm", "u5[4:0]:rd"]

[form.BREL]
# B/BL：imm26（[31:26] 为 op6 常量）
fields = ["u6[31:26]:opcode", "u26[25:0]:imm26"]

[form.SYSEXC]
# 系统/异常：**顶层是 11 位**（[31:21]，与 mtop 同段）+ imm16（[20:5]）+ op5（[4:0]）
fields = ["u11[31:21]:opcode", "u16[20:5]:imm16", "u5[4:0]:op5"]
# 顶层**不能**写成 `b16`（[31:16]）：那与 imm16 在 bit16-20 重叠，imm16 大值会把
# 顶层常量写坏（编得出、解不回——派生日志守卫实测 `SVC[imm16=65535]` 抓到）。

[form.ALUSH6]
# 逻辑（移位寄存器，64 位）：rd/rn/rm/imm6（`shift` 是逐指令常量）
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u6[15:10]:imm6",
  "u2[23:22]:shift",
  "u1[21]:nbit",
]

[form.ALUSH5]
# 同上，32 位形式：移位量 5 位（= 同一约束 imm6<32）
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u5[14:10]:imm5",
  "u2[23:22]:shift",
  "u1[21]:nbit",
]

[form.NOPF]
# 全字常量
fields = ["u32[31:0]:opcode"]

# ─────────────────────────── 指令 ───────────────────────────
# op8 常量 = 该指令 (word>>24)&0xFF（oracle 实测）：
#   add  x,w=0x91/0x11、adds=0xB1/0x31、sub=0xD1/0x51、subs=0xF1/0x71
#   add(reg) x,w=0x8B/0x0B、sub(reg)=0xCB/0x4B
# op6：b=0x05（0x14000000>>26）、bl=0x25（0x94000000>>26）

# ── 系统/异常生成与返回（A64 的 SYSTEM 族；常量按 corpus 的 `encoding:` 注释核对）──
# `op5` 指低 5 位常量、`b16` 指 [31:16] 常量、`imm16` 占 [20:5]；文本里的 `#imm` 是
# 立即数前缀（`[conventions.mem]` 之外，由操作数槽自己吃——见 `[meta].imm_prefix`）。
# **未实现**：GAS 允许 `dcps1` 省略立即数（默认 0）——那需要"可选操作数"这一新能力，
# 而声明成第二条第指令会与带立即数的那条**编码重叠**（解码 trie 直接拒），见 README 缺口清单。

[inst.SVC]
form = "SYSEXC"
opcode = 0x6A0
match = { op5 = 1 }
asm = "svc #{imm:imm16}"

[inst.HVC]
form = "SYSEXC"
opcode = 0x6A0
match = { op5 = 2 }
asm = "hvc #{imm:imm16}"

[inst.SMC]
form = "SYSEXC"
opcode = 0x6A0
match = { op5 = 3 }
asm = "smc #{imm:imm16}"

[inst.BRK]
form = "SYSEXC"
opcode = 0x6A1
match = { op5 = 0 }
asm = "brk #{imm:imm16}"

[inst.HLT]
form = "SYSEXC"
opcode = 0x6A2
match = { op5 = 0 }
asm = "hlt #{imm:imm16}"

[inst.DCPS1]
form = "SYSEXC"
opcode = 0x6A5
match = { op5 = 1 }
asm = "dcps1 #{imm:imm16}"

[inst.DCPS2]
form = "SYSEXC"
opcode = 0x6A5
match = { op5 = 2 }
asm = "dcps2 #{imm:imm16}"

[inst.DCPS3]
form = "SYSEXC"
opcode = 0x6A5
match = { op5 = 3 }
asm = "dcps3 #{imm:imm16}"

# 整字常量（无操作数）：ERET=0xD69F03E0、DRPS=0xD6BF03E0
[inst.DCPS1B]
# 裸 `dcps1` = `dcps1 #0`（GAS 缺省 0；imm16==0 的叶 arm 先命中）
form = "SYSEXC"
opcode = 0x6A5
match = { op5 = 1, imm16 = 0 }
asm = "dcps1"

[inst.DCPS2B]
# 裸 `dcps2` = `dcps2 #0`（GAS 缺省 0；imm16==0 的叶 arm 先命中）
form = "SYSEXC"
opcode = 0x6A5
match = { op5 = 2, imm16 = 0 }
asm = "dcps2"

[inst.DCPS3B]
# 裸 `dcps3` = `dcps3 #0`（GAS 缺省 0；imm16==0 的叶 arm 先命中）
form = "SYSEXC"
opcode = 0x6A5
match = { op5 = 3, imm16 = 0 }
asm = "dcps3"
[inst.ERET]
form = "NOPF"
opcode = 0xD69F03E0
asm = "eret"

[inst.DRPS]
form = "NOPF"
opcode = 0xD6BF03E0
asm = "drps"

# ── NOP（D503201F）──
[inst.NOPFAM]
form = "NOPF"
opcode = 0xD503201F
asm = "nop"

# ── NEON：abs（向量）——双寄存器，排列写在**助记符后缀**上（无需词法改动）──
# 编码：0 Q U 01110 size 10000 01000 Rn Rd；字节取自语料 `arm64-advsimd.s` 的 CHECK 行。
# 64 位排列（.8b/.4h/.2s）用 D 视图槽 `fpr`，128 位排列（.16b/.8h/.4s）用 Q 视图槽 `fprq`。
[form.VEC2R]
# NEON 双寄存器（Rd, Rn）：常量段在 vec_a/vec_c/vec_d
fields = [
  "u5[28:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u1[21]:vec_c",
  "u6[15:10]:vec_d",
  "u1[30]:vq",
  "u2[23:22]:vsize",
  "u1[29]:vu",
]

[form.VEC3R]
# NEON ?????Rd, Rn, Rm?
fields = [
  "u5[28:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u1[21]:vec_c",
  "u6[15:10]:vec_d",
  "u1[30]:vq",
  "u2[23:22]:vsize",
  "u1[29]:vu",
]

[form.VEC3RA]
# NEON ???? + ???????????????? vq???????? fields ?????
fields = [
  "u5[28:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u1[30]:vq",
  "u1[21]:vec_c",
  "u6[15:10]:vec_d",
  "u1[29]:vu",
  "u2[23:22]:vsize",
]

