[[templates]]
name = "ADDIMM"
body = { ref = "add", form = "ALUIMM", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "imm:imm12u"], asm = "add {dst}, {src}, #{imm}" }
rows = [
  { inst = "ADDIMMX", slot = "r64", opcode = 0x91, roles = ["frame_free", "frame_set"] },
  { inst = "ADDIMMW", slot = "r32", opcode = 0x11 },
]
