# ── 别名 ──

[stack]
slot = 8
align = 16
fp_save = 8

# 返回寄存器（x0）；Return lowering 的返回值移动目标

# Call 点被调用方破坏的寄存器（regalloc clobber 集）：AAPCS64 caller-saved
# = X0-X18 + lr(X30)。X19-X28 由帧件保存（roles = ["callee_save"]）→ 不在 clobber 集。



[spill.GPR]
# base = X29（fp = 入口 sp，帧顶固定）：emission 的 sp_base = -(frame)
# 是相对帧指针的偏移（spill 槽在帧内底部 [fp - frame + off]，递归各帧
# 独立）；用 STUR/LDUR 真字节偏移（imm9 符号 ±256——与 riscv LD/SD 的
# signed imm12 同角色，帧 > ~256B 报错为已知限制）。
load = "LDURX {0}, X29, {1}"
store = "STURX {0}, X29, {1}"
base = "X29"

[emit]
align_pad = 0
# 独立尾声标签开启：arm64 B（imm26）与 CBZ（imm19）label 槽经定宽 fixup
# （Relative(4,0)）+ Arm64RelocPatcher 位段重排 → return block 经
# `b epilogue_label` 跳到统一尾声，多 return block / 跨块分支函数可用
# （emission.rs 按 needs_epilogue_label=true 布局）。单块函数仍走
# fall-through 尾声（epilogue 紧跟 return block 时 emission 不空发跳转）。
epilogue_label = true


# ─────────────────────── lowering（64 位主；32 位 W 变体按 rs1_width）───────────────────────
# 覆盖 op 集 = P1 tm 测试所需最小集（SUPPORTED_OPS 由此唯一集派生）。

[[lowering]]
op = "Iadd"
when = { eq = ["rs1_width", 32] }
insts = ["ADDREGW {out}, {0}, {1}"]

[[lowering]]
op = "Iadd"
insts = ["ADDREGX {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
when = { eq = ["rs1_width", 32] }
insts = ["SUBREGW {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
insts = ["SUBREGX {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
when = { eq = ["rs1_width", 32] }
insts = ["MULW {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
insts = ["MULX {out}, {0}, {1}"]

# Iconst 值分派（按常量池解析真值 attr `iconst`；⚠️ 不能用 `imm0` 判符号——
# Iconst 的 immediate 是 `Immediate::Const(cid)`，imm0 = 池索引正数，无值语义，
# P3① 实证 imm0<0 规则永不命中）：
#   16 位域内（|v| < 0x10000）→ 单条 MOVZ（正）/MOVN（负，高位全 1 = 符号扩展）。
#   域外 → 全片序列：X 恒 4 条 movz(hw3)+movk(hw2/hw1/hw0)、W 恒 2 条
#   movz(hw1)+movk(hw0)——任意 64/32 位位型均可构造（含 i64 负大值：两补码
#   位型逐片写入，movz hw3 置高片后 movk 覆盖低片，其余位先清零后覆写，正确）。
# 序列构造先后序 = 高片 movz 先（清零其它）→ 低片 movk 依 hw 降序覆写。
[[lowering]]
op = "Iconst"
when = { and = [ { eq = ["rd", 64] }, { lt = ["iconst", 0] }, { ge = ["iconst", -65536] } ] }
insts = ["MOVNX {out}, {iconst_c16}"]

[[lowering]]
op = "Iconst"
when = { and = [ { eq = ["rd", 64] }, { ge = ["iconst", 0] }, { lt = ["iconst", 65536] } ] }
insts = ["MOVZX {out}, {iconst}"]

[[lowering]]
op = "Iconst"
when = { and = [ { eq = ["rd", 64] }, { not = { and = [ { ge = ["iconst", -65536] }, { lt = ["iconst", 65536] } ] } } ] }
insts = [
  "MOVZX3 {out}, {iconst_f3}",
  "MOVKX2 {out}, {iconst_f2}",
  "MOVKX1 {out}, {iconst_f1}",
  "MOVKX {out}, {iconst_f0}",
]

[[lowering]]
op = "Iconst"
when = { and = [ { lt = ["iconst", 0] }, { ge = ["iconst", -65536] } ] }
insts = ["MOVNW {out}, {iconst_c16}"]

[[lowering]]
op = "Iconst"
when = { and = [ { ge = ["iconst", 0] }, { lt = ["iconst", 65536] } ] }
insts = ["MOVZW {out}, {iconst}"]

[[lowering]]
op = "Iconst"
when = { not = { and = [ { ge = ["iconst", -65536] }, { lt = ["iconst", 65536] } ] } }
insts = [
  "MOVZW1 {out}, {iconst_f1}",
  "MOVKW {out}, {iconst_f0}",
]

[[lowering]]
op = "Copy"
insts = ["MOVX {out}, {0}"]

# ── 逻辑运算（P3：Band/Bor/Bxor → ANDREG/ORRREG/EORREG 直落）──

[[lowering]]
op = "Band"
when = { eq = ["rs1_width", 32] }
insts = ["ANDREGW {out}, {0}, {1}"]

[[lowering]]
op = "Band"
insts = ["ANDREGX {out}, {0}, {1}"]

[[lowering]]
op = "Bor"
when = { eq = ["rs1_width", 32] }
insts = ["ORRREGW {out}, {0}, {1}"]

[[lowering]]
op = "Bor"
insts = ["ORRREGX {out}, {0}, {1}"]

[[lowering]]
op = "Bxor"
when = { eq = ["rs1_width", 32] }
insts = ["EORREGW {out}, {0}, {1}"]

[[lowering]]
op = "Bxor"
insts = ["EORREGX {out}, {0}, {1}"]

# ═══════════════════════ 参数化模板（v18 S2c：X/W 对）═══════════════════════
# 一处声明 → 两条指令（sf 位、寄存器槽、opcode 逐行给）；`body.ref` 是引用名，
# 同名的 X/W 两条自动构成多态引用——取代原先手写的 [[aliases]] 清单（会漂移，见方案 §2.3）。

[[templates]]
name = "ADDIMM"
body = { ref = "add", form = "ALUIMM", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "imm:imm12u"], asm = "add {dst}, {src}, #{imm}" }
rows = [
  { inst = "ADDIMMX", slot = "r64", opcode = 0x91, roles = ["frame_free", "frame_set"] },
  { inst = "ADDIMMW", slot = "r32", opcode = 0x11 },
]
[[templates]]
name = "ADDSIMM"
body = { ref = "adds", form = "ALUIMM", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "imm:imm12u"], asm = "adds {dst}, {src}, #{imm}" }
rows = [
  { inst = "ADDSIMMX", slot = "r64", opcode = 0xB1 },
  { inst = "ADDSIMMW", slot = "r32", opcode = 0x31 },
]
[[templates]]
name = "SUBIMM"
body = { ref = "sub", form = "ALUIMM", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "imm:imm12u"], asm = "sub {dst}, {src}, #{imm}" }
rows = [
  { inst = "SUBIMMX", slot = "r64", opcode = 0xD1, roles = ["frame_alloc"] },
  { inst = "SUBIMMW", slot = "r32", opcode = 0x51 },
]
[[templates]]
name = "SUBSIMM"
body = { ref = "subs", form = "ALUIMM", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "imm:imm12u"], asm = "subs {dst}, {src}, #{imm}" }
rows = [
  { inst = "SUBSIMMX", slot = "r64", opcode = 0xF1 },
  { inst = "SUBSIMMW", slot = "r32", opcode = 0x71 },
]
[[templates]]
name = "ADDREG"
body = { ref = "add", form = "ALUREG", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "src2:{slot}"], asm = "add {dst}, {src}, {src2}" }
rows = [
  { inst = "ADDREGX", slot = "r64", opcode = 0x8B },
  { inst = "ADDREGW", slot = "r32", opcode = 0x0B },
]
[[templates]]
name = "SUBREG"
body = { ref = "sub", form = "ALUREG", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "src2:{slot}"], asm = "sub {dst}, {src}, {src2}" }
rows = [
  { inst = "SUBREGX", slot = "r64", opcode = 0xCB },
  { inst = "SUBREGW", slot = "r32", opcode = 0x4B },
]
[[templates]]
name = "ADDSREG"
body = { ref = "adds", form = "ALUREG", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "src2:{slot}"], asm = "adds {dst}, {src}, {src2}" }
rows = [
  { inst = "ADDSREGX", slot = "r64", opcode = 0xAB },
  { inst = "ADDSREGW", slot = "r32", opcode = 0x2B },
]
