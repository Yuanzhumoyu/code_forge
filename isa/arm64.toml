# ── NEON：abs（向量）——双寄存器，排列写在**助记符后缀**上（无需词法改动）──
# 编码：0 Q U 01110 size 10000 01000 Rn Rd；字节取自语料 `arm64-advsimd.s` 的 CHECK 行。
# 64 位排列（.8b/.4h/.2s）用 D 视图槽 `fpr`，128 位排列（.16b/.8h/.4s）用 Q 视图槽 `fprq`。
[[forms]]
name = "VEC2R"   # NEON 双寄存器（Rd, Rn）：常量段在 vec_a/vec_c/vec_d
opcode_field = "vec_a"
operand_fields = ["rt", "rn"]

[[forms]]
