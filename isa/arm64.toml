# ── NEON：neg（向量）——与 abs 同形，只差 U=1 ──
# 语料 `neg.8b v0, v0` = 0x2E20B800 = `abs.8b` | (1 << 29) ⇒ 规则被上游证实；
# 其余排列按同一规则推得（U 位 + Q/size），并由生成期编解码往返与 `[[vectors]]` 双重钉住。
[inst.NEG8B]
form = "VEC2R"
opcode = 0x0E
match = { vq = 0, vu = 1, vsize = 0, vec_c = 1, vec_d = 46, rm = 0 }
asm = "neg.8b {dst:fpr:out}, {src:fpr}"

