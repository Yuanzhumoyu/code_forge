# ── csel 家族的**标志位条件**形态（v21 W6+ 甲）─────────────────────────────
# A64 的条件码 16 个里有 6 个（`mi`/`pl`/`vs`/`vc`/`al`/`nv`）**不是**值的比较谓词 ✗
# ——它们是符号/溢出/恒真恒假 ✗，`IntCC` 里没有对应 ✗。**条件码要写全** ✗：不能因为
# "整数比较形态用不到它们"就让这 6 个条件在谱里无处安放 ✗ ⇒ 走 `flag` 银行 ✗
# （生成物字段类型是 `forge_ir::FlagCC` ✗）。
# 汇编面用独立助记符 `cself`/`csincf`/`csinvf`/`csnegf` ✗：与整数形态**同文本同签名**的
# 双形态会被歧义 lint 判成真歧义（文本层分不出条件银行 ✗）⇒ 必须可分辨 ✗。
[family.CSEL_FLAG]
body = { group = "cself", form = "CSEL4", opcode = "{opcode}", asm = "cself {dst:{slot}:out#0}, {src:{slot}#1}, {src2:{slot}#3}, {cc:flag4#2}" }
rows = [
  { inst = "CSELX_F", slot = "r64", opcode = 0x4D4 },
  { inst = "CSELW_F", slot = "r32", opcode = 0xD4 },
]
[family.CSINC_FLAG]
body = { group = "csincf", form = "CSEL4", opcode = "{opcode}", asm = "csincf {dst:{slot}:out#0}, {src:{slot}#1}, {src2:{slot}#3}, {cc:flag4#2}", match = { csop2 = 1 } }
rows = [
  { inst = "CSINCX_F", slot = "r64", opcode = 0x4D4 },
  { inst = "CSINCW_F", slot = "r32", opcode = 0xD4 },
]
[family.CSINV_FLAG]
body = { group = "csinvf", form = "CSEL4", opcode = "{opcode}", asm = "csinvf {dst:{slot}:out#0}, {src:{slot}#1}, {src2:{slot}#3}, {cc:flag4#2}" }
rows = [
  { inst = "CSINVX_F", slot = "r64", opcode = 0x6D4 },
  { inst = "CSINVW_F", slot = "r32", opcode = 0x2D4 },
]
[family.CSNEG_FLAG]
body = { group = "csnegf", form = "CSEL4", opcode = "{opcode}", asm = "csnegf {dst:{slot}:out#0}, {src:{slot}#1}, {src2:{slot}#3}, {cc:flag4#2}", match = { csop2 = 1 } }
rows = [
  { inst = "CSNEGX_F", slot = "r64", opcode = 0x6D4 },
  { inst = "CSNEGW_F", slot = "r32", opcode = 0x2D4 },
]

# ── B.cond（v18 S3c）：条件码在 [3:0]（固定字段 `bcond`），助记符由 `{cname}` 插值 ──
# A64 的 B.cond 只允许 cond ≠ AL(1110)/NV(1111)（`[3:0]=111x` 保留）；`hs`/`lo` 是
# `cs`/`cc` 的**同码别名**（表里已声明），故各给一行让汇编器也认这两个拼写
# （反汇编只会渲染首选名 `cs`/`cc`）。表里的 `al`/`nv` 供 CSEL 族使用。
[family.BCOND]
body = { form = "BCF", opcode = 0x54, asm = "b.{cname} {target:off19}" }
rows = [
  { inst = "B_EQ", cname = "eq", match = { bcond = 0 } },
  { inst = "B_NE", cname = "ne", match = { bcond = 1 } },
  { inst = "B_CS", cname = "cs", match = { bcond = 2 } },
  { inst = "B_HS", cname = "hs", match = { bcond = 2 } },
  { inst = "B_CC", cname = "cc", match = { bcond = 3 } },
  { inst = "B_LO", cname = "lo", match = { bcond = 3 } },
  { inst = "B_MI", cname = "mi", match = { bcond = 4 } },
  { inst = "B_PL", cname = "pl", match = { bcond = 5 } },
  { inst = "B_VS", cname = "vs", match = { bcond = 6 } },
  { inst = "B_VC", cname = "vc", match = { bcond = 7 } },
  { inst = "B_HI", cname = "hi", match = { bcond = 8 } },
  { inst = "B_LS", cname = "ls", match = { bcond = 9 } },
  { inst = "B_GE", cname = "ge", match = { bcond = 10 } },
  { inst = "B_LT", cname = "lt", match = { bcond = 11 } },
  { inst = "B_GT", cname = "gt", match = { bcond = 12 } },
  { inst = "B_LE", cname = "le", match = { bcond = 13 } },
  # AL/NV 在 A64 里是保留码，但上游汇编器收（语料 `b.al L1` 实测 cond=0b1110）
  { inst = "B_AL", cname = "al", match = { bcond = 14 } },
  { inst = "B_NV", cname = "nv", match = { bcond = 15 } },
]

