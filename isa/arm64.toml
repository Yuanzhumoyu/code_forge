# ── 逻辑（移位寄存器）**带移位后缀**：`{mn} {dst}, {src}, {src2}, lsl|lsr|asr|ror #{sh}` ──
# 移位种类是 2 位**常量**（`fields.shift`），移位量是操作数槽；无后缀形态仍是 `ALUREG`
# （其余位恒 0 = imm6 0/shift 0）——解码时它先命中，故 `, lsl #0` 与无后缀等价。
# X/W 只差 opcode、寄存器槽与移位量槽宽（imm6/imm5），落在行上。
[[templates]]
name = "AND_SHIFT"
body = { form = "{form}", ops = ["dst:{slot}:out", "src:{slot}", "src2:{slot}", "sh:{shslot}"], asm = "and {dst}, {src}, {src2}, {shname} #{sh}", fields = { shift = "{shcode}" } }
rows = [
  { inst = "AND_LSLX", form = "ALUSH6", opcode = 0x8A, slot = "r64", shslot = "imm6", shname = "lsl", shcode = 0 },
  { inst = "AND_LSRX", form = "ALUSH6", opcode = 0x8A, slot = "r64", shslot = "imm6", shname = "lsr", shcode = 1 },
  { inst = "AND_ASRX", form = "ALUSH6", opcode = 0x8A, slot = "r64", shslot = "imm6", shname = "asr", shcode = 2 },
  { inst = "AND_RORX", form = "ALUSH6", opcode = 0x8A, slot = "r64", shslot = "imm6", shname = "ror", shcode = 3 },
  { inst = "AND_LSLW", form = "ALUSH5", opcode = 0x0A, slot = "r32", shslot = "imm5", shname = "lsl", shcode = 0 },
  { inst = "AND_LSRW", form = "ALUSH5", opcode = 0x0A, slot = "r32", shslot = "imm5", shname = "lsr", shcode = 1 },
  { inst = "AND_ASRW", form = "ALUSH5", opcode = 0x0A, slot = "r32", shslot = "imm5", shname = "asr", shcode = 2 },
