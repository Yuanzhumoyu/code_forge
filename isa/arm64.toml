#:schema ../isa-dsl.schema.json
# ============================================================
# AArch64 (ARM64) — A64 — ISA-DSL 语法（P1 迭代 A1：全链最小可信集）
# ============================================================
#
# 严格遵循 ARM A-profile A64 指令集定义（developer.arm.com DDI0602；
# A64 指令定宽 32 位小端字）。编码位段以官方文档为准；每条 opcode/
# 固定常量由本机 LLVM clang --target=aarch64-none-elf + llvm-objdump
# 逐字 oracle 校验（tests/arm64_tests.rs 的 golden 来自该 oracle）。
#
# A1 实现（打通 编码/解码/汇编 全链的最小集，全部常量已 oracle 验证）：
#   NOP；ADD/ADDS/SUB/SUBS (immediate) × X/W；ADD/SUB (shifted register,
#   LSL#0 形式 = 三寄存器操作数) × X/W；B/BL（相对跳转）。
# A2+（后续迭代，逐个 oracle 验证后加入）：逻辑寄存器族、MOVZ/N/K、
#   CMP/CMN 别名、移位立即数、MADD/MSUB/SDIV/UDIV、CSEL、B.cond/CBZ、
#   内存 LD/ST 家族、ADR/ADRP、SP/XZR 语义、[abi]/[emit] 接入与 runner。

[meta]
name = "arm64"
# 主 FPR 类基准：AAPCS64 的浮点值池是 8 字节（v8-v15 的低 64 位），而 FP 的**宽度视图**
# （`fpr1`/`fpr2`/`fpr4`/`fpr16` = B/H/S/Q）里最宽的是 16——不钉住的话"主 FPR 类"会按
# 最宽组取到 Q，ABI 拿它去找 `V0` 就找不到（实测 aapcs64 计划报 `UnresolvedReg`）。
# 显式声明 ⇒ 主类恒为 FPR(8)（V/D 视图）。
default_fpr_width = 8
version = "0.1.0"
endian = "little"
mode = 64
case_insensitive_regs = true
# A64 的 `#` 是**立即数前缀**（`add x0, x1, #5`、`ldr x0, [x1, #8]`），注释是 `//`
#（GAS 的 aarch64 模式也如此）。历史上这里写成 "#"，生成物于是对每行按 `#` 截断——
# 所有带立即数的写法都被砍成 `add x0, x1, ` 而解析失败（语料 parsed 长期只有 37/420 的主因）。
comment_char = "//"
label_suffix = ":"
mnemonic_case = "insensitive"
# 立即数前缀：模板写 `#{imm}` 时由字面段吃掉，而**分支目标**槽（`b {target}`）前没有
# 字面 `#`，得由 `[meta].imm_prefix` 来吃——否则真实写法 `b #28`、`cbz w1, #28` 不匹配。
imm_prefix = "#"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────
# X0-X30（gpr8，64 位）与 W0-W30（gpr4，32 位）共享物理编号 0-30
# （A64 中 Xn/Wn 是同一寄存器组的不同宽度视图）。SP/XZR（31 号上下
# 文语义）后续迭代。
[encoding]
kind = "fixed"
bits = 32

[reg.gpr8]
base_index = 0
names = [
    "X0","X1","X2","X3","X4","X5","X6","X7",
    "X8","X9","X10","X11","X12","X13","X14","X15",
    "X16","X17","X18","X19","X20","X21","X22","X23",
    "X24","X25","X26","X27","X28","X29","X30","SP",
]
# ABI/架构别名（解析认、渲染仍出主名）：31 号在"零寄存器"语境下是 XZR（与 SP 同号），
# LR/FP 是 X30/X29 的惯用名（语料里 `ret lr`、`mov x29, fp`、`stp x29, lr, [sp, #-16]!` 就这么写），
# IP0/IP1 是 X16/X17（链接器 scratch）。**少一个都整行落红**——序言/尾声那批文件全用惯用名。
aliases = { XZR = 31, LR = 30, FP = 29, IP0 = 16, IP1 = 17 }

[reg.gpr4]
base_index = 0
names = [
    "W0","W1","W2","W3","W4","W5","W6","W7",
    "W8","W9","W10","W11","W12","W13","W14","W15",
    "W16","W17","W18","W19","W20","W21","W22","W23",
    "W24","W25","W26","W27","W28","W29","W30","WSP",
]
aliases = { WZR = 31 }

# ─────────────────────── 命名位域（A64）───────────────────────
# 通用寄存器位域位置在全 A64 固定：Rd=[4:0]、Rn=[9:5]、Rm=[20:16]。

[conventions.bitfields]
rd    = { offset = 0,  width = 5 }
rn    = { offset = 5,  width = 5 }
rm    = { offset = 16, width = 5 }
imm12 = { offset = 10, width = 12 } # 加立即数（sh 在 [23:22]，A1 恒 0）
imm16 = { offset = 5,  width = 16 } # MOVZ/N/K 半字立即数（[20:5]）
hw    = { offset = 21, width = 2 }  # MOVZ/N/K 半字选择（A2 恒 0）
# ── NEON（AdvSIMD）常量段：**不连续** ⇒ 切成互不重叠的几段（逐位对上游字反推，勿猜）──
# `abs.8b v0, v0` 上游 = 0x0E20B800 ⇒ Q=0[30]、U=0[29]、[28:24]=01110、size=[23:22]、
# [21]=1、Rm=[20:16]、[15:10]=101110、Rn=[9:5]、Rd=[4:0]。
vec_a = { offset = 24, width = 5 }   # [28:24] = 01110（0x0E）
vec_c = { offset = 21, width = 1 }   # [21] = 1
vec_d = { offset = 10, width = 6 }   # [15:10] = 101110（0x2E）
vq    = { offset = 30, width = 1 }   # Q：0 = 64 位排列、1 = 128 位
vu    = { offset = 29, width = 1 }   # U：0 = abs 系、1 = neg 系
vsize = { offset = 22, width = 2 }   # 元素宽：00 = b、01 = h、10 = s（位 [23:22]，勿写成 23）
nbit  = { offset = 21, width = 1 }
# 逻辑（移位寄存器）族的移位字段：`shift` 是 2 位常量（LSL=0/LSR=1/ASR=2/ROR=3，逐指令给常量），
# 移位量 X 形式 6 位、W 形式 5 位——A64 规定 32 位形式 imm6<32，5 位槽就是这条约束本身
# （用 6 位槽收 `lsl #40` 会编出未分配的字，故 W 形式另设一槽）。
shift = { offset = 22, width = 2 }
imm6  = { offset = 10, width = 6 }
imm5  = { offset = 10, width = 5 }  # 逻辑族 NOT 位（BIC/ORN/EON=1）
# 顶层固定段：
#  - op8 = 位[31:24]（立即数 ALU 与寄存器 ALU 顶层 8 位；X(sf=1)/W(sf=0)
#    各自为不同 8 位常量，故 X/W 分立 family、opcode 各含 sf）
op8   = { offset = 24, width = 8 }
op9   = { offset = 23, width = 9 } # MOV 宽立即数族（含 bit23=1 的 100101）
#  - op6 = 位[31:26]（B/BL 的 6 位顶层常量；imm26 占 [25:0]）
op6   = { offset = 26, width = 6 }
imm26 = { offset = 0,  width = 26 } # B/BL 相对偏移（与 op6 互补覆盖全字）
word  = { offset = 0,  width = 32 } # 全字常量（NOP）
# A3 扩展
ra    = { offset = 10, width = 5 }   # MADD/MSUB 累加器
o0    = { offset = 15, width = 1 }   # madd=0 / msub=1
op2d  = { offset = 10, width = 6 }   # sdiv=000011 / udiv=000010（位[15:10]）
cond  = { offset = 12, width = 4 }   # CSEL/CSINC/CSINV/CSNEG 条件码（[15:12]）
bcond = { offset = 0,  width = 4 }   # B.cond 条件码（[3:0]；bit4 恒 0，未用位天然 0）
csop2 = { offset = 10, width = 2 }   # CSEL 族 op2（sel=0 inc=1）
mtop  = { offset = 21, width = 11 }  # 乘除/条件族顶层 [31:21]（含 sf）
b16   = { offset = 16, width = 16 }  # BR/BLR/RET 顶层 [31:16]
imm19 = { offset = 5,  width = 19 }  # CBZ/CBNZ/B.cond 相对偏移（[23:5]）
cbop  = { offset = 24, width = 8 }   # CBZ/CBNZ 顶层（含 sf/op 位）
rt    = { offset = 0,  width = 5 }   # CBZ/CBNZ 测试寄存器 Rt=[4:0]
op5   = { offset = 0,  width = 5 }   # 系统/异常指令的低 5 位（svc=1/hvc=2/smc=3/dcps1..3=1..3/brk,hlt=0）
op7   = { offset = 24, width = 7 }   # TBZ/TBNZ 顶层 [30:24]（bit31 让给位序号的高位 b5）
nbit_l= { offset = 22, width = 1 }   # 逻辑立即数的 N（64 位元素=1；32 位形式恒 0）
immr  = { offset = 16, width = 6 }   # 逻辑立即数的旋转量
imms  = { offset = 10, width = 6 }   # 逻辑立即数的"1 的个数 - 1"与元素尺寸
b5    = { offset = 31, width = 1 }   # TBZ/TBNZ 位序号第 5 位（32 位形式必须为 0）
b40   = { offset = 19, width = 5 }   # TBZ/TBNZ 位序号低 5 位（实测 [0xe3,0xff,0x2b,0x36]）
imm14 = { offset = 5,  width = 14 }  # TBZ/TBNZ 相对偏移（[18:5]；与 imm19 同段但不同顶层）

opc2  = { offset = 22, width = 2 }   # LS opc（00 store / 01 load / 10 符号载）
imm12s= { offset = 10, width = 12 }  # LDR/STR 无符号 imm12（与 ALU imm12 同段）
imm9  = { offset = 12, width = 9 }   # LDUR/STUR 符号偏移（真字节）
mode  = { offset = 10, width = 2 }   # LDUR 族 [11:10]：00 无偏移 / 01 后索引 / 11 前索引
zero21= { offset = 21, width = 1 }   # LDUR 族 [21] 恒 0（保留位；显式声明出来，免得靠缺省）
one21 = { offset = 21, width = 1 }   # 寄存器偏移寻址 [21] 恒 1（与 imm9 家族的唯一区分位）
option= { offset = 13, width = 3 }   # 访存索引的扩展/移位类型：UXTW=2 / LSL=3 / SXTW=6 / SXTX=7
sbit  = { offset = 12, width = 1 }   # 该类型是否自带缩放（S=1 ⇔ 文本里写 `#N`，N = log2(宽度)）
imm3  = { offset = 10, width = 3 }   # 扩展寄存器操作数的量（`sxtw #2` 的 2；省略 = 0）
idx2  = { offset = 22, width = 2 }   # LDP/STP index 低位（bit24 由 op8 常量给：100 off STP/101 off LDP ⇒ idx2 = 0/1）
rt2   = { offset = 10, width = 5 }   # LDP/STP 第二寄存器
op8b  = { offset = 16, width = 8 }   # FMOV 的中间常量（S=0x20 / D=0x60）
zero6 = { offset = 10, width = 6 }   # FMOV 保留位（[15:10] = 0）
imm7  = { offset = 15, width = 7 }   # LDP/STP 偏移（对元素，缩放单元）

# A64 条件码（v18 S3c）：键 = 汇编/反汇编可见的条件名，code = 4 位编码。
# 这张表两处用：CSEL 族的 `cond` 槽（符号名）与下面 B.cond 模板的固定字段。
# 不写 `ir` = 不映射 IR 整数条件（本 ISA 的 lowering 目前不用 `{cc}`；
# 将来加 Icmp lowering 时再补 ir，validate 会强制补全 10 个）。
# 扩展寄存器操作数的关键字（`add x8, x8, w5, sxtw #2` 的 `sxtw`）。**分两张表是按操作数类别**：
# W 表收全部 8 个（`add w1, w2, w3, uxtx` 也合法——32 位视图下 uxtx 是恒等），X 表只收 uxtx/sxtx。
[conventions.imm_names.arr_q]   # 逻辑/位运算族：排列只决定 Q（[23:22] 是常量，非元素宽）
"8b"  = 0
"16b" = 1
"4h"  = 0
"8h"  = 1
"2s"  = 0
"4s"  = 1
"2d"  = 1

[conventions.imm_names.arr]   # NEON ????? = size*2 + q???? fields=["vq","vsize"] ?????
"8b"  = 0
"16b" = 1
"4h"  = 2
"8h"  = 3
"2s"  = 4
"4s"  = 5
"2d"  = 7

[conventions.imm_names.extend_w]
uxtb = 0
uxth = 1
uxtw = 2
uxtx = 3
sxtb = 4
sxth = 5
sxtw = 6
sxtx = 7

[conventions.imm_names.extend_x]
uxtx = 3
sxtx = 7

# ── 重定位修饰（A64 的 `#:lo12:sym` / `:lo12:sym`）──
#
# 修饰**只选重定位种类**，不改算术值：源文本的值 = 符号引用的占位（0），与上游
# "未重定位字段 = 0"一致（`elf-reloc-addsubimm.s` 的 OBJ 期望写着 `add x2, x3, #0`）。
# `text` **含 `#`**（`#:lo12:{0}` 与 `:lo12:{0}` 各一条）——于是指令模板**不带 `#`**，
# 重定位变体的"文本形状"与数值变体**不同**：同一形状的多候选里分派会提交到排第一的那条
# （不按操作数失败回退），形状相同就会互相遮蔽（实测：加了重定位变体后
# `add W0, W1, #0` 反而装配不出来）。一张表覆盖带 `#` 与不带 `#` 两种写法。
# 名字清单 = A64 的重定位修饰集合（语料普查 47 个名字）。
[[conventions.imm_fn]]
name = "abs_g0"
text = "#:abs_g0:{0}"
expr = "{0}"

[[conventions.imm_fn]]
name = "abs_g0_n"
text = ":abs_g0:{0}"
expr = "{0}"

