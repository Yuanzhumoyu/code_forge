# ── 寄存器偏移寻址（`[Xn, Xm{, ext}]`）──
#
# 编码：`size 111 V 00 opc 1 Rm option S 10 Rn Rt`——与 imm9 家族共用 `op8 = 0xF8`(X)/`0xB8`(W)，
# 靠 **bit21 = 1** 与 **[11:10] = 10** 区分（19 条上游期望字节逐条核对过）。
# `option`/`S` 与文本关键字的对应也是**量**出来的：LSL=3 / UXTW=2 / SXTW=6 / SXTX=7；
# S=1 ⇔ 文本带 `#N`，且 **N 恒 = log2(访问宽度)**（X 形式 3、W 形式 2）——所以每种组合都是一条
# 完整的文本模板，不需要"可选片段"机制。索引寄存器的类由 option 决定：LSL/SXTX 收 X 寄存器（r64），
