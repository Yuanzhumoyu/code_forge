# ── 前后索引（writeback）──
#
# A64 的三种寻址模式挤在同一族编码里，靠 mode 位区分：
#   单寄存器在 [11:10]（`00` 无偏移 / `01` 后索引 / `11` 前索引，前后索引与前两者共用
#   `op8 = 0xF8`(X)/`0xB8`(W) 的 unscaled 家族），文本形如 `[Xn, #imm]!` / `[Xn], #imm`；
#   pair 在 [25:23]（`010` 有符号偏移 / `011` 前索引 / `001` 后索引——bit24 进 `op8`、
#   bit23 进 `idx2`），故前索引 `op8 = 0xA9`、后索引 `op8 = 0xA8`（W 形式 `0x29`/`0x28`），
#   而 `idx2` = 2/3（bit23=1）与"有符号偏移"的 0/1 区分开。
# imm 一律**真字节且有符号**；pair 的 imm7 在三种模式下都按元素尺寸缩放（见 imm7x/imm7w 的 unit）。
# 上游期望字节见谱内向量（`stp x29, x30, [sp, #-16]!` = fd 7b bf a9、
# `ldp x29, x30, [sp], #16` = fd 7b c1 a8）。
[inst.LDRX_PRE]
form = "LSUN"
opcode = 0xF8
match = { opc2 = 1, mode = 3, zero21 = 0 }
asm = "ldr {dst:r64:out}, [{base:r64}, #{off:imm9s}]!"

[inst.LDRX_POST]
