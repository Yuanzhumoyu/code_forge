# ── ADD/ADDS/SUB/SUBS (immediate) ──
# oracle 校验样本：add x5,x6,#42 = 9100A8C5；adds w5,w6,#42=3100A8C5；
#   sub x5,x6,#42=D100A8C5；subs x5,x6,#42=F100A8C5

[inst.B]
roles = ["jump", "epilogue_jump"]
form = "BREL"
opcode = 0x05
asm = "b {target:off26}"

[inst.BL]
form = "BREL"
opcode = 0x25
roles = ["call"]
# `call26`（仅命名形态）：BL 的 label 槽逃逸成外部符号时，对象层按目标约定的
# `[link.<format>] call26` 落链接器重定位类型（ELF = R_AARCH64_CALL26）。
reloc = "call26"
asm = "bl {target:off26}"

# ── 逻辑寄存器 AND/BIC/ORR/ORN/EOR/EON（寄存器三操作数）──
# oracle：and x0,x1,x2=8A020020（W=0A…）、bic x6,x7,x8=8A2800E6（N 位=1）、
#   orr=AA/2A、orn x6,x7,x8=AA2800E6、eor=CA/4A、eon x6,x7,x8=CA2800E6

[inst.MOVZX1]
# movz x, #imm16, lsl #16
form = "MOVW16"
opcode = 0x1A5
match = { hw = 1 }
asm = "movz {dst:r64:out}, #{imm:imm16u}, lsl #16"

[inst.MOVZX2]
# movz x, #imm16, lsl #32
form = "MOVW16"
opcode = 0x1A5
match = { hw = 2 }
asm = "movz {dst:r64:out}, #{imm:imm16u}, lsl #32"

[inst.MOVZX3]
# movz x, #imm16, lsl #48
form = "MOVW16"
opcode = 0x1A5
match = { hw = 3 }
asm = "movz {dst:r64:out}, #{imm:imm16u}, lsl #48"

[inst.MOVZW1]
# movz w, #imm16, lsl #16
form = "MOVW16"
opcode = 0xA5
match = { hw = 1 }
asm = "movz {dst:r32:out}, #{imm:imm16u}, lsl #16"

[inst.MOVKX1]
# movk x, #imm16, lsl #16
form = "MOVW16"
opcode = 0x1E5
match = { hw = 1 }
asm = "movk {dst:r64:out}, #{imm:imm16u}, lsl #16"

[inst.MOVKX2]
# movk x, #imm16, lsl #32
form = "MOVW16"
opcode = 0x1E5
match = { hw = 2 }
asm = "movk {dst:r64:out}, #{imm:imm16u}, lsl #32"

# ─────────────────────────── 别名 ───────────────────────────

[form.MULADD]
# MADD/MSUB：rd rn ra rm（位低→高）
fields = [
  "u11[31:21]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[14:10]:ra",
  "u5[20:16]:rm",
  "u1[15]:o0",
]

[form.MUL3]
# MUL 别名（ra=31 fields）
fields = [
  "u11[31:21]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u5[14:10]:ra",
]

[form.DIV2A]
# SDIV/UDIV：rd rn rm（[15:10] op2d 经 fields）
fields = [
  "u11[31:21]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u6[15:10]:op2d",
]

[form.BRREG2]
# BR/BLR：rn（[31:16] b16 常量；[15:10]/[4:0] 零 guard）
fields = ["u16[31:16]:opcode", "u5[9:5]:rn"]

[form.RETF]
# RET：无操作数（rn=30 fields）
fields = ["u16[31:16]:opcode", "u5[9:5]:rn"]

[form.CBZF]
# CBZ/CBNZ：rn + imm19
fields = ["u8[31:24]:opcode", "u5[4:0]:rt", "u19[23:5]:imm19"]

[form.BCF]
# B.cond：imm19（cond 经 fields 常量）
fields = ["u8[31:24]:opcode", "u19[23:5]:imm19", "u4[3:0]:bcond"]

[form.LOGIMM]
# 逻辑（立即数）：rd rn N/immr/imms。顶层用 **op9**（[31:23]，含恒 0 的 bit23）
fields = [
  "u9[31:23]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u1[22]:nbit_l",
  "u6[21:16]:immr",
  "u6[15:10]:imms",
]
# ——用 op8（[31:24]）会与 MOVZ/MOVN/MOVK 的 op9 在 bit23 上撞成同一条 trie 边（0x1A4 vs 0x1A5）。

[form.TBZ]
# TBZ/TBNZ：rt + 位序号（b40[23:19] + b5[31]）+ imm14[18:5]
fields = [
  "u7[30:24]:opcode",
  "u5[4:0]:rt",
  "u5[23:19]:b40",
  "u14[18:5]:imm14",
  "u1[31]:b5",
]

[form.CSEL4]
# CSEL 族：rd rn cond rm（位低→高；cond 在 rm 之下）
fields = [
  "u11[31:21]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u4[15:12]:cond",
  "u5[20:16]:rm",
  "u2[11:10]:csop2",
]

# ─────────────────────────── 操作数槽 ───────────────────────────

[operand.cond4]
kind = "cond"
signed = false
bits = 4

# 标志位条件槽（v21 W6+ 甲）：同一个 4 位条件字段，但银行是**标志位** ⇒ 生成物字段
# 类型是 `forge_ir::FlagCC`（承接 `mi`/`pl`/`vs`/`vc`/`al`/`nv` ✗）。
[operand.flag4]
kind = "cond"
signed = false
bits = 4
cond_bank = "flag"

[operand.imm16]
kind = "imm"
signed = false
bits = 16

[operand.off19]
kind = "label"
signed = true
bits = 19
unit = 4       # 源文本/Inst 字段是**字节**偏移；字段数的是 4 字节字（`b #28` ⇒ imm26 = 7）

[operand.off14]
kind = "label"
signed = true
bits = 14
unit = 4       # TBZ/TBNZ 的相对偏移（±32768 字节，步进 4）

# 位序号：6 位值被**切成两段**——低 5 位进 b40[23:19]、第 5 位进 b5[31]（不相邻！）。
# 槽声明 encode = "slice" + fields（声明序 = 从低位切起），编码/解码两侧同源。
[operand.bitpos64]
kind = "imm"
signed = false
bits = 6
encode = "slice"
fields = ["b40", "b5"]

[operand.bitpos32]
kind = "imm"
signed = false
bits = 5       # 32 位形式：第 5 位不存在（b5 必须为 0，由补集零 guard 保证）

# 逻辑（位掩码）立即数：值必须是"一段连续 1 循环填充整个宽度"的位模式，编码成 N/immr/imms
# 三个分量（非线性映射，故走 `logical_imm` 方案而不是位切片）。
# W 形式：`wrap` 收下 `#~15`、`#~(0xfe<<24)` 这类**按位取反**写出来的负数（两种读数都收，
# 规范化到无符号位模式）；`min` 放宽到 -2^32 才容得下 `~(0xfe<<24)` 这种绝对值大于 2^31 的写法。
[operand.logicimm32]
kind = "imm"
signed = false
bits = 32
literal = "bits"
range = [-4294967296, 9223372036854775807]
encode = "logical_imm"
fields = ["nbit_l", "immr", "imms"]

[operand.logicimm64]
kind = "imm"
signed = false
bits = 64
encode = "logical_imm"
fields = ["nbit_l", "immr", "imms"]

# ── 乘法 MADD/MSUB/MUL（opcode_field=mtop [31:21]）──
# X madd word 9B020C20 → mtop=(>>21)&0x7FF=0x4D8；W=0xD8
# X msub 9B069CA4、W 1B069CA4（o0=1）；mul= madd ra=31（9B027C20/1B027C20）

[inst.BR]
form = "BRREG2"
opcode = 0xD61F
asm = "br {src:r64}"

[inst.BLR]
form = "BRREG2"
opcode = 0xD63F
roles = ["call_indirect"]
asm = "blr {src:r64}"

[inst.RET]
roles = ["ret"]
effect = ["Ret"]
form = "RETF"
opcode = 0xD65F
match = { rn = 30 }
asm = "ret"

[inst.RETR]
# `ret xN`：rn 是操作数（裸 `ret` 本身 = `ret x30`）；与 RET 共用 b16 常量，
# 解码靠"叶 arm 先试 + 平铺 if"回退（RET 的 guard 钉死 rn==30）。
form = "BRREG2"
opcode = 0xD65F
asm = "ret {src:r64}"

# ── 别名 ──

[form.LSUI]
# LDR/STR(unsigned)：rt rn imm12s
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u12[21:10]:imm12s",
  "u2[23:22]:opc2",
]

[form.LSUN]
# LDUR/STUR：rt rn imm9
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u9[20:12]:imm9",
  "u2[11:10]:mode",
  "u2[23:22]:opc2",
  "u1[21]:zero21",
]

# ─────────────────────────── 操作数槽 ───────────────────────────

[operand.imm9s]
kind = "imm"
signed = true
bits = 9

# LDP/STP 的 imm7 同理：文本是**字节**、字段 = 字节 ÷ 元素尺寸，且字段是**有符号**的
# （`stp x29, x30, [sp, #-16]` 的 imm7 = -2；A64 的 pair 偏移可以向下）。
[operand.imm7x]
kind = "imm"
signed = true
bits = 7
unit = 8

[operand.imm7w]
kind = "imm"
signed = true
bits = 7
unit = 4

# ─────────────────────────── 指令 ───────────────────────────

[inst.LDRX]
form = "LSUI"
opcode = 0xF9
match = { opc2 = 1 }
asm = "ldr {dst:r64:out}, [{base:r64}, #{imm:imm12x}]"

[inst.LDRW]
form = "LSUI"
opcode = 0xB9
match = { opc2 = 1 }
asm = "ldr {dst:r32:out}, [{base:r64}, #{imm:imm12w}]"

[inst.STRX]
form = "LSUI"
opcode = 0xF9
match = { opc2 = 0 }
