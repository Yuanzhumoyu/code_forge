form = "LSUI"
opcode = 0xB9
match = { opc2 = 0 }
asm = "str {src:r32}, [{base:r64}, #{imm:imm12w}]"

[inst.LDURX]
form = "LSUN"
opcode = 0xF8
match = { opc2 = 1, mode = 0, zero21 = 0 }
asm = "ldur {dst:r64:out}, [{base:r64}, #{off:imm9s}]"
# stack_arg_load：被调方收栈形参（`[fp + plan 偏移]`，V29 的 ±256 立即数）
roles = ["callee_load", "stack_arg_load"]

[inst.LDURW]
form = "LSUN"
opcode = 0xB8
match = { opc2 = 1, mode = 0, zero21 = 0 }
asm = "ldur {dst:r32:out}, [{base:r64}, #{off:imm9s}]"

[inst.STURX]
