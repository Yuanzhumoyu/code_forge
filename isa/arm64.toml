# ── 扩展寄存器操作数（`add x8, x8, w5, sxtw #2` / `cmp w0, w1, uxtb`）──
#
# 编码 `sf op S 01011 00 **1** Rm option imm3 Rn Rd`——**与移位寄存器族共用 op8**
# （0x8B/0x0B/0xAB/0x2B/0xCB/0x4B/0xEB/0x6B），靠 **bit21 = 1** 区分。
# **关键字是操作数**（{ext} 走命名立即数表 → option），量也是操作数（imm3）；
# 所以每 (助记符, 宽度) 只有 4 条：W 扩展 / X 扩展 × 带量 / 不带量（省略量 = imm3 0）。
# uxtx/sxtx 收 X 寄存器，其余六种收 W —— 这是**表的分法**，不是两个机制。

[inst.ADD_X_EXTW]
form = "EXTREG"
opcode = 0x8B
match = { one21 = 1 }
asm = "add {dst:r64:out}, {src:r64}, {src2:r32}, {ext:extw3} #{amt:amt3}"

