# 声明序在后，解码仍走前者；这里只承担"带量的写法能装配"。

[inst.ADD_LSLX]
form = "ALUSH6"
opcode = 0x8B
match = { shift = 0 }
asm = "add {dst:rz64:out}, {src:rz64}, {src2:rz64}, lsl #{sh:imm6}"

[inst.ADD_LSLW]
form = "ALUSH5"
opcode = 0xB
match = { shift = 0 }
