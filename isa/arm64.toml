# ── B.cond（v18 S3c）：条件码在 [3:0]（固定字段 `bcond`），助记符由 `{cname}` 插值 ──
# A64 的 B.cond 只允许 cond ≠ AL(1110)/NV(1111)（`[3:0]=111x` 保留）；`hs`/`lo` 是
# `cs`/`cc` 的**同码别名**（表里已声明），故各给一行让汇编器也认这两个拼写
# （反汇编只会渲染首选名 `cs`/`cc`）。表里的 `al`/`nv` 供 CSEL 族使用。
[[templates]]
name = "BCOND"
body = { form = "BCF", opcode = 0x54, ops = ["target:off19"], asm = "b.{cname} {target}" }
rows = [
  { inst = "B_EQ", cname = "eq", fields = { bcond = 0 } },
  { inst = "B_NE", cname = "ne", fields = { bcond = 1 } },
  { inst = "B_CS", cname = "cs", fields = { bcond = 2 } },
  { inst = "B_HS", cname = "hs", fields = { bcond = 2 } },
  { inst = "B_CC", cname = "cc", fields = { bcond = 3 } },
  { inst = "B_LO", cname = "lo", fields = { bcond = 3 } },
  { inst = "B_MI", cname = "mi", fields = { bcond = 4 } },
  { inst = "B_PL", cname = "pl", fields = { bcond = 5 } },
  { inst = "B_VS", cname = "vs", fields = { bcond = 6 } },
  { inst = "B_VC", cname = "vc", fields = { bcond = 7 } },
  { inst = "B_HI", cname = "hi", fields = { bcond = 8 } },
  { inst = "B_LS", cname = "ls", fields = { bcond = 9 } },
  { inst = "B_GE", cname = "ge", fields = { bcond = 10 } },
  { inst = "B_LT", cname = "lt", fields = { bcond = 11 } },
  { inst = "B_GT", cname = "gt", fields = { bcond = 12 } },
  { inst = "B_LE", cname = "le", fields = { bcond = 13 } },
]

