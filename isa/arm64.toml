# ── `mov <Rd>, #:abs_g0_s:sym` / `mov x0, 1b - 0b`（符号/表达式立即数）──
#
# 与 `mov {dst}, #{imm}` 形状不同（后者带 `#`）；槽复用按 hw 分组的 `imm16g*`，
# 于是 `hw` 依旧由修饰名决定，且"符号必须记到"由 `require_symbol` 把关。

# ── `mov <Rd>, #imm`（立即数别名：`movz #imm, lsl #0`）──
#
# 与寄存器形态 `mov {dst}, {src}` 形状不同（带 `#`）⇒ 共存不遮蔽。
# 上游把 `mov x0, #0` 编成 `movz x0, #0`（0xD2800000），正是这两条的编码。

# ── `movz`/`movk`/`movn` 的 `abs_g*` 类重定位（`movz x2, #:abs_g0:sym`）──
#
# 与数值形态同编码；`hw` 由**修饰名**决定（`abs_g0..g3` ⇒ `hw` 0..3），所以槽按 hw 分并
# 用 `imm_fns` 过滤。模板**不带 `#`**（修饰文本自带），与数值形态形状不同、不互相遮蔽。

# ── SIMD&FP 访存（`ldr d8, [sp, #8]` / `str s7, [sp, #4]` / `stp d8, d9, [sp, #-64]!`）──
#
# 宽度只体现在寄存器名上（助记符都是 `ldr`/`str`/`ldp`/`stp`），所以按**视图**分槽
# （见 [reg.fpr1..fpr16] 的说明）；imm12/imm7 的单位 = 访问宽度。

