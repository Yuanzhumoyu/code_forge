# ── 别名 ──

[machine.stack]
slot = 64    # 位（= 8 字节）
align = 128  # 位（= 16 字节）
fp_save = 64 # 位

# 返回寄存器（x0）；Return lowering 的返回值移动目标

# Call 点被调用方破坏的寄存器（regalloc clobber 集）：AAPCS64 caller-saved
# = X0-X18 + lr(X30)。X19-X28 由帧件保存（roles = ["callee_save"]）→ 不在 clobber 集。


[machine.spill.gpr]
class = "gpr64"
# base = X29（fp = 入口 sp，帧顶固定）：emission 的 sp_base = -(frame)
# 是相对帧指针的偏移（spill 槽在帧内底部 [fp - frame + off]，递归各帧
# 独立）；用 STUR/LDUR 真字节偏移（imm9 符号 ±256——与 riscv LD/SD 的
# signed imm12 同角色，帧 > ~256B 报错为已知限制）。
load = "LDURX {0}, X29, {1}"
store = "STURX {0}, X29, {1}"
base = "X29"

[machine.text]
align_pad = 0
# 独立尾声标签开启：arm64 B（imm26）与 CBZ（imm19）label 槽经定宽 fixup
# （Relative(4,0)）+ 生成的重定位补丁器位段重排 → return block 经
# `b epilogue_label` 跳到统一尾声，多 return block / 跨块分支函数可用
# （emission.rs 按 needs_epilogue_label=true 布局）。单块函数仍走
# fall-through 尾声（epilogue 紧跟 return block 时 emission 不空发跳转）。
epilogue_label = true


# ─────────────────────── lowering（64 位主；32 位 W 变体按 rs1_width）───────────────────────
# 覆盖 op 集 = P1 tm 测试所需最小集（SUPPORTED_OPS 由此唯一集派生）。

[[lower.Iadd]]
dispatch = "rs1_width"
insts = ["ADDREGX {out}, {0}, {1}"]

[[lower.Isub]]
dispatch = "rs1_width"
insts = ["SUBREGX {out}, {0}, {1}"]

[[lower.Imul]]
dispatch = "rs1_width"
insts = ["MULX {out}, {0}, {1}"]

# Iconst 值分派（按常量池解析真值 attr `iconst`；⚠️ 不能用 `imm0` 判符号——
# Iconst 的 immediate 是 `Immediate::Const(cid)`，imm0 = 池索引正数，无值语义，
# P3① 实证 imm0<0 规则永不命中）：
#   16 位域内（|v| < 0x10000）→ 单条 MOVZ（正）/MOVN（负，高位全 1 = 符号扩展）。
#   域外 → 全片序列（恒 X 4 条）：movz(hw3)+movk(hw2/hw1/hw0)——任意 64 位位型
#   均可构造（含 i64 负大值：两补码位型逐片写入，movz hw3 置高片后 movk 覆盖低片）。
# 序列构造先后序 = 高片 movz 先（清零其它）→ 低片 movk 依 hw 降序覆写。
#
# **按 X 宽材料化，不按 rd 分 X/W**（v27 M6-98）：i32 常量也用 X 形式 ⇒ 物理寄存器
# 里是**符号扩展后的 64 位**值。这是"规范寄存器形态"约定（x86 的
# `MOV_REG_IMM64` 同样恒 64 位）：混合宽度使用（如 `iadd(ptr, i32)` 的 -4 偏移）
# 读 64 位时才是对的；W 形式会把高位清零（-4 变 0x0000_0000_FFFF_FFFC → 野地址，
# 实测 QEMU 走异常向量死循环）。32 位使用者读低 32 位，语义不受影响。
[[lower.Iconst]]
when = { and = [{ lt = ["iconst", 0] }, { ge = ["iconst", -65536] }] }
insts = ["MOVNX {out}, {iconst_c16}"]

[[lower.Iconst]]
when = { and = [{ ge = ["iconst", 0] }, { lt = ["iconst", 65536] }] }
insts = ["MOVZX {out}, {iconst}"]

[[lower.Iconst]]
when = { not = { and = [
  { ge = [
    "iconst",
    -65536,
  ] },
  { lt = [
    "iconst",
    65536,
  ] },
] } }
insts = [
  "MOVZX3 {out}, {iconst_f3}",
  "MOVKX2 {out}, {iconst_f2}",
  "MOVKX1 {out}, {iconst_f1}",
  "MOVKX {out}, {iconst_f0}",
]

[[lower.Copy]]
insts = ["MOVX {out}, {0}"]

# ── 逻辑运算（P3：Band/Bor/Bxor → ANDREG/ORRREG/EORREG 直落）──

[[lower.Band]]
dispatch = "rs1_width"
insts = ["ANDREGX {out}, {0}, {1}"]

[[lower.Bor]]
dispatch = "rs1_width"
insts = ["ORRREGX {out}, {0}, {1}"]

[[lower.Bxor]]
dispatch = "rs1_width"
insts = ["EORREGX {out}, {0}, {1}"]

# ═══════════════════════ 参数化模板（v18 S2c：X/W 对）═══════════════════════
# 一处声明 → 两条指令（sf 位、寄存器槽、opcode 逐行给）；`body.ref` 是引用名，
# 同名的 X/W 两条自动构成多态引用——取代原先手写的 [[aliases]] 清单（会漂移，见方案 §2.3）。

[family.ADDIMM]
body = { group = "add", form = "ALUIMM", opcode = "{opcode}", asm = "add {dst:{slot}:out}, {src:{slot}}, #{imm:imm12u}", doc = "{name}（族 {family}）：把 12 位无符号立即数加到 {slot} 寄存器；操作数 {ops}。" }
rows = [
  { inst = "ADDIMMX", slot = "r64", opcode = 0x91, roles = [
    "frame_free",
    "frame_set",
  ] },
  { inst = "ADDIMMW", slot = "r32", opcode = 0x11 },
]
[family.ADDSIMM]
body = { group = "adds", form = "ALUIMM", opcode = "{opcode}", asm = "adds {dst:{slot}:out}, {src:{slot}}, #{imm:imm12u}", doc = "把 12 位无符号立即数加到 {slot} 寄存器，硬件同时更新 NZCV（adds 形态）；操作数 {ops}。" }
rows = [
  { inst = "ADDSIMMX", slot = "r64", opcode = 0xB1 },
  { inst = "ADDSIMMW", slot = "r32", opcode = 0x31 },
]
[family.SUBIMM]
body = { group = "sub", form = "ALUIMM", opcode = "{opcode}", asm = "sub {dst:{slot}:out}, {src:{slot}}, #{imm:imm12u}" }
rows = [
  { inst = "SUBIMMX", slot = "r64", opcode = 0xD1, roles = [
    "frame_alloc",
  ] },
  { inst = "SUBIMMW", slot = "r32", opcode = 0x51 },
]
[family.SUBSIMM]
body = { group = "subs", form = "ALUIMM", opcode = "{opcode}", asm = "subs {dst:{slot}:out}, {src:{slot}}, #{imm:imm12u}" }
rows = [
  { inst = "SUBSIMMX", slot = "r64", opcode = 0xF1 },
  { inst = "SUBSIMMW", slot = "r32", opcode = 0x71 },
]
[family.ADDREG]
body = { group = "add", form = "ALUREG", opcode = "{opcode}", asm = "add {dst:{slot}:out}, {src:{slot}}, {src2:{slot}}" }
rows = [
  { inst = "ADDREGX", word_size = 64, slot = "r64", opcode = 0x8B },
  { inst = "ADDREGW", word_size = 32, slot = "r32", opcode = 0x0B },
]
[family.SUBREG]
