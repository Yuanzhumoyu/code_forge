# 逻辑（位掩码）立即数：值必须是"一段连续 1 循环填充整个宽度"的位模式，编码成 N/immr/imms
# 三个分量（非线性映射，故走 `logical_imm` 方案而不是位切片）。
# W 形式：`wrap` 收下 `#~15`、`#~(0xfe<<24)` 这类**按位取反**写出来的负数（两种读数都收，
# 规范化到无符号位模式）；`min` 放宽到 -2^32 才容得下 `~(0xfe<<24)` 这种绝对值大于 2^31 的写法。
[[operand_slots]]
name = "logicimm32"
kind = "imm"
signed = false
width = 32
wrap = true
min = -4294967296
encode = "logical_imm"
fields = ["nbit_l", "immr", "imms"]

[[operand_slots]]
name = "logicimm64"
