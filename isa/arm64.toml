# 追加到 isa/arm64.toml 末尾：浮点/向量搬运能力（A5 子集）

# ── 浮点/向量寄存器组（AAPCS64：v0-v7 传参、v0 返回；宽度由指令决定）──
[reg.fpr64]
names = [
  "V0",
  "V1",
  "V2",
  "V3",
  "V4",
  "V5",
  "V6",
  "V7",
  "V8",
  "V9",
  "V10",
  "V11",
  "V12",
  "V13",
  "V14",
  "V15",
  "V16",
  "V17",
  "V18",
  "V19",
  "V20",
  "V21",
  "V22",
  "V23",
  "V24",
  "V25",
  "V26",
  "V27",
  "V28",
  "V29",
  "V30",
  "V31",
]

# ── FP 的**宽度视图**：宽度必须由寄存器组承载 ──
# 既有 `[reg.fpr64]`（V0..V31）就是 **D 视图**，下面给它挂 `D0..D31` 别名；
# B/H/S/Q 各开一组。若共用一个组，`ldr s0,…` 与 `ldr d0,…` 的文本形状相同、分派只能取
# 先声明的那条（实测把 S 编成了 D）——所以宽度不能只靠"名字在同一个池里"。
aliases = { D0 = 0, D1 = 1, D2 = 2, D3 = 3, D4 = 4, D5 = 5, D6 = 6, D7 = 7, D8 = 8, D9 = 9, D10 = 10, D11 = 11, D12 = 12, D13 = 13, D14 = 14, D15 = 15, D16 = 16, D17 = 17, D18 = 18, D19 = 19, D20 = 20, D21 = 21, D22 = 22, D23 = 23, D24 = 24, D25 = 25, D26 = 26, D27 = 27, D28 = 28, D29 = 29, D30 = 30, D31 = 31 }
[reg.fpr8]
prefix = "B"
count = 32
aliases = {}

[reg.fpr16]
prefix = "H"
count = 32
aliases = {}

[reg.fpr32]
prefix = "S"
count = 32
aliases = {}

[reg.fpr128]
prefix = "Q"
count = 32
aliases = {}
[operand.fprb]
kind = "reg"
class = "fpr8"

[operand.fprh]
kind = "reg"
class = "fpr16"

[operand.fprs]
kind = "reg"
class = "fpr32"

[operand.fprq]
kind = "reg"
class = "fpr128"

[operand.fpr]
kind = "reg"
class = "fpr64"

[form.FMOVR]
# FMOV（标量寄存器）：rd/rn（[31:24] = op8 常量、[23:16]/[15:10] 保留位）
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u8[23:16]:op8b",
  "u6[15:10]:zero6",
]

# FMOV (register) S/D = 0x1E204000 / 0x1E604000：
#   [31:24]=0x1E、[23:16]=0x20(S)/0x60(D)、[15:10]=0、[9:5]=Rn、[4:0]=Rd
[inst.FMOV_S]
data_width = 32
form = "FMOVR"
opcode = 0x1E
match = { op8b = 0x20, zero6 = 0 }
asm = "fmov {dst:fpr:out}, {src:fpr}"

[inst.FMOV_D]
data_width = 64
form = "FMOVR"
opcode = 0x1E
match = { op8b = 0x60, zero6 = 0 }
asm = "fmov {dst:fpr:out}, {src:fpr}"

# LDUR/STUR (SIMD&FP, unscaled imm9)：与 LDURX/STURX 同形，只是寄存器文件不同——
#   D：**0xFC**… (size=11, V=1, [25:24]=00 unscaled)、S：**0xBC**… (size=10)；opc2 = 01 载 / 00 存。
# **勘误（2026-10-07）**：这两条原先写成 0xFD/0xBD——那是**无符号偏移族**（imm12）的 op8，
# 于是 `ldur d8, [sp, #8]` 会编出无符号族、imm9 落到 imm12 的错位（上游期望 `e8 83 40 fc`，
# 我们出 `e8 83 40 fd`）。潜伏这么久是因为 FP 槽用 V 名、语料写的是 `d8`/`s7`，
# 那批行从来没解析过 ⇒ 字节对拍档看不见它。带 callee_save/callee_load 角色的两条尤其要紧：
# arm64 JIT 的 FPR 保存/恢复一直按错族发偏移。
[inst.LDURD]
form = "LSUN"
opcode = 0xFC
match = { opc2 = 1, mode = 0, zero21 = 0 }
asm = "ldur {dst:fpr:out}, [{base:r64}, #{off:imm9s}]"
# 帧内保存/恢复的 **FPR 类**那条：AAPCS64 要求 v8-v15 的低 64 位由被调方保存，
# 而 `LDURX`/`STURX` 只认 GPR。同一个"存到帧"能力按寄存器类分派（v20 A6）。
roles = [{ role = "callee_load", class = "fpr" }]

[inst.STURD]
form = "LSUN"
opcode = 0xFC
match = { opc2 = 0, mode = 0, zero21 = 0 }
asm = "stur {src:fpr}, [{base:r64}, #{off:imm9s}]"
roles = [{ role = "callee_save", class = "fpr" }]

[inst.LDURS]
form = "LSUN"
opcode = 0xBC
match = { opc2 = 1, mode = 0, zero21 = 0 }
asm = "ldur {dst:fpr:out}, [{base:r64}, #{off:imm9s}]"

[inst.STURS]
form = "LSUN"
opcode = 0xBC
match = { opc2 = 0, mode = 0, zero21 = 0 }
asm = "stur {src:fpr}, [{base:r64}, #{off:imm9s}]"

# FP 溢出（与 [spill.GPR] 同口径：base = X29、真字节 imm9 偏移）。
# ── Q（128 位）单寄存器访存：size=00、opc 位型与 Q 的成对一致（[31:24] = 0x3C/0x3D）──

[inst.LDRQ_FP]
form = "FPLSUI"
opcode = 0x3D
match = { opc2 = 3 }
asm = "ldr {dst:fprq:out}, [{base:r64}, #{imm:imm12fp16}]"

[inst.LDURQ_FP]
form = "LSUN"
opcode = 0x3C
match = { opc2 = 3, mode = 0, zero21 = 0 }
asm = "ldur {dst:fprq:out}, [{base:r64}, #{off:imm9s}]"

[inst.LDRQ_FP_PRE]
form = "LSUN"
opcode = 0x3C
match = { opc2 = 3, mode = 3, zero21 = 0 }
asm = "ldr {dst:fprq:out}, [{base:r64}, #{off:imm9s}]!"

[inst.LDRQ_FP_POST]
form = "LSUN"
opcode = 0x3C
match = { opc2 = 3, mode = 1, zero21 = 0 }
asm = "ldr {dst:fprq:out}, [{base:r64}], #{off:imm9s}"

[inst.STRQ_FP]
form = "FPLSUI"
opcode = 0x3D
match = { opc2 = 2 }
asm = "str {src:fprq}, [{base:r64}, #{imm:imm12fp16}]"

[inst.STURQ_FP]
form = "LSUN"
opcode = 0x3C
match = { opc2 = 2, mode = 0, zero21 = 0 }
asm = "stur {src:fprq}, [{base:r64}, #{off:imm9s}]"

[inst.STRQ_FP_PRE]
form = "LSUN"
opcode = 0x3C
match = { opc2 = 2, mode = 3, zero21 = 0 }
asm = "str {src:fprq}, [{base:r64}, #{off:imm9s}]!"

[inst.STRQ_FP_POST]
form = "LSUN"
opcode = 0x3C
match = { opc2 = 2, mode = 1, zero21 = 0 }
asm = "str {src:fprq}, [{base:r64}], #{off:imm9s}"

[machine.spill.fpr]
class = "fpr64"
load = "LDURD {0}, X29, {1}"
store = "STURD {0}, X29, {1}"

# Q（128 位）视图的溢出：与 D 同口径（base = X29、真字节 imm9），只是走 16 字节的访存。
[machine.spill.fpr16]
class = "fpr128"
load = "LDURQ_FP {0}, X29, {1}"
store = "STURQ_FP {0}, X29, {1}"

[machine]
# ── 寄存器类指针（v21 W1）：宽度只在 `[reg.<名>]` 表头里，这里只指"哪一组" ──
# 主 FPR 类基准：AAPCS64 的浮点值池是 8 字节（v8-v15 的低 64 位），FP 的宽度视图里
# 最宽的是 Q（fpr128）——不钉住的话"主 FPR 类"会按最宽组取到 Q，ABI 拿它去找 `V0`
# 就找不到（实测 aapcs64 计划报 `UnresolvedReg`）。显式声明 ⇒ 主类恒为 D 视图。
gpr = "gpr64"
fpr = "fpr64"
addr = "gpr64"
value_gpr = "gpr64"
value_fpr = "fpr64"
# 机器事实（v20 A5）：溢出与栈参数收参用的 scratch（emission 的 spill load/store 也用它）。
scratch = ["X16", "X17"]
# callee-saved 不再由谱面声明（v21 W9）：唯一来源 = 约定数据（AbiPlan/绑定），
# 序言按 plan 的整张表推。
# regalloc 不可分配：X18 = 平台寄存器；X30 = lr（BL 返回地址/prologue
# 保存）——不排除会被分配出垃圾值（覆盖返回地址 → ret 跳错）。
fixed = ["X18", "X30"]
# 链接寄存器（BL 写 X30；P1 尚未有 Call lowering 规则）。
link = "X30"
# 帧形状：lr/fp 保存槽在帧内顶部（fp_push_bytes = 16 = X30+X29 两槽）；
# 帧分配 = SUB SP, SP, #frame（SUB 自带减号语义 → 无需 alloc_neg）；
# min_frame = 16 + Σcallee_saved×8 = 96 由运行期推导（frame_layout_info）。
[machine.frame]
sp = "SP"
fp = "X29"
alloc_neg = false
layout = "fp-inside"
fp_push_bytes = 16

# ── 系统/异常族（`#` 是立即数前缀，模板里写 `#{imm}`）──
[[vectors]]
asm = "brk #1"
bytes = [0x20, 0x00, 0x20, 0xD4]

[[vectors]]
asm = "svc #8"
bytes = [0x01, 0x01, 0x00, 0xD4]

[[vectors]]
# imm16 取满：顶层 11 位（[31:21]）与 imm16（[20:5]）**不能重叠**——曾写成 b16
# 导致大立即数"编得出、解不回"（派生日志守卫实测抓到）
asm = "brk #65535"
bytes = [0xE0, 0xFF, 0x3F, 0xD4]

[[vectors]]
asm = "eret"
bytes = [0xE0, 0x03, 0x9F, 0xD6]

# ── 逻辑（移位寄存器）族：移位种类是 2 位常量、移位量是操作数槽；`ands`/`bics` 带 N 位 ──
[[vectors]]
asm = "and x1, x2, x3, ror #2"
bytes = [0x41, 0x08, 0xC3, 0x8A]

[[vectors]]
# `bics` 的 N 位在 [21,22)、移位在 [22,24)：两条边位区间不相交**却能同时命中一个字**，
# 这条钉住"平铺 if 链"（写成 else if 链会变成死代码 → 编得出、解不回）
asm = "bics x0, x1, x2"
bytes = [0x20, 0x00, 0x22, 0xEA]

[[vectors]]
asm = "bics x1, x2, x3, asr #3"
bytes = [0x41, 0x0C, 0xA3, 0xEA]

[[vectors]]
asm = "orn w1, w2, w3, lsl #7"
bytes = [0x41, 0x1C, 0x23, 0x2A]

# TBZ/TBNZ：位序号一个操作数摊到两个位域（`b40`[23:19] + `b5`[31]），目标按字节（unit = 4）
[[vectors]]
asm = "tbz w3, #5, #32764"
bytes = [0xE3, 0xFF, 0x2B, 0x36]

[[vectors]]
asm = "tbnz x3, #8, #-32768"
bytes = [0x03, 0x00, 0x44, 0x37]

[[vectors]]
# 位序号第 5 位（bit31）与 imm14 相邻但不同段——分开钉住
asm = "tbnz x1, #63, #4"
bytes = [0x21, 0x00, 0xF8, 0xB7]

# 逻辑（立即数）族：值是"一段连续 1 循环填充"的位掩码 ⇒ N/immr/imms 三分量（字节取自上游注释）
[[vectors]]
asm = "and w0, w0, #1"
bytes = [0x00, 0x00, 0x00, 0x12]

[[vectors]]
asm = "and x0, x0, #1"
bytes = [0x00, 0x00, 0x40, 0x92]

[[vectors]]
asm = "ands x1, x2, #15"
bytes = [0x41, 0x0C, 0x40, 0xF2]

[[vectors]]
# X 形式：immr = 60、imms = 59（~15 的 64 位位模式是"4 个 0 后 60 个 1"）
asm = "and sp, x5, #~15"
bytes = [0xBF, 0xEC, 0x7C, 0x92]

[[vectors]]
# W 形式按位取反写出来的负数（wrap 收下，规范化到无符号位模式 0x1ffffff——
# 与上游 CHECK 注释里的规范渲染 `and w0, w0, #0x1ffffff` 一致）
asm = "and w0, w0, #~(0xfe<<24)"
bytes = [0x00, 0x60, 0x00, 0x12]

[[vectors]]
asm = "orr w8, wzr, #0x1"
bytes = [0xE8, 0x03, 0x00, 0x32]

[[vectors]]
asm = "eor x1, x2, #0x8000"
bytes = [0x41, 0x00, 0x71, 0xD2]

# `ret xN` / `ret lr`（LR 是 X30 的别名）与裸 `dcps1`（= `dcps1 #0`）：
[[vectors]]
asm = "ret x1"
bytes = [0x20, 0x00, 0x5F, 0xD6]

[[vectors]]
asm = "ret lr"
bytes = [0xC0, 0x03, 0x5F, 0xD6]

[[vectors]]
asm = "dcps1"
bytes = [0x01, 0x00, 0xA0, 0xD4]

