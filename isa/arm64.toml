# v21 W6：终结层谱面——跳转序列。
[[lower.Jmp]]
insts = ["B {target}"]

# v21 W6：终结层谱面——条件分支（arm64 用 cbz cond,false 再 b，条件码不参与）。
[[lower.Br]]
insts = ["CBZX {cond}, {false}", "B {true}"]
# v21 W6 乙：整数返回由谱面接管（`{ret_src}` = 承载返回值的虚拟寄存器，`{ret}` = ABI 返回槽）。
[[lower.Ret]]
when = { bank = "gpr" }
insts = ["MOVX {ret}, {ret_src}"]

# ── rustc 后端首光（v27 M6-98）：栈槽地址 / 访存 / 指针 ↔ 整数 ──
# StackAddr：偏移 `{off}` 可正可负可 0，A64 的 `add/sub #imm12` 收不了负数 ⇒
# 用 `movz(hw3)+movk(hw2..hw0)` 造任意 64 位偏移，再 `add` 帧指针（X29）。
[[lower.StackAddr]]
insts = ["MOVZX3 {g}, {off_f3}", "MOVKX2 {g}, {off_f2}", "MOVKX1 {g}, {off_f1}", "MOVKX {g}, {off_f0}", "ADDREGX {out}, X29, {g}"]

# 访存按**宽度**分派（此谱只有 32/64 位的 ldr/str）：i8/i16 的 Load/Store 没有
# 规则 ⇒ 明确 `[cap:SPEC_LOWERING_RULE_MISSING]`（不静默按 64 位读写）。
[[lower.Load]]
when = { eq = ["rd", 32] }
insts = ["LDRW_ND {out}, [{0}]"]

[[lower.Load]]
when = { eq = ["rd", 64] }
insts = ["LDRX_ND {out}, [{0}]"]

[[lower.Store]]
when = { eq = ["rs1_width", 32] }
insts = ["STRW_ND {0}, [{1}]"]

[[lower.Store]]
when = { eq = ["rs1_width", 64] }
insts = ["STRX_ND {0}, [{1}]"]

[[lower.Inttoptr]]
insts = ["MOVX {out}, {0}"]

[[lower.Ptrtoint]]
insts = ["MOVX {out}, {0}"]
