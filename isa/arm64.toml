opcode = 0xF8
match = { opc2 = 0, mode = 0, zero21 = 0 }
asm = "stur {src:r64}, [{base:r64}, #{off:imm9s}]"
# stack_arg_store：调用方写传出区（`[sp + caller_offset]`）+ 被调方写 spilled 形参
roles = ["callee_save", "stack_arg_store"]

[inst.STURW]
form = "LSUN"
opcode = 0xB8
match = { opc2 = 0, mode = 0, zero21 = 0 }
asm = "stur {src:r32}, [{base:r64}, #{off:imm9s}]"

# ── 别名 ──

[form.PAIR]
# LDP/STP：rt rn rt2 imm7（位低→高）
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u5[14:10]:rt2",
  "u7[21:15]:imm7",
  "u2[23:22]:idx2",
]

# 无位移形态的形式：`[Xn]` 就是"位移 = 0"的那一格，位域由 `fields` 固定为 0，
# 因此形式里没有位移操作数位（与 DCPS1B "裸 dcps1 = dcps1 #0" 同款）。
[form.LSUIND]
# LDR/STR 无位移：rt rn
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u12[21:10]:imm12s",
  "u2[23:22]:opc2",
]

[form.PAIRND]
# LDP/STP 无位移：rt rn rt2
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u5[14:10]:rt2",
  "u2[23:22]:idx2",
  "u7[21:15]:imm7",
]

# 寄存器偏移寻址：`[Xn, Xm{ext}]` —— 索引寄存器进 `rm`，`option`/`sbit` 是逐指令常量。
[form.LSUIR]
# LDR/STR 寄存器偏移：rt rn rm
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u2[11:10]:mode",
  "u1[21]:one21",
  "u2[23:22]:opc2",
  "u3[15:13]:option",
  "u1[12]:sbit",
]

[form.FPLSUI]
# SIMD&FP 单寄存器无符号偏移：rt rn imm12
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u12[21:10]:imm12",
  "u2[23:22]:opc2",
]

[form.FPPAIR]
# SIMD&FP 成对：rt rn rt2 imm7
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rt",
  "u5[9:5]:rn",
  "u5[14:10]:rt2",
  "u7[21:15]:imm7",
  "u2[23:22]:idx2",
]

# 扩展寄存器操作数（`add x8, x8, w5, sxtw #2`）：`option` 是**操作数**（命名立即数表），
# `imm3` 是量；`bit21 = 1` 与移位寄存器族（bit21 = 0）区分。cmp/cmn 用无 rd 的两条形式。
[form.EXTREG]
# 扩展寄存器：rd rn rm option imm3
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u3[15:13]:option",
  "u3[12:10]:imm3",
  "u1[21]:one21",
]
[form.EXTREG_NA]
# 同上但省略量（imm3 = 0，由 fields 固定）
fields = [
  "u8[31:24]:opcode",
  "u5[4:0]:rd",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u3[15:13]:option",
  "u3[12:10]:imm3",
  "u1[21]:one21",
]
[form.EXTREG2]
# 扩展寄存器（cmp/cmn：rd 由 fields 固定 31）
fields = [
  "u8[31:24]:opcode",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u3[15:13]:option",
  "u3[12:10]:imm3",
  "u1[21]:one21",
  "u5[4:0]:rd",
]
[form.EXTREG2_NA]
# 同上但省略量
fields = [
  "u8[31:24]:opcode",
  "u5[9:5]:rn",
  "u5[20:16]:rm",
  "u3[15:13]:option",
  "u3[12:10]:imm3",
  "u1[21]:one21",
  "u5[4:0]:rd",
]

