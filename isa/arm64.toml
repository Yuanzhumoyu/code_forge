# ── 无位移形态（`[Xn]`）──
#
# 真实汇编里最常见的写法就是不带位移（`ldr x4, [x3]`、`str w9, [x8]`），它编码上是
# "位移 = 0"的那一格（与带位移的形态**同编码**）。照 DCPS1B 的先例：声明序放在带位移的
# 指令**之后**，解码仍走带位移那条（渲染出 `, #0`），这里只承担"省略写法能装配"。
# 上游期望字节见谱内向量（`ldr x4, [x3]` = 64 00 40 f9，来自 `arm64-memory.s` 的 CHECK 行）。
[inst.LDRX_ND]
form = "LSUIND"
opcode = 0xF9
match = { opc2 = 1, imm12s = 0 }
asm = "ldr {dst:r64:out}, [{base:r64}]"

