# ════════════════════════════════════════════════════════════
# B2：接入 TargetMachine（SysV rv64 子集 + 帧 + lowering）
# ════════════════════════════════════════════════════════════

[abi]
stack_align = 16
scratch = ["X5", "X6"]
# regalloc 不可分配：X0=zero（写入无效）、X1=ra（prologue 保存 + call 返回
# 地址）、X3/X4=gp/tp（固定用途）——不排除会分配出垃圾（实测 subw x0）。
reserved = ["X0", "X1", "X3", "X4"]

# 返回寄存器（a0）；Return/Call lowering 的返回值移动目标
ret_regs = ["X10"]

# Call 调用指令（jal ra, @N；label 槽 = -(FuncRef+1)，RiscvRelocPatcher 编码 UJ 位段）
call_inst = "JAL"
call_ret_reg = "X1"

# Call 点被调用方破坏的寄存器（regalloc clobber 集）：ra(X1) + 参数 a0-a7
# (X10-X17) + 临时 t0-t2(X5-X7)/t3-t6(X28-X31) + 固定用途 X3/X4。
# s 系（X9/X18-X27）由 @push_callee 保存 → 不在 clobber 集（跨调用存活
# 值留在 s 系安全）。X5/X6 是 spill scratch（regalloc 不可分配）。
call_clobbers = ["X1", "X3", "X4", "X7", "X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17", "X28", "X29", "X30", "X31"]

[[abi.arg_class]]
class = "int"
regs = ["X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17"]

[abi.frame]
sp = "X2"          # sp
fp = "X8"          # s0/fp
alloc_inst = "ADDI"
free_inst = "ADDI"
alloc_neg = true   # addi sp, sp, -frame_size
fp_push_bytes = 16 # ra + fp 两个保存槽
# 帧 ≥ callee_saved_bytes（16 + 11×8 = 104）：@push_callee 的 SD 槽偏移
# frame - 16 - (k+1)*8 非负（k 最大 10 → 104-16-88=0）。
min_frame_bytes = 104
# callee_saved 保存槽在帧内顶部（min_frame_bytes 覆盖）→ 帧布局不再额外减
# callee_saved_bytes：spill 槽 sp_base = -(frame) 留在帧内、StackAddr 平移 0。
# 否则 spill 槽落帧外（sp 下方更深处），递归时与 callee 帧/栈槽绝对地址
# 重叠（实测 fib 死循环）。
callee_saved_bytes_override = 0
# 栈槽（StackAddr）帧顶平移 = fp_push_bytes(16)：栈槽基准 fp-16（避开 ra/fp
# 保存槽），相对 fp 递归各帧独立。
stack_slot_shift = 16

[abi.callee_saved]
# s 系（X9, X18-X27）：@push_callee/@pop_callee 用 [spill.GPR] store/load
# 模板（SD/LD）保存到帧槽 [sp + frame - 16 - (k+1)*8]（min_frame_bytes
# 覆盖）。regalloc 把跨调用存活 vreg 分配到这里，递归/跨函数调用安全。
gpr = ["X9", "X18", "X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27"]

[spill.GPR]
# base = X8（fp = 入口 sp，等价 x86 rbp）：emission 的 sp_base =
# -(frame) - callee_saved_bytes 是**相对帧指针**的偏移。base 用 X2（sp）会
# 双重减 frame（spill 槽落帧外更深处），递归时与 callee 帧重叠（ra 槽被
# 覆盖 → ret 跳 0，实测 fault_fetch epc=0）。base = fp → spill 槽
# [fp - frame + off] = [sp + off] 帧内底部，递归帧在下方不重叠。
load = "LD {0}, X8, {1}"
store = "SD {0}, X8, {1}"
base = "X8"

[emit]
align_pad = 0
# return block 经 emit_epilogue_jump（jal x0, epilogue_label）跳到统一尾声：
# 多 return block 函数（fib 双 return）安全；label 槽块号 → 定宽 fixup。
epilogue_label = true

[emit.prologue]
insts = ["@frame_alloc", "SD X1, X2, {frame_size_m8}", "SD X8, X2, {frame_size_m16}", "ADDI X8, X2, {frame_size}", "@push_callee", "@move_args"]

[emit.epilogue]
insts = ["@pop_callee", "LD X1, X2, {frame_size_m8}", "LD X8, X2, {frame_size_m16}", "@frame_free", "RET"]

# ─────────────────────── lowering（64 位主；32 位 W 变体按 rs1_width）───────────────────────

[[lowering]]
op = "Iadd"
when = { eq = ["rs1_width", 32] }
insts = ["addw {out}, {0}, {1}"]

[[lowering]]
op = "Iadd"
insts = ["add {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
when = { eq = ["rs1_width", 32] }
insts = ["subw {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
insts = ["sub {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
when = { eq = ["rs1_width", 32] }
insts = ["mulw {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
insts = ["mul {out}, {0}, {1}"]

[[lowering]]
op = "Iconst"
insts = ["lui {out}, {iconst_hi20}", "addi {out}, {out}, {iconst_lo12}"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 32] }
insts = ["lw {out}, {0}, 0"]

[[lowering]]
op = "Load"
insts = ["ld {out}, {0}, 0"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_width", 32] }
insts = ["sw {0}, {1}, 0"]

[[lowering]]
op = "Store"
insts = ["sd {0}, {1}, 0"]

[[lowering]]
op = "StackAddr"
# 基准 X8（fp = 入口 sp，帧顶固定）：栈槽相对 fp（偏移 = v - 16，
# stack_slot_shift）→ 递归各帧独立（相对 sp 的 -4 跨帧重叠——fib_slot
# 结果错）；且避开 ra/fp 保存槽 [fp-16, fp)。
insts = ["addi {out}, X8, {off}"]

[[lowering]]
op = "Copy"
insts = ["mv {out}, {0}"]
# ── 补全 lowering（B2 遗留：位运算/移位/比较/调用）──

[[lowering]]
op = "Band"
insts = ["and {out}, {0}, {1}"]

[[lowering]]
op = "Bor"
insts = ["or {out}, {0}, {1}"]

[[lowering]]
op = "Bxor"
insts = ["xor {out}, {0}, {1}"]

[[lowering]]
op = "Bnot"
insts = ["xori {out}, {0}, -1"]

[[lowering]]
op = "Ishl"
insts = ["sll {out}, {0}, {1}"]

[[lowering]]
op = "Ushr"
insts = ["srl {out}, {0}, {1}"]

[[lowering]]
op = "Sshr"
insts = ["sra {out}, {0}, {1}"]

# Icmp：按 IntCC（icmp_id 1-10）分派。riscv 无 setcc——用 slt/sltu/xor/
# sltiu/xori 序列产生 0/1（矩阵 i1 语义）。eq = (a==b) = sltiu(xor(a,b),1)
#（xor==0 → 1）；ne = 其取反；sle/sge/ule/uge = 反向 slt/sltu 取反。
[[lowering]]
op = "Icmp"
when = { eq = ["cond", 1] } # Equal
insts = ["xor {t}, {0}, {1}", "sltiu {out}, {t}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 2] } # NotEqual
insts = ["xor {t}, {0}, {1}", "sltiu {t}, {t}, 1", "xori {out}, {t}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 3] } # SignedLessThan
insts = ["slt {out}, {0}, {1}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 4] } # SignedLessThanOrEqual = !(b < a)
insts = ["slt {t}, {1}, {0}", "xori {out}, {t}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 5] } # SignedGreaterThan = b < a
insts = ["slt {out}, {1}, {0}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 6] } # SignedGreaterThanOrEqual = !(a < b)
insts = ["slt {t}, {0}, {1}", "xori {out}, {t}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 7] } # UnsignedLessThan
insts = ["sltu {out}, {0}, {1}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 8] } # UnsignedLessThanOrEqual = !(b <u a)
insts = ["sltu {t}, {1}, {0}", "xori {out}, {t}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 9] } # UnsignedGreaterThan = b <u a
insts = ["sltu {out}, {1}, {0}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 10] } # UnsignedGreaterThanOrEqual = !(a <u b)
insts = ["sltu {t}, {0}, {1}", "xori {out}, {t}, 1"]

# Call：jal ra, @N（跨函数符号；RiscvRelocPatcher 编码 UJ 位段）
# 注意：Call 是 terminator 级 lowering（gen_call_lowering），不走此表——
# 该规则仅占位声明，实际接线见 integration.rs 的 call_inst 泛化。

# ── 除法/取模（32 位 W 变体按 rs1_width 分派）──

[[lowering]]
op = "Sdiv"
when = { eq = ["rs1_width", 32] }
insts = ["divw {out}, {0}, {1}"]

[[lowering]]
op = "Sdiv"
insts = ["div {out}, {0}, {1}"]

[[lowering]]
op = "Udiv"
when = { eq = ["rs1_width", 32] }
insts = ["divuw {out}, {0}, {1}"]

[[lowering]]
op = "Udiv"
insts = ["divu {out}, {0}, {1}"]

[[lowering]]
op = "Srem"
when = { eq = ["rs1_width", 32] }
insts = ["remw {out}, {0}, {1}"]

[[lowering]]
op = "Srem"
insts = ["rem {out}, {0}, {1}"]

[[lowering]]
op = "Urem"
when = { eq = ["rs1_width", 32] }
insts = ["remuw {out}, {0}, {1}"]

[[lowering]]
op = "Urem"
insts = ["remu {out}, {0}, {1}"]

# ── min/max（基础指令序列，不依赖 Zbb——QEMU 11.0.92 默认/显式 CPU 均不
#    译码 Zbb 的 min/max（LLVM 确认编码规范，QEMU rc 版 TCG 未接）；用
#    `slt + neg + xor + and + xor` 算术选择：min(a,b) = b ^ ((a^b) & -(a<b))）──

[[lowering]]
op = "Smin"
insts = [
    "slt {t}, {0}, {1}",
    "sub {t}, X0, {t}",
    "xor {t2}, {0}, {1}",
    "and {t}, {t2}, {t}",
    "xor {out}, {1}, {t}",
]

[[lowering]]
op = "Smax"
insts = [
    "slt {t}, {0}, {1}",
    "sub {t}, X0, {t}",
    "xor {t2}, {0}, {1}",
    "and {t}, {t2}, {t}",
    "xor {out}, {0}, {t}",
]

[[lowering]]
op = "Umin"
insts = [
    "sltu {t}, {0}, {1}",
    "sub {t}, X0, {t}",
    "xor {t2}, {0}, {1}",
    "and {t}, {t2}, {t}",
    "xor {out}, {1}, {t}",
]

[[lowering]]
op = "Umax"
insts = [
    "sltu {t}, {0}, {1}",
    "sub {t}, X0, {t}",
    "xor {t2}, {0}, {1}",
    "and {t}, {t2}, {t}",
    "xor {out}, {0}, {t}",
]

# ── 旋转（基础序列，不依赖 Zbb）：rol(a,n) = (a<<n)|(a>>(64-n))；
#    `sub X0, n` 取 -n（移位量低 6 位 = 64-n；n=0 时 srl 移位 0 正确）──

[[lowering]]
op = "Rotl"
insts = [
    "sll {t}, {0}, {1}",
    "sub {t3}, X0, {1}",
    "srl {t2}, {0}, {t3}",
    "or {out}, {t}, {t2}",
]

[[lowering]]
op = "Rotr"
insts = [
    "srl {t}, {0}, {1}",
    "sub {t3}, X0, {1}",
    "sll {t2}, {0}, {t3}",
    "or {out}, {t}, {t2}",
]

# ── 扩展/截断：riscv 的 i32 值经 W 变体/ADDI 天然 64 位符号扩展 →
#    Sextend(i32→i64) = mv；Uextend 按源宽 andi 掩码（8/16）或
#    slli+srli 清零高 32 位（32→64）；Ireduce 按结果宽截断──

[[lowering]]
op = "Sextend"
insts = ["mv {out}, {0}"]

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 8] }
insts = ["andi {out}, {0}, 255"]

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 16] }
insts = ["andi {out}, {0}, 65535"]

[[lowering]]
op = "Uextend"
insts = ["slli {out}, {0}, 32", "srli {out}, {out}, 32"]

[[lowering]]
op = "Ireduce"
when = { eq = ["rd", 8] }
insts = ["andi {out}, {0}, 255"]

[[lowering]]
op = "Ireduce"
when = { eq = ["rd", 16] }
insts = ["andi {out}, {0}, 65535"]

[[lowering]]
op = "Ireduce"
insts = ["slli {out}, {0}, 32", "srli {out}, {out}, 32"]

# ── Abs：|x| = (x ^ (x>>63)) - (x>>63)（64 位；i32 值符号扩展后正确）──

[[lowering]]
op = "Abs"
insts = [
    "srai {t}, {0}, 63",
    "xor {out}, {0}, {t}",
    "sub {out}, {out}, {t}",
]

# ── Select(cond, then, else)：cond 为 0/1 → (cond & then) | (!cond & else) ──
# 掩码法：c<<63>>63 得全0/全1 掩码（QEMU 11.1.0-rc2 的 TCG 对直接
# and/xori/and/or 序列有 host 寄存器 bug——实测 s8=0；掩码法规避）。

[[lowering]]
op = "Select"
insts = [
    "slli {t1}, {0}, 63",
    "srai {t1}, {t1}, 63",
    "and {t2}, {t1}, {1}",
    "xori {t3}, {t1}, -1",
    "and {t4}, {t3}, {2}",
    "or {out}, {t2}, {t4}",
]

# ── 空指针判断 / Freeze / Trap / Fence ──

[[lowering]]
op = "IsNull"
insts = ["sltiu {out}, {0}, 1"]

[[lowering]]
op = "IsNotNull"
insts = ["sltu {out}, X0, {0}"]

[[lowering]]
op = "Freeze"
insts = ["mv {out}, {0}"]

[[lowering]]
op = "Trap"
insts = ["ebreak"]

[[lowering]]
op = "Fence"
insts = ["fence"]

# ── Alloca：栈槽地址（current_alloca_offset；基准 X8 = fp 与 StackAddr 一致）──

[[lowering]]
op = "Alloca"
insts = ["addi {out}, X8, {alloca}"]

# ── 溢出 6 条（{out}=值、{out2}=flag；32 位用例）。riscv 无标志位 →
#    比较序列。i32 值符号扩展后 bit63 = bit31，64 位 slti 检测 32 位符号 ✓。──

[[lowering]]
op = "UaddOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "slli {t1}, {0}, 32",
    "srli {t1}, {t1}, 32",
    "slli {t2}, {1}, 32",
    "srli {t2}, {t2}, 32",
    "add {out}, {t1}, {t2}",
    "srli {t3}, {out}, 32",
    "sltu {out2}, X0, {t3}",
]

[[lowering]]
op = "UsubOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "sub {out}, {0}, {1}",
    "sltu {out2}, {0}, {1}",
]

[[lowering]]
op = "SaddOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "addw {out}, {0}, {1}",
    "slli {t1}, {out}, 32",
    "srli {t1}, {t1}, 63",
    "slli {t2}, {0}, 32",
    "srli {t2}, {t2}, 63",
    "slli {t3}, {1}, 32",
    "srli {t3}, {t3}, 63",
    "or {t4}, {t2}, {t3}",
    "xori {t4}, {t4}, 1",
    "and {t4}, {t4}, {t1}",
    "and {t5}, {t2}, {t3}",
    "xori {t1}, {t1}, 1",
    "and {t5}, {t5}, {t1}",
    "or {out2}, {t4}, {t5}",
]

[[lowering]]
op = "SsubOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "subw {out}, {0}, {1}",
    "slli {t1}, {out}, 32",
    "srli {t1}, {t1}, 63",
    "slli {t2}, {0}, 32",
    "srli {t2}, {t2}, 63",
    "slli {t3}, {1}, 32",
    "srli {t3}, {t3}, 63",
    "xori {t4}, {t2}, 1",
    "and {t4}, {t4}, {t3}",
    "and {t4}, {t4}, {t1}",
    "xori {t5}, {t3}, 1",
    "and {t5}, {t2}, {t5}",
    "xori {t1}, {t1}, 1",
    "and {t5}, {t5}, {t1}",
    "or {out2}, {t4}, {t5}",
]

[[lowering]]
op = "SmulOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "mulw {out}, {0}, {1}",
    "mul {t1}, {0}, {1}",
    "sub {t2}, {t1}, {out}",
    "sltu {out2}, X0, {t2}",
]

[[lowering]]
op = "UmulOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "slli {t1}, {0}, 32",
    "srli {t1}, {t1}, 32",
    "slli {t2}, {1}, 32",
    "srli {t2}, {t2}, 32",
    "mul {out}, {t1}, {t2}",
    "srli {t3}, {out}, 32",
    "sltu {out2}, X0, {t3}",
]


# ── 浮点（可验证部分）：Fconst 位模式加载、Fcmp 条件、Fptosi/Fptoui 转换。
#    f64 用 D 变体、f32 用 S 变体（rs1_width 分派）；QEMU 默认 RV64GC 含 F/D。──

[[lowering]]
op = "Fconst"
when = { eq = ["rd", 64] }
insts = [
    "lui {t1}, {fconst_hi32_hi20}",
    "addi {t1}, {t1}, {fconst_hi32_lo12}",
    "slli {t1}, {t1}, 32",
    "lui {t2}, {fconst_lo32_hi20}",
    # 低 32 位 LUI 立即数 bit19=1 时符号扩展污染高 32 位（如 -42.7 的
    # 0x9999A → 0xFFFFFFFF9999A000）→ slli32+srli32 截断为零扩展
    "slli {t2}, {t2}, 32",
    "srli {t2}, {t2}, 32",
    "addi {t2}, {t2}, {fconst_lo32_lo12}",
    "or {t1}, {t1}, {t2}",
    "fmv.d.x {out}, {t1}",
]

[[lowering]]
op = "Fconst"
insts = [
    "lui {t1}, {fconst_lo32_hi20}",
    # 同上：低 32 位 LUI bit19=1 符号扩展 → 截断（fmv.w.x 只取低 32 位，
    # 但高位污染会带进 NaN-box 语义）
    "slli {t1}, {t1}, 32",
    "srli {t1}, {t1}, 32",
    "addi {t1}, {t1}, {fconst_lo32_lo12}",
    "fmv.w.x {out}, {t1}",
]

# Fcmp：riscv feq/flt/fle 直接给 GPR 0/1；Ordered/Unordered 用 feq(a,a)&feq(b,b)。
# 注意：**每条规则必须带显式宽度谓词**（64 位规则也要标 rs1_width=64）——生成器
# 按 TOML 顺序生成 if-else 链，无宽度规则的 `cond=N` 会截胡后面的 32 位规则
#（实测 f32 用例被 feq.d/flt.d 抢走 → QEMU NaN-box 语义下结果错）。
[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 3] }, { eq = ["rs1_width", 64] } ] }
insts = ["feq.d {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 3] }, { eq = ["rs1_width", 32] } ] }
insts = ["feq.s {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 4] }, { eq = ["rs1_width", 64] } ] }
insts = ["feq.d {out}, {0}, {1}", "xori {out}, {out}, 1"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 4] }, { eq = ["rs1_width", 32] } ] }
insts = ["feq.s {out}, {0}, {1}", "xori {out}, {out}, 1"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 5] }, { eq = ["rs1_width", 64] } ] }
insts = ["flt.d {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 5] }, { eq = ["rs1_width", 32] } ] }
insts = ["flt.s {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 6] }, { eq = ["rs1_width", 64] } ] }
insts = ["fle.d {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 6] }, { eq = ["rs1_width", 32] } ] }
insts = ["fle.s {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 7] }, { eq = ["rs1_width", 64] } ] }
insts = ["flt.d {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 7] }, { eq = ["rs1_width", 32] } ] }
insts = ["flt.s {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 8] }, { eq = ["rs1_width", 64] } ] }
insts = ["fle.d {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 8] }, { eq = ["rs1_width", 32] } ] }
insts = ["fle.s {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 1] }, { eq = ["rs1_width", 64] } ] }
insts = ["feq.d {t}, {0}, {0}", "feq.d {t2}, {1}, {1}", "and {out}, {t}, {t2}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 1] }, { eq = ["rs1_width", 32] } ] }
insts = ["feq.s {t}, {0}, {0}", "feq.s {t2}, {1}, {1}", "and {out}, {t}, {t2}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 2] }, { eq = ["rs1_width", 64] } ] }
insts = ["feq.d {t}, {0}, {0}", "feq.d {t2}, {1}, {1}", "and {t}, {t}, {t2}", "xori {out}, {t}, 1"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 2] }, { eq = ["rs1_width", 32] } ] }
insts = ["feq.s {t}, {0}, {0}", "feq.s {t2}, {1}, {1}", "and {t}, {t}, {t2}", "xori {out}, {t}, 1"]

