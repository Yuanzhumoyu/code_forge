# ============================================================
# RISC-V 64-bit (RV64IM) — v12 唯一语法试点（迭代 2：定宽编码/解码/汇编）
# ============================================================
#
# 与 v11 (riscv64_v10.toml) 的关系：本文件是 v12 迁移试点，生成**自包含**
# 模块（Inst/encode/decode/disassemble/assemble，仅依赖 std），在
# forge-codegen 中与 v11 后端并存、按字节 golden 对比。指令顺序与 v11
# 完全一致（解码声明序首匹配对齐）；[abi]/[lowering]/[emit] 迁移在迭代 5。
#
# v12 设计要点：
# - 指令不再写位偏移：位域位置在 [conventions.bitfields]，form 按位置绑定
#   （operand_fields）；操作数少于位域位置时多余位域取 fields 固定值或隐式 0
# - 散布位段（pieces）表达 S/U/B/J 立即数分段布局（编码/解码可逆）
# - 操作数槽定义值类型（reg → u32 物理索引；imm/label → i64，按槽宽度符号扩展）
# - asm 模板 = mnemonic + 操作数模板（{0}/{1}... 占位符；缺省 "{0}, {1}, ..."；
#   内存形式 "{off}({base})" / "({base})"）

[meta]
name = "riscv64_v12"
version = "13.0"
endian = "little"
mode = 64
default_inst_width = 32
case_insensitive_regs = true
# v13 语法键（显式化；缺省值一致）
comment_char = "#"
label_suffix = ":"
mnemonic_case = "insensitive"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────

[reg.gpr8]
names = [
    "X0","X1","X2","X3","X4","X5","X6","X7",
    "X8","X9","X10","X11","X12","X13","X14","X15",
    "X16","X17","X18","X19","X20","X21","X22","X23",
    "X24","X25","X26","X27","X28","X29","X30","X31",
]

[reg.fpr4]
names = [
    "F0","F1","F2","F3","F4","F5","F6","F7",
    "F8","F9","F10","F11","F12","F13","F14","F15",
    "F16","F17","F18","F19","F20","F21","F22","F23",
    "F24","F25","F26","F27","F28","F29","F30","F31",
]

# ─────────────────────── 命名位域（一次声明）───────────────────────

[conventions.bitfields]
rd     = { offset = 7,  width = 5 }
rs1    = { offset = 15, width = 5 }
rs2    = { offset = 20, width = 5 }
funct3 = { offset = 12, width = 3 }
funct7 = { offset = 25, width = 7 }
funct5 = { offset = 27, width = 5 }   # AMO 的 funct5（bits 31:27；aq=26、rl=25）
funct6 = { offset = 26, width = 6 }   # 移位立即数高位（SLLI/SRLI/SRAI）
shamt6 = { offset = 20, width = 6 }
shamt5 = { offset = 20, width = 5 }   # W 变体移位（RV64：shamt 5 位，bit25 归 funct7）
opcode = { offset = 0,  width = 7 }
word   = { offset = 0,  width = 32 }  # FENCE 全字常量
imm12  = { offset = 20, width = 12 }  # I 型
imm20  = { pieces = [ { offset = 12, width = 20, shift = 12 } ] }                       # U 型 LUI
imm_s  = { pieces = [ { offset = 7,  width = 5, shift = 0 }, { offset = 25, width = 7, shift = 5 } ] }   # S 型
imm_b  = { pieces = [ { offset = 31, width = 1, shift = 12 }, { offset = 25, width = 6, shift = 5 },     # B 型
                       { offset = 8,  width = 4, shift = 1 },  { offset = 7,  width = 1, shift = 11 } ] }
imm_j  = { pieces = [ { offset = 31, width = 1, shift = 20 }, { offset = 21, width = 10, shift = 1 },    # J 型
                       { offset = 20, width = 1, shift = 11 }, { offset = 12, width = 8, shift = 12 } ] }

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "gpr"
kind = "reg"
class = "gpr8"
roles = ["in", "out"]

[[operand_slots]]
name = "fpr"
kind = "reg"
class = "fpr4"
roles = ["in", "out"]

[[operand_slots]]
name = "imm12"
kind = "imm"
signed = true
width = 12

[[operand_slots]]
name = "imm20"
kind = "imm"
signed = false
width = 20

[[operand_slots]]
name = "shamt"
kind = "imm"
signed = false
width = 6

[[operand_slots]]
name = "off_b"
kind = "label"
signed = true
width = 13

[[operand_slots]]
name = "off_j"
kind = "label"
signed = true
width = 21

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "R"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "rs2"]

[[forms]]
name = "I"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "imm12"]

[[forms]]
name = "S"
opcode_field = "opcode"
operand_fields = ["rs2", "rs1", "imm_s"]

[[forms]]
name = "U"
opcode_field = "opcode"
operand_fields = ["rd", "imm20"]

[[forms]]
name = "B"
opcode_field = "opcode"
operand_fields = ["rs1", "rs2", "imm_b"]

[[forms]]
name = "J"
opcode_field = "opcode"
operand_fields = ["rd", "imm_j"]

[[forms]]
name = "SHIFT"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "shamt6"]

[[forms]]
name = "SHIFT5"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "shamt5"]

[[forms]]
name = "ZBB"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "rs2"]

[[forms]]
name = "OP"
opcode_field = "opcode"
operand_fields = []

[[forms]]
name = "W32"
opcode_field = "word"
operand_fields = []


# ── R 型整数 + Zbb R（opcode 0x33；funct3/funct7 区分）──

[[families]]
name = "RR"
form = "R"
opcode = 0x33
ops = ["dst:gpr:out", "src:gpr", "src2:gpr"]
asm = "{name} {dst}, {src}, {src2}"

[[families.variants]]
name = "ADD"
fields = { funct3 = 0, funct7 = 0x00 }

[[families.variants]]
name = "SUB"
fields = { funct3 = 0, funct7 = 0x20 }

[[families.variants]]
name = "SLL"
fields = { funct3 = 1, funct7 = 0x00 }

[[families.variants]]
name = "SLT"
fields = { funct3 = 2, funct7 = 0x00 }

[[families.variants]]
name = "SLTU"
fields = { funct3 = 3, funct7 = 0x00 }

[[families.variants]]
name = "XOR"
fields = { funct3 = 4, funct7 = 0x00 }

[[families.variants]]
name = "SRL"
fields = { funct3 = 5, funct7 = 0x00 }

[[families.variants]]
name = "SRA"
fields = { funct3 = 5, funct7 = 0x20 }

[[families.variants]]
name = "OR"
fields = { funct3 = 6, funct7 = 0x00 }

[[families.variants]]
name = "AND"
fields = { funct3 = 7, funct7 = 0x00 }

[[families.variants]]
name = "MUL"
fields = { funct3 = 0, funct7 = 0x01 }

[[families.variants]]
name = "DIV"
fields = { funct3 = 4, funct7 = 0x01 }

[[families.variants]]
name = "DIVU"
fields = { funct3 = 5, funct7 = 0x01 }

[[families.variants]]
name = "REM"
fields = { funct3 = 6, funct7 = 0x01 }

[[families.variants]]
name = "REMU"
fields = { funct3 = 7, funct7 = 0x01 }

[[families.variants]]
name = "ROL"
fields = { funct3 = 1, funct7 = 0x30 }

[[families.variants]]
name = "ROR"
fields = { funct3 = 5, funct7 = 0x30 }

[[families.variants]]
name = "MIN"
fields = { funct3 = 0, funct7 = 0x05 }

[[families.variants]]
name = "MAX"
fields = { funct3 = 1, funct7 = 0x05 }

[[families.variants]]
name = "MINU"
fields = { funct3 = 4, funct7 = 0x05 }

[[families.variants]]
name = "MAXU"
fields = { funct3 = 5, funct7 = 0x05 }

# ── I 型立即数 ALU（opcode 0x13；ADDI 保留顶层：roles + 与 MOV/ADDI_GLOBAL 同键）──

[[families]]
name = "II"
form = "I"
opcode = 0x13
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "{name} {dst}, {src}, {imm}"

[[families.variants]]
name = "SLTI"
fields = { funct3 = 2 }

[[families.variants]]
name = "SLTIU"
fields = { funct3 = 3 }

[[families.variants]]
name = "XORI"
fields = { funct3 = 4 }

[[families.variants]]
name = "ORI"
fields = { funct3 = 6 }

[[families.variants]]
name = "ANDI"
fields = { funct3 = 7 }

# ── B 型分支（opcode 0x63；funct3 区分）──

[[families]]
name = "BB"
form = "B"
opcode = 0x63
ops = ["src:gpr", "src2:gpr", "target:off_b"]
asm = "{name} {src}, {src2}, {target}"

[[families.variants]]
name = "BEQ"
fields = { funct3 = 0 }
roles = ["branch"]

[[families.variants]]
name = "BNE"
fields = { funct3 = 1 }

[[families.variants]]
name = "BLT"
fields = { funct3 = 4 }

[[families.variants]]
name = "BGE"
fields = { funct3 = 5 }

[[families.variants]]
name = "BLTU"
fields = { funct3 = 6 }

# ── W 变体 R 型（opcode 0x3B；移位 W 走 SHIFT5 顶层）──

[[families]]
name = "WW"
form = "R"
opcode = 0x3b
ops = ["dst:gpr:out", "src:gpr", "src2:gpr"]
asm = "{name} {dst}, {src}, {src2}"

[[families.variants]]
name = "ADDW"
fields = { funct3 = 0, funct7 = 0x00 }

[[families.variants]]
name = "SUBW"
fields = { funct3 = 0, funct7 = 0x20 }

[[families.variants]]
name = "MULW"
fields = { funct3 = 0, funct7 = 0x01 }

[[families.variants]]
name = "DIVW"
fields = { funct3 = 4, funct7 = 0x01 }

[[families.variants]]
name = "DIVUW"
fields = { funct3 = 5, funct7 = 0x01 }

[[families.variants]]
name = "REMW"
fields = { funct3 = 6, funct7 = 0x01 }

[[families.variants]]
name = "REMUW"
fields = { funct3 = 7, funct7 = 0x01 }
# ─────────────────────────── 指令（顺序 = v11 声明序）───────────────────────────

# ADDI 复制（@move_args 用）；与 ADDI 同编码（imm=0），解码首匹配

[[instructions]]
name = "MOV_RM8_R64"
roles = ["gpr_mov"]
form = "I"
opcode = 0x13
fields = { funct3 = 0 }
effect = ["Move"]
ops = ["dst:gpr:out", "src:gpr"]
asm = "mv {dst}, {src}"

