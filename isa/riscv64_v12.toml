# ── 饱和（32 位）：UaddSat 进位时 = 0xFFFFFFFF；UsubSat 借位时 = 0 ──

[[lowering]]
op = "UaddSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "slli {t1}, {0}, 32",
    "srli {t1}, {t1}, 32",
    "slli {t2}, {1}, 32",
    "srli {t2}, {t2}, 32",
    "add {t3}, {t1}, {t2}",
    "srli {t4}, {t3}, 32",
    "sltu {t4}, X0, {t4}",
    "slli {t4}, {t4}, 63",
    "srai {t4}, {t4}, 63",
    "xori {t5}, {t4}, -1",
    "and {t5}, {t5}, {t3}",
    "or {out}, {t4}, {t5}",
    "slli {out}, {out}, 32",
    "srli {out}, {out}, 32",
]

[[lowering]]
op = "UsubSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "sub {t1}, {0}, {1}",
    "sltu {t2}, {0}, {1}",
    "slli {t2}, {t2}, 63",
    "srai {t2}, {t2}, 63",
    "xori {t3}, {t2}, -1",
    "and {out}, {t3}, {t1}",
    "slli {out}, {out}, 32",
    "srli {out}, {out}, 32",
]