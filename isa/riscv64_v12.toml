    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "OR {g4}, {g2}, {g3}",
    "XORI {g4}, {g4}, 1",
    "AND {g4}, {g4}, {g1}",
    "AND {g5}, {g2}, {g3}",
    "XORI {g1}, {g1}, 1",
    "AND {g5}, {g5}, {g1}",
    "OR {out2}, {g4}, {g5}",
]

[[lowering]]
op = "SsubOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "SUBW {out}, {0}, {1}",
    "SLLI {g1}, {out}, 32",
    "SRLI {g1}, {g1}, 63",
    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "XORI {g4}, {g2}, 1",
