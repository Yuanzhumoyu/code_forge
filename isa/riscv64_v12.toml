    "XORI {g5}, {g3}, 1",
    "AND {g5}, {g2}, {g5}",
    "XORI {g1}, {g1}, 1",
    "AND {g5}, {g5}, {g1}",
    "OR {out2}, {g4}, {g5}",
]

[[lowering]]
op = "SmulOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "MULW {out}, {0}, {1}",
