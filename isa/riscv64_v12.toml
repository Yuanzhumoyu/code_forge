# ── GlobalAddr：auipc+addi PC-relative（encoder 特判 AUIPC_GLOBAL/
#    ADDI_GLOBAL 的 imm<0 → Relative(4,0) "G{id}" reloc；patcher 按
#    opcode 0x17=auipc 写 hi20、0x13=addi 写 lo12）──

[[lowering]]
op = "GlobalAddr"
insts = [
    "AUIPC_GLOBAL {out}, {global}",
    "ADDI_GLOBAL {out}, {out}, {global}",
]

# ── 原子：AtomicRmw op 判别值 = immediates[0]（Xchg=0、Add=1、Sub=2）──
# AMO 语义 rd=旧内存值，正合 AtomicRmw 返回值。Sub 无规范 amosub →
# neg（sub X0）+ amoadd。aq/rl=0（单线程 QEMU 无并发序需要）。
# 模板按 R 型 operand_fields=[rd,rs1,rs2] **位置**绑定：{out}→rd、
# {0}=addr→rs1、{1}/src→rs2（不能用括号——括号 token 判 mem 类型）。

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 0] }, { eq = ["rs1_width", 64] } ] }
insts = ["AMOSWAP_D {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 0] }, { eq = ["rs1_width", 32] } ] }
insts = ["AMOSWAP_W {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 1] }, { eq = ["rs1_width", 64] } ] }
insts = ["AMOADD_D {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 1] }, { eq = ["rs1_width", 32] } ] }
insts = ["AMOADD_W {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 2] }, { eq = ["rs1_width", 64] } ] }
insts = ["SUB {g}, X0, {1}", "AMOADD_D {out}, {0}, {g}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 2] }, { eq = ["rs1_width", 32] } ] }
insts = ["SUB {g}, X0, {1}", "AMOADD_W {out}, {0}, {g}"]

# ── Cmpxchg：**无分支** LR/SC 序列（单线程 QEMU 下 sc.d 不失败，无需
#    重试循环；模板层无函数内 label）──
#    lr.d 读旧值 → 与期望比较 → 掩码选择写入值（匹配→new、不匹配→old
#    即无操作写回）→ sc.d；结果 = 旧值。32 位用 lr.w/sc.w + 掩码截断。
#    sc.d {out0}, {0}, {g4}：rd=成功标志（丢弃）、rs1=addr、rs2=写入值。

[[lowering]]
op = "Cmpxchg"
when = { eq = ["rs1_width", 64] }
insts = [
    "LR_D {g}, {0}",
    "XOR {g1}, {g}, {1}",
    "SLTU {g2}, X0, {g1}",
    "SLLI {g2}, {g2}, 63",
    "SRAI {g2}, {g2}, 63",
    "XORI {g3}, {g2}, -1",
    "AND {g4}, {2}, {g3}",
    "AND {g2}, {g}, {g2}",
    "OR {g4}, {g4}, {g2}",
    "SC_D {g5}, {0}, {g4}",
    "MOV_RM8_R64 {out}, {g}",
]

[[lowering]]
op = "Cmpxchg"
when = { eq = ["rs1_width", 32] }
insts = [
    "LR_W {g}, {0}",
    "XOR {g1}, {g}, {1}",
    "SLTU {g2}, X0, {g1}",
    "SLLI {g2}, {g2}, 63",
    "SRAI {g2}, {g2}, 63",
    "XORI {g3}, {g2}, -1",
    "AND {g4}, {2}, {g3}",
    "AND {g2}, {g}, {g2}",
    "OR {g4}, {g4}, {g2}",
    "SC_W {g5}, {0}, {g4}",
    "MOV_RM8_R64 {out}, {g}",
]

# ── 有符号饱和（32 位）：溢出检测（addw/subw 截断 + 符号位逻辑）+
#    掩码选择饱和值（正溢出 → 0x7FFFFFFF、负溢出 → 0x80000000 符号扩展）。
#    a 的符号位决定饱和方向：a_sign=0（正）→ 正饱和、a_sign=1 → 负饱和。
#    与 SaddOverflow/SsubOverflow 同源的位逻辑（slli32+srli63 取 bit31）。
[[lowering]]
op = "SaddSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "ADDW {g}, {0}, {1}",
    "SLLI {g1}, {g}, 32",
    "SRLI {g1}, {g1}, 63",
    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "XOR {g4}, {g2}, {g3}",
    "XORI {g4}, {g4}, 1",
    "XOR {g5}, {g1}, {g2}",
    "AND {g4}, {g4}, {g5}",
    "SLLI {g4}, {g4}, 63",
    "SRAI {g4}, {g4}, 63",
    "LUI {g3}, 0x80000",
    "XORI {g5}, {g3}, -1",
    "SLLI {g2}, {g2}, 63",
    "SRAI {g2}, {g2}, 63",
    "AND {g3}, {g3}, {g2}",
    "XORI {g2}, {g2}, -1",
    "AND {g5}, {g5}, {g2}",
    "OR {g3}, {g3}, {g5}",
    "AND {g3}, {g3}, {g4}",
    "XORI {g4}, {g4}, -1",
    "AND {g}, {g}, {g4}",
    "OR {out}, {g}, {g3}",
]

[[lowering]]
op = "SsubSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "SUBW {g}, {0}, {1}",
    "SLLI {g1}, {g}, 32",
    "SRLI {g1}, {g1}, 63",
    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "XOR {g4}, {g2}, {g3}",
    "XOR {g5}, {g1}, {g2}",
    "AND {g4}, {g4}, {g5}",
    "SLLI {g4}, {g4}, 63",
    "SRAI {g4}, {g4}, 63",
    "LUI {g3}, 0x80000",
    "XORI {g5}, {g3}, -1",
    "SLLI {g2}, {g2}, 63",
