# ── GlobalAddr：auipc+addi PC-relative（encoder 特判 AUIPC_GLOBAL/
#    ADDI_GLOBAL 的 imm<0 → Relative(4,0) "G{id}" reloc；patcher 按
#    opcode 0x17=auipc 写 hi20、0x13=addi 写 lo12）──

[[lowering]]
op = "GlobalAddr"
insts = [
    "auipc.g {out}, {global}",
    "addi.g {out}, {out}, {global}",
]

# ── 原子：AtomicRmw op 判别值 = immediates[0]（Xchg=0、Add=1、Sub=2）──
# AMO 语义 rd=旧内存值，正合 AtomicRmw 返回值。Sub 无规范 amosub →
# neg（sub X0）+ amoadd。aq/rl=0（单线程 QEMU 无并发序需要）。
# 模板按 R 型 operand_fields=[rd,rs1,rs2] **位置**绑定：{out}→rd、
# {0}=addr→rs1、{1}/src→rs2（不能用括号——括号 token 判 mem 类型）。

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 0] }, { eq = ["rs1_width", 64] } ] }
insts = ["amoswap.d {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 0] }, { eq = ["rs1_width", 32] } ] }
insts = ["amoswap.w {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 1] }, { eq = ["rs1_width", 64] } ] }
insts = ["amoadd.d {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 1] }, { eq = ["rs1_width", 32] } ] }
insts = ["amoadd.w {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 2] }, { eq = ["rs1_width", 64] } ] }
insts = ["sub {g}, X0, {1}", "amoadd.d {out}, {0}, {g}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 2] }, { eq = ["rs1_width", 32] } ] }
insts = ["sub {g}, X0, {1}", "amoadd.w {out}, {0}, {g}"]

# ── Cmpxchg：**无分支** LR/SC 序列（单线程 QEMU 下 sc.d 不失败，无需
#    重试循环；模板层无函数内 label）──
#    lr.d 读旧值 → 与期望比较 → 掩码选择写入值（匹配→new、不匹配→old
#    即无操作写回）→ sc.d；结果 = 旧值。32 位用 lr.w/sc.w + 掩码截断。
#    sc.d {out0}, {0}, {g4}：rd=成功标志（丢弃）、rs1=addr、rs2=写入值。

[[lowering]]
op = "Cmpxchg"
when = { eq = ["rs1_width", 64] }
insts = [
    "lr.d {g}, {0}",
    "xor {g1}, {g}, {1}",
    "sltu {g2}, X0, {g1}",
    "slli {g2}, {g2}, 63",
    "srai {g2}, {g2}, 63",
    "xori {g3}, {g2}, -1",
    "and {g4}, {2}, {g3}",
    "and {g2}, {g}, {g2}",
    "or {g4}, {g4}, {g2}",
    "sc.d {g5}, {0}, {g4}",
    "mv {out}, {g}",
]

[[lowering]]
op = "Cmpxchg"
when = { eq = ["rs1_width", 32] }
insts = [
    "lr.w {g}, {0}",
    "xor {g1}, {g}, {1}",
    "sltu {g2}, X0, {g1}",
    "slli {g2}, {g2}, 63",
    "srai {g2}, {g2}, 63",
    "xori {g3}, {g2}, -1",
    "and {g4}, {2}, {g3}",
    "and {g2}, {g}, {g2}",
    "or {g4}, {g4}, {g2}",
    "sc.w {g5}, {0}, {g4}",
    "mv {out}, {g}",
]

# ── 有符号饱和（32 位）：溢出检测（addw/subw 截断 + 符号位逻辑）+
#    掩码选择饱和值（正溢出 → 0x7FFFFFFF、负溢出 → 0x80000000 符号扩展）。
#    a 的符号位决定饱和方向：a_sign=0（正）→ 正饱和、a_sign=1 → 负饱和。
#    与 SaddOverflow/SsubOverflow 同源的位逻辑（slli32+srli63 取 bit31）。
[[lowering]]
op = "SaddSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "addw {g}, {0}, {1}",
    "slli {g1}, {g}, 32",
    "srli {g1}, {g1}, 63",
    "slli {g2}, {0}, 32",
    "srli {g2}, {g2}, 63",
    "slli {g3}, {1}, 32",
    "srli {g3}, {g3}, 63",
    "xor {g4}, {g2}, {g3}",
    "xori {g4}, {g4}, 1",
    "xor {g5}, {g1}, {g2}",
    "and {g4}, {g4}, {g5}",
    "slli {g4}, {g4}, 63",
    "srai {g4}, {g4}, 63",
    "lui {g3}, 0x80000",
    "xori {g5}, {g3}, -1",
    "slli {g2}, {g2}, 63",
    "srai {g2}, {g2}, 63",
    "and {g3}, {g3}, {g2}",
    "xori {g2}, {g2}, -1",
    "and {g5}, {g5}, {g2}",
    "or {g3}, {g3}, {g5}",
    "and {g3}, {g3}, {g4}",
    "xori {g4}, {g4}, -1",
    "and {g}, {g}, {g4}",
    "or {out}, {g}, {g3}",
]

[[lowering]]
op = "SsubSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "subw {g}, {0}, {1}",
    "slli {g1}, {g}, 32",
    "srli {g1}, {g1}, 63",
    "slli {g2}, {0}, 32",
    "srli {g2}, {g2}, 63",
    "slli {g3}, {1}, 32",
    "srli {g3}, {g3}, 63",
    "xor {g4}, {g2}, {g3}",
    "xor {g5}, {g1}, {g2}",
    "and {g4}, {g4}, {g5}",
    "slli {g4}, {g4}, 63",
    "srai {g4}, {g4}, 63",
    "lui {g3}, 0x80000",
    "xori {g5}, {g3}, -1",
    "slli {g2}, {g2}, 63",
    "srai {g2}, {g2}, 63",
    "and {g3}, {g3}, {g2}",
    "xori {g2}, {g2}, -1",
    "and {g5}, {g5}, {g2}",
    "or {g3}, {g3}, {g5}",
    "and {g3}, {g3}, {g4}",
    "xori {g4}, {g4}, -1",
    "and {g}, {g}, {g4}",
    "or {out}, {g}, {g3}",
]

# ── 位操作软件序列（RV64GC 无 Zbb；SWAR 无分支）──
# Popcnt：分治计数（Hacker's Delight）。
# Clz：先把最高位 1 向下传播（t |= t>>1..32）→ popcnt(t) = 64 - clz。
# Ctz：ctz(x) = popcnt((x & -x) - 1)。

[[lowering]]
op = "Popcnt"
insts = [
    "add {g}, {0}, X0",
    "srli {g1}, {g}, 1",
    "lui {g2}, 0x55555000",
    "addi {g2}, {g2}, 0x555",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "sub {g}, {g}, {g1}",
    "lui {g2}, 0x33333000",
    "addi {g2}, {g2}, 0x333",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g}, {g2}",
    "srli {g3}, {g}, 2",
    "and {g3}, {g3}, {g2}",
    "add {g}, {g1}, {g3}",
    "lui {g2}, 0xf0f1000",
    "addi {g2}, {g2}, -0xf1",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "srli {g1}, {g}, 4",
    "add {g}, {g}, {g1}",
    "and {g}, {g}, {g2}",
    "srli {g1}, {g}, 8",
    "add {g}, {g}, {g1}",
    "srli {g1}, {g}, 16",
    "add {g}, {g}, {g1}",
    "srli {g1}, {g}, 32",
    "add {g}, {g}, {g1}",
    "andi {out}, {g}, 0x7F",
]

[[lowering]]
op = "Clz"
insts = [
    "add {g}, {0}, X0",
    "srli {g1}, {g}, 1",
    "or {g}, {g}, {g1}",
    "srli {g1}, {g}, 2",
    "or {g}, {g}, {g1}",
    "srli {g1}, {g}, 4",
    "or {g}, {g}, {g1}",
    "srli {g1}, {g}, 8",
    "or {g}, {g}, {g1}",
    "srli {g1}, {g}, 16",
    "or {g}, {g}, {g1}",
    "srli {g1}, {g}, 32",
    "or {g}, {g}, {g1}",
    "srli {g1}, {g}, 1",
    "lui {g2}, 0x55555000",
    "addi {g2}, {g2}, 0x555",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "sub {g}, {g}, {g1}",
    "lui {g2}, 0x33333000",
    "addi {g2}, {g2}, 0x333",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g}, {g2}",
    "srli {g3}, {g}, 2",
    "and {g3}, {g3}, {g2}",
    "add {g}, {g1}, {g3}",
    "lui {g2}, 0xf0f1000",
    "addi {g2}, {g2}, -0xf1",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "srli {g1}, {g}, 4",
    "add {g}, {g}, {g1}",
    "and {g}, {g}, {g2}",
    "srli {g1}, {g}, 8",
    "add {g}, {g}, {g1}",
    "srli {g1}, {g}, 16",
    "add {g}, {g}, {g1}",
    "srli {g1}, {g}, 32",
    "add {g}, {g}, {g1}",
    "andi {g}, {g}, 0x7F",
    "addi {g1}, X0, 64",
    "sub {out}, {g1}, {g}",
]

[[lowering]]
op = "Ctz"
insts = [
    "sub {g}, X0, {0}",
    "and {g}, {0}, {g}",
    "addi {g}, {g}, -1",
    "srli {g1}, {g}, 1",
    "lui {g2}, 0x55555000",
    "addi {g2}, {g2}, 0x555",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "sub {g}, {g}, {g1}",
    "lui {g2}, 0x33333000",
    "addi {g2}, {g2}, 0x333",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g}, {g2}",
    "srli {g3}, {g}, 2",
    "and {g3}, {g3}, {g2}",
    "add {g}, {g1}, {g3}",
    "lui {g2}, 0xf0f1000",
    "addi {g2}, {g2}, -0xf1",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "srli {g1}, {g}, 4",
    "add {g}, {g}, {g1}",
    "and {g}, {g}, {g2}",
    "srli {g1}, {g}, 8",
    "add {g}, {g}, {g1}",
    "srli {g1}, {g}, 16",
    "add {g}, {g}, {g1}",
    "srli {g1}, {g}, 32",
    "add {g}, {g}, {g1}",
    "andi {out}, {g}, 0x7F",
]



# ── Nop / Undef / Poison / Bitreverse ──
# Undef/Poison 语义自由 → 返回 0（xor 清零，与 x86 一致）。

[[lowering]]
op = "Nop"
insts = ["nop"]

[[lowering]]
op = "Undef"
insts = ["xor {out}, {out}, {out}"]

[[lowering]]
op = "Poison"
insts = ["xor {out}, {out}, {out}"]

# Bitreverse：SWAR 分治（Hacker's Delight）——每步 (x & mask)<<k | (x>>k) & mask，
# 掩码逐次构造用完即弃（不长期占用临时）。5 级 + 32 位交换。

[[lowering]]
op = "Bitreverse"
insts = [
    "srli {g1}, {0}, 1",
    "lui {g2}, 0x55555000",
    "addi {g2}, {g2}, 0x555",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "slli {g3}, {0}, 1",
    "and {g3}, {g3}, {g2}",
    "or {g}, {g1}, {g3}",
    "srli {g1}, {g}, 2",
    "lui {g2}, 0x33333000",
    "addi {g2}, {g2}, 0x333",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "slli {g3}, {g}, 2",
    "and {g3}, {g3}, {g2}",
    "or {g}, {g1}, {g3}",
    "srli {g1}, {g}, 4",
    "lui {g2}, 0xf0f1000",
    "addi {g2}, {g2}, -0xf1",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "slli {g3}, {g}, 4",
    "and {g3}, {g3}, {g2}",
    "or {g}, {g1}, {g3}",
    "srli {g1}, {g}, 8",
    "lui {g2}, 0x0ff0000",
    "addi {g2}, {g2}, 0xff",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "slli {g3}, {g}, 8",
    "and {g3}, {g3}, {g2}",
    "or {g}, {g1}, {g3}",
    "srli {g1}, {g}, 16",
    # mask = 0x0000FFFF0000FFFF：0x0000FFFF = lui 0x10 + addi -1
    # （0xFFFF 低 12 位 0xFFF 有符号 = -1，lui 需 +1 进位 0x10000）
    "lui {g2}, 0x10000",
    "addi {g2}, {g2}, -1",
    "slli {g3}, {g2}, 32",
    "or {g2}, {g2}, {g3}",
    "and {g1}, {g1}, {g2}",
    "slli {g3}, {g}, 16",
    "and {g3}, {g3}, {g2}",
    "or {g}, {g1}, {g3}",
    "srli {g1}, {g}, 32",
    "slli {g}, {g}, 32",
    "or {out}, {g}, {g1}",
]
