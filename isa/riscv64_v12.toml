# ════════════════════════════════════════════════════════════
# B2：接入 TargetMachine（SysV rv64 子集 + 帧 + lowering）
# ════════════════════════════════════════════════════════════

[abi]
stack_align = 16
scratch = ["X5", "X6"]
# regalloc 不可分配：X0=zero（写入无效）、X1=ra（prologue 保存 + call 返回
# 地址）、X3/X4=gp/tp（固定用途）——不排除会分配出垃圾（实测 subw x0）。
reserved = ["X0", "X1", "X3", "X4"]

# 返回寄存器（a0）；Return/Call lowering 的返回值移动目标
ret_regs = ["X10"]

# Call 调用指令（jal ra, @N；label 槽 = -(FuncRef+1)，RiscvRelocPatcher 编码 UJ 位段）
call_ret_reg = "X1"

# Call 点被调用方破坏的寄存器（regalloc clobber 集）：ra(X1) + 参数 a0-a7
# (X10-X17) + 临时 t0-t2(X5-X7)/t3-t6(X28-X31) + 固定用途 X3/X4。
# s 系（X9/X18-X27）由 @push_callee 保存 → 不在 clobber 集（跨调用存活
# 值留在 s 系安全）。X5/X6 是 spill scratch（regalloc 不可分配）。
call_clobbers = ["X1", "X3", "X4", "X7", "X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17", "X28", "X29", "X30", "X31"]

[[abi.arg_class]]
class = "int"
regs = ["X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17"]

[abi.frame]
sp = "X2"          # sp
fp = "X8"          # s0/fp
alloc_neg = true   # addi sp, sp, -frame_size
# fp-inside：ra/fp/callee_saved 保存槽在帧内顶部 → min_frame_bytes(104 =
# fp_push 16 + 11×8)、callee_saved_bytes_override(0)、stack_slot_shift(16)
# 三个值全部由运行期推导（pipeline/frame_layout.rs::frame_layout_info），
# 不再手写魔法数。
layout = "fp-inside"
fp_push_bytes = 16 # ra + fp 两个保存槽

[abi.callee_saved]
# s 系（X9, X18-X27）：@push_callee/@pop_callee 用 [spill.GPR] store/load
# 模板（SD/LD）保存到帧槽 [sp + frame - 16 - (k+1)*8]（fp-inside 推导的最小
# 帧 = fp_push 16 + 11×8 = 104 覆盖，SD 偏移非负）。regalloc 把跨调用存活
# vreg 分配到这里，递归/跨函数调用安全。
gpr = ["X9", "X18", "X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27"]

[spill.GPR]
# base = X8（fp = 入口 sp，等价 x86 rbp）：emission 的 sp_base =
# -(frame) - callee_saved_bytes 是**相对帧指针**的偏移。base 用 X2（sp）会
# 双重减 frame（spill 槽落帧外更深处），递归时与 callee 帧重叠（ra 槽被
# 覆盖 → ret 跳 0，实测 fault_fetch epc=0）。base = fp → spill 槽
# [fp - frame + off] = [sp + off] 帧内底部，递归帧在下方不重叠。
load = "LD {0}, X8, {1}"
store = "SD {0}, X8, {1}"
base = "X8"

[emit]
align_pad = 0
# return block 经 emit_epilogue_jump（jal x0, epilogue_label）跳到统一尾声：
# 多 return block 函数（fib 双 return）安全；label 槽块号 → 定宽 fixup。
epilogue_label = true

[emit.prologue]
insts = ["@frame_alloc", "SD X1, X2, {frame_size_m8}", "SD X8, X2, {frame_size_m16}", "ADDI X8, X2, {frame_size}", "@push_callee", "@move_args"]

[emit.epilogue]
insts = ["@pop_callee", "LD X1, X2, {frame_size_m8}", "LD X8, X2, {frame_size_m16}", "@frame_free", "RET"]

# ─────────────────────── lowering（64 位主；32 位 W 变体按 rs1_width）───────────────────────

[[lowering]]
op = "Iadd"
when = { eq = ["rs1_width", 32] }
insts = ["ADDW {out}, {0}, {1}"]

[[lowering]]
op = "Iadd"
insts = ["ADD {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
when = { eq = ["rs1_width", 32] }
insts = ["SUBW {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
insts = ["SUB {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
when = { eq = ["rs1_width", 32] }
insts = ["MULW {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
insts = ["MUL {out}, {0}, {1}"]

[[lowering]]
op = "Iconst"
when = { eq = ["rd", 64] }
insts = [
    "LUI {g1}, {iconst_hi32_hi20}",
    "ADDI {g1}, {g1}, {iconst_hi32_lo12}",
    "SLLI {g1}, {g1}, 32",
    "LUI {g2}, {iconst_lo32_hi20}",
    # lo32 LUI bit19=1 符号扩展污染高 32 位 → slli32+srli32 截断
    "SLLI {g2}, {g2}, 32",
    "SRLI {g2}, {g2}, 32",
    "ADDI {g2}, {g2}, {iconst_lo32_lo12}",
    "OR {out}, {g1}, {g2}",
]

[[lowering]]
op = "Iconst"
insts = ["LUI {out}, {iconst_hi20}", "ADDI {out}, {out}, {iconst_lo12}"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 32] }
insts = ["LW {out}, {0}, 0"]

[[lowering]]
op = "Load"
insts = ["LD {out}, {0}, 0"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_width", 32] }
insts = ["SW {0}, {1}, 0"]

[[lowering]]
op = "Store"
insts = ["SD {0}, {1}, 0"]

[[lowering]]
op = "StackAddr"
# 基准 X8（fp = 入口 sp，帧顶固定）：栈槽相对 fp（偏移 = v - 16，
# stack_slot_shift）→ 递归各帧独立（相对 sp 的 -4 跨帧重叠——fib_slot
# 结果错）；且避开 ra/fp 保存槽 [fp-16, fp)。
insts = ["ADDI {out}, X8, {off}"]

[[lowering]]
op = "Copy"
insts = ["MOV_RM8_R64 {out}, {0}"]
# ── 补全 lowering（B2 遗留：位运算/移位/比较/调用）──

[[lowering]]
op = "Band"
insts = ["AND {out}, {0}, {1}"]

[[lowering]]
op = "Bor"
insts = ["OR {out}, {0}, {1}"]

[[lowering]]
op = "Bxor"
insts = ["XOR {out}, {0}, {1}"]

[[lowering]]
op = "Bnot"
insts = ["XORI {out}, {0}, -1"]

[[lowering]]
op = "Ishl"
insts = ["SLL {out}, {0}, {1}"]

[[lowering]]
op = "Ushr"
insts = ["SRL {out}, {0}, {1}"]

[[lowering]]
op = "Sshr"
insts = ["SRA {out}, {0}, {1}"]

# Icmp：按 IntCC（icmp_id 1-10）分派。riscv 无 setcc——用 slt/sltu/xor/
# sltiu/xori 序列产生 0/1（矩阵 i1 语义）。eq = (a==b) = sltiu(xor(a,b),1)
#（xor==0 → 1）；ne = 其取反；sle/sge/ule/uge = 反向 slt/sltu 取反。
[[lowering]]
op = "Icmp"
when = { eq = ["cond", 1] } # Equal
insts = ["XOR {g}, {0}, {1}", "SLTIU {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 2] } # NotEqual
insts = ["XOR {g}, {0}, {1}", "SLTIU {g}, {g}, 1", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 3] } # SignedLessThan
insts = ["SLT {out}, {0}, {1}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 4] } # SignedLessThanOrEqual = !(b < a)
insts = ["SLT {g}, {1}, {0}", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 5] } # SignedGreaterThan = b < a
insts = ["SLT {out}, {1}, {0}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 6] } # SignedGreaterThanOrEqual = !(a < b)
insts = ["SLT {g}, {0}, {1}", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 7] } # UnsignedLessThan
insts = ["SLTU {out}, {0}, {1}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 8] } # UnsignedLessThanOrEqual = !(b <u a)
insts = ["SLTU {g}, {1}, {0}", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 9] } # UnsignedGreaterThan = b <u a
insts = ["SLTU {out}, {1}, {0}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 10] } # UnsignedGreaterThanOrEqual = !(a <u b)
insts = ["SLTU {g}, {0}, {1}", "XORI {out}, {g}, 1"]

# Call：jal ra, @N（跨函数符号；RiscvRelocPatcher 编码 UJ 位段）
# 注意：Call 是 terminator 级 lowering（gen_call_lowering），不走此表——
# 该规则仅占位声明，实际接线见 integration.rs 的 call_inst 泛化。

# ── 除法/取模（32 位 W 变体按 rs1_width 分派）──

[[lowering]]
op = "Sdiv"
when = { eq = ["rs1_width", 32] }
insts = ["DIVW {out}, {0}, {1}"]

[[lowering]]
op = "Sdiv"
insts = ["DIV {out}, {0}, {1}"]

[[lowering]]
op = "Udiv"
when = { eq = ["rs1_width", 32] }
insts = ["DIVUW {out}, {0}, {1}"]

[[lowering]]
op = "Udiv"
insts = ["DIVU {out}, {0}, {1}"]

[[lowering]]
op = "Srem"
when = { eq = ["rs1_width", 32] }
insts = ["REMW {out}, {0}, {1}"]

[[lowering]]
op = "Srem"
insts = ["REM {out}, {0}, {1}"]

[[lowering]]
op = "Urem"
when = { eq = ["rs1_width", 32] }
insts = ["REMUW {out}, {0}, {1}"]

[[lowering]]
op = "Urem"
insts = ["REMU {out}, {0}, {1}"]

# ── min/max（基础指令序列，不依赖 Zbb——QEMU 11.0.92 默认/显式 CPU 均不
#    译码 Zbb 的 min/max（LLVM 确认编码规范，QEMU rc 版 TCG 未接）；用
#    `slt + neg + xor + and + xor` 算术选择：min(a,b) = b ^ ((a^b) & -(a<b))）──

[[lowering]]
op = "Smin"
insts = [
    "SLT {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {1}, {g}",
]

[[lowering]]
op = "Smax"
insts = [
    "SLT {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {0}, {g}",
]

[[lowering]]
op = "Umin"
insts = [
    "SLTU {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {1}, {g}",
]

[[lowering]]
op = "Umax"
insts = [
    "SLTU {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {0}, {g}",
]

# ── 旋转（基础序列，不依赖 Zbb）：rol(a,n) = (a<<n)|(a>>(64-n))；
#    `sub X0, n` 取 -n（移位量低 6 位 = 64-n；n=0 时 srl 移位 0 正确）──

[[lowering]]
op = "Rotl"
insts = [
    "SLL {g}, {0}, {1}",
    "SUB {g3}, X0, {1}",
    "SRL {g2}, {0}, {g3}",
    "OR {out}, {g}, {g2}",
]

[[lowering]]
op = "Rotr"
insts = [
    "SRL {g}, {0}, {1}",
    "SUB {g3}, X0, {1}",
    "SLL {g2}, {0}, {g3}",
    "OR {out}, {g}, {g2}",
]

# ── 扩展/截断：riscv 的 i32 值经 W 变体/ADDI 天然 64 位符号扩展 →
#    Sextend(i32→i64) = mv；Uextend 按源宽 andi 掩码（8/16）或
#    slli+srli 清零高 32 位（32→64）；Ireduce 按结果宽截断──

[[lowering]]
op = "Sextend"
insts = ["MOV_RM8_R64 {out}, {0}"]

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 8] }
insts = ["ANDI {out}, {0}, 255"]

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 16] }
# 0xFFFF 超出 imm12 有符号范围 ±2047（旧 andi 65535 依赖掩码截断侥幸
# 正确）——用 slli/srli 清零高 48 位（与 32 位路径同模式）
insts = ["SLLI {out}, {0}, 48", "SRLI {out}, {out}, 48"]

[[lowering]]
op = "Uextend"
insts = ["SLLI {out}, {0}, 32", "SRLI {out}, {out}, 32"]

[[lowering]]
op = "Ireduce"
when = { eq = ["rd", 8] }
insts = ["ANDI {out}, {0}, 255"]

[[lowering]]
op = "Ireduce"
when = { eq = ["rd", 16] }
# 0xFFFF 超出 imm12 有符号范围 ±2047（旧 andi 65535 依赖掩码截断侥幸
# 正确）——用 slli/srli 清零高 48 位
insts = ["SLLI {out}, {0}, 48", "SRLI {out}, {out}, 48"]

[[lowering]]
op = "Ireduce"
insts = ["SLLI {out}, {0}, 32", "SRLI {out}, {out}, 32"]

# ── Abs：|x| = (x ^ (x>>63)) - (x>>63)（64 位；i32 值符号扩展后正确）──

[[lowering]]
op = "Abs"
insts = [
    "SRAI {g}, {0}, 63",
    "XOR {out}, {0}, {g}",
    "SUB {out}, {out}, {g}",
]

# ── Select(cond, then, else)：cond 为 0/1 → (cond & then) | (!cond & else) ──
# 掩码法：c<<63>>63 得全0/全1 掩码（QEMU 11.1.0-rc2 的 TCG 对直接
# and/xori/and/or 序列有 host 寄存器 bug——实测 s8=0；掩码法规避）。

[[lowering]]
op = "Select"
insts = [
    "SLLI {g1}, {0}, 63",
    "SRAI {g1}, {g1}, 63",
    "AND {g2}, {g1}, {1}",
    "XORI {g3}, {g1}, -1",
    "AND {g4}, {g3}, {2}",
    "OR {out}, {g2}, {g4}",
]

# ── 空指针判断 / Freeze / Trap / Fence ──

[[lowering]]
op = "IsNull"
insts = ["SLTIU {out}, {0}, 1"]

[[lowering]]
op = "IsNotNull"
insts = ["SLTU {out}, X0, {0}"]

[[lowering]]
op = "Freeze"
insts = ["MOV_RM8_R64 {out}, {0}"]

[[lowering]]
op = "Trap"
insts = ["EBREAK"]

[[lowering]]
op = "Fence"
insts = ["FENCE"]

# ── Alloca：栈槽地址（current_alloca_offset；基准 X8 = fp 与 StackAddr 一致）──

[[lowering]]
op = "Alloca"
insts = ["ADDI {out}, X8, {alloca}"]

# ── 溢出 6 条（{out}=值、{out2}=flag；32 位用例）。riscv 无标志位 →
#    比较序列。i32 值符号扩展后 bit63 = bit31，64 位 slti 检测 32 位符号 ✓。──

[[lowering]]
op = "UaddOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "SLLI {g1}, {0}, 32",
    "SRLI {g1}, {g1}, 32",
    "SLLI {g2}, {1}, 32",
    "SRLI {g2}, {g2}, 32",
    "ADD {out}, {g1}, {g2}",
    "SRLI {g3}, {out}, 32",
    "SLTU {out2}, X0, {g3}",
]

[[lowering]]
op = "UsubOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "SUB {out}, {0}, {1}",
    "SLTU {out2}, {0}, {1}",
]

[[lowering]]
op = "SaddOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "ADDW {out}, {0}, {1}",
