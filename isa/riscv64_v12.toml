# ── Nop / Undef / Poison / Bitreverse ──
# Undef/Poison 语义自由 → 返回 0（xor 清零，与 x86 一致）。

[[lowering]]
op = "Nop"
insts = ["NOP"]

[[lowering]]
op = "Undef"
insts = ["XOR {out}, {out}, {out}"]

[[lowering]]
op = "Poison"
insts = ["XOR {out}, {out}, {out}"]

# Bitreverse：SWAR 分治（Hacker's Delight）——每步 (x & mask)<<k | (x>>k) & mask，
# 掩码逐次构造用完即弃（不长期占用临时）。5 级 + 32 位交换。

[[lowering]]
op = "Bitreverse"
insts = [
    "SRLI {g1}, {0}, 1",
    "LUI {g2}, 0x55555000",
    "ADDI {g2}, {g2}, 0x555",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {0}, 1",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 2",
    "LUI {g2}, 0x33333000",
    "ADDI {g2}, {g2}, 0x333",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 2",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 4",
    "LUI {g2}, 0xf0f1000",
    "ADDI {g2}, {g2}, -0xf1",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 4",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 8",
    "LUI {g2}, 0x0ff0000",
    "ADDI {g2}, {g2}, 0xff",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 8",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 16",
    # mask = 0x0000FFFF0000FFFF：0x0000FFFF = lui 0x10 + addi -1
    # （0xFFFF 低 12 位 0xFFF 有符号 = -1，lui 需 +1 进位 0x10000）
    "LUI {g2}, 0x10000",
    "ADDI {g2}, {g2}, -1",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 16",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 32",
    "SLLI {g}, {g}, 32",
    "OR {out}, {g}, {g1}",
]
