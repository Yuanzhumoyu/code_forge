when = { and = [ { eq = ["cond", 6] }, { eq = ["rs1_width", 64] } ] }
insts = ["FLE_D {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 6] }, { eq = ["rs1_width", 32] } ] }
insts = ["FLE_S {out}, {0}, {1}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 7] }, { eq = ["rs1_width", 64] } ] }
insts = ["FLT_D {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 7] }, { eq = ["rs1_width", 32] } ] }
insts = ["FLT_S {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 8] }, { eq = ["rs1_width", 64] } ] }
insts = ["FLE_D {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 8] }, { eq = ["rs1_width", 32] } ] }
insts = ["FLE_S {out}, {1}, {0}"]

[[lowering]]
op = "Fcmp"
when = { and = [ { eq = ["cond", 1] }, { eq = ["rs1_width", 64] } ] }
insts = ["FEQ_D {g}, {0}, {0}", "FEQ_D {g2}, {1}, {1}", "AND {out}, {g}, {g2}"]

[[lowering]]
