# ── 向量区段结束

[machine]
# 机器事实（v20 A5）：溢出与栈参数收参用的 scratch（emission 的 spill load/store 也用它）。
spill_scratch = ["R10", "R11"]
# 帧为 callee-saved 预留的推入槽数（机器事实，v20 A6）：与"哪些寄存器必须保住"（约定，
# 在 `[abi.callee_saved]` 里）分开——生成期 `__cs_bytes` 与 fp-outside 的推补偿用它。
callee_saved_gpr = ["RBX", "RDI", "RSI", "R12", "R13", "R14", "R15"]
callee_save_slots = 7
# 帧填充（字节，机器事实，v20 A5-3，原 `[abi].frame_padding`）：8 = align(16)/2。
# 归机器事实的理由：它由**这台机器的帧机制**决定——入口 rsp ≡ 8 (mod 16)（call 压了
# 返回地址），x86 的帧件是 `push rbp` + 7 次 callee-saved `push` = 8 次推入（偶数）⇒
# `sub rsp` 之前仍是 8 ⇒ 必须多减 8 才能在 call 点回到 16 对齐。缺省 0 会让系统 DLL
# （如 kernel32!ExitProcess 内部的 movdqa）在未对齐栈上崩（0xC0000005）。
# 约定侧的同名字段在 AbiRules（win64/sysv64 都写 8），进 plan 后由管线优先读。
frame_padding = 8
# 位置计数规则（机器事实，v20 A5-3，原 `[abi].arg_slot`）：Windows x64 的 int/float
# **共享位置游标**——参数 i 用 GPR{i}/XMM{i}（第 2 个参数即使第 1 个是整数也进 XMM1）。
# 约定侧的正式位置是 AbiRules::position（win64 规则写 by_position，进 plan 后优先）。
arg_slot = "by-position"
# 向量 by-ref 阈值（字节，机器事实，v20 A5-3，原 [[abi.arg_class]] strategy/by-ref limit=128 位）：
# 超过 16 字节的向量参数/返回按引用传（调用方栈上副本 + 传指针）。
vector_by_ref_bytes = 16

# 帧形状：栈/帧指针寄存器名 + 帧指针保存槽字节数（x86 用硬件 push 保存 fp，故
# 布局模式是缺省 fp-outside、alloc 立即数由 SUB 自带减号语义）。
[machine.frame]
sp = "RSP"
fp = "RBP"
fp_push_bytes = 8
