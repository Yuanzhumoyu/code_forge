# cvtsi2ss：32 位源（w=0）与 64 位源（w=1）合并——源槽多类 gprx + opsize=s1
# 驱动 REX.W（eax → 0、rax → 1），按操作数实际宽度自动分发。

[[instructions]]
name = "CVTSI2SS"
form = "SSE_RR"
opcode = 0x2A
fields = { prefix = 0xF3 }
opsize = "src"
rex_w = "auto"
ops = ["dst:fpr:out", "src:gprx"]
asm = "cvtsi2ss {dst}, {src}"

[[instructions]]
name = "MOVD_FREG_IREG"
form = "SSE_RR"
opcode = 0x6E
fields = { prefix = 0x66, w = 0 }
ops = ["dst:fpr:out", "src:gpr"]
asm = "movd {dst}, {src}"
# **类间位搬移**（v20 V7）：GPR 的位模式 → FPR。x86 的 SysV64 正常情况下浮点走 XMM，
# 这条只在"约定的落点是整数寄存器"时需要（`classify` 把浮点判给 int 池：软浮点/Zfinx 式
# 约定、或调用约定自定义）。缺这条角色 ⇒ 那条落点 fail-closed（不拿同类搬移顶上）。
data_width = 32

[[instructions]]
name = "MOVD_IREG_FREG"
modrm = { reg = "src", rm = "dst" }
form = "SSE_RR"
opcode = 0x7E
fields = { prefix = 0x66, w = 0 }
ops = ["dst:gpr:out", "src:fpr"]
asm = "movd {dst}, {src}"
data_width = 32

[[instructions]]
name = "PUNPCKLDQ"
form = "SSE_RR"
opcode = 0x62
fields = { prefix = 0x66, w = 0 }
ops = ["dst:fpr:out", "src:fpr"]
asm = "punpckldq {dst}, {src}"

[[instructions]]
name = "PUNPCKLQDQ"
form = "SSE_RR"
opcode = 0x6C
fields = { prefix = 0x66, w = 0 }
ops = ["dst:fpr:out", "src:fpr"]
asm = "punpcklqdq {dst}, {src}"

[[instructions]]
name = "PUNPCKHDQ"
form = "SSE_RR"
opcode = 0x6A
fields = { prefix = 0x66, w = 0 }
ops = ["dst:fpr:out", "src:fpr"]
asm = "punpckhdq {dst}, {src}"

[[instructions]]
name = "MOVSS"
data_width = 32
form = "SSE_RR"
opcode = 0x10
fields = { prefix = 0xF3, w = 0 }
ops = ["dst:fpr:out", "src:fpr"]
asm = "movss {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "CMPXCHG_MEM_R"
modrm = { rm = "[src2]" }
opsize = "src"
escape = [0x0F]
prefix = "field"
opcode = 0xB1
fields = { prefix = 0xF0 }
# v14：数据槽 gprx 多类——DSL 回填携带 IR 值宽度（I16→66 前缀、I32→无
# REX.W、I64→RAX 视图 REX.W），rm_mem 宽度自动分发（16/32/64 同 opcode
# 0F B1 + 66/REX.W；8 位是独立 opcode 0F B0——见 CMPXCHG_MEM_R_8）。
# 取代固定 _32 变体（CMPXCHG_MEM_R_32 已删——见 WA-35/DSL 回填缺口修复）。
ops = ["src:gprx", "src2:gprx"]
asm = "lock cmpxchg [{src2}], {src}"
effect = ["Write"]
# cmpxchg 隐式读 RAX（期望值）并写 RAX（旧值）——regalloc 需知 RAX 在本
# 指令点被破坏，否则会把期望值的 SSA 值留在 RAX 跨过本指令（后续 icmp
# 读 RAX = 旧值 → 与自身比较恒真 → 循环提前退出、写不生效——fetch_and
# 类 CMPXCHG 循环回归实证）。div/idiv 同款建模（见 WA-35）。
implicit_regs = ["RAX"]

[[instructions]]
name = "CMPXCHG_MEM_R_8"
modrm = { rm = "[src2]" }
escape = [0x0F]
prefix = "field"
opcode = 0xB0
fields = { prefix = 0xF0 }
# 8 位 LOCK CMPXCHG：0F B0（r/m8，隐式 AL——mov RAX 后 AL 即期望值低
# 字节）。数据槽 gpr1b（byte_reg 强制 REX：spl/bpl/sil/dil）。
ops = ["src:gpr1b", "src2:gprx"]
asm = "lock cmpxchg [{src2}], {src}"
effect = ["Write"]
implicit_regs = ["RAX"]

[[instructions]]
name = "XADD_MEM_R"
ref = "xadd"
modrm = { rm = "[src]" }
opsize = "dst"
escape = [0x0F]
prefix = "field"
opcode = 0xC1
fields = { prefix = 0xF0 }
# v14：数据槽 gprx（16/32/64 auto）——AtomicRmw Add/Sub lowering 的 {g1}
# 临时恒 64 位池（窄域 Add/Sub 走 intrinsics cmpxchg 循环，i64 域用本指令）。
ops = ["dst:gprx:inout", "src:gprx"]
asm = "xadd [{src}], {dst}"

[[instructions]]
name = "XCHG_MEM_R"
form = "MRR_MEM"
modrm = { rm = "[src]" }
opcode = 0x87
ops = ["dst:gprx:inout", "src:gprx"]
asm = "xchg [{src}], {dst}"

[[instructions]]
name = "SUB_MEM_R"
form = "MRR_MEM_PRE"
modrm = { rm = "[src2]" }
opcode = 0x29
fields = { prefix = 0xF0 }
ops = ["src:gpr", "src2:gpr"]
asm = "lock sub [{src2}], {src}"

[[instructions]]
name = "AND_MEM_R"
form = "MRR_MEM_PRE"
modrm = { rm = "[src2]" }
opcode = 0x21
fields = { prefix = 0xF0 }
ops = ["src:gpr", "src2:gpr"]
asm = "lock and [{src2}], {src}"

[[instructions]]
name = "OR_MEM_R"
form = "MRR_MEM_PRE"
modrm = { rm = "[src2]" }
opcode = 0x09
fields = { prefix = 0xF0 }
ops = ["src:gpr", "src2:gpr"]
asm = "lock or [{src2}], {src}"

[[instructions]]
name = "XOR_MEM_R"
form = "MRR_MEM_PRE"
modrm = { rm = "[src2]" }
opcode = 0x31
fields = { prefix = 0xF0 }
ops = ["src:gpr", "src2:gpr"]
asm = "lock xor [{src2}], {src}"

[[instructions]]
name = "MOV_R_MEM"
form = "MRR_MEM"
# 按 vreg 基址读内存的能力（v20 变参 V4）：`dst ← [src]`，宽度随目标类自动。
modrm = { rm = "[src]" }
opcode = 0x8B
# v14：数据槽 gprx——内存 load 宽度由 IR 类型 auto（I16→66、I32→无
# REX.W、I64→REX.W）。固定 _32 变体已删（WA-35 DSL 修复）。
# 基址槽 gprx（assemble 兼容 EAX/RAX 视图；编码取同编号寻址）。
ops = ["dst:gprx:out", "src:gprx"]
asm = "mov {dst}, [{src}]"

[[instructions]]
name = "MOV_R_MEM_8"
modrm = { rm = "[src]" }
opcode = 0x8A
# 8 位内存 load：独立 opcode 8A（gprx 显式排除 gpr1——8 位 mov 是 8A 非
# 8B）。数据槽 gpr1b（byte_reg：spl/bpl/sil/dil 强制 REX）。
ops = ["dst:gpr1b:out", "src:gprx"]
asm = "mov {dst}, [{src}]"

[[instructions]]
name = "STORE_MEM_R"
form = "MRR_MEM"
modrm = { rm = "[src2]" }
opcode = 0x89
ops = ["src:gprx", "src2:gprx"]
asm = "mov [{src2}], {src}"

[[instructions]]
name = "STORE_MEM_R_8"
modrm = { rm = "[src2]" }
opcode = 0x88
ops = ["src:gpr1b", "src2:gprx"]
asm = "mov [{src2}], {src}"

[[instructions]]
name = "MOVSD_R_MEM"
form = "MRR_MEM_0F_FIX32"
modrm = { rm = "[src]" }
opcode = 0x10
fields = { prefix = 0xF2 }
# 按 vreg 基址读**浮点**的能力（v20 变参 V4）：`va_arg(ap, f64)` 取值用它
ops = ["dst:fpr:out", "src:gpr"]
asm = "movsd {dst}, [{src}]"

[[instructions]]
name = "MOVSD_MEM_R"
form = "MRR_MEM_0F_FIX32"
modrm = { rm = "[src2]" }
opcode = 0x11
fields = { prefix = 0xF2 }
ops = ["src:fpr", "src2:gpr"]
asm = "movsd [{src2}], {src}"

[[instructions]]
name = "MOV64_RR"
ref = "mov"
# 建立/恢复帧指针（v20 A4）：`mov rbp, rsp`（序言）/ `mov rsp, rbp`（尾声）。
roles = ["frame_set"]
form = "MRR_FIX64"
opcode = 0x89
# 与 MOV_RM_R（mov {1}, {0}）同模板同槽类型 → 生成期去重跳过（64 位经 MOV_RM_R 分发）。
ops = ["src:gpr", "dst:gpr:inout"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "MOV64_RM"
roles = ["stack_arg_load"]
form = "MRR_MEMREF"
modrm = { rm = "[mem]" }
opcode = 0x8B
ops = ["dst:gpr:out", "mem:mem"]
asm = "mov {dst}, {mem}"
# 被调方栈参数 load（v20 A5-3 起偏移来自 plan 的 ArgPlace::Stack{offset}，从 [fp+offset] 收第 5+ 参数）

[[instructions]]
name = "MOV64_MR"
roles = ["stack_arg_store"]
form = "MRR_MEMREF"
modrm = { rm = "[mem]" }
opcode = 0x89
ops = ["src:gpr", "mem:mem"]
asm = "mov {mem}, {src}"
# 调用方栈参数 store（v20 A5-3 起偏移来自 plan 的 caller_offset(k)，第 5+ 参数写 [sp+shadow+k*槽]）

# ── 内存形式的 mov（8/16/32 位，v20 V10 第七批）──────────────────────────────
#
# 已有几条各自都表示不了**完整内存模板**：
# - `MOV_R_MEM` / `MOV_R_MEM_8` / `STORE_MEM_R` / `STORE_MEM_R_8`：rm 引用的是 `reg`
#   槽（`[{src}]` 简写）——那是给 IR 降级用的 **vreg 基址**，文本里只认 `[RAX]`
#   （没有位移、没有索引、没有尺寸前缀）；
# - `MOV64_RM` / `MOV64_MR`：MemRef 风味但 `opsize = 64` 固定，只覆盖 64 位，
#   而且它们是 ABI 的 `stack_arg_load`/`stack_arg_store`，不能动。
# 于是真实汇编里最常见的 `mov eax, [rbx+8]`、`mov al, BYTE PTR [rbx]` 没有候选。
# 这里按 ALU 内存族同款形状补上（`MRR_MEMREF_AUTO` 的 `opsize = "s0"`：宽度由数据
# 寄存器驱动，16 → 66 前缀、32 → 无前缀；8 位是独立操作码 8A/88）。
#
# **不写 `ref`**（与 ALU 内存族同纪律）：IR 降级仍走 MOV_R_MEM/STORE_MEM_R（vreg
# 基址），候选集与运行期行为逐字节不动，JIT 矩阵不受影响。

[[instructions]]
name = "MOV_R_MEM_AUTO"
form = "MRR_MEMREF_AUTO"
modrm = { rm = "[mem]" }
opcode = 0x8B
ops = ["dst:gpr24:out", "mem:mem"]
asm = "mov {dst}, {mem}"

[[instructions]]
name = "STORE_MEM_R_AUTO"
form = "MRR_MEMREF_AUTO"
modrm = { rm = "[mem]" }
opcode = 0x89
ops = ["src:gpr24", "mem:mem"]
asm = "mov {mem}, {src}"

[[instructions]]
name = "MOV_R_MEM_8_AUTO"
form = "MRR_MEMREF_AUTO"
modrm = { rm = "[mem]" }
opcode = 0x8A
ops = ["dst:gpr1b:out", "mem:mem"]
asm = "mov {dst}, {mem}"

[[instructions]]
name = "STORE_MEM_R_8_AUTO"
form = "MRR_MEMREF_AUTO"
modrm = { rm = "[mem]" }
opcode = 0x88
ops = ["src:gpr1b", "mem:mem"]
asm = "mov {mem}, {src}"

# `movsxd r64, dword ptr [mem]`：已有的是**寄存器**源（`MOVSXD_R_RM`，`MRR_FIX64`），
# 内存源没有候选。源宽度由操作码 63 决定（dword），目标由 REX.W 决定（64 位），
# 所以这里用 `MRR_MEMREF`（opsize 64 固定），与寄存器版的 mod=3 分支互斥。
[[instructions]]
name = "MOVSXD_R_MEM"
form = "MRR_MEMREF"
modrm = { rm = "[mem]" }
opcode = 0x63
ops = ["dst:gpr:out", "mem:mem"]
asm = "movsxd {dst}, {mem}"

# `xchg [mem], r16/32/64`：已有的 `XCHG_MEM_R`（`MRR_MEM`）是 `[{reg}]` 简写风味
# ——**没有位移**。带位移的 `xchg [rbx+8], rax` 是真实代码里的常见写法（自旋锁/交换），
# 这里补 MemRef 风味；无位移的写法仍由声明在前的 `XCHG_MEM_R` 命中（同字节、同类型）。
[[instructions]]
name = "XCHG_MEM_R_AUTO"
form = "MRR_MEMREF_AUTO"
modrm = { rm = "[mem]" }
opcode = 0x87
ops = ["dst:gprx:inout", "mem:mem"]
asm = "xchg {mem}, {dst}"

[[instructions]]
name = "MOVSD_RM"
modrm = { rm = "[mem]" }
opsize = 32
escape = [0x0F]
prefix = "field"
opcode = 0x10
fields = { prefix = 0xF2 }
ops = ["dst:fpr:out", "mem:mem"]
asm = "movsd {dst}, {mem}"

[[instructions]]
name = "MOVSD_MR"
modrm = { rm = "[mem]" }
opsize = 32
escape = [0x0F]
prefix = "field"
opcode = 0x11
fields = { prefix = 0xF2 }
# 浮点写内存的能力（v20 变参 V4）：调用方把**浮点栈实参**写进传出区用它
# （`{ role = "stack_arg_store", class = "fpr" }`——与 MOV64_MR 的整数版分工）。
roles = [{ role = "stack_arg_store", class = "fpr" }]
ops = ["src:fpr", "mem:mem"]
asm = "movsd {mem}, {src}"

# ── 128 位 SSE 向量内存 load/store（≤16B Direct 向量（V128）值经栈槽
#    往返用——WA-37 D3：V128 值在 XMM 全宽，8B movsd/movss 会截断）。
#    MOVUPS：0F 10/11（无前缀，非对齐 16 字节）；register-indirect
#    （addr 寄存器值，与 Load/Store lowering 的 mov 形态一致——
#    StackAddr 先 lea 地址到寄存器）。──
[[instructions]]
name = "MOVUPS_128_R_MEM"
form = "MRR_MEM_0F_FIX32"
modrm = { rm = "[src]" }
opcode = 0x10
fields = { prefix = 0 }
ops = ["dst:fpr:out", "src:gpr"]
asm = "movups {dst}, [{src}]"

[[instructions]]
name = "MOVUPS_128_MEM_R"
form = "MRR_MEM_0F_FIX32"
modrm = { rm = "[src2]" }
opcode = 0x11
fields = { prefix = 0 }
ops = ["src:fpr", "src2:gpr"]
asm = "movups [{src2}], {src}"

# 128 位**MemRef 形式**（base+disp；spill 槽用——上面的 reg 基址形式 disp 恒 0，
# 表达不了 `[RBP - off]`）。与 MOVSD_RM/MR 同形，只是无 F2 前缀 = 16 字节。
[[instructions]]
name = "MOVUPS_RM"
modrm = { rm = "[mem]" }
opsize = 32
escape = [0x0F]
prefix = "field"
opcode = 0x10
fields = { prefix = 0 }
ops = ["dst:fpr:out", "mem:mem"]
asm = "movups {dst}, {mem}"

[[instructions]]
name = "MOVUPS_MR"
modrm = { rm = "[mem]" }
opsize = 32
escape = [0x0F]
prefix = "field"
opcode = 0x11
fields = { prefix = 0 }
ops = ["src:fpr", "mem:mem:out"]
asm = "movups {mem}, {src}"

# ── 标量浮点补齐（Phase 4：F32 内存标量、F32→整数、64 位转换、极值、舍入）──

[[instructions]]
name = "MOVSS_R_MEM"
