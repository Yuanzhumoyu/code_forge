# ── 一元读改写：`FE /digit`（r/m8）与 `FF /digit`（r/m16/32/64）───────────────
#
# 与 NOT/NEG 同族（`MRR_EXT_OP`：reg = 固定扩展码、rm = 目的操作数）。`inc`/`dec` 在
# 64 位模式下仍合法——只是 16 位的短编码（`40+r`..`4F`）在长模式里成了 REX 前缀，
# 所以只能用 `FF /0`、`FF /1`（8 位是 `FE /0`、`FE /1`）。
#
# 不写 `ref`：IR 降级不用它们（`+1`/`-1` 走 ADD/SUB 的立即数形式），只有汇编器入口需要。

[[templates]]
name = "INCDEC_RM"
body = { form = "MRR_EXT_OP", opcode = 0xFF, ops = ["dst:gprx:inout"] }
rows = [
  { inst = "INC_RM", modrm = { reg = 0, rm = "dst" }, asm = "inc {dst}" },
  { inst = "DEC_RM", modrm = { reg = 1, rm = "dst" }, asm = "dec {dst}" },
]

[[templates]]
name = "INCDEC_RM_8"
body = { form = "MRR_EXT_OP", opcode = 0xFE, ops = ["dst:gpr1b:inout"] }
rows = [
  { inst = "INC_RM_8", modrm = { reg = 0, rm = "dst" }, asm = "inc {dst}" },
  { inst = "DEC_RM_8", modrm = { reg = 1, rm = "dst" }, asm = "dec {dst}" },
]
[[instructions]]
name = "NOT_RM"
form = "MRR_EXT_OP"
modrm = { reg = 2, rm = "dst" }
opcode = 0xF7
# 目的槽用 `gprx`（16/32/64）：`not eax`/`not r16d` 是真实语料里的常态；原来固定 64 位。
ops = ["dst:gprx:inout"]
asm = "not {dst}"

# ── 一元族的**内存形态**（FF /0,/1 与 F7 /2../7）──
#
# 为什么模板里写死尺寸前缀（`not dword ptr {mem}`）而不是靠 `{size}` 提示：一元形态
# **没有寄存器操作数**，编码宽度无从上推——`{size}` 按设计只是给人读的冗余提示、不进
# MemRef（见 docs/reference/isa-dsl.md 的 `[conventions.mem]`）。写成字面量之后
# `dword ptr` 是**模板的一部分**：`not byte ptr [rax]` 不会命中这条（真汇编器同样要求
# 一元内存形态给尺寸提示），不会静默按 32 位编出来。其他宽度照这个形状加一行即可。
[[instructions]]
name = "NOT_MEM32"
form = "MRR_MEMREF_AUTO"
modrm = { reg = 2, rm = "[mem]" }
opcode = 0xF7
opsize = 32
ops = ["mem:mem:inout"]
asm = "not dword ptr {mem}"

[[instructions]]
name = "NEG_MEM32"
form = "MRR_MEMREF_AUTO"
modrm = { reg = 3, rm = "[mem]" }
opcode = 0xF7
opsize = 32
ops = ["mem:mem:inout"]
asm = "neg dword ptr {mem}"

[[instructions]]
name = "INC_MEM32"
form = "MRR_MEMREF_AUTO"
modrm = { reg = 0, rm = "[mem]" }
opcode = 0xFF
opsize = 32
ops = ["mem:mem:inout"]
asm = "inc dword ptr {mem}"

[[instructions]]
name = "DEC_MEM32"
form = "MRR_MEMREF_AUTO"
modrm = { reg = 1, rm = "[mem]" }
opcode = 0xFF
opsize = 32
ops = ["mem:mem:inout"]
asm = "dec dword ptr {mem}"

[[instructions]]
name = "MUL_MEM32"
form = "MRR_MEMREF_AUTO"
modrm = { reg = 4, rm = "[mem]" }
opcode = 0xF7
opsize = 32
effect = ["Write"]
# mul 隐式读 RAX 并写 RAX:RDX（128 位积）
implicit_regs = ["RAX", "RDX"]
ops = ["mem:mem"]
asm = "mul dword ptr {mem}"

[[instructions]]
name = "IMUL_MEM32"
form = "MRR_MEMREF_AUTO"
modrm = { reg = 5, rm = "[mem]" }
opcode = 0xF7
opsize = 32
