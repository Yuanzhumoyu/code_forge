# 地址算术能力（v20 变参 V4）：`dst += imm`——变参游标推进等生成器序列用它。
# `frame_free` 角色（v20 A4：序/尾声由生成器按角色发射）也挂在它上面——原先另有一条
# 只差 `dst:gpr`（64 位）的 `ADD64_R_IMM32` 专门承载该角色，两条 asm 文本完全相同，
