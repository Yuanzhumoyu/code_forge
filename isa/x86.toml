# ── ALU 立即数：`83 /n ib`（符号扩展 imm8）与 `81 /n id`（imm32）──
#
# 同一条汇编文本两条编码都合法，但**规范与上游（GAS/LLVM）都取短的**：
# `xor rax, 12` 是 `48 83 f0 0c`（4 字节）而不是 `48 81 f0 0c 00 00 00`（7 字节）。
# 两条的汇编文本相同 ⇒ 会撞上生成器的 `type_signature` 去重；签名里带上了立即数**值域**
# （`dsl/codegen/asm.rs`），因此两条都留在扫描候选里：按**声明序**先试 imm8s，
# 值放不进 imm8s（超 i8）再落回 imm32。
#
# 目的槽用 `gprx`（16/32/64 多宽度）：`xor eax, 12`、`add ax, -12` 这类写法在真实语料里
# 遍地都是，`81`/`83` 本来就按 opsize 前缀区分宽度。
#
# 这些 imm8s 形式**不带 `ref`**：IR 降级的候选集按 `ref` 建表，不给 ref 就不会被降级选中
# （降级仍走下面那条 `ref = "add"` 的 `ADD_R_IMM32`，编译器行为不变）；汇编文本照样认。

[[instructions]]
name = "ADD_R_IMM8S"
form = "MRR_EXT"
modrm = { reg = 0, rm = "dst" }
opcode = 0x83
imm = 8
ops = ["dst:gprx:inout", "imm:imm8s"]
asm = "add {dst}, {imm}"

[[instructions]]
name = "OR_R_IMM8S"
form = "MRR_EXT"
modrm = { reg = 1, rm = "dst" }
opcode = 0x83
imm = 8
ops = ["dst:gprx:inout", "imm:imm8s"]
asm = "or {dst}, {imm}"

[[instructions]]
name = "ADC_R_IMM8S"
form = "MRR_EXT"
modrm = { reg = 2, rm = "dst" }
opcode = 0x83
imm = 8
ops = ["dst:gprx:inout", "imm:imm8s"]
asm = "adc {dst}, {imm}"

[[instructions]]
name = "SBB_R_IMM8S"
form = "MRR_EXT"
modrm = { reg = 3, rm = "dst" }
opcode = 0x83
imm = 8
ops = ["dst:gprx:inout", "imm:imm8s"]
asm = "sbb {dst}, {imm}"

[[instructions]]
name = "AND_R_IMM8S"
form = "MRR_EXT"
modrm = { reg = 4, rm = "dst" }
opcode = 0x83
imm = 8
ops = ["dst:gprx:inout", "imm:imm8s"]
asm = "and {dst}, {imm}"

[[instructions]]
name = "SUB_R_IMM8S"
form = "MRR_EXT"
modrm = { reg = 5, rm = "dst" }
opcode = 0x83
imm = 8
ops = ["dst:gprx:inout", "imm:imm8s"]
asm = "sub {dst}, {imm}"

[[instructions]]
name = "XOR_R_IMM8S"
form = "MRR_EXT"
modrm = { reg = 6, rm = "dst" }
opcode = 0x83
imm = 8
ops = ["dst:gprx:inout", "imm:imm8s"]
asm = "xor {dst}, {imm}"

[[instructions]]
