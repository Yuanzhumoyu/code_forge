[[instructions]]
name = "DIV_RM"
form = "MRR_EXT_OP"
modrm = { reg = 6, rm = "src" }
opcode = 0xF7
effect = ["Write"]
# div 隐式读 RAX:RDX（128 位被除数）并写 RAX(商)/RDX(余数)
implicit_regs = ["RAX", "RDX"]
