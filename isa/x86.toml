# cvtsi2sd：32 位源（w=0）与 64 位源（w=1）合并——源槽多类 gprx + opsize=s1
# 驱动 REX.W（eax → 0、rax → 1），汇编器按操作数实际宽度自动分发。
[[instructions]]
name = "CVTSI2SD"
form = "SSE_RR"
opcode = 0x2A
fields = { prefix = 0xF2 }
opsize = "src"
rex_w = "auto"
ops = ["dst:fpr:out", "src:gprx"]
asm = "cvtsi2sd {dst}, {src}"

[[instructions]]
name = "CVTSD2SS"
form = "SSE_RR"
opcode = 0x5A
fields = { prefix = 0xF2, w = 0 }
# 变参取值时的"窄回"能力（v20 V4 + D5）：C/LLVM 的默认实参提升把 float 传成 double，
# `va_arg(ap, f32)` 得取 double 再窄回来——这条就是那一步（bits = 目的位宽）。
ops = ["dst:fpr:out", "src:fpr"]
asm = "cvtsd2ss {dst}, {src}"

[[instructions]]
name = "CVTSS2SD"
form = "SSE_RR"
opcode = 0x5A
fields = { prefix = 0xF3, w = 0 }
