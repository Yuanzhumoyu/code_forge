#:schema ../isa-dsl.schema.json

# ============================================================

# x86-64 — 变长语义键试点（迭代 3：ModRM/REX/opsize/SSE）

# ============================================================

#

# 迁移范围（与 v11 golden 逐字节对比）：

# - @modrm 家族 24 条（mod=11 寄存器形式；opsize 动态或固定 64）

# - @modrm_imm32 6 条（81 /digit + imm32）

# - @sse_rr 简单指令 23 条（0F escape + 固定前缀 + 固定 REX.W）

# 未迁移：@modrm_mem（内存寻址/SIB，迭代 3b）、@sse_rr 家族（opcodes 数组，

# 迭代 4 families）、VEX（迭代 4）、@op_rm/@cmovcc/@setcc/@mov_imm64 等。

#

# 变长 form 语义键（迭代 3）：

# - modrm = "rr"（ModRM mod=11：reg=操作数 0、rm=操作数 1）| "ext"

#   （reg=fields.ext 固定扩展码、rm=操作数 0）

# - opsize = "auto"（指令有 opsize 操作数：16 → 0x66 前缀、64 → REX.W=1）

#   | 数字（固定 opsize，无 opsize 操作数）

# - prefix = "field"（fields.prefix：SSE 的 66/F2/F3/0）| 数字（固定）

# - rex_w = "field"（fields.w 固定 REX.W 位）| "auto"（opsize==64）

# - imm = 32（尾部 imm32，符号扩展按槽）

# - 寄存器 = 组内索引 0-15（= x86 物理编号；REX.R/B 由索引高位自动推导）

# 非文本操作数：opsize 槽（kind = "opsize"）asm 无占位符，assemble 默认 64。


[meta]
name = "x86_64"
version = "13.0"
endian = "little"
mode = 64
case_insensitive_regs = true
# v13 语法键（缺省值与显式声明一致，此处显式化供文档/校验）
comment_char = "#"
label_suffix = ":"
mnemonic_case = "insensitive"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────
# GPR 四宽度视图共用物理编号 0-31（base_index=0）：同一物理寄存器的
# 8/16/32/64 位视图。opsize 由操作数寄存器宽度自动推导（Phase 2 起）。
# gpr8 不含 AH/CH/DH/BH（byte_reg 强制 REX，索引 4-7 恒为 SPL/BPL/SIL/DIL）。
# 索引 16-31 = **APX 的 EGPR**（r16..r31 四个宽度视图）：只有 REX2 前缀能编码，
# 编码器见到 ≥16 就改发 REX2（见 codegen/vlen.rs 的 `__rex2` 分支）。
[encoding]
kind = "prefix_scan"
max_len = 15

[reg.gpr8]
names = ["RAX","RCX","RDX","RBX","RSP","RBP","RSI","RDI",
         "R8","R9","R10","R11","R12","R13","R14","R15",
         "R16","R17","R18","R19","R20","R21","R22","R23",
         "R24","R25","R26","R27","R28","R29","R30","R31"]
# 分配池只到 r15：EGPR（r16..r31）**能编码不能分配**——本后端不假设跑它的 CPU 支持
# APX，ABI 也不认它们；分配器一用，JIT 产物在没有 APX 的机器上就是非法指令。
alloc_count = 16

[reg.gpr4]
base_index = 0
names = ["EAX","ECX","EDX","EBX","ESP","EBP","ESI","EDI",
         "R8D","R9D","R10D","R11D","R12D","R13D","R14D","R15D",
         "R16D","R17D","R18D","R19D","R20D","R21D","R22D","R23D",
         "R24D","R25D","R26D","R27D","R28D","R29D","R30D","R31D"]

[reg.gpr2]
base_index = 0
names = ["AX","CX","DX","BX","SP","BP","SI","DI",
         "R8W","R9W","R10W","R11W","R12W","R13W","R14W","R15W",
         "R16W","R17W","R18W","R19W","R20W","R21W","R22W","R23W",
         "R24W","R25W","R26W","R27W","R28W","R29W","R30W","R31W"]

[reg.gpr1]
base_index = 0
names = ["AL","CL","DL","BL","SPL","BPL","SIL","DIL",
         "R8B","R9B","R10B","R11B","R12B","R13B","R14B","R15B",
         "R16B","R17B","R18B","R19B","R20B","R21B","R22B","R23B",
         "R24B","R25B","R26B","R27B","R28B","R29B","R30B","R31B"]

[reg.fpr8]
base_index = 0
names = ["MM0","MM1","MM2","MM3","MM4","MM5","MM6","MM7"]

[reg.fpr16]
names = ["XMM0","XMM1","XMM2","XMM3","XMM4","XMM5","XMM6","XMM7",
         "XMM8","XMM9","XMM10","XMM11","XMM12","XMM13","XMM14","XMM15"]

# ModRM 约定：RBP(5)/R13(13) 作为基址在 mod=00 时是 RIP-rel/无基址——
# 强制 disp8=0 编码（与 v11 一致）

[reg.fpr32]
names = ["ZMM0","ZMM1","ZMM2","ZMM3","ZMM4","ZMM5","ZMM6","ZMM7",
         "ZMM8","ZMM9","ZMM10","ZMM11","ZMM12","ZMM13","ZMM14","ZMM15",
         "ZMM16","ZMM17","ZMM18","ZMM19","ZMM20","ZMM21","ZMM22","ZMM23",
         "ZMM24","ZMM25","ZMM26","ZMM27","ZMM28","ZMM29","ZMM30","ZMM31"]

# AVX-512 掩码寄存器（opmask，k0-k7；EVEX P2 aaa 位）
[reg.kreg8]
names = ["K0","K1","K2","K3","K4","K5","K6","K7"]
[conventions.modrm]
force_disp_base = [5, 13]

# v20 V10：内存操作数文本模板**列表**。第 0 条用于反汇编渲染（渲染必须唯一），
# 其余只在汇编解析时按列表序兜底——同一份 MemRef 的几种合法写法各写一条，
# 不必硬塞进同一条模板。
#   * {size} = 解析专用的尺寸前缀（QWORD PTR 之类），值不进 MemRef：宽度由操作数槽
#     /opsize 决定，前缀只是给人读的冗余提示；渲染时输出空串，所以
#     disassemble -> assemble 仍然闭合。关键字表见 size_keywords，大小写按
#     [meta].mnemonic_case（x86 = insensitive，qword ptr / QWORD PTR 都认）。
#   * GAS 的 Intel 方言把位移写在下标**前**（0x90909090[eax]），与 Intel 语法的
#     [eax+0x90909090] 是同一份数据的两种写法 → 单列第 1 条（{size} 可选，故它同时
#     覆盖带不带尺寸前缀两种写法）。
#   * **没写 {base} 的模板 = 无基址写法**（第 2 条）：x86 用它表示绝对地址
#     （movsd XMM5, [-8] → mod=00 + SIB.base=101 + disp32）。
[conventions.mem]
templates = [
  "{size}[{base}+{index}*{scale}+{disp}]",  # 第 0 条 = 渲染形态
  "{size}{disp}[{base}]",                   # GAS Intel 的 disp[base]
  "{size}[{disp}]",                         # **无基址**：只写地址（绝对寻址）
]
size_keywords = ["byte ptr", "word ptr", "dword ptr", "qword ptr", "xmmword ptr"]

# v13/v18-S3b：条件码表（**唯一一份**；jcc/setcc/cmovcc 的 cond 槽查它、
# 反汇编按码渲染、lowering 的 `{cc}` 按 ir 字段查它）。
#   键   = 汇编/反汇编可见的条件名（反汇编取同码里字母序最小者）
#   code = 编码（进 opcode 低 4 位）
#   ir   = 该名实现的 IR 整数条件（仅有符号/无符号比较的 10 个；纯别名省略）
[conventions.cond]
o   = { code = 0 }
no  = { code = 1 }
b   = { code = 2, ir = "ult" }
c   = { code = 2 }
nae = { code = 2 }
ae  = { code = 3, ir = "uge" }
nb  = { code = 3 }
nc  = { code = 3 }
e   = { code = 4, ir = "eq" }
z   = { code = 4 }
ne  = { code = 5, ir = "ne" }
nz  = { code = 5 }
be  = { code = 6, ir = "ule" }
na  = { code = 6 }
a   = { code = 7, ir = "ugt" }
nbe = { code = 7 }
s   = { code = 8 }
ns  = { code = 9 }
p   = { code = 10 }
pe  = { code = 10 }
np  = { code = 11 }
po  = { code = 11 }
l   = { code = 12, ir = "slt" }
nge = { code = 12 }
ge  = { code = 13, ir = "sge" }
nl  = { code = 13 }
le  = { code = 14, ir = "sle" }
ng  = { code = 14 }
g   = { code = 15, ir = "sgt" }
nle = { code = 15 }

# v13：变长解码前缀扫描表（缺省即此表；66/F0/F2/F3/67/REX 扫描集）
[[conventions.prefix_scan]]
byte = 0x66
effects = ["opsize16"]
[[conventions.prefix_scan]]
byte = 0xF0
effects = ["lock"]
[[conventions.prefix_scan]]
byte = 0xF2
effects = ["repne"]
[[conventions.prefix_scan]]
byte = 0xF3
effects = ["repe"]
[[conventions.prefix_scan]]
byte = 0x67
effects = ["addr32"]
[[conventions.prefix_scan]]
range = "0x40..0x4F"
effects = ["rex"]
# APX 的 REX2（`0xD5` + 1 字节 payload）：**吃两个字节**——payload 低 4 位是 REX
# 的低 4 位（W/R3/X3/B3），高位是 5 位寄存器字段的第 4 位（R4/X4/B4）+ M0。M0 取代
# `0F` escape 字节（M0=1 = 0F 映射），所以译码有两条 M0 分支（见 vlen.rs 的 `__m0`）。
# 64 位模式下 `0xD5` 没有别的含义（32 位模式的 `aad` 在长模式已删）。
[[conventions.prefix_scan]]
byte = 0xD5
effects = ["rex2"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "gpr"
kind = "reg"
class = "gpr8"
roles = "inout"

[[operand_slots]]
name = "gprx"
kind = "reg"
# 多宽度视图（16/32/64 位）——类型签名分发的核心：一个槽接纳宽度集合，
# 实际宽度由操作数寄存器决定（opsize auto 推导 66/REX.W 前缀）。
# 显式排除 8 位（gpr1）：8 位 mov 是不同 opcode（88 vs 8B），应声明为
# 独立 form 而非经由 gprx 误编码（garbage 防护）。
classes = ["gpr2", "gpr4", "gpr8"]
roles = "inout"

# 16/32 位（2/4 字节）——**不含 64 位**：64 位的内存 mov 是 ABI 的
# `MOV64_RM`/`MOV64_MR`（`opsize = 64` 固定，带 `stack_arg_*` 角色），
# 再收 64 位就是同一批字节的第二条候选（无冗余）。
[[operand_slots]]
name = "gpr24"
kind = "reg"
classes = ["gpr2", "gpr4"]
roles = "inout"

# 「8 位**字段**、64 位**名字**」的槽（v20 V10 加注）：SETCC 的 rm 是 8 位寄存器，
# 但 lowering 用的是承接布尔结果的 64 位 vreg（`xor {out}, {out}` 先清零，故低字节
# 即结果）——`SETCC_RM8 {out}, …` 的文本里必须是 `RAX` 这类 64 位名，改成 `gpr1`
# 会让所有 Cmp/Fcmp 降级当场汇编失败。真正的 8 位名字槽是下面的 `gpr1b`。
[[operand_slots]]
name = "gpr8"
kind = "reg"
class = "gpr8"
byte_reg = true
roles = "inout"

# 16 位寄存器操作数（movzx/movsx 16 位源等）
[[operand_slots]]
name = "gpr2"
kind = "reg"
class = "gpr2"
roles = "inout"


[[operand_slots]]
name = "gpr1b"
kind = "reg"
# 8 位寄存器操作数（SETCC 目标等）：索引 4-7（spl/bpl/sil/dil）无 REX 前缀
# 会被解码为 ah/ch/dh/bh，必须强制 REX（见 codegen REX 条件）。
class = "gpr1"
byte_reg = true
# `inout` = 8 位 ALU 的读改写（`add al, imm8` / `add byte ptr […], dl`）。
roles = "inout"
[[operand_slots]]
name = "fpr"
kind = "reg"
class = "fpr16"
roles = "inout"


[[operand_slots]]
name = "fpr32"
kind = "reg"
class = "fpr32"
roles = "inout"

[[operand_slots]]
name = "kreg"
kind = "reg"
class = "kreg8"
roles = "inout"

[[operand_slots]]
name = "imm32"
kind = "imm"
signed = true
width = 32
# 32 位立即数字段是**位模式**：`0x90909090` 与 `-1869574000` 是同一批字节，GAS/LLVM
# 两种写法都收。`wrap` 让汇编器额外接受无符号读数并规范化到有符号读数；解码/反汇编
# 渲染/边界检查仍用规范域（`-2^31..2^31-1`），所以 `add rax, -12` 的文本与字节不变。
wrap = true

[[operand_slots]]
name = "mem"
kind = "mem"
class = "gpr8"

[[operand_slots]]
name = "imm8"
kind = "imm"
signed = false
width = 8

# 符号扩展的 8 位立即数（`83 /n ib`）：**必须有符号**——CPU 把它符号扩展到操作数宽度，
# 所以 `0x80..0xff` 在这里是负数。`imm8`（无符号 8 位）是给位域类立即数用的
# （SSE `imm8` lane 索引、VEXTRACT 等），不能混用。
[[operand_slots]]
name = "imm8s"
kind = "imm"
signed = true
width = 8

# 无符号 16 位立即数（`ret imm16` / `retf imm16`）。
[[operand_slots]]
name = "imm16"
kind = "imm"
signed = false
width = 16

[[operand_slots]]
name = "imm64"
kind = "imm"
signed = false
width = 64

# 32 位寄存器操作数（`mov r32, imm32` 的 `B8+r id`：16/64 位的立即数宽度不同，
# 不能共用一个多宽度槽）。
[[operand_slots]]
name = "gpr4"
kind = "reg"
class = "gpr4"
roles = "inout"

[[operand_slots]]
name = "rel"
kind = "label"
signed = true
width = 32

[[operand_slots]]
name = "cond"
kind = "cond"
width = 8

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "MRR"            # @modrm：reg=op0, rm=op1, opsize auto
opsize = "out"

[[forms]]
name = "MRR_FIX64"      # @modrm：opsize 固定 64（恒 REX.W）
opsize = 64

[[forms]]
name = "MRR_0F"         # @modrm + 0F escape
opsize = "s0"
escape = [0x0F]

[[forms]]
name = "MRR_0F_NOOS"    # @modrm + 0F escape + 无 opsize（movzx/movsx：dest/src
                        # 宽度不同合法——8/16 位源零/符号扩展到 64，不做一致性检查）
prefix = "field"
rex_w = "field"
escape = [0x0F]

[[forms]]
name = "MRR_0F_FIX64"   # @modrm + 0F escape + opsize 固定 64（MOVQ 系列；prefix=field）
opsize = 64
escape = [0x0F]
prefix = "field"

[[forms]]
name = "MRR_0F_PREFIX"  # @modrm + 0F escape + 指令级 prefix（LZCNT/TZCNT/POPCNT 的 F3）
opsize = "s0"
escape = [0x0F]
prefix = "field"

[[forms]]
name = "MRR_EXT"        # @modrm_imm32：reg=fields.ext, rm=op0, imm32
opsize = "s0"
imm = 32

[[forms]]
name = "SSE_RR"         # @sse_rr：0F opcode /r，prefix=fields.prefix, w=fields.w
escape = [0x0F]
prefix = "field"
rex_w = "field"

[[forms]]
name = "EVEX_RR_MEMREF"   # EVEX 内存：reg=op0、MemRef op1；压缩位移 ×evex_disp_scale
evex = { map = "field", pp = "field", w = "field", l = "field", disp_scale = "field" }

[[forms]]
name = "EVEX_RRV"        # EVEX 三操作数（AVX-512）：reg=op0、vvvv=~op1、rm=op2；L'L 由 evex_l（0/1/2）
evex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "VEX_RRV"        # VEX 三操作数：reg=op0(dest)、rm=op2(src2)、vvvv=~op1(src1)
vex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "VEX_RR"         # VEX 两操作数：vvvv=0x0F（无源）
vex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "VEX_RR_MEMREF"  # VEX 内存形式：reg=op0(dest)、MemRef base/disp=op1（vmovaps xmm, [rax+disp]）
vex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "MRR_EXT_OP"       # @op_rm：F7 /digit（reg=fields.ext, rm=op0，无 imm）
opsize = "s0"

[[forms]]
name = "MRR_EXT_OP_FIX64" # @shift_reg：D3 /digit（rm=op0），opsize 固定 64（REX.W）
opsize = 64

[[forms]]
name = "MRR_MEM"          # [reg 基址 + disp 0]；无 escape（XCHG/MOV_R_MEM/STORE_MEM_R）
opsize = "s0"

[[forms]]
name = "MRR_MEM_PRE"      # 内存 + prefix=field、无 escape（LOCK 原子族 29/21/09/31）
opsize = "s0"
prefix = "field"

[[forms]]
name = "MRR_MEM_0F_FIX32" # 内存 + 0F + prefix=field + opsize 32（MOVSD 内存标量）
opsize = 32
escape = [0x0F]
prefix = "field"

[[forms]]
name = "MRR_MEMREF_AUTO"  # MemRef 内存（base/index/disp）+ opsize 由首个 Reg 操作数驱动
opsize = "s0"

[[forms]]
name = "MRR_MEMREF"       # MemRef 内存（base+disp）+ opsize 64（spill）
opsize = 64

[[instructions]]
name = "MOV_R_RM"
ref = "mov"
form = "MRR"
opcode = 0x8B
# v13-：与 MOV_RM_R/MOV64_RR 合并为同一助记符 `mov`——16/32/64 位寄存器
# 版本按实际类型自动分发（mov EAX,EBX → 8B 32 位无前缀、mov RAX,RBX →
# 89 D8、mov AX,BX → 66 8B）。gprx 显式排除 8 位（见槽声明）。
# v14：DSL 回填修复后 32 位值（I32）回填 GPR(4) 视图 → auto 32 位；固定
# 32 位变体 MOV_R_RM_32（mov32，FIX32 form）已删——32 位 lowering 统一走本指令。
ops = ["dst:gprx:out", "src:gprx"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "MOV_R8_RM8"
ref = "mov"
opcode = 0x8A
# v13：8 位 mov——gpr1b 槽（byte_reg 强制 REX：spl/bpl/sil/dil）。与 16/32/64 位
# 共享助记符 `mov`（`mov al, bl` → 8A C3）。gprx 显式排除 gpr1（防 8B 误编码）。
ops = ["dst:gpr1b:out", "src:gpr1b"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "MOV_RM_R"
ref = "mov"
form = "MRR"
opcode = 0x89
ops = ["src:gpr", "dst:gpr:inout"]
asm = "mov {dst}, {src}"
effect = ["Move"]

# 16/32 位的 **MR 形态**（`89 /r`）：`mov r/m16(r/m32), r16(r32)`。
#
# 汇编器**不选**它（16/32 位的 reg-reg 走上面的 `MOV_R_RM`/`8B`，与上游 LLVM 选的
# 形态不同但同义），声明它的理由是**解码**：上游编出的 `mov r16d, eax` 是
# `d5 10 89 c0`（EGPR 在 rm 字段），我们的解码器必须解得回来——否则语料对拍只能把
# 这条**合法编码**记成"字节差异"。与 64 位那对（`MOV_RM_R` / `MOV64_RR`）同一格局：
# 每条合法编码都要有人认领，认领方式就是把形态建全。
[[instructions]]
name = "MOV_RM_R_24"
ref = "mov"
form = "MRR"
opcode = 0x89
ops = ["src:gpr24", "dst:gpr24:inout"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "MOVSXD_R_RM"
ref = "movsxd"
form = "MRR_FIX64"
opcode = 0x63
# 源槽用 `gpr`（64 位）：lowering 的 `movsxd {out}, {0}` 送来的是 I32 **值**，而它住在
# 64 位值池寄存器里（`movsxd RAX, RBX` 是既有向量）。
ops = ["dst:gpr:out", "src:gpr"]
asm = "movsxd {dst}, {src}"

# 同一编码的第二个真实形态：`movsxd r64, r/m32` 在**真实汇编**里写 32 位名
# （`movsxd rax, r16d`、`movsxd r16, eax`）。与上面那条的差别只有源槽的类
# （`gpr4` vs `gpr`）——文本里的寄存器名不同，所以两条各自命中、互不歧义；
# 解码按声明序（先 64 位源那条），编码字节完全相同（`MRR_FIX64`）。
# 为什么不用一个多类槽收两边：`opsize = r64`（= 固定宽度要求）会对**多类** GPR 槽
# 过滤宽度 ⇒ `ecx`/`r16d` 全被拒；换成 `opsize = s0` 又会要求两个操作数同宽 ⇒
# `movsxd rax, ecx` 这种"64←32"的真实写法同样被拒。两条同编码指令是既有格局
# （`MOV_R_RM`/`MOV_RM_R`、`MOV64_RR` 那几对）。
[[instructions]]
name = "MOVSXD_R_RM32"
ref = "movsxd"
form = "MRR_FIX64"
opcode = 0x63
ops = ["dst:gpr:out", "src:gpr4"]
asm = "movsxd {dst}, {src}"

# RM_R 两地址算术/逻辑（ADD/SUB/XOR/AND/OR）：opsize 必须取 **inout 目的槽
# （s1）**，不能用 form MRR 缺省的 s0。s0 是 modrm.reg = 源操作数——lowering
# `add {1}, {out}` 把源绑定到 IR 的第二个操作数，其类型可比结果窄（forge-ir
# `TypeId::upcast` 允许混宽：`iadd(PTR, I32) -> PTR`）。取源宽度会发 32 位
# ADD，把 64 位指针高半清零 → 栈槽地址算术全线 SEGV（mini_c alloc_slot =
# `iadd(stack_addr, iconst_i32(-4))` 实证）。目的槽 = IR 结果值 XReg，其
# 类型恒为 upcast 结果（≥ 两操作数），故 s1 == 结果宽度 == 正确编码宽度。
[[instructions]]
name = "ADD_RM_R"
ref = "add"
form = "MRR"
opcode = 0x01
# v14：数据槽 gprx——宽度由 IR 类型 auto（I32→无 REX.W 32 位、I64→REX.W）。
# 固定 _32 变体已删（DSL 回填修复后同 opcode 由 66/REX.W 前缀分发——WA-35）。
ops = ["src:gprx", "dst:gprx:inout"]
asm = "add {dst}, {src}"

[[instructions]]
name = "SUB_RM_R"
ref = "sub"
form = "MRR"
opcode = 0x29
ops = ["src:gprx", "dst:gprx:inout"]
asm = "sub {dst}, {src}"

# IMUL 是 reg-form（目的 = op0 = modrm.reg）——form 缺省 s0 已是目的槽。
[[instructions]]
name = "IMUL_R_RM"
form = "MRR_0F"
opcode = 0xAF
ops = ["dst:gprx:out", "src:gprx"]
asm = "imul {dst}, {src}"

# 两操作数 `imul` 的**内存源**形态（`0F AF /r`，rm = 内存）。
# 与 `IMUL_R_RM` 同编码、同模板，只是 rm 是 MemRef——宽度由目的寄存器（`s0`）驱动，
# 所以 `imul ebx, dword ptr […]` 与 `imul rbx, qword ptr […]` 都成立。
[[instructions]]
name = "IMUL_R_MEM"
form = "MRR_MEMREF_AUTO"
escape = [0x0F]
modrm = { reg = "dst", rm = "[mem]" }
opcode = 0xAF
ops = ["dst:gprx:out", "mem:mem"]
asm = "imul {dst}, {mem}"

[[instructions]]
name = "XOR_RM_R"
ref = "xor"
form = "MRR"
opcode = 0x31
ops = ["src:gprx", "dst:gprx:inout"]
asm = "xor {dst}, {src}"

[[instructions]]
name = "AND_RM_R"
ref = "and"
form = "MRR"
opcode = 0x21
ops = ["src:gprx", "dst:gprx:inout"]
asm = "and {dst}, {src}"

[[instructions]]
name = "OR_RM_R"
ref = "or"
form = "MRR"
opcode = 0x09
ops = ["src:gprx", "dst:gprx:inout"]
asm = "or {dst}, {src}"

# CMP/TEST 只有两个源槽（没有 inout 目的槽可取宽度，IR 结果是 BOOL 不带操作数
# 宽度）→ `opsize = "max"`：取两操作数宽度的宽者 = `TypeId::upcast` 结果宽度。
# 取单槽（form MRR 缺省 s0 = modrm.reg）会按较窄者编码——`icmp(PTR, iconst_i32(0))`
# 发 32 位 CMP 只比低半，高半非 0 的指针与 null 判等为真（空指针检查失效）。
# 汇编文本仍要求两操作数同宽（`cmp RAX, EBX` 拒绝）——max 只放宽 IR 降级路径。
[[instructions]]
name = "CMP_RM_R"
ref = "cmp"
form = "MRR"
opcode = 0x39
opsize = "max"
ops = ["src:gprx", "src2:gprx"]
asm = "cmp {src2}, {src}"

[[instructions]]
name = "TEST_RM_R"
roles = ["test"]
form = "MRR"
opcode = 0x85
opsize = "max"
ops = ["src:gprx", "src2:gprx"]
asm = "test {src2}, {src}"

# ── 内存形式的 ALU 族（v20 V10）─────────────────────────────────────────────
#
# 与寄存器版**共用操作码**，区别只在 ModRM 的 mod（=11 走寄存器形式，≠11 走内存
# 形式）：`ADD_RM_R`（0x01）等只覆盖前者，这里补后者。两种 rm 风味在 x86 谱里早有
# 先例（`MOV_R_RM`/`MOV_R_MEM`、`MOV_RM_R`/`STORE_MEM_R`），不是新机制。
#
# 两族都**不写 `ref`**：IR 降级不发射内存形式的 ALU（目前只有汇编器入口需要它），
# 所以候选集不变、字节与运行期行为逐字节不动，JIT 矩阵不受影响。
#
# 名字用 x86 手册的形态名：`*_MR` = r/m ← r/m op r（目的在内存）；
# `*_R_MEM` = r ← r op r/m（源在内存）。宽度由旁边的寄存器驱动
# （`MRR_MEMREF_AUTO` 的 `opsize = "s0"`）——内存操作数自己不携带宽度语义。

[[templates]]
name = "ALU_MR"
body = { form = "MRR_MEMREF_AUTO", modrm = { rm = "[mem]" }, ops = ["src:gprx", "mem:mem:inout"] }
rows = [
  { inst = "ADD_MR",  opcode = 0x01, asm = "add {mem}, {src}" },
  { inst = "OR_MR",   opcode = 0x09, asm = "or {mem}, {src}" },
  { inst = "ADC_MR",  opcode = 0x11, asm = "adc {mem}, {src}" },
  { inst = "SBB_MR",  opcode = 0x19, asm = "sbb {mem}, {src}" },
  { inst = "AND_MR",  opcode = 0x21, asm = "and {mem}, {src}" },
  { inst = "SUB_MR",  opcode = 0x29, asm = "sub {mem}, {src}" },
  { inst = "XOR_MR",  opcode = 0x31, asm = "xor {mem}, {src}" },
  { inst = "CMP_MR",  opcode = 0x39, asm = "cmp {mem}, {src}", ops = ["src:gprx", "mem:mem"] },
]

[[templates]]
name = "ALU_R_MEM"
body = { form = "MRR_MEMREF_AUTO", modrm = { rm = "[mem]" }, ops = ["dst:gprx:out", "mem:mem"] }
rows = [
  { inst = "ADD_R_MEM", opcode = 0x03, asm = "add {dst}, {mem}" },
  { inst = "OR_R_MEM",  opcode = 0x0B, asm = "or {dst}, {mem}" },
  { inst = "ADC_R_MEM", opcode = 0x13, asm = "adc {dst}, {mem}" },
  { inst = "SBB_R_MEM", opcode = 0x1B, asm = "sbb {dst}, {mem}" },
  { inst = "AND_R_MEM", opcode = 0x23, asm = "and {dst}, {mem}" },
  { inst = "SUB_R_MEM", opcode = 0x2B, asm = "sub {dst}, {mem}" },
  { inst = "XOR_R_MEM", opcode = 0x33, asm = "xor {dst}, {mem}" },
  { inst = "CMP_R_MEM", opcode = 0x3B, asm = "cmp {src}, {mem}", ops = ["src:gprx", "mem:mem"] },
]

# ── 8 位 ALU 族（v20 V10）───────────────────────────────────────────────────
#
# x86 的 8 位算术是**独立操作码**（不是同一操作码换宽度前缀）：`00 /r`（r/m8 ←
# r/m8 op r8）、`02 /r`（r8 ← r8 op r/m8）、`80 /digit ib`（r/m8 ← r/m8 op imm8）。
# 寄存器槽用 `gpr1b`（class `gpr1` + `byte_reg = true`：SPL/BPL/SIL/DIL 强制 REX）。
#
# 与 16/32/64 位族一样**不写 `ref`**：IR 降级不发射 8 位 ALU（8 位值在 IR 里走显式
# 扩展），目前只有汇编器入口需要它。名字后缀 `_8` 沿用 `MOV_R_MEM_8` /
# `STORE_MEM_R_8` 的既有写法。

[[templates]]
name = "ALU8_MR"
body = { form = "MRR_MEMREF_AUTO", modrm = { rm = "[mem]" }, ops = ["src:gpr1b", "mem:mem:inout"] }
rows = [
  { inst = "ADD_MR_8", opcode = 0x00, asm = "add {mem}, {src}" },
  { inst = "OR_MR_8",  opcode = 0x08, asm = "or {mem}, {src}" },
  { inst = "ADC_MR_8", opcode = 0x10, asm = "adc {mem}, {src}" },
  { inst = "SBB_MR_8", opcode = 0x18, asm = "sbb {mem}, {src}" },
  { inst = "AND_MR_8", opcode = 0x20, asm = "and {mem}, {src}" },
  { inst = "SUB_MR_8", opcode = 0x28, asm = "sub {mem}, {src}" },
  { inst = "XOR_MR_8", opcode = 0x30, asm = "xor {mem}, {src}" },
  { inst = "CMP_MR_8", opcode = 0x38, asm = "cmp {mem}, {src}", ops = ["src:gpr1b", "mem:mem"] },
]

[[templates]]
name = "ALU8_R_MEM"
body = { form = "MRR_MEMREF_AUTO", modrm = { rm = "[mem]" }, ops = ["dst:gpr1b:out", "mem:mem"] }
rows = [
  { inst = "ADD_R_MEM_8", opcode = 0x02, asm = "add {dst}, {mem}" },
  { inst = "OR_R_MEM_8",  opcode = 0x0A, asm = "or {dst}, {mem}" },
  { inst = "ADC_R_MEM_8", opcode = 0x12, asm = "adc {dst}, {mem}" },
  { inst = "SBB_R_MEM_8", opcode = 0x1A, asm = "sbb {dst}, {mem}" },
  { inst = "AND_R_MEM_8", opcode = 0x22, asm = "and {dst}, {mem}" },
  { inst = "SUB_R_MEM_8", opcode = 0x2A, asm = "sub {dst}, {mem}" },
  { inst = "XOR_R_MEM_8", opcode = 0x32, asm = "xor {dst}, {mem}" },
  { inst = "CMP_R_MEM_8", opcode = 0x3A, asm = "cmp {src}, {mem}", ops = ["src:gpr1b", "mem:mem"] },
]

[[templates]]
name = "ALU8_RM_IMM8"
body = { form = "MRR_EXT", imm = 8, ops = ["dst:gpr1b:inout", "imm:imm8"] }
rows = [
  { inst = "ADD_RM8_IMM8", opcode = 0x80, modrm = { reg = 0, rm = "dst" }, asm = "add {dst}, {imm}" },
  { inst = "OR_RM8_IMM8",  opcode = 0x80, modrm = { reg = 1, rm = "dst" }, asm = "or {dst}, {imm}" },
  { inst = "ADC_RM8_IMM8", opcode = 0x80, modrm = { reg = 2, rm = "dst" }, asm = "adc {dst}, {imm}" },
  { inst = "SBB_RM8_IMM8", opcode = 0x80, modrm = { reg = 3, rm = "dst" }, asm = "sbb {dst}, {imm}" },
  { inst = "AND_RM8_IMM8", opcode = 0x80, modrm = { reg = 4, rm = "dst" }, asm = "and {dst}, {imm}" },
  { inst = "SUB_RM8_IMM8", opcode = 0x80, modrm = { reg = 5, rm = "dst" }, asm = "sub {dst}, {imm}" },
  { inst = "XOR_RM8_IMM8", opcode = 0x80, modrm = { reg = 6, rm = "dst" }, asm = "xor {dst}, {imm}" },
  { inst = "CMP_RM8_IMM8", opcode = 0x80, modrm = { reg = 7, rm = "dst" }, asm = "cmp {dst}, {imm}" },
]

[[instructions]]
