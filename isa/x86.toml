[[instructions]]
name = "MOV_REG_IMM64"
# 立即数 → 寄存器能力（v20 变参 V3）：变参 `va_start` 物化对象时要写宿主算好的初值；
# v20 V7 起也用于**变参元信息寄存器**（SysV 的 `%al`）：调用点按布局算出"用了几个向量
# 寄存器"再写进去——数字是运行期的，所以必须是"立即数 → 寄存器"这条能力。
data_width = 64
opcode_reg = 0xB8
rex_w = "always"
imm = 0x40
ops = ["dst:gpr:out", "imm:imm64"]
asm = "mov {dst}, {imm}"

# `mov r32, imm32`（`B8+r id`）：32 位**不**带 `rex_w`，立即数只需 4 字节
# （`mov eax, 0x1234` → `b8 34 12 00 00`）。**不给 `data_width`**：搬运表（v20 V8）
# 仍只认 64 位那条，编译器行为不变——这条补的是**汇编面**（真实语料里的常见写法，
# 也是 P1 时登记的 `mov eax, 0x1234` 缺口）。
[[instructions]]
name = "MOV_R_IMM32"
opcode_reg = 0xB8
opsize = 32
imm = 32
ops = ["dst:gpr4:out", "imm:imm32"]
asm = "mov {dst}, {imm}"

[[instructions]]
name = "BSWAP_R"
opcode_reg = 0xC8
rex_w = "always"
escape = [0x0F]

