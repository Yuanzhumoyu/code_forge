# ── 移位：按立即数（`D1 /n` 的 1、`C1 /n ib` 的一般计数）──
#
# `shl rax, 1` 的规范写法是 `D1 /4`（2 字节）；`C1 /4 01` 也合法但更长。两条模板
# （字面 `1` vs `{imm}`）不同，不撞 `type_signature`；`D1` 那条**声明在前**，
# `shl edi, 1` 先命中它（与上游 GAS/LLVM 的规范形式一致）。
# 目的槽 `gprx`：`shl edi, 1` 这类 32 位写法是真实语料里的常态。

[[instructions]]
name = "SHL_RM_ONE"
form = "MRR"
modrm = { reg = 4, rm = "dst" }
opcode = 0xD1
ops = ["dst:gprx:inout"]
asm = "shl {dst}, 1"

[[instructions]]
name = "SHR_RM_ONE"
form = "MRR"
modrm = { reg = 5, rm = "dst" }
opcode = 0xD1
ops = ["dst:gprx:inout"]
asm = "shr {dst}, 1"

[[instructions]]
name = "SAR_RM_ONE"
form = "MRR"
modrm = { reg = 7, rm = "dst" }
opcode = 0xD1
ops = ["dst:gprx:inout"]
asm = "sar {dst}, 1"

[[instructions]]
name = "SHL_RM_IMM8"
form = "MRR_EXT"
modrm = { reg = 4, rm = "dst" }
opcode = 0xC1
imm = 8
ops = ["dst:gprx:inout", "imm:imm8"]
asm = "shl {dst}, {imm}"

[[instructions]]
name = "SHR_RM_IMM8"
form = "MRR_EXT"
modrm = { reg = 5, rm = "dst" }
opcode = 0xC1
imm = 8
ops = ["dst:gprx:inout", "imm:imm8"]
asm = "shr {dst}, {imm}"

[[instructions]]
