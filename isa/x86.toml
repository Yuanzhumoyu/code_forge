# 迭代 6 续（JIT 矩阵补齐）——整数全量 lowering
# ════════════════════════════════════════════════════════════════

# ── Select(cond, then, else) = cond ? then : else（v11 修复版）──

[[lowering]]
op = "Select"
insts = [
    "TEST_RM_R {0}, {0}",
    "mov {out}, {2}",
    "CMOVCC_R_RM {out}, {1}, 5",
]

# ── Uextend：按源宽分派（movzx 合并助记符，源槽 gpr1b/gpr2 自动分发）──

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 8] }
insts = ["movzx {out}, {0}"]

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 16] }
insts = ["movzx {out}, {0}"]

[[lowering]]
op = "Rotl"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "ROL_RM {out}",
]

[[lowering]]
op = "Rotr"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "ROR_RM {out}",
]

[[lowering]]
op = "Smin"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 13"]

[[lowering]]
op = "Smax"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 14"]

[[lowering]]
op = "Umin"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 3"]

[[lowering]]
op = "Umax"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 6"]

# ── Abs：rd = |rs1|（neg + cmovl=12）──

[[lowering]]
op = "Abs"
insts = [
    "mov {g}, {0}",
    "NEG_RM {g}",
    "mov {out}, {0}",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {out}, {g}, 12",
]

# ── 前导/尾随零、popcount、字节交换 ──

[[lowering]]
op = "Clz"
# 32 位输入用 lzcntl（gpr32 类）；否则 64 位 lzcntq——否则 32 位输入
# 被零扩展后 lzcntq 返回 63 而非 31（u32::leading_zeros 错值）。
insts = ["mov {out}, {0}", "LZCNT_R {out}, {0}"]

[[lowering]]
op = "Ctz"
insts = ["mov {out}, {0}", "TZCNT_R {out}, {0}"]

[[lowering]]
op = "Popcnt"
insts = ["mov {out}, {0}", "POPCNT_R {out}, {0}"]

[[lowering]]
op = "Bswap"
insts = ["mov {out}, {0}", "BSWAP_R {out}"]

# ── 空指针判断 / Freeze / Trap / Fence ──

[[lowering]]
op = "IsNull"
insts = ["xor {out}, {out}", "TEST_RM_R {0}, {0}", "SETCC_RM8 {out}, 4"]

[[lowering]]
op = "IsNotNull"
insts = ["xor {out}, {out}", "TEST_RM_R {0}, {0}", "SETCC_RM8 {out}, 5"]

[[lowering]]
op = "Trap"
insts = ["UD2"]

[[lowering]]
op = "Fence"
insts = ["MFENCE"]

# ── Alloca：栈槽地址（current_alloca_offset）──

[[lowering]]
op = "Alloca"
insts = ["LEA_R64_SIB {out}, [RBP+{alloca}]"]

# ── 溢出 6 条：{out}=值、{out2}=flag（seto=0/setb=2）──

[[lowering]]
op = "SaddOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {out2}, 0",
]

[[lowering]]
op = "UaddOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {out2}, 2",
]

[[lowering]]
op = "SsubOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "sub {1}, {out}",
    "SETCC_RM8 {out2}, 0",
]

[[lowering]]
op = "UsubOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "sub {1}, {out}",
    "SETCC_RM8 {out2}, 2",
]

[[lowering]]
op = "SmulOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "IMUL_R_RM {out}, {1}",
    "SETCC_RM8 {out2}, 0",
]

[[lowering]]
op = "UmulOverflow"
insts = [
    "mov {out}, {0}",
    "IMUL_R_RM {out}, {1}",
    "xor {out2}, {out2}",
    "cmp {0}, {out}",
    "SETCC_RM8 {out2}, 2",
    "xor {g}, {g}",
    "TEST_RM_R {1}, {1}",
    "SETCC_RM8 {g}, 5",
    "and {g}, {out2}",
]

[[lowering]]
op = "SaddSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {g1}, 0",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFF",
    "MOV_REG_IMM64 {g3}, 0x80000000",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {g4}, {g2}, 9",
    "CMOVCC_R_RM {g4}, {g3}, 8",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g4}, 5",
]

[[lowering]]
op = "SaddSat"
when = { eq = ["rs1_width", 64] }
insts = [
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {g1}, 0",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFFFFFFFFFF",
    "MOV_REG_IMM64 {g3}, 0x8000000000000000",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {g4}, {g2}, 9",
    "CMOVCC_R_RM {g4}, {g3}, 8",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g4}, 5",
]

[[lowering]]
op = "UaddSat"
insts = [
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {g1}, 2",
    "MOV_REG_IMM64 {g2}, 0xFFFFFFFFFFFFFFFF",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g2}, 5",
]

[[lowering]]
op = "UsubSat"
insts = [
    "mov {out}, {0}",
