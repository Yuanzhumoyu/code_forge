# ── APX（REX2）向量：字节取自上游 LLVM 语料 `apx-rex2-format-intel.s` 的 CHECK 注释。
# 覆盖三条 REX2 发射路径：`+r`（B8+rd，寄存器进 **B4/B3**）、ModRM reg/rm（r16+ 在
# reg 或 rm 字段）、内存形式（base/index 是 EGPR）与 mandatory prefix（popcnt 的 F3
# 在 REX2 **之前**）。M0 位取代 `0F` 字节这一点由 popcnt / cmov / imul 三条覆盖。
