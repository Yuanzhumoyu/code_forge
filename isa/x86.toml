# ── 真实汇编写法：**条件码烘进 opcode**（助记符后缀）—— 见 asm/README.md 的缺口清单 ──
#
# 上游语料写的是 `cmovl eax, r16d` / `sete al`：助记符**自带条件**、没有 `cc` 操作数。
# 我们目前只建模了通用形态（`cmovcc {dst}, {src}, {cc}` / `setcc {dst}, {cc}`，供 lowering
# 使用）。两条路子都试过并被否决，原因记在这里（省得下轮重踩）：
#
# 1. `asm = "set{cc} {dst}"`（占位符嵌进助记符）：**扫描器按整个 token 匹配字面段**，
#    而 `sete` 是一个 token ⇒ 字面段 `"set"` 匹配不上。要支持就得让"紧贴操作数的
#    字面段"按 ident **前缀**匹配、余下部分由该操作数消费（改 asm.rs 扫描器；影响
#    所有 ISA，因此单独一轮做）。
# 2. 按条件码逐条声明（`SETE_RM8_B`，opcode 0x94）：**解码树不容许掩码边共存**——
#    通用形态的 `0F 9x` 是掩码边（掩码 0xF0），固定条件的 `0F 94` 落在同一掩码空间，
#    `check_dec_trie_overlaps` 直接拒；且这是**真**歧义（同一批字节对应两种 Inst 形状）。
#
# 语料里的 14 行（cmovl ×10、sete ×4）因此停在 `NoPrefix` 桶（"上游比我们全"），
# 不影响门禁（门禁只看 tail_mismatch）。

[[instructions]]
name = "ROUNDSD_I"
modrm = { reg = "dst", rm = "src" }
escape = [0x0F, 0x3A]
prefix = "field"
rex_w = "field"
imm = 8
opcode = 0x0B            # ROUNDSD = 66 0F 3A 0B /r ib（0A 是 ROUNDSS）
fields = { prefix = 0x66, w = 1 }
ops = ["dst:fpr:out", "src:fpr", "imm:imm8"]
asm = "roundsd {dst}, {src}, {imm}"
effect = ["Pure"]

