[[instructions]]
name = "NOP"

opcode = 0x90
asm = "nop"

# `nop r/m`（`0F 1F /0`）：不是空操作助记符的别名，而是**带操作数**的 NOP——Intel 明确
# 用它做多字节填充/对齐。寄存器形态（`nop r16d`）由寄存器驱动宽度；内存形态用字面
# `dword ptr`（同 `NOT_MEM32` 一族：一元形态没有寄存器可驱动宽度）。
[[instructions]]
name = "NOP_RM"
form = "MRR_EXT_OP"
escape = [0x0F]
modrm = { reg = 0, rm = "dst" }
opcode = 0x1F
ops = ["dst:gprx"]
asm = "nop {dst}"
effect = ["Pure"]

