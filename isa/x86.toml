effect = ["Pure"]

[[instructions]]
name = "MOVQ_FREG_XMM"
form = "MRR_0F_FIX64"
opcode = 0x7E
fields = { prefix = 0x66, w = 1 }
ops = ["dst:fpr:out", "src:fpr"]
asm = "movq {dst}, {src}"
effect = ["Pure"]

[[instructions]]
name = "MOVAPS_MR"
form = "MRR_0F_FIX64"
opcode = 0x29
fields = { prefix = 0, w = 0 }
ops = ["src:gpr", "src2:fpr"]
asm = "movaps {src}, {src2}"
effect = ["Write"]

[[instructions]]
name = "LZCNT_R"
form = "MRR_0F_PREFIX"
opcode = 0xBD
fields = { prefix = 0xF3, w = 0 }
# v14：槽 gprx——宽度由 IR 类型 auto（I32 输入 → 无 REX.W lzcntl 返回 31
# 位语义；I64 → REX.W lzcntq）。固定 _32 变体（LZCNT_R32）已删。
ops = ["dst:gprx:out", "src:gprx"]
asm = "lzcnt {dst}, {src}"
effect = ["Pure"]

[[instructions]]
name = "TZCNT_R"
form = "MRR_0F_PREFIX"
opcode = 0xBC
fields = { prefix = 0xF3, w = 0 }
ops = ["dst:gprx:out", "src:gprx"]
asm = "tzcnt {dst}, {src}"
effect = ["Pure"]

[[instructions]]
name = "POPCNT_R"
form = "MRR_0F_PREFIX"
opcode = 0xB8
fields = { prefix = 0xF3, w = 0 }
ops = ["dst:gprx:out", "src:gprx"]
asm = "popcnt {dst}, {src}"
effect = ["Pure"]

# ── 旋转（迭代 6 续：D3 /0 /1，CL 隐式计数；宽度按结果类型 32/64）──

[[instructions]]
name = "ROL_RM"
form = "MRR_EXT_OP"
modrm = { reg = 0, rm = "dst" }
opcode = 0xD3
effect = ["Pure"]
ops = ["dst:gprx:inout"]
asm = "rol {dst}"

[[instructions]]
name = "ROR_RM"
form = "MRR_EXT_OP"
modrm = { reg = 1, rm = "dst" }
opcode = 0xD3
effect = ["Pure"]
ops = ["dst:gprx:inout"]
asm = "ror {dst}"

# ============================================================
# 调用约定：v20 A5-3 起谱侧不再声明参数池/返回槽（`[abi]` 整节已下线）；
# ============================================================

[stack]
slot = 8
align = 16
fp_save = 8

# 位置计数规则（by-position：int/float 共享位置游标）自 v20 A5-3 起是**机器事实**，
# 写在 [machine].arg_slot（约定侧的正式位置是 AbiRules::position，进 plan 后优先）。

# Windows x64 栈参数布局（shadow = 32、被调方首个栈参偏移 = 2 槽）**已不在谱里声明**
# （v20 A5-3）：它随约定而变，归 `AbiRules`（`shadow_bytes` + `stack.first_offset_slots`），
# 引擎算成 plan 的 `CallLayout`；被调方按 `ArgPlace::Stack { offset }` 收参、调用方按
# `caller_offset(k)` 写参。谱侧只剩能力申报：`roles = ["stack_arg_load"/"stack_arg_store"]`。





# 溢出模板（基址 = RBP 帧指针）——**按值宽分档**（WA-46）：
# 旧实现只有一份 [spill.FPR]，模板是 8 字节 MOVSD，而生成器忽略 width 参数 ⇒
# 任何向量值被 spill 都只搬 8 字节（V128/V256/V512 高半区静默截断；CI 上
# `test_jit_v512_byref_param` 偶发 lane15 错即此因：高半是栈残留）。
# 现按宽度分档：FPR（≤8 字节标量，缺省）/ FPR16 / FPR32 / FPR64；
# 生成器按 `xreg.width()` 分派，>8 字节未声明模板 → **编译期 Unsupported**
#（fail-closed，不再退回 8 字节标量搬运）。
[spill.GPR]
load = "MOV64_RM {0}, {1}"
store = "MOV64_MR {0}, {1}"
base = "RBP"

[spill.FPR]
load = "MOVSD_RM {0}, {1}"
store = "MOVSD_MR {0}, {1}"
base = "RBP"

[spill.FPR16]
load = "MOVUPS_RM {0}, {1}"
store = "MOVUPS_MR {0}, {1}"
base = "RBP"

[spill.FPR32]
load = "VMOVUPS_RM {0}, {1}"
store = "VMOVUPS_MR {0}, {1}"
base = "RBP"

[spill.FPR64]
load = "VMOVUPS_ZMM_MEM {0}, {1}"
store = "VMOVUPS_ZMM_MR {0}, {1}"
base = "RBP"

# 序言/尾声（模板按指令操作数序绑定：MOV64_RR op0=src、op1=dest；
# MOV64_RR RSP, RBP = mov64rr rbp←rsp）
[emit]
align_pad = 0x90   # `.align` 伪指令填充字节 = NOP


# ── 重定位表（v18 S3d）：指令写 `reloc = "<名>"`，语义与绑定槽在此 ──
# x86 的全局地址用 10 字节移动绝对立即数：fixup = 指令末尾 imm64 的 8 字节，
# 宿主语义 = Absolute(8)（补丁宽度取自槽宽）。
[[reloc]]
name = "abs64"
semantics = "absolute"
slot = "imm64"

# ── 引用名（多态分派）：见各指令的 `ref`（S10e 的 [[aliases]] 已并入指令属性）──
[[lowering]]
op = "Iconst"
insts = ["MOV_REG_IMM64 {out}, {iconst}"]

# ADD_RM_R 语义 add {1}, {0}：dest=op1(inout)、src=op0(in)。
# Iadd:out = a + b → mov out,a; add out,b（{1} = 第二个 IR 操作数）
[[lowering]]
op = "Iadd"
insts = ["mov {out}, {0}", "add {1}, {out}"]

[[lowering]]
op = "Isub"
insts = ["mov {out}, {0}", "sub {1}, {out}"]

[[lowering]]
op = "Band"
insts = ["mov {out}, {0}", "and {1}, {out}"]

[[lowering]]
op = "Bor"
insts = ["mov {out}, {0}", "or {1}, {out}"]

[[lowering]]
op = "Bxor"
insts = ["mov {out}, {0}", "xor {1}, {out}"]

[[lowering]]
op = "Imul"
insts = ["mov {out}, {0}", "IMUL_R_RM {out}, {1}"]

[[lowering]]
op = "Icmp"
insts = ["xor {out}, {out}", "cmp {1}, {0}", "SETCC_RM8 {out}, {cc}"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 8] }
insts = ["MOVZX_R8_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 16] }
insts = ["MOVZX_R16_MEM {out}, [{0}]"]

# 向量（Direct 值）内存 load——WA-37 D3 全宽往返 + W3 宽向量：
# V128（16B）→ movups（0F 10 无前缀，16 字节非对齐）；V64（8B）
# → movsd（低 64 位即 V64 全值；V64 高半无意义）；V256（32B）→ vmovups
# ymm（VEX.256，vex_l=1）；V512（64B）→ vmovups zmm（EVEX，evex_l=2）。
# rd_vec = 结果向量类型字节数（非向量 None）——不误伤 64 位标量/I128 load。
# 宽向量的**硬件前提**由编译入口按字节数守卫（compiler.rs）：>32B 需
# AVX-512F（EVEX），无则显式拒绝（不发射本机无法执行的指令）。
[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 64] }
insts = ["VMOVUPS_512_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 32] }
insts = ["VMOVUPS_256_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 16] }
insts = ["MOVUPS_128_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 8] }
insts = ["MOVSD_R_MEM {out}, [{0}]"]

# 默认（非向量 / 未覆盖宽度）——8 字节 MOV。宽向量**不会**落到这里：
# 32B/64B 有上面的专用规则，其它 >16B 宽度由编译入口显式拒绝。
[[lowering]]
op = "Load"
insts = ["MOV_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_width", 8] }
insts = ["STORE_MEM_R_8 [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 64] }
insts = ["VMOVUPS_512_MEM_R [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 32] }
insts = ["VMOVUPS_256_MEM_R [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 16] }
insts = ["MOVUPS_128_MEM_R [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 8] }
insts = ["MOVSD_MEM_R [{0}], {1}"]

# 默认（非向量 / 未覆盖宽度）——8 字节 store；向量宽度同上（32B/64B 专用
# 规则，其它 >16B 宽度由编译入口显式拒绝）。
[[lowering]]
op = "Store"
insts = ["STORE_MEM_R [{0}], {1}"]

[[lowering]]
op = ["Copy", "Uextend", "Ireduce", "Freeze", "Ptrtoint", "Inttoptr"]
insts = ["mov {out}, {0}"]

# ── Sextend：按源宽分派——8/16 位源 movsx（0F BE/BF，源槽 gpr1b/gpr2
#    movsx 合并助记符自动分发），32 位源 movsxd。原实现恒 movsxd（读低
#    32 符号扩展）——I8 源 0xCE(movzx 206) 被扩成 +206 而非 -50（WA-36
#    i8 signed 值符号扩展实证）。──

[[lowering]]
op = "Sextend"
when = { eq = ["rs1_width", 8] }
insts = ["movsx {out}, {0}"]

[[lowering]]
op = "Sextend"
when = { eq = ["rs1_width", 16] }
insts = ["movsx {out}, {0}"]

[[lowering]]
op = "Sextend"
insts = ["movsxd {out}, {0}"]

[[lowering]]
op = "Bnot"
insts = ["mov {out}, {0}", "NOT_RM {out}"]

[[lowering]]
op = "StackAddr"
insts = ["LEA_R64_SIB {out}, [RBP+{off}]"]

# ── 移位（v11 语义：计数搬 RCX（CL 隐式计数）→ D3 /digit）──

[[lowering]]
op = "Ishl"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "SHL_RM_CL {out}",
]

[[lowering]]
op = "Ushr"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "SHR_RM_CL {out}",
]

[[lowering]]
op = "Sshr"
insts = [
    "movsxd {out}, {0}",
    "mov RCX, {1}",
    "SAR_RM_CL {out}",
]

# ── 除法（v11 语义：movsxd RAX,rs1 + cqo + idiv %t + mov rd,RAX/RDX）──

[[lowering]]
op = "Sdiv"
insts = [
    "mov {g}, {1}",
    "movsxd RAX, {0}",
    "CQO",
    "IDIV_RM {g}",
    "mov {out}, RAX",
]

[[lowering]]
op = "Srem"
insts = [
    "mov {g}, {1}",
    "movsxd RAX, {0}",
    "CQO",
    "IDIV_RM {g}",
    "mov {out}, RDX",
]

[[lowering]]
op = "Udiv"
insts = [
    "xor RDX, RDX",
    "mov RAX, {0}",
    "DIV_RM {1}",
    "mov {out}, RAX",
]

[[lowering]]
op = "Urem"
insts = [
    "xor RDX, RDX",
    "mov RAX, {0}",
    "DIV_RM {1}",
    "mov {out}, RDX",
]

