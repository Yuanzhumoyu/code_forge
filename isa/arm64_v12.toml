# ============================================================
# AArch64 (ARM64) — A64 — v12 语法（P1 迭代 A1：全链最小可信集）
# ============================================================
#
# 严格遵循 ARM A-profile A64 指令集定义（developer.arm.com DDI0602；
# A64 指令定宽 32 位小端字）。编码位段以官方文档为准；每条 opcode/
# 固定常量由本机 LLVM clang --target=aarch64-none-elf + llvm-objdump
# 逐字 oracle 校验（tests/arm64_v12_tests.rs 的 golden 来自该 oracle）。
#
# A1 实现（打通 编码/解码/汇编 全链的最小集，全部常量已 oracle 验证）：
#   NOP；ADD/ADDS/SUB/SUBS (immediate) × X/W；ADD/SUB (shifted register,
#   LSL#0 形式 = 三寄存器操作数) × X/W；B/BL（相对跳转）。
# A2+（后续迭代，逐个 oracle 验证后加入）：逻辑寄存器族、MOVZ/N/K、
#   CMP/CMN 别名、移位立即数、MADD/MSUB/SDIV/UDIV、CSEL、B.cond/CBZ、
#   内存 LD/ST 家族、ADR/ADRP、SP/XZR 语义、[abi]/[emit] 接入与 runner。

[meta]
name = "arm64_v12"
version = "0.1.0"
endian = "little"
mode = 64
default_inst_width = 32
case_insensitive_regs = true
comment_char = "#"
label_suffix = ":"
mnemonic_case = "insensitive"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────
# X0-X30（gpr8，64 位）与 W0-W30（gpr4，32 位）共享物理编号 0-30
# （A64 中 Xn/Wn 是同一寄存器组的不同宽度视图）。SP/XZR（31 号上下
# 文语义）后续迭代。

[reg.gpr8]
base_index = 0
names = [
    "X0","X1","X2","X3","X4","X5","X6","X7",
    "X8","X9","X10","X11","X12","X13","X14","X15",
    "X16","X17","X18","X19","X20","X21","X22","X23",
    "X24","X25","X26","X27","X28","X29","X30","SP",
]

[reg.gpr4]
base_index = 0
names = [
    "W0","W1","W2","W3","W4","W5","W6","W7",
    "W8","W9","W10","W11","W12","W13","W14","W15",
    "W16","W17","W18","W19","W20","W21","W22","W23",
    "W24","W25","W26","W27","W28","W29","W30","WSP",
]

# ─────────────────────── 命名位域（A64）───────────────────────
# 通用寄存器位域位置在全 A64 固定：Rd=[4:0]、Rn=[9:5]、Rm=[20:16]。

[conventions.bitfields]
rd    = { offset = 0,  width = 5 }
rn    = { offset = 5,  width = 5 }
rm    = { offset = 16, width = 5 }
imm12 = { offset = 10, width = 12 } # 加立即数（sh 在 [23:22]，A1 恒 0）
imm16 = { offset = 5,  width = 16 } # MOVZ/N/K 半字立即数（[20:5]）
hw    = { offset = 21, width = 2 }  # MOVZ/N/K 半字选择（A2 恒 0）
nbit  = { offset = 21, width = 1 }  # 逻辑族 NOT 位（BIC/ORN/EON=1）
# 顶层固定段：
#  - op8 = 位[31:24]（立即数 ALU 与寄存器 ALU 顶层 8 位；X(sf=1)/W(sf=0)
#    各自为不同 8 位常量，故 X/W 分立 family、opcode 各含 sf）
op8   = { offset = 24, width = 8 }
op9   = { offset = 23, width = 9 } # MOV 宽立即数族（含 bit23=1 的 100101）
#  - op6 = 位[31:26]（B/BL 的 6 位顶层常量；imm26 占 [25:0]）
op6   = { offset = 26, width = 6 }
imm26 = { offset = 0,  width = 26 } # B/BL 相对偏移（与 op6 互补覆盖全字）
word  = { offset = 0,  width = 32 } # 全字常量（NOP）
# A3 扩展
ra    = { offset = 10, width = 5 }   # MADD/MSUB 累加器
o0    = { offset = 15, width = 1 }   # madd=0 / msub=1
op2d  = { offset = 10, width = 6 }   # sdiv=000011 / udiv=000010（位[15:10]）
cond  = { offset = 12, width = 4 }   # CSEL/B.cond 条件码（A64：eq0..nv15）
csop2 = { offset = 10, width = 2 }   # CSEL 族 op2（sel=0 inc=1）
mtop  = { offset = 21, width = 11 }  # 乘除/条件族顶层 [31:21]（含 sf）
b16   = { offset = 16, width = 16 }  # BR/BLR/RET 顶层 [31:16]
imm19 = { offset = 5,  width = 19 }  # CBZ/CBNZ/B.cond 相对偏移（[23:5]）
cbop  = { offset = 24, width = 8 }   # CBZ/CBNZ 顶层（含 sf/op 位）
rt    = { offset = 0,  width = 5 }   # CBZ/CBNZ 测试寄存器 Rt=[4:0]

opc2  = { offset = 22, width = 2 }   # LS opc（00 store / 01 load / 10 符号载）
imm12s= { offset = 10, width = 12 }  # LDR/STR 无符号 imm12（与 ALU imm12 同段）
imm9  = { offset = 12, width = 9 }   # LDUR/STUR 符号偏移（真字节）
p6    = { offset = 26, width = 6 }   # LDP/STP 顶层 [31:26]（X=0x2A/W=0x0A）
idx3  = { offset = 22, width = 3 }   # LDP/STP index（100 off STP/101 off LDP）
rt2   = { offset = 10, width = 5 }   # LDP/STP 第二寄存器
imm7  = { offset = 15, width = 7 }   # LDP/STP 偏移（对元素，缩放单元）
# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "r64"
kind = "reg"
class = "gpr8"
roles = ["in", "out"]

[[operand_slots]]
name = "r32"
kind = "reg"
class = "gpr4"
roles = ["in", "out"]

[[operand_slots]]
name = "imm12u"
kind = "imm"
signed = false
width = 12

[[operand_slots]]
name = "imm16u"
kind = "imm"
signed = false
width = 16

[[operand_slots]]
name = "off26"
kind = "label"
signed = true
width = 26

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "ALUIMM"   # ADD(S)/SUB(S) (imm)：rd/rn/imm12（[23:22] sh=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "imm12"]

[[forms]]
name = "ALUREG"   # ADD/SUB (shifted reg, LSL#0)：rd/rn/rm
                  #（[15:10] imm6=0、[23:22] shift=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "MOVR"     # MOV 别名：rd/rm（rn 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rd", "rm"]

[[forms]]
name = "MOVW16"   # MOVZ/MOVN/MOVK：rd/imm16（顶层 [31:23] 常量，hw 经 fields）
opcode_field = "op9"
operand_fields = ["rd", "imm16"]

[[forms]]
name = "CMPIMM"   # CMP/CMN(imm)：rn/imm12（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "imm12"]

[[forms]]
name = "CMPREG"   # CMP(reg)：rn/rm（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "rm"]

[[forms]]
name = "BREL"     # B/BL：imm26（[31:26] 为 op6 常量）
opcode_field = "op6"
operand_fields = ["imm26"]

[[forms]]
name = "NOPF"     # 全字常量
opcode_field = "word"
operand_fields = []

# ─────────────────────────── 指令 ───────────────────────────
# op8 常量 = 该指令 (word>>24)&0xFF（oracle 实测）：
#   add  x,w=0x91/0x11、adds=0xB1/0x31、sub=0xD1/0x51、subs=0xF1/0x71
#   add(reg) x,w=0x8B/0x0B、sub(reg)=0xCB/0x4B
# op6：b=0x05（0x14000000>>26）、bl=0x25（0x94000000>>26）

# ── NOP（D503201F）──
[[instructions]]
name = "NOPFAM"
form = "NOPF"
opcode = 0xD503201F
asm = "nop"

# ── ADD/ADDS/SUB/SUBS (immediate) ──
# oracle 校验样本：add x5,x6,#42 = 9100A8C5；adds w5,w6,#42=3100A8C5；
#   sub x5,x6,#42=D100A8C5；subs x5,x6,#42=F100A8C5

[[instructions]]
name = "ADDIMMX"
roles = ["frame_free"]
form = "ALUIMM"
opcode = 0x91
ops = ["dst:r64:out", "src:r64", "imm:imm12u"]
asm = "add {dst}, {src}, #{imm}"

[[instructions]]
name = "ADDIMMW"
form = "ALUIMM"
opcode = 0x11
ops = ["dst:r32:out", "src:r32", "imm:imm12u"]
asm = "add {dst}, {src}, #{imm}"

[[instructions]]
name = "ADDSIMMX"
form = "ALUIMM"
opcode = 0xB1
ops = ["dst:r64:out", "src:r64", "imm:imm12u"]
asm = "adds {dst}, {src}, #{imm}"

[[instructions]]
name = "ADDSIMMW"
form = "ALUIMM"
opcode = 0x31
ops = ["dst:r32:out", "src:r32", "imm:imm12u"]
asm = "adds {dst}, {src}, #{imm}"

[[instructions]]
name = "SUBIMMX"
roles = ["frame_alloc"]
form = "ALUIMM"
opcode = 0xD1
ops = ["dst:r64:out", "src:r64", "imm:imm12u"]
asm = "sub {dst}, {src}, #{imm}"

[[instructions]]
name = "SUBIMMW"
form = "ALUIMM"
opcode = 0x51
ops = ["dst:r32:out", "src:r32", "imm:imm12u"]
asm = "sub {dst}, {src}, #{imm}"

[[instructions]]
name = "SUBSIMMX"
form = "ALUIMM"
opcode = 0xF1
ops = ["dst:r64:out", "src:r64", "imm:imm12u"]
asm = "subs {dst}, {src}, #{imm}"

[[instructions]]
name = "SUBSIMMW"
form = "ALUIMM"
opcode = 0x71
ops = ["dst:r32:out", "src:r32", "imm:imm12u"]
asm = "subs {dst}, {src}, #{imm}"

# ── ADD/SUB (shifted register, LSL#0) ──
# oracle 校验样本：add x5,x6,x2=8B0200C5；add w5,w6,w2=0B0200C5

[[instructions]]
name = "ADDREGX"
form = "ALUREG"
opcode = 0x8B
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "add {dst}, {src}, {src2}"

[[instructions]]
name = "ADDREGW"
form = "ALUREG"
opcode = 0x0B
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "add {dst}, {src}, {src2}"

[[instructions]]
name = "SUBREGX"
form = "ALUREG"
opcode = 0xCB
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "sub {dst}, {src}, {src2}"

[[instructions]]
name = "SUBREGW"
form = "ALUREG"
opcode = 0x4B
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "sub {dst}, {src}, {src2}"

# ADDS/SUBS (shifted reg, LSL#0)
# oracle：adds x5,x6,x7=AB0700C5、subs w5,w6,w7=6B0700C5

[[instructions]]
name = "ADDSREGX"
form = "ALUREG"
opcode = 0xAB
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "adds {dst}, {src}, {src2}"

[[instructions]]
name = "ADDSREGW"
form = "ALUREG"
opcode = 0x2B
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "adds {dst}, {src}, {src2}"

[[instructions]]
name = "SUBSREGX"
form = "ALUREG"
opcode = 0xEB
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "subs {dst}, {src}, {src2}"

[[instructions]]
name = "SUBSREGW"
form = "ALUREG"
opcode = 0x6B
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "subs {dst}, {src}, {src2}"

# ── B/BL ──
# oracle 校验样本：b .=14000000；bl .=94000000

[[instructions]]
name = "B"
form = "BREL"
opcode = 0x05
ops = ["target:off26"]
asm = "b {target}"

[[instructions]]
name = "BL"
form = "BREL"
opcode = 0x25
ops = ["target:off26"]
asm = "bl {target}"

# ── 逻辑寄存器 AND/BIC/ORR/ORN/EOR/EON（寄存器三操作数）──
# oracle：and x0,x1,x2=8A020020（W=0A…）、bic x6,x7,x8=8A2800E6（N 位=1）、
#   orr=AA/2A、orn x6,x7,x8=AA2800E6、eor=CA/4A、eon x6,x7,x8=CA2800E6

[[instructions]]
name = "ANDREGX"
form = "ALUREG"
opcode = 0x8A
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "and {dst}, {src}, {src2}"

[[instructions]]
name = "ANDREGW"
form = "ALUREG"
opcode = 0x0A
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "and {dst}, {src}, {src2}"

[[instructions]]
name = "BICREGX"
form = "ALUREG"
opcode = 0x8A
fields = { nbit = 1 }
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "bic {dst}, {src}, {src2}"

[[instructions]]
name = "BICREGW"
form = "ALUREG"
opcode = 0x0A
fields = { nbit = 1 }
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "bic {dst}, {src}, {src2}"

[[instructions]]
name = "ORRREGX"
form = "ALUREG"
opcode = 0xAA
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "orr {dst}, {src}, {src2}"

[[instructions]]
name = "ORRREGW"
form = "ALUREG"
opcode = 0x2A
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "orr {dst}, {src}, {src2}"

[[instructions]]
name = "ORNREGX"
form = "ALUREG"
opcode = 0xAA
fields = { nbit = 1 }
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "orn {dst}, {src}, {src2}"

[[instructions]]
name = "ORNREGW"
form = "ALUREG"
opcode = 0x2A
fields = { nbit = 1 }
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "orn {dst}, {src}, {src2}"

[[instructions]]
name = "EORREGX"
form = "ALUREG"
opcode = 0xCA
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "eor {dst}, {src}, {src2}"

[[instructions]]
name = "EORREGW"
form = "ALUREG"
opcode = 0x4A
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "eor {dst}, {src}, {src2}"

[[instructions]]
name = "EONREGX"
form = "ALUREG"
opcode = 0xCA
fields = { nbit = 1 }
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "eon {dst}, {src}, {src2}"

[[instructions]]
name = "EONREGW"
form = "ALUREG"
opcode = 0x4A
fields = { nbit = 1 }
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "eon {dst}, {src}, {src2}"

# ── MOV 别名（ORR rd, xzr, rm；X/W）──
# oracle：mov x9,x10=AA0A03E9、mov w9,w10=2A0A03E9（rn=31 常量）

[[instructions]]
name = "MOVX"
roles = ["gpr_mov"]
form = "MOVR"
opcode = 0xAA
fields = { rn = 31 }
ops = ["dst:r64:out", "src2:r64"]
asm = "mov {dst}, {src2}"

[[instructions]]
name = "MOVW"
form = "MOVR"
opcode = 0x2A
fields = { rn = 31 }
ops = ["dst:r32:out", "src2:r32"]
asm = "mov {dst}, {src2}"

# ── CMP/CMN（SUBS/ADDS/SUBS-REG 目标=xzr 别名；rd=31 常量）──
# oracle：cmp x0,#5=F100141F、cmp w0,#5=7100141F、cmn x0,#5=B100141F、
#   cmp x1,x2=EB02003F、cmp w1,w2=6B02003F

[[instructions]]
name = "CMPIMMX"
form = "CMPIMM"
opcode = 0xF1
fields = { rd = 31 }
ops = ["src:r64", "imm:imm12u"]
asm = "cmp {src}, #{imm}"

[[instructions]]
name = "CMPIMMW"
form = "CMPIMM"
opcode = 0x71
fields = { rd = 31 }
ops = ["src:r32", "imm:imm12u"]
asm = "cmp {src}, #{imm}"

[[instructions]]
name = "CMNIMMX"
form = "CMPIMM"
opcode = 0xB1
fields = { rd = 31 }
ops = ["src:r64", "imm:imm12u"]
asm = "cmn {src}, #{imm}"

[[instructions]]
name = "CMNIMMW"
form = "CMPIMM"
opcode = 0x31
fields = { rd = 31 }
ops = ["src:r32", "imm:imm12u"]
asm = "cmn {src}, #{imm}"

[[instructions]]
name = "CMPREGX"
form = "CMPREG"
opcode = 0xEB
fields = { rd = 31 }
ops = ["src:r64", "src2:r64"]
asm = "cmp {src}, {src2}"

[[instructions]]
name = "CMPREGW"
form = "CMPREG"
opcode = 0x6B
fields = { rd = 31 }
ops = ["src:r32", "src2:r32"]
asm = "cmp {src}, {src2}"

# ── MOVZ/MOVN/MOVK（hw=0 变体）──
# 顶层常量 = (word>>23)&0x1FF（[31:23]，含 bit23=1 的 100101）：
#   movz x0,#0=D2800000 → 0x1A5；movz w=0xA5；movn x=0x125；movn w=0x25；
#   movk x=0x1E5；movk w=0xE5

[[instructions]]
name = "MOVZX"
form = "MOVW16"
opcode = 0x1A5
fields = { hw = 0 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}"

[[instructions]]
name = "MOVZW"
form = "MOVW16"
opcode = 0xA5
fields = { hw = 0 }
ops = ["dst:r32:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}"

[[instructions]]
name = "MOVNX"
form = "MOVW16"
opcode = 0x125
fields = { hw = 0 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movn {dst}, #{imm}"

[[instructions]]
name = "MOVNW"
form = "MOVW16"
opcode = 0x25
fields = { hw = 0 }
ops = ["dst:r32:out", "imm:imm16u"]
asm = "movn {dst}, #{imm}"

[[instructions]]
name = "MOVKX"
form = "MOVW16"
opcode = 0x1E5
fields = { hw = 0 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movk {dst}, #{imm}"

[[instructions]]
name = "MOVKW"
form = "MOVW16"
opcode = 0xE5
fields = { hw = 0 }
ops = ["dst:r32:out", "imm:imm16u"]
asm = "movk {dst}, #{imm}"

# ─────────────────────────── 别名 ───────────────────────────

[[aliases]]
name = "and"
insts = ["ANDREGX", "ANDREGW"]

[[aliases]]
name = "bic"
insts = ["BICREGX", "BICREGW"]

[[aliases]]
name = "orr"
insts = ["ORRREGX", "ORRREGW"]

[[aliases]]
name = "orn"
insts = ["ORNREGX", "ORNREGW"]

[[aliases]]
name = "eor"
insts = ["EORREGX", "EORREGW"]

[[aliases]]
name = "eon"
insts = ["EONREGX", "EONREGW"]

[[aliases]]
name = "mov"
insts = ["MOVX", "MOVW"]

[[aliases]]
name = "movz"
insts = ["MOVZX", "MOVZW"]

[[aliases]]
name = "movn"
insts = ["MOVNX", "MOVNW"]

[[aliases]]
name = "movk"
insts = ["MOVKX", "MOVKW"]

[[aliases]]
name = "cmp"
insts = ["CMPIMMX", "CMPIMMW", "CMPREGX", "CMPREGW"]

[[aliases]]
name = "cmn"
insts = ["CMNIMMX", "CMNIMMW"]


# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "MULADD"   # MADD/MSUB：rd rn ra rm（位低→高）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "ra", "rm"]

[[forms]]
name = "MUL3"     # MUL 别名（ra=31 fields）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "DIV2A"    # SDIV/UDIV：rd rn rm（[15:10] op2d 经 fields）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "BRREG2"   # BR/BLR：rn（[31:16] b16 常量；[15:10]/[4:0] 零 guard）
opcode_field = "b16"
operand_fields = ["rn"]

[[forms]]
name = "RETF"     # RET：无操作数（rn=30 fields）
opcode_field = "b16"
operand_fields = []

[[forms]]
name = "CBZF"     # CBZ/CBNZ：rn + imm19
opcode_field = "cbop"
operand_fields = ["rt", "imm19"]

[[forms]]
name = "BCF"      # B.cond：imm19（cond 经 fields 常量）
opcode_field = "cbop"
operand_fields = ["imm19"]

[[forms]]
name = "CSEL4"    # CSEL 族：rd rn cond rm（位低→高；cond 在 rm 之下）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "cond", "rm"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "cond4"
kind = "imm"
signed = false
width = 4

[[operand_slots]]
name = "off19"
kind = "label"
signed = true
width = 19

# ── 乘法 MADD/MSUB/MUL（opcode_field=mtop [31:21]）──
# X madd word 9B020C20 → mtop=(>>21)&0x7FF=0x4D8；W=0xD8
# X msub 9B069CA4、W 1B069CA4（o0=1）；mul= madd ra=31（9B027C20/1B027C20）

[[instructions]]
name = "MADDX"
form = "MULADD"
opcode = 0x4D8
ops = ["dst:r64:out", "src:r64", "acc:r64", "src2:r64"]
asm = "madd {dst}, {src}, {src2}, {acc}"

[[instructions]]
name = "MADDW"
form = "MULADD"
opcode = 0xD8
ops = ["dst:r32:out", "src:r32", "acc:r32", "src2:r32"]
asm = "madd {dst}, {src}, {src2}, {acc}"

[[instructions]]
name = "MSUBX"
form = "MULADD"
opcode = 0x4D8
fields = { o0 = 1 }
ops = ["dst:r64:out", "src:r64", "acc:r64", "src2:r64"]
asm = "msub {dst}, {src}, {src2}, {acc}"

[[instructions]]
name = "MSUBW"
form = "MULADD"
opcode = 0xD8
fields = { o0 = 1 }
ops = ["dst:r32:out", "src:r32", "acc:r32", "src2:r32"]
asm = "msub {dst}, {src}, {src2}, {acc}"

[[instructions]]
name = "MULX"
form = "MUL3"
opcode = 0x4D8
fields = { ra = 31 }
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "mul {dst}, {src}, {src2}"

[[instructions]]
name = "MULW"
form = "MUL3"
opcode = 0xD8
fields = { ra = 31 }
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "mul {dst}, {src}, {src2}"

# ── 除法 SDIV/UDIV（op2d 区分）──
# sdiv x0,x1,x2=9AC20C20 → mtop=0x4D6、op2d=3；udiv=9AC20820 op2d=2（W 去 sf）

[[instructions]]
name = "SDIVX"
form = "DIV2A"
opcode = 0x4D6
fields = { op2d = 3 }
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "sdiv {dst}, {src}, {src2}"

[[instructions]]
name = "SDIVW"
form = "DIV2A"
opcode = 0xD6
fields = { op2d = 3 }
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "sdiv {dst}, {src}, {src2}"

[[instructions]]
name = "UDIVX"
form = "DIV2A"
opcode = 0x4D6
fields = { op2d = 2 }
ops = ["dst:r64:out", "src:r64", "src2:r64"]
asm = "udiv {dst}, {src}, {src2}"

[[instructions]]
name = "UDIVW"
form = "DIV2A"
opcode = 0xD6
fields = { op2d = 2 }
ops = ["dst:r32:out", "src:r32", "src2:r32"]
asm = "udiv {dst}, {src}, {src2}"

# ── BR/BLR/RET ──
# oracle：br x3=D61F0060、blr x3=D63F0060、ret=D65F03C0（rn=30 常量）

[[instructions]]
name = "BR"
form = "BRREG2"
opcode = 0xD61F
ops = ["src:r64"]
asm = "br {src}"

[[instructions]]
name = "BLR"
form = "BRREG2"
opcode = 0xD63F
ops = ["src:r64"]
asm = "blr {src}"

[[instructions]]
name = "RET"
roles = ["ret"]
effect = ["Ret"]
form = "RETF"
opcode = 0xD65F
fields = { rn = 30 }
asm = "ret"

# ── CBZ/CBNZ ×X/W ──
# oracle：cbz x0,.=B4000000、cbnz w1,.=35000001

[[instructions]]
name = "CBZX"
form = "CBZF"
opcode = 0xB4
ops = ["src:r64", "target:off19"]
asm = "cbz {src}, {target}"

[[instructions]]
name = "CBZW"
form = "CBZF"
opcode = 0x34
ops = ["src:r32", "target:off19"]
asm = "cbz {src}, {target}"

[[instructions]]
name = "CBNZX"
form = "CBZF"
opcode = 0xB5
ops = ["src:r64", "target:off19"]
asm = "cbnz {src}, {target}"

[[instructions]]
name = "CBNZW"
form = "CBZF"
opcode = 0x35
ops = ["src:r32", "target:off19"]
asm = "cbnz {src}, {target}"

# ── CSEL 族（cond 数值槽；位低→高 rd rn cond rm）──
# 布局：sf op 0 11010100 00 Rm cond op2 1 1 Rn Rd
#   csel：op=0、op2=0（X mtop: 9A820020 >>21=0x4D4? oracle 推：见下方逐条）
#   csinc op2=1、csinv op=1 op2=0、csneg op=1 op2=1
# oracle 实测字：csel x0,x1,x2,eq=9A820020、csinc x0,x1,x2,eq=9A820420、
#   csinv x4,x5,x6,ne=DA8610A4、csneg w4,w5,w6,gt=5A86C4A4

[[instructions]]
name = "CSELX"
form = "CSEL4"
opcode = 0x4D4
ops = ["dst:r64:out", "src:r64", "condx:cond4", "src2:r64"]
asm = "csel {dst}, {src}, {src2}, #{condx}"

[[instructions]]
name = "CSELW"
form = "CSEL4"
opcode = 0xD4
ops = ["dst:r32:out", "src:r32", "condx:cond4", "src2:r32"]
asm = "csel {dst}, {src}, {src2}, #{condx}"

[[instructions]]
name = "CSINCX"
form = "CSEL4"
opcode = 0x4D4
fields = { csop2 = 1 }
ops = ["dst:r64:out", "src:r64", "condx:cond4", "src2:r64"]
asm = "csinc {dst}, {src}, {src2}, #{condx}"

[[instructions]]
name = "CSINCW"
form = "CSEL4"
opcode = 0xD4
fields = { csop2 = 1 }
ops = ["dst:r32:out", "src:r32", "condx:cond4", "src2:r32"]
asm = "csinc {dst}, {src}, {src2}, #{condx}"

[[instructions]]
name = "CSINVX"
form = "CSEL4"
opcode = 0x6D4
ops = ["dst:r64:out", "src:r64", "condx:cond4", "src2:r64"]
asm = "csinv {dst}, {src}, {src2}, #{condx}"

[[instructions]]
name = "CSINVW"
form = "CSEL4"
opcode = 0x2D4
ops = ["dst:r32:out", "src:r32", "condx:cond4", "src2:r32"]
asm = "csinv {dst}, {src}, {src2}, #{condx}"

[[instructions]]
name = "CSNEGX"
form = "CSEL4"
opcode = 0x6D4
fields = { csop2 = 1 }
ops = ["dst:r64:out", "src:r64", "condx:cond4", "src2:r64"]
asm = "csneg {dst}, {src}, {src2}, #{condx}"

[[instructions]]
name = "CSNEGW"
form = "CSEL4"
opcode = 0x2D4
fields = { csop2 = 1 }
ops = ["dst:r32:out", "src:r32", "condx:cond4", "src2:r32"]
asm = "csneg {dst}, {src}, {src2}, #{condx}"

# ── B.cond（cond 数值槽）──
# oracle：b.eq .=54000000；b.ne 8 = 54000041（imm19=2）

[[instructions]]
name = "BCOND"
form = "CBZF"
opcode = 0x54
fields = { cond = 0 }
ops = ["target:off19"]
asm = "b.eq {target}"

