# ═════════════════════════════ A4：加载/存储（最小集） ═══════════════════════════
# LDR/STR 无符号 imm12：size[31:30] 111 001 opc[23:22] imm12[21:10] Rn Rt
#   top8: X=0xF9、W=0xB9、H=0x79、B=0x39；opc2: STR=0、LDR=1
# LDUR/STUR 未缩放：size 111 000 opc imm9[20:12] Rn Rt
#   top8: X=0xF8、W=0xB8、H=0x78、B=0x38；opc2: STUR=0、LDUR=1
# ⚠️ 无符号 imm12 语义=**缩放单元**（编码存 imm12；真实字节偏移=imm12<<scale）：
#   DSL 无 encode 变换钩子，asm 文本与 golden 用缩放值；P2 帧/ABI 由后端换算。

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "LSUI"     # LDR/STR(unsigned)：rt rn imm12s
opcode_field = "op8"
operand_fields = ["rt", "rn", "imm12s"]

[[forms]]
name = "LSUN"     # LDUR/STUR：rt rn imm9
opcode_field = "op8"
operand_fields = ["rt", "rn", "imm9"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "imm9s"
kind = "imm"
signed = true
width = 9

[[operand_slots]]
name = "imm7u"
kind = "imm"
signed = false
width = 7

# ─────────────────────────── 指令 ───────────────────────────

[[instructions]]
name = "LDRX"
form = "LSUI"
opcode = 0xF9
fields = { opc2 = 1 }
ops = ["dst:r64:out", "base:r64", "imm:imm12u"]
asm = "ldr {dst}, [{base}, #{imm}]"

[[instructions]]
name = "LDRW"
form = "LSUI"
opcode = 0xB9
fields = { opc2 = 1 }
ops = ["dst:r32:out", "base:r64", "imm:imm12u"]
asm = "ldr {dst}, [{base}, #{imm}]"

[[instructions]]
name = "STRX"
form = "LSUI"
opcode = 0xF9
fields = { opc2 = 0 }
ops = ["src:r64", "base:r64", "imm:imm12u"]
asm = "str {src}, [{base}, #{imm}]"

[[instructions]]
name = "STRW"
form = "LSUI"
opcode = 0xB9
fields = { opc2 = 0 }
ops = ["src:r32", "base:r64", "imm:imm12u"]
asm = "str {src}, [{base}, #{imm}]"

[[instructions]]
name = "LDURX"
form = "LSUN"
opcode = 0xF8
fields = { opc2 = 1 }
ops = ["dst:r64:out", "base:r64", "off:imm9s"]
asm = "ldur {dst}, [{base}, #{off}]"

[[instructions]]
name = "LDURW"
form = "LSUN"
opcode = 0xB8
fields = { opc2 = 1 }
ops = ["dst:r32:out", "base:r64", "off:imm9s"]
asm = "ldur {dst}, [{base}, #{off}]"

[[instructions]]
name = "STURX"
form = "LSUN"
opcode = 0xF8
fields = { opc2 = 0 }
ops = ["src:r64", "base:r64", "off:imm9s"]
asm = "stur {src}, [{base}, #{off}]"

[[instructions]]
name = "STURW"
form = "LSUN"
opcode = 0xB8
fields = { opc2 = 0 }
ops = ["src:r32", "base:r64", "off:imm9s"]
asm = "stur {src}, [{base}, #{off}]"

# ── 别名 ──

[[aliases]]
name = "ldr"
insts = ["LDRX", "LDRW"]

[[aliases]]
name = "str"
insts = ["STRX", "STRW"]

[[aliases]]
name = "ldur"
insts = ["LDURX", "LDURW"]

[[aliases]]
name = "stur"
insts = ["STURX", "STURW"]

# ═════════════════════════════ A5：寄存器对 LDP/STP（offset） ═══════════════════════════
# 布局：opc[31:30] 101 index[24:22] imm7[21:15] Rt2[14:10] Rn Rt
#   X 对 top6=0x2A（opc=10）、W 对=0x0A（opc=00）；index: STP=4/LDP=5
# oracle：stp x0,x1,[x2]=A9000440、ldp x0,x1,[x2]=A9400440、
#   ldp x2,x3,[x4,#16]=A9410C82（imm7=2 缩放）、stp w0,w1,[x2]=29000440、
#   ldp w0,w1,[x2,#8]=29410440（imm7=1）
# ⚠️ imm7 语义=**对元素缩放单元**（X 对 ×8、W 对 ×4），asm/golden 存缩放值

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "PAIR"     # LDP/STP：rt rn rt2 imm7（位低→高）
opcode_field = "op8"
operand_fields = ["rt", "rn", "rt2", "imm7"]

# ─────────────────────────── 指令 ───────────────────────────

[[instructions]]
name = "STPX"
form = "PAIR"
opcode = 0xA9
fields = { idx3 = 4 }
ops = ["t1:r64", "base:r64", "t2:r64", "imm:imm7u"]
asm = "stp {t1}, {t2}, [{base}, #{imm}]"

[[instructions]]
name = "LDPX"
form = "PAIR"
opcode = 0xA9
fields = { idx3 = 5 }
ops = ["t1:r64:out", "base:r64", "t2:r64:out", "imm:imm7u"]
asm = "ldp {t1}, {t2}, [{base}, #{imm}]"

[[instructions]]
name = "STPW"
form = "PAIR"
opcode = 0x29
fields = { idx3 = 4 }
ops = ["t1:r32", "base:r64", "t2:r32", "imm:imm7u"]
asm = "stp {t1}, {t2}, [{base}, #{imm}]"

[[instructions]]
name = "LDPW"
form = "PAIR"
opcode = 0x29
fields = { idx3 = 5 }
ops = ["t1:r32:out", "base:r64", "t2:r32:out", "imm:imm7u"]
asm = "ldp {t1}, {t2}, [{base}, #{imm}]"

# ── 别名 ──

[[aliases]]
name = "stp"
insts = ["STPX", "STPW"]

[[aliases]]
name = "ldp"
insts = ["LDPX", "LDPW"]

# ════════════════════════════════════════════════════════════
# B2：接入 TargetMachine（AAPCS64 子集 + 帧 + lowering）
# ════════════════════════════════════════════════════════════
# 帧/ABI 事实（AAPCS64）：
#   sp = X31（Reg::SP）、fp = X29、lr = X30（return address）；
#   参数 a0-a7 = X0-X7；返回 x0；callee-saved = X19-X28 + fp + lr；
#   scratch = X16/X17（IP0/IP1，spill 用）；X18 平台寄存器保留。
# 帧布局镜像 riscv64_v12 的 fp-inside：sub sp → 存 lr/fp 到
# [sp+frame-8]/[sp+frame-16] → fp=sp+frame → @push_callee（X19-X28
# 按需保存到 [sp+frame-16-(k+1)*8]）→ @move_args。
# ⚠️ imm 语义说明：本 DSL 无 encode 变换钩子——A64 的 LDR/STR 无符号
# imm12 与 LDP/STP imm7 都是"缩放单元"（真实字节偏移 = imm << scale），
# 帧/ABI 层一律改用 **LDUR/STUR（imm9 真字节偏移，±256）** 保证字节
# 语义正确；帧 ≥ ~256B 时 imm9 越界 → encode 报错（显式失败不静默截断）。

[abi]
stack_align = 16
scratch = ["X16", "X17"]
# regalloc 不可分配：X18 = 平台寄存器；X30 = lr（BL 返回地址/prologue
# 保存）——不排除会被分配出垃圾值（覆盖返回地址 → ret 跳错）。
reserved = ["X18", "X30"]

# 返回寄存器（x0）；Return lowering 的返回值移动目标
ret_regs = ["X0"]

# Call 返回地址寄存器（BL 写 X30；P1 尚未有 Call lowering 规则）
call_ret_reg = "X30"

# Call 点被调用方破坏的寄存器（regalloc clobber 集）：AAPCS64 caller-saved
# = X0-X18 + lr(X30)。X19-X28 由 @push_callee 保存 → 不在 clobber 集。
call_clobbers = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7", "X8", "X9", "X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17", "X18", "X30"]

[[abi.arg_class]]
class = "int"
regs = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7"]

[abi.frame]
sp = "SP"
fp = "X29"
# @frame_alloc = SUB SP, SP, #frame（SUB 自带减号语义 → 无需 alloc_neg）
alloc_neg = false
# fp-inside：lr/fp 保存槽在帧内顶部（fp_push_bytes=16 = X30+X29 两槽）；
# min_frame = 16 + Σcallee_saved×8 = 96 由运行期推导（frame_layout_info）。
layout = "fp-inside"
fp_push_bytes = 16

[abi.callee_saved]
# X19-X28（fp/lr 由 fp_push 区显式存取，不入表）：@push_callee/@pop_callee
# 用 [spill.GPR] store/load 模板（STURX/LDURX）保存到 [sp+frame-16-(k+1)*8]。
gpr = ["X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27", "X28"]

[spill.GPR]
# base = X29（fp = 入口 sp，帧顶固定）：emission 的 sp_base = -(frame)
# 是相对帧指针的偏移（spill 槽在帧内底部 [fp - frame + off]，递归各帧
# 独立）；用 STUR/LDUR 真字节偏移（imm9 符号 ±256——与 riscv LD/SD 的
# signed imm12 同角色，帧 > ~256B 报错为已知限制）。
load = "LDURX {0}, X29, {1}"
store = "STURX {0}, X29, {1}"
base = "X29"

[emit]
align_pad = 0
# 独立尾声标签关闭：arm64 B 是定宽 imm26（label 槽需 reloc patcher 位段
# 重排，P1 尚未接入 A64 patcher）→ return block 直接 fall-through 到
# 函数末尾的尾声（RET）——仅单 return block 函数安全（P1 tm 测试满足；
# 多 return / 跨块分支函数需 B+B.cond 角色与 Arm64RelocPatcher，后置）。
epilogue_label = false

[emit.prologue]
insts = [
    "@frame_alloc",
    "STURX X30, SP, {frame_size_m8}",
    "STURX X29, SP, {frame_size_m16}",
    "ADDIMMX X29, SP, {frame_size}",
    "@push_callee",
    "@move_args",
]

[emit.epilogue]
insts = [
    "@pop_callee",
    "LDURX X30, SP, {frame_size_m8}",
    "LDURX X29, SP, {frame_size_m16}",
    "@frame_free",
    "RET",
]

# ─────────────────────── lowering（64 位主；32 位 W 变体按 rs1_width）───────────────────────
# 覆盖 op 集 = P1 tm 测试所需最小集（SUPPORTED_OPS 由此唯一集派生）。

[[lowering]]
op = "Iadd"
when = { eq = ["rs1_width", 32] }
insts = ["ADDREGW {out}, {0}, {1}"]

[[lowering]]
op = "Iadd"
insts = ["ADDREGX {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
when = { eq = ["rs1_width", 32] }
insts = ["SUBREGW {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
insts = ["SUBREGX {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
when = { eq = ["rs1_width", 32] }
insts = ["MULW {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
insts = ["MULX {out}, {0}, {1}"]

# Iconst：小值（0..0xFFFF）→ 单条 MOVZ {out}, #imm16。大值/负值需
# movz+movk(hw 1..3)/movn 多序列——hw 变体指令与值域分派后置（P1 约束：
# 超出 imm16u 值域在 encode 期显式报错，不静默截断）。
[[lowering]]
op = "Iconst"
when = { eq = ["rd", 64] }
insts = ["MOVZX {out}, {iconst}"]

[[lowering]]
op = "Iconst"
insts = ["MOVZW {out}, {iconst}"]

[[lowering]]
op = "Copy"
insts = ["MOVX {out}, {0}"]
