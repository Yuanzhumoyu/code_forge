# ============================================================
# AArch64 (ARM64) — A64 — v12 语法（P1 迭代 A1：全链最小可信集）
# ============================================================
#
# 严格遵循 ARM A-profile A64 指令集定义（developer.arm.com DDI0602；
# A64 指令定宽 32 位小端字）。编码位段以官方文档为准；每条 opcode/
# 固定常量由本机 LLVM clang --target=aarch64-none-elf + llvm-objdump
# 逐字 oracle 校验（tests/arm64_v12_tests.rs 的 golden 来自该 oracle）。
#
# A1 实现（打通 编码/解码/汇编 全链的最小集，全部常量已 oracle 验证）：
#   NOP；ADD/ADDS/SUB/SUBS (immediate) × X/W；ADD/SUB (shifted register,
#   LSL#0 形式 = 三寄存器操作数) × X/W；B/BL（相对跳转）。
# A2+（后续迭代，逐个 oracle 验证后加入）：逻辑寄存器族、MOVZ/N/K、
#   CMP/CMN 别名、移位立即数、MADD/MSUB/SDIV/UDIV、CSEL、B.cond/CBZ、
#   内存 LD/ST 家族、ADR/ADRP、SP/XZR 语义、[abi]/[emit] 接入与 runner。

[meta]
name = "arm64_v12"
version = "0.1.0"
endian = "little"
mode = 64
default_inst_width = 32
case_insensitive_regs = true
comment_char = "#"
label_suffix = ":"
mnemonic_case = "insensitive"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────
# X0-X30（gpr8，64 位）与 W0-W30（gpr4，32 位）共享物理编号 0-30
# （A64 中 Xn/Wn 是同一寄存器组的不同宽度视图）。SP/XZR（31 号上下
# 文语义）后续迭代。

[reg.gpr8]
base_index = 0
names = [
    "X0","X1","X2","X3","X4","X5","X6","X7",
    "X8","X9","X10","X11","X12","X13","X14","X15",
    "X16","X17","X18","X19","X20","X21","X22","X23",
    "X24","X25","X26","X27","X28","X29","X30","SP",
]

[reg.gpr4]
base_index = 0
names = [
    "W0","W1","W2","W3","W4","W5","W6","W7",
    "W8","W9","W10","W11","W12","W13","W14","W15",
    "W16","W17","W18","W19","W20","W21","W22","W23",
    "W24","W25","W26","W27","W28","W29","W30","WSP",
]

# ─────────────────────── 命名位域（A64）───────────────────────
# 通用寄存器位域位置在全 A64 固定：Rd=[4:0]、Rn=[9:5]、Rm=[20:16]。

[conventions.bitfields]
rd    = { offset = 0,  width = 5 }
rn    = { offset = 5,  width = 5 }
rm    = { offset = 16, width = 5 }
imm12 = { offset = 10, width = 12 } # 加立即数（sh 在 [23:22]，A1 恒 0）
imm16 = { offset = 5,  width = 16 } # MOVZ/N/K 半字立即数（[20:5]）
hw    = { offset = 21, width = 2 }  # MOVZ/N/K 半字选择（A2 恒 0）
nbit  = { offset = 21, width = 1 }  # 逻辑族 NOT 位（BIC/ORN/EON=1）
# 顶层固定段：
#  - op8 = 位[31:24]（立即数 ALU 与寄存器 ALU 顶层 8 位；X(sf=1)/W(sf=0)
#    各自为不同 8 位常量，故 X/W 分立 family、opcode 各含 sf）
op8   = { offset = 24, width = 8 }
op9   = { offset = 23, width = 9 } # MOV 宽立即数族（含 bit23=1 的 100101）
#  - op6 = 位[31:26]（B/BL 的 6 位顶层常量；imm26 占 [25:0]）
op6   = { offset = 26, width = 6 }
imm26 = { offset = 0,  width = 26 } # B/BL 相对偏移（与 op6 互补覆盖全字）
word  = { offset = 0,  width = 32 } # 全字常量（NOP）
# A3 扩展
ra    = { offset = 10, width = 5 }   # MADD/MSUB 累加器
o0    = { offset = 15, width = 1 }   # madd=0 / msub=1
op2d  = { offset = 10, width = 6 }   # sdiv=000011 / udiv=000010（位[15:10]）
cond  = { offset = 12, width = 4 }   # CSEL/B.cond 条件码（A64：eq0..nv15）
csop2 = { offset = 10, width = 2 }   # CSEL 族 op2（sel=0 inc=1）
mtop  = { offset = 21, width = 11 }  # 乘除/条件族顶层 [31:21]（含 sf）
b16   = { offset = 16, width = 16 }  # BR/BLR/RET 顶层 [31:16]
imm19 = { offset = 5,  width = 19 }  # CBZ/CBNZ/B.cond 相对偏移（[23:5]）
cbop  = { offset = 24, width = 8 }   # CBZ/CBNZ 顶层（含 sf/op 位）
rt    = { offset = 0,  width = 5 }   # CBZ/CBNZ 测试寄存器 Rt=[4:0]

opc2  = { offset = 22, width = 2 }   # LS opc（00 store / 01 load / 10 符号载）
imm12s= { offset = 10, width = 12 }  # LDR/STR 无符号 imm12（与 ALU imm12 同段）
imm9  = { offset = 12, width = 9 }   # LDUR/STUR 符号偏移（真字节）
p6    = { offset = 26, width = 6 }   # LDP/STP 顶层 [31:26]（X=0x2A/W=0x0A）
idx3  = { offset = 22, width = 3 }   # LDP/STP index（100 off STP/101 off LDP）
rt2   = { offset = 10, width = 5 }   # LDP/STP 第二寄存器
imm7  = { offset = 15, width = 7 }   # LDP/STP 偏移（对元素，缩放单元）
# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "r64"
kind = "reg"
class = "gpr8"
roles = ["in", "out"]

[[operand_slots]]
name = "r32"
kind = "reg"
class = "gpr4"
roles = ["in", "out"]

[[operand_slots]]
name = "imm12u"
kind = "imm"
signed = false
width = 12

[[operand_slots]]
name = "imm16u"
kind = "imm"
signed = false
width = 16

[[operand_slots]]
name = "off26"
kind = "label"
signed = true
width = 26

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "ALUIMM"   # ADD(S)/SUB(S) (imm)：rd/rn/imm12（[23:22] sh=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "imm12"]

[[forms]]
name = "ALUREG"   # ADD/SUB (shifted reg, LSL#0)：rd/rn/rm
                  #（[15:10] imm6=0、[23:22] shift=0 → 零 guard）
opcode_field = "op8"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "MOVR"     # MOV 别名：rd/rm（rn 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rd", "rm"]

[[forms]]
name = "MOVW16"   # MOVZ/MOVN/MOVK：rd/imm16（顶层 [31:23] 常量，hw 经 fields）
opcode_field = "op9"
operand_fields = ["rd", "imm16"]

[[forms]]
name = "CMPIMM"   # CMP/CMN(imm)：rn/imm12（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "imm12"]

[[forms]]
name = "CMPREG"   # CMP(reg)：rn/rm（rd 经 fields=31 常量）
opcode_field = "op8"
operand_fields = ["rn", "rm"]

[[forms]]
name = "BREL"     # B/BL：imm26（[31:26] 为 op6 常量）
opcode_field = "op6"
operand_fields = ["imm26"]

[[forms]]
name = "NOPF"     # 全字常量
opcode_field = "word"
operand_fields = []

# ─────────────────────────── 指令 ───────────────────────────
# op8 常量 = 该指令 (word>>24)&0xFF（oracle 实测）：
#   add  x,w=0x91/0x11、adds=0xB1/0x31、sub=0xD1/0x51、subs=0xF1/0x71
#   add(reg) x,w=0x8B/0x0B、sub(reg)=0xCB/0x4B
# op6：b=0x05（0x14000000>>26）、bl=0x25（0x94000000>>26）

# ── NOP（D503201F）──
[[instructions]]
name = "NOPFAM"
form = "NOPF"
opcode = 0xD503201F
asm = "nop"

# ── ADD/ADDS/SUB/SUBS (immediate) ──
# oracle 校验样本：add x5,x6,#42 = 9100A8C5；adds w5,w6,#42=3100A8C5；
#   sub x5,x6,#42=D100A8C5；subs x5,x6,#42=F100A8C5

[[instructions]]
name = "B"
roles = ["jump", "epilogue_jump"]
form = "BREL"
opcode = 0x05
ops = ["target:off26"]
asm = "b {target}"

[[instructions]]
name = "BL"
form = "BREL"
opcode = 0x25
ops = ["target:off26"]
asm = "bl {target}"

# ── 逻辑寄存器 AND/BIC/ORR/ORN/EOR/EON（寄存器三操作数）──
# oracle：and x0,x1,x2=8A020020（W=0A…）、bic x6,x7,x8=8A2800E6（N 位=1）、
#   orr=AA/2A、orn x6,x7,x8=AA2800E6、eor=CA/4A、eon x6,x7,x8=CA2800E6

[[instructions]]
name = "MOVZX1"   # movz x, #imm16, lsl #16
form = "MOVW16"
opcode = 0x1A5
fields = { hw = 1 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #16"

[[instructions]]
name = "MOVZX2"   # movz x, #imm16, lsl #32
form = "MOVW16"
opcode = 0x1A5
fields = { hw = 2 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #32"

[[instructions]]
name = "MOVZX3"   # movz x, #imm16, lsl #48
form = "MOVW16"
opcode = 0x1A5
fields = { hw = 3 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #48"

[[instructions]]
name = "MOVZW1"   # movz w, #imm16, lsl #16
form = "MOVW16"
opcode = 0xA5
fields = { hw = 1 }
ops = ["dst:r32:out", "imm:imm16u"]
asm = "movz {dst}, #{imm}, lsl #16"

[[instructions]]
name = "MOVKX1"   # movk x, #imm16, lsl #16
form = "MOVW16"
opcode = 0x1E5
fields = { hw = 1 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movk {dst}, #{imm}, lsl #16"

[[instructions]]
name = "MOVKX2"   # movk x, #imm16, lsl #32
form = "MOVW16"
opcode = 0x1E5
fields = { hw = 2 }
ops = ["dst:r64:out", "imm:imm16u"]
asm = "movk {dst}, #{imm}, lsl #32"

# ─────────────────────────── 别名 ───────────────────────────

[[forms]]
name = "MULADD"   # MADD/MSUB：rd rn ra rm（位低→高）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "ra", "rm"]

[[forms]]
name = "MUL3"     # MUL 别名（ra=31 fields）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "DIV2A"    # SDIV/UDIV：rd rn rm（[15:10] op2d 经 fields）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "rm"]

[[forms]]
name = "BRREG2"   # BR/BLR：rn（[31:16] b16 常量；[15:10]/[4:0] 零 guard）
opcode_field = "b16"
operand_fields = ["rn"]

[[forms]]
name = "RETF"     # RET：无操作数（rn=30 fields）
opcode_field = "b16"
operand_fields = []

[[forms]]
name = "CBZF"     # CBZ/CBNZ：rn + imm19
opcode_field = "cbop"
operand_fields = ["rt", "imm19"]

[[forms]]
name = "BCF"      # B.cond：imm19（cond 经 fields 常量）
opcode_field = "cbop"
operand_fields = ["imm19"]

[[forms]]
name = "CSEL4"    # CSEL 族：rd rn cond rm（位低→高；cond 在 rm 之下）
opcode_field = "mtop"
operand_fields = ["rd", "rn", "cond", "rm"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "cond4"
kind = "imm"
signed = false
width = 4

[[operand_slots]]
name = "off19"
kind = "label"
signed = true
width = 19

# ── 乘法 MADD/MSUB/MUL（opcode_field=mtop [31:21]）──
# X madd word 9B020C20 → mtop=(>>21)&0x7FF=0x4D8；W=0xD8
# X msub 9B069CA4、W 1B069CA4（o0=1）；mul= madd ra=31（9B027C20/1B027C20）

[[instructions]]
name = "BR"
form = "BRREG2"
opcode = 0xD61F
ops = ["src:r64"]
asm = "br {src}"

[[instructions]]
name = "BLR"
form = "BRREG2"
opcode = 0xD63F
ops = ["src:r64"]
asm = "blr {src}"

[[instructions]]
name = "RET"
roles = ["ret"]
effect = ["Ret"]
form = "RETF"
opcode = 0xD65F
fields = { rn = 30 }
asm = "ret"

# ── CBZ/CBNZ ×X/W ──
# oracle：cbz x0,.=B4000000、cbnz w1,.=35000001

[[instructions]]
name = "BCOND"
form = "CBZF"
opcode = 0x54
fields = { cond = 0 }
ops = ["target:off19"]
asm = "b.eq {target}"

# ── 别名 ──

[[forms]]
name = "LSUI"     # LDR/STR(unsigned)：rt rn imm12s
opcode_field = "op8"
operand_fields = ["rt", "rn", "imm12s"]

[[forms]]
name = "LSUN"     # LDUR/STUR：rt rn imm9
opcode_field = "op8"
operand_fields = ["rt", "rn", "imm9"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "imm9s"
kind = "imm"
signed = true
width = 9

[[operand_slots]]
name = "imm7u"
kind = "imm"
signed = false
width = 7

# ─────────────────────────── 指令 ───────────────────────────

[[instructions]]
name = "LDRX"
form = "LSUI"
opcode = 0xF9
fields = { opc2 = 1 }
ops = ["dst:r64:out", "base:r64", "imm:imm12u"]
asm = "ldr {dst}, [{base}, #{imm}]"

[[instructions]]
name = "LDRW"
form = "LSUI"
opcode = 0xB9
fields = { opc2 = 1 }
ops = ["dst:r32:out", "base:r64", "imm:imm12u"]
asm = "ldr {dst}, [{base}, #{imm}]"

[[instructions]]
name = "STRX"
form = "LSUI"
opcode = 0xF9
fields = { opc2 = 0 }
ops = ["src:r64", "base:r64", "imm:imm12u"]
asm = "str {src}, [{base}, #{imm}]"

[[instructions]]
name = "STRW"
form = "LSUI"
opcode = 0xB9
fields = { opc2 = 0 }
ops = ["src:r32", "base:r64", "imm:imm12u"]
asm = "str {src}, [{base}, #{imm}]"

[[instructions]]
name = "LDURX"
form = "LSUN"
opcode = 0xF8
fields = { opc2 = 1 }
ops = ["dst:r64:out", "base:r64", "off:imm9s"]
asm = "ldur {dst}, [{base}, #{off}]"

[[instructions]]
name = "LDURW"
form = "LSUN"
opcode = 0xB8
fields = { opc2 = 1 }
ops = ["dst:r32:out", "base:r64", "off:imm9s"]
asm = "ldur {dst}, [{base}, #{off}]"

[[instructions]]
name = "STURX"
form = "LSUN"
opcode = 0xF8
fields = { opc2 = 0 }
ops = ["src:r64", "base:r64", "off:imm9s"]
asm = "stur {src}, [{base}, #{off}]"

[[instructions]]
name = "STURW"
form = "LSUN"
opcode = 0xB8
fields = { opc2 = 0 }
ops = ["src:r32", "base:r64", "off:imm9s"]
asm = "stur {src}, [{base}, #{off}]"

# ── 别名 ──

[[forms]]
name = "PAIR"     # LDP/STP：rt rn rt2 imm7（位低→高）
opcode_field = "op8"
operand_fields = ["rt", "rn", "rt2", "imm7"]

# ─────────────────────────── 指令 ───────────────────────────

[[instructions]]
name = "STPX"
form = "PAIR"
opcode = 0xA9
fields = { idx3 = 4 }
ops = ["t1:r64", "base:r64", "t2:r64", "imm:imm7u"]
asm = "stp {t1}, {t2}, [{base}, #{imm}]"

[[instructions]]
name = "LDPX"
form = "PAIR"
opcode = 0xA9
fields = { idx3 = 5 }
ops = ["t1:r64:out", "base:r64", "t2:r64:out", "imm:imm7u"]
asm = "ldp {t1}, {t2}, [{base}, #{imm}]"

[[instructions]]
name = "STPW"
form = "PAIR"
opcode = 0x29
fields = { idx3 = 4 }
ops = ["t1:r32", "base:r64", "t2:r32", "imm:imm7u"]
asm = "stp {t1}, {t2}, [{base}, #{imm}]"

[[instructions]]
name = "LDPW"
form = "PAIR"
opcode = 0x29
fields = { idx3 = 5 }
ops = ["t1:r32:out", "base:r64", "t2:r32:out", "imm:imm7u"]
asm = "ldp {t1}, {t2}, [{base}, #{imm}]"

# ── 别名 ──

[stack]
slot = 8
align = 16
fp_save = 8

[abi]
scratch = ["X16", "X17"]
# regalloc 不可分配：X18 = 平台寄存器；X30 = lr（BL 返回地址/prologue
# 保存）——不排除会被分配出垃圾值（覆盖返回地址 → ret 跳错）。
reserved = ["X18", "X30"]

# 返回寄存器（x0）；Return lowering 的返回值移动目标
ret_regs = ["X0"]

# Call 返回地址寄存器（BL 写 X30；P1 尚未有 Call lowering 规则）
call_ret_reg = "X30"

# Call 点被调用方破坏的寄存器（regalloc clobber 集）：AAPCS64 caller-saved
# = X0-X18 + lr(X30)。X19-X28 由 @push_callee 保存 → 不在 clobber 集。
call_clobbers = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7", "X8", "X9", "X10", "X11", "X12", "X13", "X14", "X15", "X16", "X17", "X18", "X30"]

[[abi.arg_class]]
class = "int"
regs = ["X0", "X1", "X2", "X3", "X4", "X5", "X6", "X7"]

[abi.frame]
sp = "SP"
fp = "X29"
# @frame_alloc = SUB SP, SP, #frame（SUB 自带减号语义 → 无需 alloc_neg）
alloc_neg = false
# fp-inside：lr/fp 保存槽在帧内顶部（fp_push_bytes=16 = X30+X29 两槽）；
# min_frame = 16 + Σcallee_saved×8 = 96 由运行期推导（frame_layout_info）。
layout = "fp-inside"
fp_push_bytes = 16

[abi.callee_saved]
# X19-X28（fp/lr 由 fp_push 区显式存取，不入表）：@push_callee/@pop_callee
# 用 [spill.GPR] store/load 模板（STURX/LDURX）保存到 [sp+frame-16-(k+1)*8]。
gpr = ["X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27", "X28"]

[spill.GPR]
# base = X29（fp = 入口 sp，帧顶固定）：emission 的 sp_base = -(frame)
# 是相对帧指针的偏移（spill 槽在帧内底部 [fp - frame + off]，递归各帧
# 独立）；用 STUR/LDUR 真字节偏移（imm9 符号 ±256——与 riscv LD/SD 的
# signed imm12 同角色，帧 > ~256B 报错为已知限制）。
load = "LDURX {0}, X29, {1}"
store = "STURX {0}, X29, {1}"
base = "X29"

[emit]
align_pad = 0
# 独立尾声标签开启：arm64 B（imm26）与 CBZ（imm19）label 槽经定宽 fixup
# （Relative(4,0)）+ Arm64RelocPatcher 位段重排 → return block 经
# `b epilogue_label` 跳到统一尾声，多 return block / 跨块分支函数可用
# （emission.rs 按 needs_epilogue_label=true 布局）。单块函数仍走
# fall-through 尾声（epilogue 紧跟 return block 时 emission 不空发跳转）。
epilogue_label = true

[emit.prologue]
insts = [
    "@frame_alloc",
    "STURX X30, SP, {frame_size_m8}",
    "STURX X29, SP, {frame_size_m16}",
    "ADDIMMX X29, SP, {frame_size}",
    "@push_callee",
    "@move_args",
]

[emit.epilogue]
insts = [
    "@pop_callee",
    "LDURX X30, SP, {frame_size_m8}",
    "LDURX X29, SP, {frame_size_m16}",
    "@frame_free",
    "RET",
]

# ─────────────────────── lowering（64 位主；32 位 W 变体按 rs1_width）───────────────────────
# 覆盖 op 集 = P1 tm 测试所需最小集（SUPPORTED_OPS 由此唯一集派生）。

[[lowering]]
op = "Iadd"
when = { eq = ["rs1_width", 32] }
insts = ["ADDREGW {out}, {0}, {1}"]

[[lowering]]
op = "Iadd"
insts = ["ADDREGX {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
when = { eq = ["rs1_width", 32] }
insts = ["SUBREGW {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
insts = ["SUBREGX {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
when = { eq = ["rs1_width", 32] }
insts = ["MULW {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
insts = ["MULX {out}, {0}, {1}"]

# Iconst 值分派（按常量池解析真值 attr `iconst`；⚠️ 不能用 `imm0` 判符号——
# Iconst 的 immediate 是 `Immediate::Const(cid)`，imm0 = 池索引正数，无值语义，
# P3① 实证 imm0<0 规则永不命中）：
#   16 位域内（|v| < 0x10000）→ 单条 MOVZ（正）/MOVN（负，高位全 1 = 符号扩展）。
#   域外 → 全片序列：X 恒 4 条 movz(hw3)+movk(hw2/hw1/hw0)、W 恒 2 条
#   movz(hw1)+movk(hw0)——任意 64/32 位位型均可构造（含 i64 负大值：两补码
#   位型逐片写入，movz hw3 置高片后 movk 覆盖低片，其余位先清零后覆写，正确）。
# 序列构造先后序 = 高片 movz 先（清零其它）→ 低片 movk 依 hw 降序覆写。
[[lowering]]
op = "Iconst"
when = { and = [ { eq = ["rd", 64] }, { lt = ["iconst", 0] }, { ge = ["iconst", -65536] } ] }
insts = ["MOVNX {out}, {iconst_c16}"]

[[lowering]]
op = "Iconst"
when = { and = [ { eq = ["rd", 64] }, { ge = ["iconst", 0] }, { lt = ["iconst", 65536] } ] }
insts = ["MOVZX {out}, {iconst}"]

[[lowering]]
op = "Iconst"
when = { and = [ { eq = ["rd", 64] }, { not = { and = [ { ge = ["iconst", -65536] }, { lt = ["iconst", 65536] } ] } } ] }
insts = [
  "MOVZX3 {out}, {iconst_f3}",
  "MOVKX2 {out}, {iconst_f2}",
  "MOVKX1 {out}, {iconst_f1}",
  "MOVKX {out}, {iconst_f0}",
]

[[lowering]]
op = "Iconst"
when = { and = [ { lt = ["iconst", 0] }, { ge = ["iconst", -65536] } ] }
insts = ["MOVNW {out}, {iconst_c16}"]

[[lowering]]
op = "Iconst"
when = { and = [ { ge = ["iconst", 0] }, { lt = ["iconst", 65536] } ] }
insts = ["MOVZW {out}, {iconst}"]

[[lowering]]
op = "Iconst"
when = { not = { and = [ { ge = ["iconst", -65536] }, { lt = ["iconst", 65536] } ] } }
insts = [
  "MOVZW1 {out}, {iconst_f1}",
  "MOVKW {out}, {iconst_f0}",
]

[[lowering]]
op = "Copy"
insts = ["MOVX {out}, {0}"]

# ── 逻辑运算（P3：Band/Bor/Bxor → ANDREG/ORRREG/EORREG 直落）──

[[lowering]]
op = "Band"
when = { eq = ["rs1_width", 32] }
insts = ["ANDREGW {out}, {0}, {1}"]

[[lowering]]
op = "Band"
insts = ["ANDREGX {out}, {0}, {1}"]

[[lowering]]
op = "Bor"
when = { eq = ["rs1_width", 32] }
insts = ["ORRREGW {out}, {0}, {1}"]

[[lowering]]
op = "Bor"
insts = ["ORRREGX {out}, {0}, {1}"]

[[lowering]]
op = "Bxor"
when = { eq = ["rs1_width", 32] }
insts = ["EORREGW {out}, {0}, {1}"]

[[lowering]]
op = "Bxor"
insts = ["EORREGX {out}, {0}, {1}"]

# ═══════════════════════ 参数化模板（v18 S2：X/W 对）═══════════════════════
# 一处声明 → 两条指令（sf 位、寄存器槽、opcode 逐行给）；`ref` 自动进别名表，
# 取代原来的 29 条 [[aliases]]（手写清单会漂移，见方案 §2.3）。

[[templates]]
name = "ADDIMM{x}"
ref = "add"
params = { x = ["X", "W"], slot = ["r64", "r32"], opcode = [0x91, 0x11] }
body = { form = "ALUIMM", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "imm:imm12u"], asm = "add {dst}, {src}, #{imm}" }
[[templates.overrides]]
row = 0
body = { roles = ["frame_free"] }

[[templates]]
name = "ADDSIMM{x}"
ref = "adds"
params = { x = ["X", "W"], slot = ["r64", "r32"], opcode = [0xB1, 0x31] }
body = { form = "ALUIMM", opcode = "{opcode}", ops = ["dst:{slot}:out", "src:{slot}", "imm:imm12u"], asm = "adds {dst}, {src}, #{imm}" }

