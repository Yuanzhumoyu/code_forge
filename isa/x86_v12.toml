[[instructions]]
name = "VEXTRACTF128"
vex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = { reg = "src", rm = "dst" }
imm = 8
opcode = 0x19
fields = { vex_map = 3, vex_pp = 1, vex_w = 0, vex_l = 1 }
ops = ["src:fpr", "dst:fpr:out", "imm:imm8"]
asm = "vextractf128 {dst}, {src}, {imm}"

[[instructions]]
name = "VINSERTF128"
vex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = { reg = "dst", rm = "src2" }
imm = 8
opcode = 0x18
fields = { vex_map = 3, vex_pp = 1, vex_w = 0, vex_l = 1 }
ops = ["dst:fpr:out", "src:fpr", "src2:fpr", "imm:imm8"]
asm = "vinsertf128 {dst}, {src}, {src2}, {imm}"

# EVEX 版（AVX-512F）：VINSERTF32X4 zmm1, zmm2, xmm3/m128, imm8
# （EVEX.512.66.0F3A.W0 18 /r ib：map=3=0F3A、pp=1=66、L'L=2 → 512 位）。
# 语义：dst := src1 整 512 位拷贝后，把第 imm 个 128 位 lane 换成 src2。
# 用途：V512 常量（Vconst rd=512）——四个 128 位段各自装好后按 imm=0..3 插入。
[[instructions]]
name = "VINSERTF32X4"
evex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = { reg = "dst", rm = "src2" }
imm = 8
opcode = 0x18
fields = { evex_map = 3, evex_pp = 1, evex_w = 0, evex_l = 2 }
ops = ["dst:fpr32:out", "src:fpr32", "src2:fpr", "imm:imm8"]
asm = "vinsertf32x4 {dst}, {src}, {src2}, {imm}"

# EVEX 版（AVX-512F）：VEXTRACTF32X4 xmm1, zmm2, imm8
# （EVEX.512.66.0F3A.W0 19 /r ib：map=3=0F3A、pp=1=66、L'L=2 → 512 位；
#  dest 在 r/m、src 在 reg——与 VEXTRACTF128 同构）。
# 语义：dst(xmm) := src(zmm) 的第 imm 个 128 位 lane。
# 用途：V512（64B）按 lane 提取——先取段（0..3），再段内 PSHUFD 取 dword/qword。
[[instructions]]
name = "VEXTRACTF32X4"
evex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = { reg = "src", rm = "dst" }
imm = 8
opcode = 0x19
fields = { evex_map = 3, evex_pp = 1, evex_w = 0, evex_l = 2 }
ops = ["src:fpr32", "dst:fpr:out", "imm:imm8"]
asm = "vextractf32x4 {dst}, {src}, {imm}"
