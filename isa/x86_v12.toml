body = { form = "EVEX_RRV", modrm = { reg = "dst", rm = "src2" }, fields = { evex_map = 1, evex_pp = 1, evex_w = 0, evex_l = 2 }, ops = ["dst:fpr32:out", "src:fpr32", "src2:fpr32"], asm = "{inst.lower} {dst}, {src}, {src2}" }
rows = [
  { inst = "VPADDD_ZMM", ref = "vpaddd", opcode = 0xFE, asm = "vpaddd {dst}, {src}, {src2}" },
  { inst = "VPSUBD_ZMM", ref = "vpsubd", opcode = 0xFA, asm = "vpsubd {dst}, {src}, {src2}" },
  { inst = "VPADDQ_ZMM", ref = "vpaddq", opcode = 0xD4, fields = { evex_w = 1 }, asm = "vpaddq {dst}, {src}, {src2}" },   # EVEX 下 W 位区分 dword/qword（vpaddd=W0、vpaddq=W1）
  { inst = "VPSUBQ_ZMM", ref = "vpsubq", opcode = 0xFB, fields = { evex_w = 1 }, asm = "vpsubq {dst}, {src}, {src2}" },
]
# EVEX 无源（2 操作数）：vmovaps zmm, zmm
[[instructions]]
name = "VMOVAPS_ZMM"
ref = "vmovaps"
evex = { map = "field", pp = "field", w = "field", l = "field" }
opcode = 0x28
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2 }
ops = ["dst:fpr32:out", "src:fpr32"]
asm = "vmovaps {dst}, {src}"

[[instructions]]
name = "VMOVAPS_ZMM_MEM"
ref = "vmovaps"
form = "EVEX_RR_MEMREF"
modrm = { rm = "[mem]" }
opcode = 0x28
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2, evex_disp_scale = 64 }
# v13：EVEX 内存形式（512 位，压缩位移 scale=64）——vmovaps zmm, [rax±disp]
ops = ["dst:fpr32:out", "mem:mem"]
asm = "vmovaps {dst}, {mem}"

# 非对齐 512 位 load（by-ref 传参用；EVEX 0x10 + disp_scale=64）
[[instructions]]
name = "VMOVUPS_ZMM_MEM"
ref = "vmovups"
roles = [{ role = "wide_vec_load", bits = 512 }]
form = "EVEX_RR_MEMREF"
modrm = { rm = "[mem]" }
opcode = 0x10
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2, evex_disp_scale = 64 }
ops = ["dst:fpr32:out", "mem:mem"]
asm = "vmovups {dst}, {mem}"

# 非对齐 512 位 store（by-ref 调用方侧副本）
[[instructions]]
name = "VMOVUPS_ZMM_MR"
ref = "vmovups"
roles = [{ role = "wide_vec_store", bits = 512 }]
form = "EVEX_RR_MEMREF"
modrm = { rm = "[mem]" }
opcode = 0x11
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2, evex_disp_scale = 64 }
ops = ["src:fpr32", "mem:mem:out"]
asm = "vmovups {src}, {mem}"

# 宽向量 IR Load/Store 的 gpr 基址形式（EVEX 512 位；见 VMOVUPS_256_R_MEM 的说明）
[[instructions]]
name = "VMOVUPS_512_R_MEM"
form = "EVEX_RR_MEMREF"
modrm = { rm = "[src]" }
opcode = 0x10
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2, evex_disp_scale = 64 }
ops = ["dst:fpr32:out", "src:gpr"]
asm = "vmovups {dst}, [{src}]"

[[instructions]]
name = "VMOVUPS_512_MEM_R"
form = "EVEX_RR_MEMREF"
modrm = { rm = "[src2]" }
opcode = 0x11
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2, evex_disp_scale = 64 }
ops = ["src:fpr32", "src2:gpr"]
asm = "vmovups [{src2}], {src}"

# ── EVEX opmask（掩码写合并，z=0）：vaddps zmm, zmm, zmm, k1 ──
# 与 3 操作数 VADDPS_ZMM 同助记符自动分发（类型签名 O3 不同）；第 4 操作数
# kreg 类槽 → P2 aaa = 掩码寄存器索引。
[[instructions]]
name = "VADDPS_ZMM_MASK"
ref = "vaddps"
form = "EVEX_RRV"
modrm = { reg = "dst", rm = "src2" }
opcode = 0x58
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2 }
ops = ["dst:fpr32:out", "src:fpr32", "src2:fpr32", "src3:kreg"]
asm = "vaddps {dst}, {src}, {src2}, {src3}"

# EVEX 零掩码（z=1）：vaddps zmm, zmm, zmm, k1（P2 z 位 = 1；与 z=0 同助记符去重）
[[instructions]]
name = "VADDPS_ZMM_MASKZ"
form = "EVEX_RRV"
modrm = { reg = "dst", rm = "src2" }
opcode = 0x58
fields = { evex_map = 1, evex_pp = 0, evex_w = 0, evex_l = 2, evex_z = 1 }
ops = ["dst:fpr32:out", "src:fpr32", "src2:fpr32", "src3:kreg"]
asm = "vaddps {dst}, {src}, {src2}, {src3}"

