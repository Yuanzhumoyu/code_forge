
# ============================================================

# x86-64 — v12 变长语义键试点（迭代 3：ModRM/REX/opsize/SSE）

# ============================================================

#

# 迁移范围（与 v11 golden 逐字节对比）：

# - @modrm 家族 24 条（mod=11 寄存器形式；opsize 动态或固定 64）

# - @modrm_imm32 6 条（81 /digit + imm32）

# - @sse_rr 简单指令 23 条（0F escape + 固定前缀 + 固定 REX.W）

# 未迁移：@modrm_mem（内存寻址/SIB，迭代 3b）、@sse_rr 家族（opcodes 数组，

# 迭代 4 families）、VEX（迭代 4）、@op_rm/@cmovcc/@setcc/@mov_imm64 等。

#

# v12 变长 form 语义键（迭代 3）：

# - modrm = "rr"（ModRM mod=11：reg=操作数 0、rm=操作数 1）| "ext"

#   （reg=fields.ext 固定扩展码、rm=操作数 0）

# - opsize = "auto"（指令有 opsize 操作数：16 → 0x66 前缀、64 → REX.W=1）

#   | 数字（固定 opsize，无 opsize 操作数）

# - prefix = "field"（fields.prefix：SSE 的 66/F2/F3/0）| 数字（固定）

# - rex_w = "field"（fields.w 固定 REX.W 位）| "auto"（opsize==64）

# - imm = 32（尾部 imm32，符号扩展按槽）

# - 寄存器 = 组内索引 0-15（= x86 物理编号；REX.R/B 由索引高位自动推导）

# 非文本操作数：opsize 槽（kind = "opsize"）asm 无占位符，assemble 默认 64。


[meta]
name = "x86_64_v12"
version = "13.0"
endian = "little"
mode = 64
variable_length = true
max_inst_len = 15
case_insensitive_regs = true
# v13 语法键（缺省值与显式声明一致，此处显式化供文档/校验）
comment_char = "#"
label_suffix = ":"
mnemonic_case = "insensitive"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────
# GPR 四宽度视图共用物理编号 0-15（base_index=0）：同一物理寄存器的
# 8/16/32/64 位视图。opsize 由操作数寄存器宽度自动推导（Phase 2 起）。
# gpr8 不含 AH/CH/DH/BH（v12 byte_reg 强制 REX，索引 4-7 恒为 SPL/BPL/SIL/DIL）。

[reg.gpr8]
names = ["RAX","RCX","RDX","RBX","RSP","RBP","RSI","RDI",
         "R8","R9","R10","R11","R12","R13","R14","R15"]

[reg.gpr4]
base_index = 0
names = ["EAX","ECX","EDX","EBX","ESP","EBP","ESI","EDI",
         "R8D","R9D","R10D","R11D","R12D","R13D","R14D","R15D"]

[reg.gpr2]
base_index = 0
names = ["AX","CX","DX","BX","SP","BP","SI","DI",
         "R8W","R9W","R10W","R11W","R12W","R13W","R14W","R15W"]

[reg.gpr1]
base_index = 0
names = ["AL","CL","DL","BL","SPL","BPL","SIL","DIL",
         "R8B","R9B","R10B","R11B","R12B","R13B","R14B","R15B"]

[reg.fpr8]
base_index = 0
names = ["MM0","MM1","MM2","MM3","MM4","MM5","MM6","MM7"]

[reg.fpr16]
names = ["XMM0","XMM1","XMM2","XMM3","XMM4","XMM5","XMM6","XMM7",
         "XMM8","XMM9","XMM10","XMM11","XMM12","XMM13","XMM14","XMM15"]

# ModRM 约定：RBP(5)/R13(13) 作为基址在 mod=00 时是 RIP-rel/无基址——
# 强制 disp8=0 编码（与 v11 一致）

[reg.fpr32]
names = ["ZMM0","ZMM1","ZMM2","ZMM3","ZMM4","ZMM5","ZMM6","ZMM7",
         "ZMM8","ZMM9","ZMM10","ZMM11","ZMM12","ZMM13","ZMM14","ZMM15",
         "ZMM16","ZMM17","ZMM18","ZMM19","ZMM20","ZMM21","ZMM22","ZMM23",
         "ZMM24","ZMM25","ZMM26","ZMM27","ZMM28","ZMM29","ZMM30","ZMM31"]

# AVX-512 掩码寄存器（opmask，k0-k7；EVEX P2 aaa 位）
[reg.kreg8]
names = ["K0","K1","K2","K3","K4","K5","K6","K7"]
[conventions.modrm]
force_disp_base = [5, 13]

# v13：条件码表（缺省即此表；jcc/setcc/cmovcc 的 cond 槽查表）
[conventions.cond]
o = 0
no = 1
b = 2
c = 2
nae = 2
ae = 3
nb = 3
nc = 3
e = 4
z = 4
ne = 5
nz = 5
be = 6
na = 6
a = 7
nbe = 7
s = 8
ns = 9
p = 10
pe = 10
np = 11
po = 11
l = 12
nge = 12
ge = 13
nl = 13
le = 14
ng = 14
g = 15
nle = 15

# v13：变长解码前缀扫描表（缺省即此表；66/F0/F2/F3/67/REX 扫描集）
[[conventions.prefix_scan]]
byte = 0x66
effects = ["opsize16"]
[[conventions.prefix_scan]]
byte = 0xF0
effects = ["lock"]
[[conventions.prefix_scan]]
byte = 0xF2
effects = ["repne"]
[[conventions.prefix_scan]]
byte = 0xF3
effects = ["repe"]
[[conventions.prefix_scan]]
byte = 0x67
effects = ["addr16"]
[[conventions.prefix_scan]]
range = "0x40..0x4F"
effects = ["rex"]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "gpr"
kind = "reg"
class = "gpr8"
roles = ["in", "out", "inout"]

# 8 位寄存器操作数（SETCC 目标等）：索引 4-7（spl/bpl/sil/dil）无 REX 前缀
# 会被解码为 ah/ch/dh/bh，必须强制 REX（见 codegen REX 条件）。
[[operand_slots]]
name = "gpr32"
kind = "reg"
class = "gpr4"
roles = ["in", "out", "inout"]

[[operand_slots]]
name = "gprx"
kind = "reg"
# 多宽度视图（16/32/64 位）——类型签名分发的核心：一个槽接纳宽度集合，
# 实际宽度由操作数寄存器决定（opsize auto 推导 66/REX.W 前缀）。
# 显式排除 8 位（gpr1）：8 位 mov 是不同 opcode（88 vs 8B），应声明为
# 独立 form 而非经由 gprx 误编码（garbage 防护）。
classes = ["gpr2", "gpr4", "gpr8"]
roles = ["in", "out", "inout"]

[[operand_slots]]
name = "gpr8"
kind = "reg"
class = "gpr8"
byte_reg = true
roles = ["in", "out", "inout"]

# 16 位寄存器操作数（movzx/movsx 16 位源等）
[[operand_slots]]
name = "gpr2"
kind = "reg"
class = "gpr2"
roles = ["in", "out"]


[[operand_slots]]
name = "gpr1b"
kind = "reg"
class = "gpr1"
byte_reg = true
roles = ["in", "out"]
[[operand_slots]]
name = "fpr"
kind = "reg"
class = "fpr16"
roles = ["in", "out", "inout"]


[[operand_slots]]
name = "fpr32"
kind = "reg"
class = "fpr32"
roles = ["in", "out"]

[[operand_slots]]
name = "kreg"
kind = "reg"
class = "kreg8"
roles = ["in", "out"]

[[operand_slots]]
name = "imm32"
kind = "imm"
signed = true
width = 32

[[operand_slots]]
name = "mem"
kind = "mem"
class = "gpr8"

[[operand_slots]]
name = "imm8"
kind = "imm"
signed = false
width = 8

[[operand_slots]]
name = "imm64"
kind = "imm"
signed = false
width = 64

[[operand_slots]]
name = "rel"
kind = "label"
signed = true
width = 32

[[operand_slots]]
name = "cond"
kind = "cond"
width = 8

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "MRR"            # @modrm：reg=op0, rm=op1, opsize auto
opsize = "out"

[[forms]]
name = "MRR_FIX64"      # @modrm：opsize 固定 64（恒 REX.W）
opsize = 64

[[forms]]
name = "MRR_0F"         # @modrm + 0F escape
opsize = "s0"
escape = [0x0F]

[[forms]]
name = "MRR_0F_NOOS"    # @modrm + 0F escape + 无 opsize（movzx/movsx：dest/src
                        # 宽度不同合法——8/16 位源零/符号扩展到 64，不做一致性检查）
prefix = "field"
rex_w = "field"
escape = [0x0F]

[[forms]]
name = "MRR_0F_FIX64"   # @modrm + 0F escape + opsize 固定 64（MOVQ 系列；prefix=field）
opsize = 64
escape = [0x0F]
prefix = "field"

[[forms]]
name = "MRR_0F_PREFIX"  # @modrm + 0F escape + 指令级 prefix（LZCNT/TZCNT/POPCNT 的 F3）
opsize = "s0"
escape = [0x0F]
prefix = "field"

[[forms]]
name = "MRR_EXT"        # @modrm_imm32：reg=fields.ext, rm=op0, imm32
opsize = "s0"
imm = 32

[[forms]]
name = "SSE_RR"         # @sse_rr：0F opcode /r，prefix=fields.prefix, w=fields.w
escape = [0x0F]
prefix = "field"
rex_w = "field"

[[forms]]
name = "EVEX_RR_MEMREF"   # EVEX 内存：reg=op0、MemRef op1；压缩位移 ×evex_disp_scale
evex = { map = "field", pp = "field", w = "field", l = "field", disp_scale = "field" }

[[forms]]
name = "EVEX_RRV"        # EVEX 三操作数（AVX-512）：reg=op0、vvvv=~op1、rm=op2；L'L 由 evex_l（0/1/2）
evex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "VEX_RRV"        # VEX 三操作数：reg=op0(dest)、rm=op2(src2)、vvvv=~op1(src1)
vex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "VEX_RR"         # VEX 两操作数：vvvv=0x0F（无源）
vex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "VEX_RR_MEMREF"  # VEX 内存形式：reg=op0(dest)、MemRef base/disp=op1（vmovaps xmm, [rax+disp]）
vex = { map = "field", pp = "field", w = "field", l = "field" }

[[forms]]
name = "MRR_EXT_OP"       # @op_rm：F7 /digit（reg=fields.ext, rm=op0，无 imm）
opsize = "s0"

[[forms]]
name = "MRR_EXT_OP_FIX64" # @shift_reg：D3 /digit（rm=op0），opsize 固定 64（REX.W）
opsize = 64

[[forms]]
name = "MRR_MEM"          # [reg 基址 + disp 0]；无 escape（XCHG/MOV_R_MEM/STORE_MEM_R）
opsize = "s0"

[[forms]]
name = "MRR_MEM_PRE"      # 内存 + prefix=field、无 escape（LOCK 原子族 29/21/09/31）
opsize = "s0"
prefix = "field"

[[forms]]
name = "MRR_MEM_0F_FIX32" # 内存 + 0F + prefix=field + opsize 32（MOVSD 内存标量）
opsize = 32
escape = [0x0F]
prefix = "field"

[[forms]]
name = "MRR_MEMREF"       # MemRef 内存（base+disp）+ opsize 64（spill）
opsize = 64

[[instructions]]
name = "MOV_R_RM"
form = "MRR"
opcode = 0x8B
# v13-：与 MOV_RM_R/MOV64_RR 合并为同一助记符 `mov`——16/32/64 位寄存器
# 版本按实际类型自动分发（mov EAX,EBX → 8B 32 位无前缀、mov RAX,RBX →
# 89 D8、mov AX,BX → 66 8B）。gprx 显式排除 8 位（见槽声明）。
# v14：DSL 回填修复后 32 位值（I32）回填 GPR(4) 视图 → auto 32 位；固定
# 32 位变体 MOV_R_RM_32（mov32，FIX32 form）已删——32 位 lowering 统一走本指令。
ops = ["dst:gprx:out", "src:gprx"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "MOV_R8_RM8"
opcode = 0x8A
# v13：8 位 mov——gpr1b 槽（byte_reg 强制 REX：spl/bpl/sil/dil）。与 16/32/64 位
# 共享助记符 `mov`（`mov al, bl` → 8A C3）。gprx 显式排除 gpr1（防 8B 误编码）。
ops = ["dst:gpr1b:out", "src:gpr1b"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "MOV_RM_R"
form = "MRR"
opcode = 0x89
ops = ["src:gpr", "dst:gpr:inout"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "MOVSXD_R_RM"
form = "MRR_FIX64"
opcode = 0x63
ops = ["dst:gpr:out", "src:gpr"]
asm = "movsxd {dst}, {src}"

# RM_R 两地址算术/逻辑（ADD/SUB/XOR/AND/OR）：opsize 必须取 **inout 目的槽
# （s1）**，不能用 form MRR 缺省的 s0。s0 是 modrm.reg = 源操作数——lowering
# `add {1}, {out}` 把源绑定到 IR 的第二个操作数，其类型可比结果窄（forge-ir
# `TypeId::upcast` 允许混宽：`iadd(PTR, I32) -> PTR`）。取源宽度会发 32 位
# ADD，把 64 位指针高半清零 → 栈槽地址算术全线 SEGV（mini_c alloc_slot =
# `iadd(stack_addr, iconst_i32(-4))` 实证）。目的槽 = IR 结果值 XReg，其
# 类型恒为 upcast 结果（≥ 两操作数），故 s1 == 结果宽度 == 正确编码宽度。
[[instructions]]
name = "ADD_RM_R"
form = "MRR"
opcode = 0x01
# v14：数据槽 gprx——宽度由 IR 类型 auto（I32→无 REX.W 32 位、I64→REX.W）。
# 固定 _32 变体已删（DSL 回填修复后同 opcode 由 66/REX.W 前缀分发——WA-35）。
ops = ["src:gprx", "dst:gprx:inout"]
asm = "add {dst}, {src}"

[[instructions]]
name = "SUB_RM_R"
form = "MRR"
opcode = 0x29
ops = ["src:gprx", "dst:gprx:inout"]
asm = "sub {dst}, {src}"

# IMUL 是 reg-form（目的 = op0 = modrm.reg）——form 缺省 s0 已是目的槽。
[[instructions]]
name = "IMUL_R_RM"
form = "MRR_0F"
opcode = 0xAF
ops = ["dst:gprx:out", "src:gprx"]
asm = "imul {dst}, {src}"

[[instructions]]
name = "XOR_RM_R"
form = "MRR"
opcode = 0x31
ops = ["src:gprx", "dst:gprx:inout"]
asm = "xor {dst}, {src}"

[[instructions]]
name = "AND_RM_R"
form = "MRR"
opcode = 0x21
ops = ["src:gprx", "dst:gprx:inout"]
asm = "and {dst}, {src}"

[[instructions]]
name = "OR_RM_R"
form = "MRR"
opcode = 0x09
ops = ["src:gprx", "dst:gprx:inout"]
asm = "or {dst}, {src}"

# CMP/TEST 只有两个源槽（没有 inout 目的槽可取宽度，IR 结果是 BOOL 不带操作数
# 宽度）→ `opsize = "max"`：取两操作数宽度的宽者 = `TypeId::upcast` 结果宽度。
# 取单槽（form MRR 缺省 s0 = modrm.reg）会按较窄者编码——`icmp(PTR, iconst_i32(0))`
# 发 32 位 CMP 只比低半，高半非 0 的指针与 null 判等为真（空指针检查失效）。
# 汇编文本仍要求两操作数同宽（`cmp RAX, EBX` 拒绝）——max 只放宽 IR 降级路径。
[[instructions]]
name = "CMP_RM_R"
form = "MRR"
opcode = 0x39
opsize = "max"
ops = ["src:gprx", "src2:gprx"]
asm = "cmp {src2}, {src}"

[[instructions]]
name = "TEST_RM_R"
roles = ["test"]
form = "MRR"
opcode = 0x85
opsize = "max"
ops = ["src:gprx", "src2:gprx"]
asm = "test {src2}, {src}"

# movzx：8 位源（REX.W + 0F B6）与 16 位源（66 REX.W 0F B7）合并助记符——
# 源槽宽度自动分发（gpr1b → B6、gpr2 → B7）。REX.W 保证 64 位 dest 全零扩展。
[[instructions]]
name = "MOVZX_R8_RM"
form = "MRR_0F_NOOS"
opcode = 0xB6
fields = { prefix = 0, w = 1 }
ops = ["dst:gpr:out", "src:gpr1b"]
asm = "movzx {dst}, {src}"

[[instructions]]
name = "MOVZX_R16_RM"
form = "MRR_0F_NOOS"
opcode = 0xB7
fields = { prefix = 0x66, w = 1 }
ops = ["dst:gpr:out", "src:gpr2"]
asm = "movzx {dst}, {src}"

# movzx 内存源（窄 load 零扩展读——窄值寄存器必须高位清零，否则后续
# 32/64 位比较/算术带高位垃圾（u8 比较误判实证——v14 字节宽度修复）。
# 8 位：REX.W 0F B6（源内存 1 字节）；16 位：66 REX.W 0F B7。
[[instructions]]
name = "MOVZX_R8_MEM"
modrm = { rm = "[src]" }
prefix = "field"
rex_w = "field"
escape = [0x0F]
opcode = 0xB6
fields = { prefix = 0, w = 1 }
ops = ["dst:gpr:out", "src:gprx"]
asm = "movzx {dst}, [{src}]"

[[instructions]]
name = "MOVZX_R16_MEM"
modrm = { rm = "[src]" }
prefix = "field"
rex_w = "field"
escape = [0x0F]
opcode = 0xB7
fields = { prefix = 0x66, w = 1 }
ops = ["dst:gpr:out", "src:gprx"]
asm = "movzx {dst}, [{src}]"

# movsx：8 位源（REX.W + 0F BE）与 16 位源（66 REX.W 0F BF）合并助记符。
[[instructions]]
name = "MOVSX_R8_RM"
form = "MRR_0F_NOOS"
opcode = 0xBE
fields = { prefix = 0, w = 1 }
ops = ["dst:gpr:out", "src:gpr1b"]
asm = "movsx {dst}, {src}"

[[instructions]]
name = "MOVSX_R16_RM"
form = "MRR_0F_NOOS"
opcode = 0xBF
fields = { prefix = 0x66, w = 1 }
ops = ["dst:gpr:out", "src:gpr2"]
asm = "movsx {dst}, {src}"

[[instructions]]
name = "CMPXCHG_RM_R"
form = "MRR_0F"
opcode = 0xB1
ops = ["src:gpr", "dst:gpr:inout"]
asm = "cmpxchg {dst}, {src}"

[[instructions]]
name = "XADD_RM_R"
form = "MRR_0F"
opcode = 0xC1
ops = ["src:gpr", "dst:gpr:inout"]
asm = "xadd {dst}, {src}"

[[instructions]]
name = "BT_RM_R"
form = "MRR_0F"
opcode = 0xA3
ops = ["src:gpr", "src2:gpr"]
asm = "bt {src2}, {src}"

[[instructions]]
name = "BTS_RM_R"
form = "MRR_0F"
opcode = 0xAB
ops = ["src:gpr", "src2:gpr"]
asm = "bts {src2}, {src}"

[[instructions]]
name = "BTR_RM_R"
form = "MRR_0F"
opcode = 0xB3
ops = ["src:gpr", "src2:gpr"]
asm = "btr {src2}, {src}"

[[instructions]]
name = "BTC_RM_R"
form = "MRR_0F"
opcode = 0xBB
ops = ["src:gpr", "src2:gpr"]
asm = "btc {src2}, {src}"

[[instructions]]
name = "MOV_RM8_R64"
roles = ["gpr_mov"]
form = "MRR"
opcode = 0x89
ops = ["src:gpr", "dst:gpr:inout"]
asm = "mov {dst}, {src}"   # v13：与 MOV_RM_R 合并（真重复，生成期去重保留首个）
effect = ["Move"]

[[instructions]]
name = "MOV_R8_RM64"
form = "MRR"
opcode = 0x8B
ops = ["dst:gpr:out", "src:gpr"]
asm = "mov {dst}, {src}"
effect = ["Move"]

[[instructions]]
name = "ADD_R_IMM32"
form = "MRR_EXT"
modrm = { reg = 0, rm = "dst" }
opcode = 0x81
ops = ["dst:gpr:inout", "imm:imm32"]
asm = "add {dst}, {imm}"

[[instructions]]
name = "OR_R_IMM32"
form = "MRR_EXT"
modrm = { reg = 1, rm = "dst" }
opcode = 0x81
ops = ["dst:gpr:inout", "imm:imm32"]
asm = "or {dst}, {imm}"

[[instructions]]
name = "AND_R_IMM32"
form = "MRR_EXT"
modrm = { reg = 4, rm = "dst" }
opcode = 0x81
ops = ["dst:gpr:inout", "imm:imm32"]
asm = "and {dst}, {imm}"

[[instructions]]
name = "SUB_R_IMM32"
form = "MRR_EXT"
modrm = { reg = 5, rm = "dst" }
opcode = 0x81
ops = ["dst:gpr:inout", "imm:imm32"]
asm = "sub {dst}, {imm}"

[[instructions]]
name = "XOR_R_IMM32"
form = "MRR_EXT"
modrm = { reg = 6, rm = "dst" }
opcode = 0x81
ops = ["dst:gpr:inout", "imm:imm32"]
asm = "xor {dst}, {imm}"

[[instructions]]
name = "CMP_R_IMM32"
form = "MRR_EXT"
modrm = { reg = 7, rm = "src" }
opcode = 0x81
ops = ["src:gpr", "imm:imm32"]
asm = "cmp {src}, {imm}"

# ── @sse_rr 简单指令（prefix=field, w=0）──

[[instructions]]
name = "SQRTSD"
