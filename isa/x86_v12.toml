    "and {g2}, {g5}",
    "mov {g4}, {g3}",
    "and {g2}, {g4}",
    "mov RCX, {g1}",
    "SHL_RM_CL {g4}",
    "or {g4}, {g5}",
    "MOV_REG_IMM64 {g1}, 4",
    "MOV_REG_IMM64 {g2}, 0x0F0F0F0F",
    "mov {g3}, {g5}",
    "mov RCX, {g1}",
