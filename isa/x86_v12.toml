fields = { prefix = 0x66, w = 1 }
ops = ["dst:fpr:out", "src:fpr"]
asm = "movq {dst}, {src}"
effect = ["Pure"]

[[instructions]]
name = "MOVQ_FREG_XMM"
form = "MRR_0F_FIX64"
opcode = 0x7E
fields = { prefix = 0x66, w = 1 }
ops = ["dst:fpr:out", "src:fpr"]
asm = "movq {dst}, {src}"
effect = ["Pure"]

[[instructions]]
name = "MOVAPS_MR"
form = "MRR_0F_FIX64"
opcode = 0x29
fields = { prefix = 0, w = 0 }
ops = ["src:gpr", "src2:fpr"]
asm = "movaps {src}, {src2}"
effect = ["Write"]

[[instructions]]
name = "LZCNT_R"
form = "MRR_0F_PREFIX"
opcode = 0xBD
fields = { prefix = 0xF3, w = 0 }
# v14：槽 gprx——宽度由 IR 类型 auto（I32 输入 → 无 REX.W lzcntl 返回 31
# 位语义；I64 → REX.W lzcntq）。固定 _32 变体（LZCNT_R32）已删。
ops = ["dst:gprx:out", "src:gprx"]
asm = "lzcnt {dst}, {src}"
effect = ["Pure"]

[[instructions]]
name = "TZCNT_R"
form = "MRR_0F_PREFIX"
opcode = 0xBC
fields = { prefix = 0xF3, w = 0 }
ops = ["dst:gprx:out", "src:gprx"]
asm = "tzcnt {dst}, {src}"
effect = ["Pure"]

[[instructions]]
name = "POPCNT_R"
form = "MRR_0F_PREFIX"
opcode = 0xB8
fields = { prefix = 0xF3, w = 0 }
ops = ["dst:gprx:out", "src:gprx"]
asm = "popcnt {dst}, {src}"
effect = ["Pure"]

# ── 旋转（迭代 6 续：D3 /0 /1，CL 隐式计数；宽度按结果类型 32/64）──

[[instructions]]
name = "ROL_RM"
form = "MRR_EXT_OP"
modrm = { reg = 0, rm = "dst" }
opcode = 0xD3
effect = ["Pure"]
ops = ["dst:gprx:inout"]
asm = "rol {dst}"

[[instructions]]
name = "ROR_RM"
form = "MRR_EXT_OP"
modrm = { reg = 1, rm = "dst" }
opcode = 0xD3
effect = ["Pure"]
ops = ["dst:gprx:inout"]
asm = "ror {dst}"

# ============================================================
# 调用约定（迭代 5 声明层：arg_class 类别分类，为 YMM by-ref 铺路）
# ============================================================

[stack]
slot = 8
align = 16
fp_save = 8

[abi]
# 帧填充 8（align/2）：prologue push rbp + 7 callee-saved 后 rsp%16==8，
# sub rsp 必须使 call 前 rsp%16==0（Windows x64 ABI）——缺省 0 会让系统
# DLL（如 kernel32!ExitProcess 内部 movdqa）在未对齐栈上 SEGV（0xC0000005）。
frame_padding = 8
# Windows x64：int/float 参数共享位置计数（参数 i → GPR{i}/XMM{i}）
arg_slot = "by-position"
# 溢出 scratch（spill load/store 用；R10/R11）
scratch = ["R10", "R11"]

# Windows x64 栈参数布局：shadow space 32 字节（调用方在 call 前预留）；
# 被调方第 5+ 参数在 [rbp + 2*8 + (k-4)*8]、调用方写 [rsp + 32 + (k-4)*8]。
[abi.stack_args]
callee_base = "fp"
caller_base = "sp"
first_offset_slots = 2
stride_slots = 1
shadow_bytes = 32

[[abi.arg_class]]
class = "int"
regs = ["RCX", "RDX", "R8", "R9"]

[[abi.arg_class]]
class = "float"
regs = ["XMM0", "XMM1", "XMM2", "XMM3"]

[[abi.arg_class]]
class = "vector"
strategy = "by-ref"
limit = 128

[abi.frame]
sp = "RSP"
fp = "RBP"
fp_push_bytes = 8


[abi.callee_saved]
gpr = ["RBX", "RDI", "RSI", "R12", "R13", "R14", "R15"]
xmm = []

# 溢出模板（基址 = RBP 帧指针）——**按值宽分档**（WA-46）：
# 旧实现只有一份 [spill.FPR]，模板是 8 字节 MOVSD，而生成器忽略 width 参数 ⇒
# 任何向量值被 spill 都只搬 8 字节（V128/V256/V512 高半区静默截断；CI 上
# `test_jit_v512_byref_param` 偶发 lane15 错即此因：高半是栈残留）。
# 现按宽度分档：FPR（≤8 字节标量，缺省）/ FPR16 / FPR32 / FPR64；
# 生成器按 `xreg.width()` 分派，>8 字节未声明模板 → **编译期 Unsupported**
#（fail-closed，不再退回 8 字节标量搬运）。
[spill.GPR]
load = "MOV64_RM {0}, {1}"
store = "MOV64_MR {0}, {1}"
base = "RBP"

[spill.FPR]
load = "MOVSD_RM {0}, {1}"
store = "MOVSD_MR {0}, {1}"
base = "RBP"

[spill.FPR16]
load = "MOVUPS_RM {0}, {1}"
store = "MOVUPS_MR {0}, {1}"
base = "RBP"

[spill.FPR32]
load = "VMOVUPS_RM {0}, {1}"
store = "VMOVUPS_MR {0}, {1}"
base = "RBP"

[spill.FPR64]
load = "VMOVUPS_ZMM_MEM {0}, {1}"
store = "VMOVUPS_ZMM_MR {0}, {1}"
base = "RBP"

# 序言/尾声（模板按指令操作数序绑定：MOV64_RR op0=src、op1=dest；
# MOV64_RR RSP, RBP = mov64rr rbp←rsp）
[emit]
align_pad = 0x90   # `.align` 伪指令填充字节 = NOP

[emit.prologue]
insts = ["PUSH RBP", "MOV64_RR RSP, RBP", "@push_callee", "@move_args", "@frame_alloc"]

[emit.epilogue]
insts = ["MOV64_RR RBP, RSP", "SUB64_R_IMM32 RSP, {callee_saved_bytes}", "@pop_callee", "POP RBP", "RET"]

# ── 重定位表（v18 S3d）：指令写 `reloc = "<名>"`，语义与绑定槽在此 ──
# x86 的全局地址用 10 字节移动绝对立即数：fixup = 指令末尾 imm64 的 8 字节，
# 宿主语义 = Absolute(8)（补丁宽度取自槽宽）。
[[reloc]]
name = "abs64"
semantics = "absolute"
slot = "imm64"

# ── 引用名（多态分派）：见各指令的 `ref`（S10e 的 [[aliases]] 已并入指令属性）──
[[lowering]]
op = "Iconst"
insts = ["MOV_REG_IMM64 {out}, {iconst}"]

# ADD_RM_R 语义 add {1}, {0}：dest=op1(inout)、src=op0(in)。
# Iadd:out = a + b → mov out,a; add out,b（{1} = 第二个 IR 操作数）
[[lowering]]
op = "Iadd"
insts = ["mov {out}, {0}", "add {1}, {out}"]

[[lowering]]
op = "Isub"
insts = ["mov {out}, {0}", "sub {1}, {out}"]

[[lowering]]
op = "Band"
insts = ["mov {out}, {0}", "and {1}, {out}"]

[[lowering]]
op = "Bor"
insts = ["mov {out}, {0}", "or {1}, {out}"]

[[lowering]]
op = "Bxor"
insts = ["mov {out}, {0}", "xor {1}, {out}"]

[[lowering]]
op = "Imul"
insts = ["mov {out}, {0}", "IMUL_R_RM {out}, {1}"]

[[lowering]]
op = "Icmp"
insts = ["xor {out}, {out}", "cmp {1}, {0}", "SETCC_RM8 {out}, {cc}"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 8] }
insts = ["MOVZX_R8_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 16] }
insts = ["MOVZX_R16_MEM {out}, [{0}]"]

# 向量（Direct 值）内存 load——WA-37 D3 全宽往返 + W3 宽向量：
# V128（16B）→ movups（0F 10 无前缀，16 字节非对齐）；V64（8B）
# → movsd（低 64 位即 V64 全值；V64 高半无意义）；V256（32B）→ vmovups
# ymm（VEX.256，vex_l=1）；V512（64B）→ vmovups zmm（EVEX，evex_l=2）。
# rd_vec = 结果向量类型字节数（非向量 None）——不误伤 64 位标量/I128 load。
# 宽向量的**硬件前提**由编译入口按字节数守卫（compiler.rs）：>32B 需
# AVX-512F（EVEX），无则显式拒绝（不发射本机无法执行的指令）。
[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 64] }
insts = ["VMOVUPS_512_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 32] }
insts = ["VMOVUPS_256_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 16] }
insts = ["MOVUPS_128_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 8] }
insts = ["MOVSD_R_MEM {out}, [{0}]"]

# 默认（非向量 / 未覆盖宽度）——8 字节 MOV。宽向量**不会**落到这里：
# 32B/64B 有上面的专用规则，其它 >16B 宽度由编译入口显式拒绝。
[[lowering]]
op = "Load"
insts = ["MOV_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_width", 8] }
insts = ["STORE_MEM_R_8 [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 64] }
insts = ["VMOVUPS_512_MEM_R [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 32] }
insts = ["VMOVUPS_256_MEM_R [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 16] }
insts = ["MOVUPS_128_MEM_R [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 8] }
insts = ["MOVSD_MEM_R [{0}], {1}"]

# 默认（非向量 / 未覆盖宽度）——8 字节 store；向量宽度同上（32B/64B 专用
# 规则，其它 >16B 宽度由编译入口显式拒绝）。
[[lowering]]
op = "Store"
insts = ["STORE_MEM_R [{0}], {1}"]

[[lowering]]
op = ["Copy", "Uextend", "Ireduce", "Freeze", "Ptrtoint", "Inttoptr"]
insts = ["mov {out}, {0}"]

# ── Sextend：按源宽分派——8/16 位源 movsx（0F BE/BF，源槽 gpr1b/gpr2
#    movsx 合并助记符自动分发），32 位源 movsxd。原实现恒 movsxd（读低
#    32 符号扩展）——I8 源 0xCE(movzx 206) 被扩成 +206 而非 -50（WA-36
#    i8 signed 值符号扩展实证）。──

[[lowering]]
op = "Sextend"
when = { eq = ["rs1_width", 8] }
insts = ["movsx {out}, {0}"]

[[lowering]]
op = "Sextend"
when = { eq = ["rs1_width", 16] }
insts = ["movsx {out}, {0}"]

[[lowering]]
op = "Sextend"
insts = ["movsxd {out}, {0}"]

[[lowering]]
op = "Bnot"
insts = ["mov {out}, {0}", "NOT_RM {out}"]

[[lowering]]
op = "StackAddr"
insts = ["LEA_R64_SIB {out}, [RBP+{off}]"]

# ── 移位（v11 语义：计数搬 RCX（CL 隐式计数）→ D3 /digit）──

[[lowering]]
op = "Ishl"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "SHL_RM_CL {out}",
]

[[lowering]]
op = "Ushr"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "SHR_RM_CL {out}",
]

[[lowering]]
op = "Sshr"
insts = [
    "movsxd {out}, {0}",
    "mov RCX, {1}",
    "SAR_RM_CL {out}",
]

# ── 除法（v11 语义：movsxd RAX,rs1 + cqo + idiv %t + mov rd,RAX/RDX）──

[[lowering]]
op = "Sdiv"
insts = [
    "mov {g}, {1}",
    "movsxd RAX, {0}",
    "CQO",
    "IDIV_RM {g}",
    "mov {out}, RAX",
]

[[lowering]]
op = "Srem"
insts = [
    "mov {g}, {1}",
    "movsxd RAX, {0}",
    "CQO",
    "IDIV_RM {g}",
    "mov {out}, RDX",
]

[[lowering]]
op = "Udiv"
insts = [
    "xor RDX, RDX",
    "mov RAX, {0}",
    "DIV_RM {1}",
    "mov {out}, RAX",
]

[[lowering]]
op = "Urem"
insts = [
    "xor RDX, RDX",
    "mov RAX, {0}",
    "DIV_RM {1}",
    "mov {out}, RDX",
]

# ════════════════════════════════════════════════════════════════
# 迭代 6 续（JIT 矩阵补齐）——整数全量 lowering
# ════════════════════════════════════════════════════════════════

# ── Select(cond, then, else) = cond ? then : else（v11 修复版）──

[[lowering]]
op = "Select"
insts = [
    "TEST_RM_R {0}, {0}",
    "mov {out}, {2}",
    "CMOVCC_R_RM {out}, {1}, 5",
]

# ── Uextend：按源宽分派（movzx 合并助记符，源槽 gpr1b/gpr2 自动分发）──

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 8] }
insts = ["movzx {out}, {0}"]

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 16] }
insts = ["movzx {out}, {0}"]

[[lowering]]
op = "Rotl"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "ROL_RM {out}",
]

[[lowering]]
op = "Rotr"
insts = [
    "mov {out}, {0}",
    "mov RCX, {1}",
    "ROR_RM {out}",
]

[[lowering]]
op = "Smin"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 13"]

[[lowering]]
op = "Smax"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 14"]

[[lowering]]
op = "Umin"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 3"]

[[lowering]]
op = "Umax"
insts = ["mov {out}, {0}", "cmp {1}, {0}", "CMOVCC_R_RM {out}, {1}, 6"]

# ── Abs：rd = |rs1|（neg + cmovl=12）──

[[lowering]]
op = "Abs"
insts = [
    "mov {g}, {0}",
    "NEG_RM {g}",
    "mov {out}, {0}",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {out}, {g}, 12",
]

# ── 前导/尾随零、popcount、字节交换 ──

[[lowering]]
op = "Clz"
# 32 位输入用 lzcntl（gpr32 类）；否则 64 位 lzcntq——否则 32 位输入
# 被零扩展后 lzcntq 返回 63 而非 31（u32::leading_zeros 错值）。
insts = ["mov {out}, {0}", "LZCNT_R {out}, {0}"]

[[lowering]]
op = "Ctz"
insts = ["mov {out}, {0}", "TZCNT_R {out}, {0}"]

[[lowering]]
op = "Popcnt"
insts = ["mov {out}, {0}", "POPCNT_R {out}, {0}"]

[[lowering]]
op = "Bswap"
insts = ["mov {out}, {0}", "BSWAP_R {out}"]

# ── 空指针判断 / Freeze / Trap / Fence ──

[[lowering]]
op = "IsNull"
insts = ["xor {out}, {out}", "TEST_RM_R {0}, {0}", "SETCC_RM8 {out}, 4"]

[[lowering]]
op = "IsNotNull"
insts = ["xor {out}, {out}", "TEST_RM_R {0}, {0}", "SETCC_RM8 {out}, 5"]

[[lowering]]
op = "Trap"
insts = ["UD2"]

[[lowering]]
op = "Fence"
insts = ["MFENCE"]

# ── Alloca：栈槽地址（current_alloca_offset）──

[[lowering]]
op = "Alloca"
insts = ["LEA_R64_SIB {out}, [RBP+{alloca}]"]

# ── 溢出 6 条：{out}=值、{out2}=flag（seto=0/setb=2）──

[[lowering]]
op = "SaddOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {out2}, 0",
]

[[lowering]]
op = "UaddOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {out2}, 2",
]

[[lowering]]
op = "SsubOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "sub {1}, {out}",
    "SETCC_RM8 {out2}, 0",
]

[[lowering]]
op = "UsubOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "sub {1}, {out}",
    "SETCC_RM8 {out2}, 2",
]

[[lowering]]
op = "SmulOverflow"
insts = [
    "xor {out2}, {out2}",
    "mov {out}, {0}",
    "IMUL_R_RM {out}, {1}",
    "SETCC_RM8 {out2}, 0",
]

[[lowering]]
op = "UmulOverflow"
insts = [
    "mov {out}, {0}",
    "IMUL_R_RM {out}, {1}",
    "xor {out2}, {out2}",
    "cmp {0}, {out}",
    "SETCC_RM8 {out2}, 2",
    "xor {g}, {g}",
    "TEST_RM_R {1}, {1}",
    "SETCC_RM8 {g}, 5",
    "and {g}, {out2}",
]

[[lowering]]
op = "SaddSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {g1}, 0",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFF",
    "MOV_REG_IMM64 {g3}, 0x80000000",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {g4}, {g2}, 9",
    "CMOVCC_R_RM {g4}, {g3}, 8",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g4}, 5",
]

[[lowering]]
op = "SaddSat"
when = { eq = ["rs1_width", 64] }
insts = [
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {g1}, 0",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFFFFFFFFFF",
    "MOV_REG_IMM64 {g3}, 0x8000000000000000",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {g4}, {g2}, 9",
    "CMOVCC_R_RM {g4}, {g3}, 8",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g4}, 5",
]

[[lowering]]
op = "UaddSat"
insts = [
    "mov {out}, {0}",
    "add {1}, {out}",
    "SETCC_RM8 {g1}, 2",
    "MOV_REG_IMM64 {g2}, 0xFFFFFFFFFFFFFFFF",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g2}, 5",
]

[[lowering]]
op = "UsubSat"
insts = [
    "mov {out}, {0}",
    "sub {1}, {out}",
    "SETCC_RM8 {g1}, 2",
    "xor {g2}, {g2}",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g2}, 5",
]

