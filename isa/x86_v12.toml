when = { and = [ { eq = ["rd", 256] }, { in = ["elem", [1, 3]] } ] }
insts = ["VBROADCASTSS {out}, {0}"]

[[lowering]]
op = "Vbroadcast"
when = { and = [ { le = ["rd", 128] }, { in = ["elem", [1, 3]] } ] }
insts = ["MOVSS {out}, {0}", "PUNPCKLDQ {out}, {out}", "PUNPCKLDQ {out}, {out}"]

[[lowering]]
