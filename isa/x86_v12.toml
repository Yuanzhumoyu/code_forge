# 非对齐向量 store（by-ref 调用方侧：实参 → 栈上副本）
[[instructions]]
name = "VMOVUPS_MR"
ref = "vmovups"
roles = [{ role = "wide_vec_store", bits = 256 }]
form = "VEX_RR_MEMREF"
