ops = ["src:fpr", "mem:mem:out"]
asm = "vmovups {src}, {mem}"

# ── 宽向量 IR Load/Store 的 **gpr 基址**形式（W3，2026-09-12）──
# 与 MOVUPS_128_R_MEM 同形：`modrm = { rm = "[reg]" }` = 仅基址 [base]、disp 恒 0
# （v15 ModRM 的 mem+reg 形态）。IR 层的 Load/Store 地址是 lowering 的**寄存器
# 操作数**，而 lowering 模板只能绑定寄存器、无法现场构造 MemRef——故需要这两条。
# 上面的 MemRef 形式（VMOVUPS_RM/MR、VMOVUPS_ZMM_MEM/MR）继续供 ABI by-ref 路径
# （base+disp 由 frame/Call lowering 显式构造，如 `[RSP+off]`）。
# 二者编码键相同（同一机器码的两种操作数建模）；汇编/解码按其操作数形状分发。
[[instructions]]
name = "VMOVUPS_256_R_MEM"
form = "VEX_RR_MEMREF"
modrm = { rm = "[src]" }
opcode = 0x10
fields = { vex_map = 1, vex_pp = 0, vex_w = 0, vex_l = 1 }
ops = ["dst:fpr:out", "src:gpr"]
asm = "vmovups {dst}, [{src}]"

[[instructions]]
name = "VMOVUPS_256_MEM_R"
form = "VEX_RR_MEMREF"
modrm = { rm = "[src2]" }
opcode = 0x11
fields = { vex_map = 1, vex_pp = 0, vex_w = 0, vex_l = 1 }
ops = ["src:fpr", "src2:gpr"]
asm = "vmovups [{src2}], {src}"

