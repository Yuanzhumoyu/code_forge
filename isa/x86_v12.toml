when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 4] }, { ge = ["imm0", 3] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 1", "PSHUFD {f1}, {f1}, 78", "MOVQ_R64_XMM {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["elem", 1] }, { ne = ["imm0", 0] } ] }
insts = ["PSHUFD {f1}, {0}, {imm0}", "MOVSS {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["elem", 3] }, { ne = ["imm0", 0] } ] }
insts = ["PSHUFD {f1}, {0}, {imm0}", "MOVD_IREG_FREG {out}, {f1}"]

[[lowering]]
