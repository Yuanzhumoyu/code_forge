name = "MOV_R_MEM"
form = "MRR_MEM"
modrm = { rm = "[src]" }
opcode = 0x8B
# v14：数据槽 gprx——内存 load 宽度由 IR 类型 auto（I16→66、I32→无
# REX.W、I64→REX.W）。固定 _32 变体已删（WA-35 DSL 修复）。
