# ============================================================
# x86-64 — v12 变长语义键试点（迭代 3：ModRM/REX/opsize/SSE）
# ============================================================
#
# 迁移范围（与 v11 golden 逐字节对比）：
# - @modrm 家族 24 条（mod=11 寄存器形式；opsize 动态或固定 64）
# - @modrm_imm32 6 条（81 /digit + imm32）
# - @sse_rr 简单指令 23 条（0F escape + 固定前缀 + 固定 REX.W）
# 未迁移：@modrm_mem（内存寻址/SIB，迭代 3b）、@sse_rr 家族（opcodes 数组，
# 迭代 4 families）、VEX（迭代 4）、@op_rm/@cmovcc/@setcc/@mov_imm64 等。
#
# v12 变长 form 语义键（迭代 3）：
# - modrm = "rr"（ModRM mod=11：reg=操作数 0、rm=操作数 1）| "ext"
#   （reg=fields.ext 固定扩展码、rm=操作数 0）
# - opsize = "auto"（指令有 opsize 操作数：16 → 0x66 前缀、64 → REX.W=1）
#   | 数字（固定 opsize，无 opsize 操作数）
# - prefix = "field"（fields.prefix：SSE 的 66/F2/F3/0）| 数字（固定）
# - rex_w = "field"（fields.w 固定 REX.W 位）| "auto"（opsize==64）
# - imm = 32（尾部 imm32，符号扩展按槽）
# - 寄存器 = 组内索引 0-15（= x86 物理编号；REX.R/B 由索引高位自动推导）
# 非文本操作数：opsize 槽（kind = "opsize"）asm 无占位符，assemble 默认 64。

[meta]
name = "x86_64_v12"
version = "12.0"
endian = "little"
mode = 64
variable_length = true
max_inst_len = 15

# ─────────────────────────── 寄存器组 ───────────────────────────

[reg.gpr64]
width = 64
names = ["RAX","RCX","RDX","RBX","RSP","RBP","RSI","RDI",
         "R8","R9","R10","R11","R12","R13","R14","R15"]

[reg.xmm]
width = 128
names = ["XMM0","XMM1","XMM2","XMM3","XMM4","XMM5","XMM6","XMM7",
         "XMM8","XMM9","XMM10","XMM11","XMM12","XMM13","XMM14","XMM15"]

# ModRM 约定：RBP(5)/R13(13) 作为基址在 mod=00 时是 RIP-rel/无基址——
# 强制 disp8=0 编码（与 v11 一致）
[conventions.modrm]
force_disp_base = [5, 13]

# ─────────────────────────── 操作数槽 ───────────────────────────

[[operand_slots]]
name = "gpr"
kind = "reg"
class = "gpr64"
field_width = 4
roles = ["in", "out"]

[[operand_slots]]
name = "fpr"
kind = "reg"
class = "xmm"
field_width = 4
roles = ["in", "out"]

[[operand_slots]]
name = "imm32"
kind = "imm"
signed = true
width = 32

[[operand_slots]]
name = "opsize"
kind = "opsize"

[[operand_slots]]
name = "mem"
kind = "mem"
class = "gpr64"

[[operand_slots]]
name = "imm8"
kind = "imm"
signed = false
width = 8

[[operand_slots]]
name = "imm64"
kind = "imm"
signed = false
width = 64

[[operand_slots]]
name = "rel"
kind = "label"
signed = true
width = 32

[[operand_slots]]
name = "cond"
kind = "cond"
width = 8

# ─────────────────────────── 编码形式 ───────────────────────────

[[forms]]
name = "MRR"            # @modrm：reg=op0, rm=op1, opsize auto
modrm = "rr"
opsize = "auto"
opcode_bytes = 1

[[forms]]
name = "MRR_FIX64"      # @modrm：opsize 固定 64（恒 REX.W）
modrm = "rr"
opsize = 64
opcode_bytes = 1

[[forms]]
name = "MRR_0F"         # @modrm + 0F escape
modrm = "rr"
opsize = "auto"
escape = [0x0F]
opcode_bytes = 1

[[forms]]
name = "MRR_0F_FIX64"   # @modrm + 0F escape + opsize 固定 64（MOVQ 系列）
modrm = "rr"
opsize = 64
escape = [0x0F]
opcode_bytes = 1

[[forms]]
name = "MRR_0F38"       # @modrm + 0F 38 escape（PMULLD 等）
modrm = "rr"
opsize = 64
escape = [0x0F, 0x38]
opcode_bytes = 1

[[forms]]
name = "MRR_EXT"        # @modrm_imm32：reg=fields.ext, rm=op0, imm32
modrm = "ext"
opsize = "auto"
imm = 32
opcode_bytes = 1

[[forms]]
name = "SSE_RR"         # @sse_rr：0F opcode /r，prefix=fields.prefix, w=fields.w
modrm = "rr"
escape = [0x0F]
prefix = "field"
rex_w = "field"
opcode_bytes = 1

# ── 内存寻址（迭代 3b：@modrm_mem）──

[[forms]]
name = "VEX_RRV"        # VEX 三操作数：reg=op0, rm=op1, vvvv=~op2（有源）
vex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = "rr"
opcode_bytes = 1

[[forms]]
name = "VEX_RR"         # VEX 两操作数：vvvv=0x0F（无源）
vex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = "rr"
opcode_bytes = 1

[[forms]]
name = "VEX_RRV_IMM"    # VEX 三操作数 + imm8
vex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = "rr"
imm = 8
opcode_bytes = 1

[[forms]]
name = "VEX_RR_IMM"     # VEX 两操作数 + imm8（VEXTRACTF128）
vex = { map = "field", pp = "field", w = "field", l = "field" }
modrm = "rr"
imm = 8
opcode_bytes = 1

[[forms]]
name = "MRR_EXT_OP"       # @op_rm：F7 /digit（reg=fields.ext, rm=op0，无 imm）
modrm = "ext"
opsize = "auto"
opcode_bytes = 1

[[forms]]
name = "EXT_0F"           # ext + 0F escape（SETCC 0F 90+cc /r）
modrm = "ext"
escape = [0x0F]
opcode_bytes = 1

[[forms]]
name = "MRR_EXT64_IMM32"  # @op_rm_imm32：REX.W + 81 /digit + imm32（64 位专用）
modrm = "ext"
opsize = 64
imm = 32
opcode_bytes = 1

[[forms]]
name = "SSE_RR_IMM8"      # @sse_rr_imm8：prefix + 0F + opcode + /r + imm8
modrm = "rr"
escape = [0x0F]
prefix = "field"
rex_w = "field"
imm = 8
opcode_bytes = 1

[[forms]]
name = "PUSH_REG"         # 50+r（push r64；reg≥8 → REX.B 41）
opcode_reg = 0x50
opcode_bytes = 1

[[forms]]
name = "POP_REG"          # 58+r
opcode_reg = 0x58
opcode_bytes = 1

[[forms]]
name = "MOV_IMM64"        # REX.W + B8+r + imm64
opcode_reg = 0xB8
rex_w = "always"
imm = 64
opcode_bytes = 1

[[forms]]
name = "BSWAP_R"          # REX.W + 0F C8+r
opcode_reg = 0xC8
rex_w = "always"
escape = [0x0F]
opcode_bytes = 1

[[forms]]
name = "MRR_MEM"          # [reg 基址 + disp 0]；无 escape（XCHG/MOV_R_MEM/STORE_MEM_R）
modrm = "rm_mem"
opsize = "auto"
opcode_bytes = 1

[[forms]]
name = "MRR_MEM_0F"       # 内存 + 0F escape + prefix=field（XADD 0F C1 双字节）
modrm = "rm_mem"
opsize = "auto"
escape = [0x0F]
prefix = "field"
opcode_bytes = 1

[[forms]]
name = "MRR_MEM_PRE"      # 内存 + prefix=field、无 escape（LOCK 原子族 29/21/09/31）
modrm = "rm_mem"
opsize = "auto"
prefix = "field"
opcode_bytes = 1

[[forms]]
name = "MRR_MEM_0F_FIX32" # 内存 + 0F + prefix=field + opsize 32（MOVSD 内存标量）
modrm = "rm_mem"
opsize = 32
escape = [0x0F]
prefix = "field"
opcode_bytes = 1

[[forms]]
name = "MRR_MEMREF"       # MemRef 内存（base+disp）+ opsize 64（spill）
modrm = "rm_memref"
opsize = 64
opcode_bytes = 1

[[forms]]
name = "MRR_MEMREF_F2"    # MemRef + F2 0F + opsize 32（MOVSD_RM/MR）
modrm = "rm_memref"
opsize = 32
escape = [0x0F]
prefix = "field"
opcode_bytes = 1

[[forms]]
name = "REL32"            # 直接相对跳转/调用：opcode + rel32（无 ModRM）
imm = 32
opcode_bytes = 1

[[forms]]
name = "NOOP"             # 无操作数：单字节 opcode（RET 0xC3 等）
opcode_bytes = 1

[[forms]]
name = "NOOP_ESC"         # 无操作数 + escape（NOP 0F 0B、MFENCE 0F AE F0、CQO 48 99）
escape = [0x0F]
opcode_bytes = 1

[[forms]]
name = "REL32_ESC"        # rel32 + escape（JCC_REL32: 0F cond rel32）
escape = [0x0F]
imm = 32
opcode_bytes = 1

[[forms]]
name = "OP_EXT"           # FF /digit（CALL_RM FF /2: modrm.ext=2、rm=op0）
modrm = "ext"
opcode_bytes = 1

