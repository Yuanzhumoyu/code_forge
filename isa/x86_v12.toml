# ============================================================
# 调用约定（迭代 5 声明层：arg_class 类别分类，为 YMM by-ref 铺路）
# ============================================================

[abi]
stack_align = 16

[[abi.arg_class]]
class = "int"
regs = ["RCX", "RDX", "R8", "R9"]

[[abi.arg_class]]
class = "float"
regs = ["XMM0", "XMM1", "XMM2", "XMM3"]

[[abi.arg_class]]
class = "vector"
strategy = "by-ref"
limit = 128

[abi.frame]
sp = "RSP"
fp = "RBP"
alloc_inst = "SUB64_R_IMM32"
free_inst = "ADD64_R_IMM32"
fp_push_bytes = 8

[abi.callee_saved]
gpr = ["RBX", "RDI", "RSI", "R12", "R13", "R14", "R15"]
xmm = []

# 溢出模板（基址 = RBP 帧指针）
[spill.GPR]
load = "MOV64_RM {0}, {1}"
store = "MOV64_MR {0}, {1}"
base = "RBP"

[spill.FPR]
load = "MOVSD_RM {0}, {1}"
store = "MOVSD_MR {0}, {1}"
base = "RBP"

# 序言/尾声（模板按指令操作数序绑定：MOV64_RR op0=src、op1=dest；
# MOV64_RR RSP, RBP = mov64rr rbp←rsp）
[emit.prologue]
insts = ["PUSH RBP", "MOV64_RR RSP, RBP", "@push_callee", "@move_args", "@frame_alloc"]

[emit.epilogue]
insts = ["MOV64_RR RBP, RSP", "SUB64_R_IMM32 RSP, 56", "@pop_callee", "POP RBP", "RET"]

# ============================================================
# 指令选择（迭代 5 声明层：符号化操作数 {out}/{0}/{1}）
# ============================================================

# 常量：MOV_REG_IMM64 {out}, {iconst}——{iconst} 从常量池解析（index → 值）。
[[lowering]]
op = "Iconst"
insts = ["MOV_REG_IMM64 {out}, {iconst}"]

# ADD_RM_R 语义 add {1}, {0}：dest=op1(inout)、src=op0(in)。
# Iadd:out = a + b → mov out,a; add out,b（{1} = 第二个 IR 操作数）
[[lowering]]
op = "Iadd"
insts = ["MOV_R_RM {out}, {0}", "ADD_RM_R {1}, {out}"]

[[lowering]]
op = "Isub"
insts = ["MOV_R_RM {out}, {0}", "SUB_RM_R {1}, {out}"]

[[lowering]]
op = "Band"
insts = ["MOV_R_RM {out}, {0}", "AND_RM_R {1}, {out}"]

[[lowering]]
op = "Bor"
insts = ["MOV_R_RM {out}, {0}", "OR_RM_R {1}, {out}"]

[[lowering]]
op = "Bxor"
insts = ["MOV_R_RM {out}, {0}", "XOR_RM_R {1}, {out}"]

[[lowering]]
op = "Imul"
insts = ["MOV_R_RM {out}, {0}", "IMUL_R_RM {out}, {1}"]

[[lowering]]
op = "Icmp"
insts = ["XOR_RM_R {out}, {out}", "CMP_RM_R {0}, {1}", "SETCC_RM8 {out}, {cc}"]

# ── mini_c 核心（迭代 6 续：load/store/copy/extend/not）──

[[lowering]]
op = "Load"
insts = ["MOV_R_MEM {out}, {0}"]

[[lowering]]
op = "Store"
insts = ["STORE_MEM_R {0}, {1}"]

[[lowering]]
op = "Copy"
insts = ["MOV_R_RM {out}, {0}"]

[[lowering]]
op = "Sextend"
insts = ["MOVSXD_R_GPR {out}, {0}"]

[[lowering]]
op = "Bnot"
insts = ["MOV_R_RM {out}, {0}", "NOT_RM {out}"]

[[lowering]]
op = "StackAddr"
insts = ["LEA_R64_SIB {out}, [RBP+{off}]"]