when = { and = [ { eq = ["elem", 2] }, { ne = ["imm0", 0] } ] }
insts = ["PSHUFD {f1}, {0}, 78", "MOVSD {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { eq = ["elem", 4] }
insts = ["PSHUFD {f1}, {0}, 78", "MOVQ_R64_XMM {out}, {f1}"]

# ── Vinsert（标量写入 lane0；V256 拆低半修改后拼回）──

[[lowering]]
op = "Vinsert"
when = { and = [ { eq = ["rd", 256] }, { in = ["elem", [1, 3]] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 0", "MOVSS {f1}, {1}", "VINSERTF128 {out}, {0}, {f1}, 0"]

[[lowering]]
op = "Vinsert"
when = { and = [ { le = ["rd", 128] }, { in = ["elem", [1, 3]] } ] }
insts = ["MOVAPS {out}, {0}", "MOVSS {out}, {1}"]

[[lowering]]
op = "Vinsert"
when = { and = [ { eq = ["rd", 256] }, { in = ["elem", [2, 4]] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 0", "MOVSD {f1}, {1}", "VINSERTF128 {out}, {0}, {f1}, 0"]

[[lowering]]
op = "Vinsert"
when = { le = ["rd", 128] }
insts = ["MOVAPS {out}, {0}", "MOVSD {out}, {1}"]

# ── Vbroadcast（标量广播）──

[[lowering]]
