# ════════════════════════════════════════════════════════════
# 迭代 10（Phase 7 收尾）——缺口补齐
# ════════════════════════════════════════════════════════════

# ── SsubSat（饱和减：SUB + 溢出方向 clamp；SaddSat 的 SUB 变体）──

[[lowering]]
op = "SsubSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "mov {out}, {0}",
    "sub {1}, {out}",
    "SETCC_RM8 {g1}, 0",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFF",
    "MOV_REG_IMM64 {g3}, 0x80000000",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {g4}, {g2}, 9",
    "CMOVCC_R_RM {g4}, {g3}, 8",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g4}, 5",
]

[[lowering]]
op = "SsubSat"
when = { eq = ["rs1_width", 64] }
insts = [
    "mov {out}, {0}",
    "sub {1}, {out}",
    "SETCC_RM8 {g1}, 0",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFFFFFFFFFF",
    "MOV_REG_IMM64 {g3}, 0x8000000000000000",
    "TEST_RM_R {0}, {0}",
    "CMOVCC_R_RM {g4}, {g2}, 9",
    "CMOVCC_R_RM {g4}, {g3}, 8",
    "TEST_RM_R {g1}, {g1}",
    "CMOVCC_R_RM {out}, {g4}, 5",
]

# ── Ptrtoint / Inttoptr：x86 指针 = i64，直拷 ──

[[lowering]]
op = "Ptrtoint"
insts = ["mov {out}, {0}"]

[[lowering]]
op = "Inttoptr"
insts = ["mov {out}, {0}"]

# ── Undef / Poison：清零（Poison 语义为 deferred UB，任意值可接受）──

[[lowering]]
op = "Undef"
insts = ["xor {out}, {out}"]

[[lowering]]
op = "Poison"
insts = ["xor {out}, {out}"]

# ── GlobalAddr：mov 符号地址 + ABS8 重定位（JIT 符号表按 "G{id}" 注册；
#    编码层 imm<0 表示 GlobalId，encoder 转 ABS8 reloc，非 JIT 后端同样可用）──

[[lowering]]
op = "GlobalAddr"
insts = ["MOVABS_GLOBAL {out}, {global}"]

# ── 原子（Phase 7）：AtomicRmw 的 op 判别值 = immediates[0]（imm0 谓词：
#    Xchg=0、Add=1、Sub=2；And/Or/Xor/Nand/Max/Min/Umax/Umin/Fadd/Fsub 需
#    CMPXCHG 循环或软件序列 → 编译期 Unsupported）。
#    XADD/XCHG 均返回旧值（dest 寄存器 ← 旧内存值），正好是 AtomicRmw 语义。
#    v14：dest 用结果 {out} 而非 DSL 临时 {g1}——{g1} 恒 64 位池（xadd/xchg
#    对 i32 原子 8 字节越界，v13 单 static 侥幸）；{out} 是 IR 结果（类型 =
#    val 类型登记 xreg_types → 回填 gprx 按类型宽度，i32→32 位 xadd/xchg 无
#    越界）。val 先拷到 out（val 不被覆盖），指令后 out = 旧内存值 = 返回
#    语义（无需末次 mov）。窄域（1/2 字节）仍走 intrinsics cmpxchg 循环。

[[lowering]]
op = "AtomicRmw"
when = { eq = ["imm0", 0] }
insts = [
    "mov {out}, {1}",
    "XCHG_MEM_R {out}, [{0}]",
]

[[lowering]]
op = "AtomicRmw"
when = { eq = ["imm0", 1] }
insts = [
    "mov {out}, {1}",
    "xadd {out}, [{0}]",
]

[[lowering]]
op = "AtomicRmw"
when = { eq = ["imm0", 2] }
insts = [
    "mov {out}, {1}",
    "NEG_RM {out}",
    "xadd {out}, [{0}]",
]

# ── Cmpxchg：RAX = 期望值（隐式累加器）→ LOCK CMPXCHG [ptr], new →
#    RAX = 旧值（不相等时写回 RAX）。单结果（旧值）；成功标志未展开
#    （IR 层 struct 展开走 extractvalue，x86 后端暂不支持）。
#    v14：16/32/64 数据宽度经 gprx 槽 auto（66/REX.W）；8 位独立 opcode
#    0F B0（隐式 AL）按 rs2_width==8 分派。

[[lowering]]
op = "Cmpxchg"
when = { eq = ["rs2_width", 8] }
insts = [
    "mov RAX, {1}",
    "CMPXCHG_MEM_R_8 {2}, {0}",
    "mov {out}, RAX",
]

[[lowering]]
op = "Cmpxchg"
insts = [
    "mov RAX, {1}",
    "CMPXCHG_MEM_R {2}, {0}",
    "mov {out}, RAX",
]

# ── Nop：无操作（GetElementPtr 已在编译期 expand_geps 展开为 Copy+mul+add，
#    无需 TOML 规则——见 compiler.rs expand_geps）──

[[lowering]]
op = "Nop"
insts = ["NOP"]

# ── Frem（fmod = a - b*trunc(a/b)；ROUNDS{S,D} imm8=3 是向零截断）──

[[lowering]]
op = "Frem"
when = { eq = ["elem", 1] }
insts = [
    "MOVSS {f1}, {0}",
    "DIVSS {f1}, {1}",
    "ROUNDSS_I {f1}, {f1}, 3",
    "MULSS {f1}, {1}",
    "MOVSS {out}, {0}",
    "SUBSS {out}, {f1}",
]

[[lowering]]
op = "Frem"
insts = [
    "MOVSD {f1}, {0}",
    "DIVSD {f1}, {1}",
    "ROUNDSD_I {f1}, {f1}, 3",
    "MULSD {f1}, {1}",
    "MOVSD {out}, {0}",
    "SUBSD {out}, {f1}",
]
