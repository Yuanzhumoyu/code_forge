# ============================================================
# 指令选择（迭代 5 声明层：符号化操作数 {out}/{0}/{1}）
# ============================================================

# 常量：MOV_REG_IMM64 {out}, {iconst}——{iconst} 从常量池解析（index → 值）。

[[lowering]]
op = "Iconst"
insts = ["MOV_REG_IMM64 {out}, {iconst}"]

# ADD_RM_R 语义 add {1}, {0}：dest=op1(inout)、src=op0(in)。
# Iadd:out = a + b → mov out,a; add out,b（{1} = 第二个 IR 操作数）
[[lowering]]
op = "Iadd"
insts = ["mov {out}, {0}", "add {1}, {out}"]

[[lowering]]
op = "Isub"
insts = ["mov {out}, {0}", "sub {1}, {out}"]

[[lowering]]
op = "Band"
insts = ["mov {out}, {0}", "and {1}, {out}"]

[[lowering]]
op = "Bor"
insts = ["mov {out}, {0}", "or {1}, {out}"]

[[lowering]]
op = "Bxor"
insts = ["mov {out}, {0}", "xor {1}, {out}"]

[[lowering]]
op = "Imul"
insts = ["mov {out}, {0}", "IMUL_R_RM {out}, {1}"]

[[lowering]]
op = "Icmp"
when = { eq = ["rs1_width", 32] }
insts = ["xor {out}, {out}", "cmp {1}, {0}", "SETCC_RM8 {out}, {cc}"]

[[lowering]]
op = "Icmp"
insts = ["xor {out}, {out}", "cmp {1}, {0}", "SETCC_RM8 {out}, {cc}"]

# ── mini_c 核心（迭代 6 续：load/store/copy/extend/not）──
# Load/Store 按内存宽度（u8 → 1 字节、i16 → 2、i32 → 4、i64 → 8）：宽
# load/store 越界（曾致 params/loop/除法 5 用例失败；u8 曾 8 字节读侥幸）。
# v14：窄 load（8/16 位）用 movzx 内存形式——零扩展写全 64 位寄存器（窄值
# 高位约定 lib.rs），否则后续 32 位 cmp/算术带高位垃圾（u8 比较误判实证）；
# mov gprx auto 16/32/64（mem/store 统一）；8 位 store 独立 opcode 88（gpr1b）。

[[lowering]]
op = "Load"
when = { eq = ["rd", 8] }
insts = ["MOVZX_R8_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 16] }
insts = ["MOVZX_R16_MEM {out}, [{0}]"]

# ≤16B 向量（Direct XMM 值）内存 load——WA-37 D3 全宽往返：
# V128（16B）→ movups（0F 10 无前缀，16 字节非对齐）；V64（8B）
# → movsd（低 64 位即 V64 全值；V64 高半无意义）。rd_vec = 结果向量
# 类型字节数（非向量 None）——不误伤 64 位标量/I128 load。
[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 16] }
insts = ["MOVUPS_128_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Load"
when = { eq = ["rd_vec", 8] }
insts = ["MOVSD_R_MEM {out}, [{0}]"]

# 注：>16B 向量（V256 32B / V512 64B）的 Load/Store **无规则**——ISA 类模型
# 只有 XMM（fpr16）/ZMM（fpr32）槽类，缺 YMM(32B) 类，规则无法表达
# （曾落到下方默认 8 字节 MOV_R_MEM → 静默截断）。现由编译入口
# **显式拒绝** >16B 向量 Load/Store（compiler.rs，fail-closed）。
[[lowering]]
op = "Load"
insts = ["MOV_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_width", 8] }
insts = ["STORE_MEM_R_8 [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 16] }
insts = ["MOVUPS_128_MEM_R [{0}], {1}"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_vec", 8] }
insts = ["MOVSD_MEM_R [{0}], {1}"]

# 注：>16B 向量 store 同 Load（无 YMM/ZMM 槽类可表达）→ 编译入口显式拒绝。
[[lowering]]
op = "Store"
insts = ["STORE_MEM_R [{0}], {1}"]

[[lowering]]
op = "Copy"
insts = ["mov {out}, {0}"]

# ── Sextend：按源宽分派——8/16 位源 movsx（0F BE/BF，源槽 gpr1b/gpr2
#    movsx 合并助记符自动分发），32 位源 movsxd。原实现恒 movsxd（读低
#    32 符号扩展）——I8 源 0xCE(movzx 206) 被扩成 +206 而非 -50（WA-36
#    i8 signed 值符号扩展实证）。──

[[lowering]]
op = "Sextend"
when = { eq = ["rs1_width", 8] }
insts = ["movsx {out}, {0}"]

[[lowering]]
op = "Sextend"
when = { eq = ["rs1_width", 16] }
insts = ["movsx {out}, {0}"]

[[lowering]]
op = "Sextend"
insts = ["movsxd {out}, {0}"]

[[lowering]]
op = "Bnot"
insts = ["mov {out}, {0}", "NOT_RM {out}"]

[[lowering]]
op = "StackAddr"
insts = ["LEA_R64_SIB {out}, [RBP+{off}]"]

# ── 移位（v11 语义：计数搬 RCX（CL 隐式计数）→ D3 /digit）──

[[lowering]]
