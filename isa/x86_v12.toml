# ── Vsplit（宽向量 → 128 位片段）/ Vconcat（128×2 → 宽向量）──

[[lowering]]
op = "Vsplit"
when = { eq = ["imm0", 0] }
insts = ["VEXTRACTF128 {0}, {out}, 0"]

[[lowering]]
op = "Vsplit"
when = { eq = ["imm0", 1] }
insts = ["VEXTRACTF128 {0}, {out}, 1"]

[[lowering]]
op = "Vconcat"
insts = ["VINSERTF128 {out}, {0}, {1}, 1"]

# ── ShuffleVector（SHUFPS 双源重排；V256 拆半）──

[[lowering]]
op = "ShuffleVector"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 1] } ] }
insts = [
    "VEXTRACTF128 {0}, {f1}, 0",
    "VEXTRACTF128 {1}, {f2}, 0",
    "SHUFPS {f1}, {f2}, {shufps_imm8}",
    "VEXTRACTF128 {0}, {f3}, 1",
    "VEXTRACTF128 {1}, {f4}, 1",
    "SHUFPS {f3}, {f4}, {shufps_imm8_hi}",
    "VINSERTF128 {out}, {f1}, {f3}, 1",
]

[[lowering]]
op = "ShuffleVector"
when = { eq = ["elem", 1] }
insts = ["MOVAPS {out}, {0}", "SHUFPS {out}, {1}, {shufps_imm8}"]

# ── Vconst（常量池 lane 恢复 → XMM/YMM）──

[[lowering]]
op = "Vconst"
