    "MOV_REG_IMM64 {g1}, 4",
    "MOV_REG_IMM64 {g2}, 0x0F0F0F0F0F0F0F0F",
    "mov {g3}, {g5}",
    "mov RCX, {g1}",
    "SHR_RM_CL {g3}",
    "and {g2}, {g3}",
    "mov {g4}, {g5}",
    "and {g2}, {g4}",
    "mov RCX, {g1}",
    "SHL_RM_CL {g4}",
    "or {g4}, {g3}",
    "mov {out}, {g3}",
    "BSWAP_R {out}",
]

# ════════════════════════════════════════════════════════════
# 迭代 7（Phase 4）——标量浮点全量 lowering
# ════════════════════════════════════════════════════════════
# 谓词属性：elem = 结果类型 id（F32=1、F64=2、I32=3、I64=4）、
# rs1_width = 源 1 宽度（位）、cond = Fcmp 条件 id（见 fcmp_id 映射）。

# ── Fadd/Fsub/Fmul/Fdiv（F32 → SS 族 / F64 → SD 族）──

[[lowering]]
op = "Fadd"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "ADDSS {out}, {1}"]

[[lowering]]
op = "Fadd"
insts = ["MOVSD {out}, {0}", "ADDSD {out}, {1}"]

[[lowering]]
op = "Fsub"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "SUBSS {out}, {1}"]

[[lowering]]
op = "Fsub"
insts = ["MOVSD {out}, {0}", "SUBSD {out}, {1}"]

[[lowering]]
op = "Fmul"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "MULSS {out}, {1}"]

[[lowering]]
op = "Fmul"
insts = ["MOVSD {out}, {0}", "MULSD {out}, {1}"]

[[lowering]]
op = "Fdiv"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "DIVSS {out}, {1}"]

[[lowering]]
op = "Fdiv"
insts = ["MOVSD {out}, {0}", "DIVSD {out}, {1}"]

# ── Fneg / Fabs（符号位掩码：XORPS/ANDPD 与 XORPD/ANDPD）──

[[lowering]]
op = "Fneg"
when = { eq = ["elem", 1] }
insts = [
    "MOVSS {out}, {0}",
    "MOV_REG_IMM64 {g}, 0x80000000",
    "MOVQ_XMM_R64 {f}, {g}",
    "XORPS {out}, {f}",
]

[[lowering]]
op = "Fneg"
insts = [
    "MOVSD {out}, {0}",
    "MOV_REG_IMM64 {g}, 0x8000000000000000",
    "MOVQ_XMM_R64 {f}, {g}",
    "XORPD {out}, {f}",
]

[[lowering]]
op = "Fabs"
when = { eq = ["elem", 1] }
insts = [
    "MOVSS {out}, {0}",
    "MOV_REG_IMM64 {g}, 0x7FFFFFFF",
    "MOVQ_XMM_R64 {f}, {g}",
    "ANDPS {out}, {f}",
]

[[lowering]]
op = "Fabs"
insts = [
    "MOVSD {out}, {0}",
    "MOV_REG_IMM64 {g}, 0x7FFFFFFFFFFFFFFF",
    "MOVQ_XMM_R64 {f}, {g}",
    "ANDPD {out}, {f}",
]

# ── Fsqrt ──

[[lowering]]
op = "Fsqrt"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "SQRTSS {out}, {0}"]

[[lowering]]
op = "Fsqrt"
insts = ["MOVSD {out}, {0}", "SQRTSD {out}, {0}"]

# ── Fmin / Fmax ──

[[lowering]]
op = "Fmin"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "MINSS {out}, {1}"]

[[lowering]]
op = "Fmin"
insts = ["MOVSD {out}, {0}", "MINSD {out}, {1}"]

[[lowering]]
op = "Fmax"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "MAXSS {out}, {1}"]

[[lowering]]
op = "Fmax"
insts = ["MOVSD {out}, {0}", "MAXSD {out}, {1}"]

# ── Fma：a*b + c（mul + add 序列）──

[[lowering]]
op = "Fma"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "MULSS {out}, {1}", "ADDSS {out}, {2}"]

[[lowering]]
op = "Fma"
insts = ["MOVSD {out}, {0}", "MULSD {out}, {1}", "ADDSD {out}, {2}"]

# ── [[pattern]]（S6）：Fadd(Fmul(a,b), c) → mul+add 融合 ──
# 树型多 op 匹配：内部节点 Fmul 要求单 use、同块，整棵子树 fused 成 3 条
# 指令（movss/mulss/addss 或 movsd/mulsd/addsd）。与逐条 lowering（Fmul 2 条
# + Fadd 2 条 = 4 条，且各带一条 mov 拷贝）相比省 1 条 mov。叶变量按树
# DFS 序编号：{a}→0、{b}→1、{c}→2。

[[pattern]]
match = "Fadd(Fmul(a, b), c)"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {a}", "MULSS {out}, {b}", "ADDSS {out}, {c}"]

[[pattern]]
match = "Fadd(Fmul(a, b), c)"
when = { eq = ["elem", 2] }
insts = ["MOVSD {out}, {a}", "MULSD {out}, {b}", "ADDSD {out}, {c}"]

# ── 舍入（ROUNDSD/ROUNDSS：0=near, 1=floor, 2=ceil）──

[[lowering]]
op = "Ffloor"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "ROUNDSS_I {out}, {0}, 1"]

[[lowering]]
op = "Ffloor"
insts = ["MOVSD {out}, {0}", "ROUNDSD_I {out}, {0}, 1"]

[[lowering]]
op = "Fceil"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "ROUNDSS_I {out}, {0}, 2"]

[[lowering]]
op = "Fceil"
insts = ["MOVSD {out}, {0}", "ROUNDSD_I {out}, {0}, 2"]

[[lowering]]
op = "Fround"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "ROUNDSS_I {out}, {0}, 0"]

[[lowering]]
op = "Fround"
insts = ["MOVSD {out}, {0}", "ROUNDSD_I {out}, {0}, 0"]

# ── Ftrunc：截断到 0（cvtt 无条件截断 + 往返；64 位整数域）──

[[lowering]]
op = "Ftrunc"
when = { eq = ["elem", 1] }
insts = ["MOVSS {out}, {0}", "CVTTSS2SI {g}, {0}", "CVTSI2SS {out}, {g}"]

[[lowering]]
op = "Ftrunc"
insts = ["MOVSD {out}, {0}", "CVTTSD2SI {g}, {0}", "CVTSI2SD {out}, {g}"]

# ── Fpext（f32 → f64）/ Fptrunc（f64 → f32）──

[[lowering]]
op = "Fpext"
insts = ["MOVSS {out}, {0}", "CVTSS2SD {out}, {0}"]

[[lowering]]
op = "Fptrunc"
insts = ["MOVSD {out}, {0}", "CVTSD2SS {out}, {0}"]

# ── Fconst：常量池浮点位模式 → GPR → XMM ──

[[lowering]]
op = "Fconst"
insts = ["MOV_REG_IMM64 {g}, {fconst}", "MOVQ_XMM_R64 {out}, {g}"]

# ── Fload / Fstore（按元素类型分派 MOVSS/MOVSD 内存版；base=地址寄存器）──

[[lowering]]
op = "Fload"
when = { eq = ["elem", 1] }
insts = ["MOVSS_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Fload"
insts = ["MOVSD_R_MEM {out}, [{0}]"]

[[lowering]]
op = "Fstore"
# Fstore 无结果指令——`elem`（取 results）恒 None，会永远落 movsd
# （F32 存 8 字节 → 覆盖相邻槽；float_array_construct/SIMD 反汇编实证
# movsd 而非 movss）。改按 rs1_width（args.first() = 被存值，F32 → 32）
# 分派，与 Fload 的 elem（结果类型）语义对称。
when = { eq = ["rs1_width", 32] }
insts = ["MOVSS_MEM_R [{0}], {1}"]

[[lowering]]
op = "Fstore"
insts = ["MOVSD_MEM_R [{0}], {1}"]

# ── 转换：Sitofp（整数 → 浮点；rs1_width 源宽度、elem 结果类型）──

[[lowering]]
op = "Sitofp"
when = { and = [ { eq = ["rs1_width", 32] }, { eq = ["elem", 2] } ] }
insts = ["CVTSI2SD {out}, {0}"]

[[lowering]]
op = "Sitofp"
when = { and = [ { eq = ["rs1_width", 64] }, { eq = ["elem", 2] } ] }
insts = ["CVTSI2SD {out}, {0}"]

[[lowering]]
op = "Sitofp"
when = { and = [ { eq = ["rs1_width", 32] }, { eq = ["elem", 1] } ] }
insts = ["CVTSI2SS {out}, {0}"]

[[lowering]]
op = "Sitofp"
when = { eq = ["rs1_width", 64] }
insts = ["CVTSI2SS {out}, {0}"]

# ── Fptosi（浮点 → 整数，截断向零；elem 结果整数类型）──

[[lowering]]
op = "Fptosi"
when = { and = [ { eq = ["rs1_width", 64] }, { in = ["elem", [3, 4]] } ] }
insts = ["CVTTSD2SI {out}, {0}"]

[[lowering]]
op = "Fptosi"
when = { and = [ { eq = ["rs1_width", 32] }, { eq = ["elem", 4] } ] }
insts = ["CVTTSS2SI {out}, {0}"]

[[lowering]]
op = "Fptosi"
when = { eq = ["rs1_width", 32] }
insts = ["CVTTSS2SI {out}, {0}"]

# ── Fptoui / Uitofp（无符号；32 位域精确，u64 ≥ 2^63 边界 Phase 7）──

[[lowering]]
op = "Fptoui"
when = { and = [ { eq = ["rs1_width", 64] }, { in = ["elem", [3, 4]] } ] }
insts = ["CVTTSD2SI {out}, {0}"]

[[lowering]]
op = "Fptoui"
when = { and = [ { eq = ["rs1_width", 32] }, { eq = ["elem", 3] } ] }
insts = ["CVTTSS2SI {out}, {0}"]

[[lowering]]
op = "Fptoui"
when = { eq = ["rs1_width", 32] }
insts = ["CVTTSS2SI {out}, {0}"]

[[lowering]]
op = "Uitofp"
when = { and = [ { eq = ["rs1_width", 32] }, { eq = ["elem", 2] } ] }
insts = ["mov {g}, {0}", "CVTSI2SD {out}, {g}"]

[[lowering]]
op = "Uitofp"
when = { and = [ { eq = ["rs1_width", 32] }, { eq = ["elem", 1] } ] }
insts = ["mov {g}, {0}", "CVTSI2SS {out}, {g}"]

[[lowering]]
op = "Uitofp"
when = { and = [ { eq = ["rs1_width", 64] }, { eq = ["elem", 2] } ] }
insts = ["CVTSI2SD {out}, {0}"]

[[lowering]]
op = "Uitofp"
when = { eq = ["rs1_width", 64] }
insts = ["CVTSI2SS {out}, {0}"]

# ── Fcopysign：GPR 位操作（F32 → 32 位掩码 / F64 → 64 位掩码；
#    F32 结果只取低 32 位，高 32 位无定义）──

[[lowering]]
op = "Fcopysign"
when = { eq = ["elem", 1] }
insts = [
    "MOVQ_R64_XMM {g}, {0}",
    "MOVQ_R64_XMM {g2}, {1}",
    "MOV_REG_IMM64 {g3}, 0x80000000",
    "mov {g4}, {g3}",
    "NOT_RM {g4}",
    "and {g4}, {g}",
    "and {g3}, {g2}",
    "or {g2}, {g}",
    "MOVQ_XMM_R64 {out}, {g}",
]

[[lowering]]
op = "Fcopysign"
insts = [
    "MOVQ_R64_XMM {g}, {0}",
    "MOVQ_R64_XMM {g2}, {1}",
    "MOV_REG_IMM64 {g3}, 0x8000000000000000",
    "mov {g4}, {g3}",
    "NOT_RM {g4}",
    "and {g4}, {g}",
    "and {g3}, {g2}",
    "or {g2}, {g}",
    "MOVQ_XMM_R64 {out}, {g}",
]

# ── Fcmp：cond 属性（fcmp_id）分派 16 条件 × F32/F64 ──
# COMISD/COMISS 标志：ZF=相等、CF=a<b、PF=无序（NaN）。
# o* 有序条件须 ∧ !PF（setnp）；u* 无序-or 条件 = 单 setcc 或 ∨ 组合。

# 形状 A：单 setcc（8 个条件码）

[[lowering]]
op = "Fcmp"
when = { eq = ["elem", 1] }   # f32
vary = { cond = [1, 2, 4, 7, 8, 11, 14, 15], k = [11, 10, 5, 7, 3, 4, 2, 6] }
insts = ["xor {out}, {out}", "COMISS {0}, {1}", "SETCC_RM8 {out}, {k}"]

[[lowering]]
op = "Fcmp"
vary = { cond = [1, 2, 4, 7, 8, 11, 14, 15], k = [11, 10, 5, 7, 3, 4, 2, 6] }
insts = ["xor {out}, {out}", "COMISD {0}, {1}", "SETCC_RM8 {out}, {k}"]

# 形状 B：setcc 11（非 NaN）与 setcc k 取交——有序比较

[[lowering]]
op = "Fcmp"
when = { eq = ["elem", 1] }   # f32
vary = { cond = [3, 5, 6], k = [4, 2, 6] }
insts = ["xor {out}, {out}", "COMISS {0}, {1}", "SETCC_RM8 {out}, 11", "SETCC_RM8 {g}, {k}", "and {g}, {out}"]

[[lowering]]
op = "Fcmp"
vary = { cond = [3, 5, 6], k = [4, 2, 6] }
insts = ["xor {out}, {out}", "COMISD {0}, {1}", "SETCC_RM8 {out}, 11", "SETCC_RM8 {g}, {k}", "and {g}, {out}"]

# 形状 C：setcc 10（NaN）与 setcc k 取并——无序比较

[[lowering]]
op = "Fcmp"
when = { eq = ["elem", 1] }   # f32
vary = { cond = [12, 13, 16], k = [7, 3, 5] }
insts = ["xor {out}, {out}", "COMISS {0}, {1}", "SETCC_RM8 {out}, 10", "SETCC_RM8 {g}, {k}", "or {g}, {out}"]

[[lowering]]
op = "Fcmp"
vary = { cond = [12, 13, 16], k = [7, 3, 5] }
insts = ["xor {out}, {out}", "COMISD {0}, {1}", "SETCC_RM8 {out}, 10", "SETCC_RM8 {g}, {k}", "or {g}, {out}"]

# 形状 D：常量结果（与元素类型无关——原谱的 elem==1 变体是纯重复）

[[lowering]]
op = "Fcmp"
when = { eq = ["cond", 9] }
insts = ["xor {out}, {out}"]

[[lowering]]
op = "Fcmp"
when = { eq = ["cond", 10] }
insts = ["MOV_REG_IMM64 {out}, 1"]

# ════════════════════════════════════════════════════════════
# 迭代 9（Phase 6）——向量全量（V64/V128/V256）
# ════════════════════════════════════════════════════════════
# 谓词：rd = 结果向量位宽（64/128/256）、elem = 元素类型 id（F32=1/F64=2/
# I32=3/I64=4）、imm0 = Vextract/Vinsert/Vsplit 的 lane/片段索引。
# V256 需 AVX/AVX2（avx_available 检查在 encode 侧）。

# ── Vadd ──

[[lowering]]
op = "Vadd"
when = { eq = ["rd", 256] }
vary = { elem = [1, 2, 3, 4], m = ["vaddps", "vaddpd", "vpaddd", "vpaddq"] }
insts = ["{m} {out}, {0}, {1}"]

[[lowering]]
op = "Vadd"
when = { le = ["rd", 128] }
vary = { elem = [1, 2, 3], m = ["ADDPS", "ADDPD", "PADDD"] }
insts = ["MOVAPS {out}, {0}", "{m} {out}, {1}"]

[[lowering]]
op = "Vadd"
when = { le = ["rd", 128] }
insts = ["MOVAPS {out}, {0}", "PADDQ {out}, {1}"]

# ── Vsub ──

[[lowering]]
op = "Vsub"
when = { eq = ["rd", 256] }
vary = { elem = [1, 2, 3, 4], m = ["vsubps", "vsubpd", "vpsubd", "vpsubq"] }
insts = ["{m} {out}, {0}, {1}"]

[[lowering]]
op = "Vsub"
when = { le = ["rd", 128] }
vary = { elem = [1, 2, 3], m = ["SUBPS", "SUBPD", "PSUBD"] }
insts = ["MOVAPS {out}, {0}", "{m} {out}, {1}"]

[[lowering]]
op = "Vsub"
when = { le = ["rd", 128] }
insts = ["MOVAPS {out}, {0}", "PSUBQ {out}, {1}"]

# ── Vmul（浮点全宽度；i32 → PMULLD/VPMULLD；i64 无 SIMD 指令 → 兜底）──

[[lowering]]
op = "Vmul"
when = { eq = ["rd", 256] }
vary = { elem = [1, 2, 3], m = ["vmulps", "vmulpd", "VPMULLD"] }
insts = ["{m} {out}, {0}, {1}"]

[[lowering]]
op = "Vmul"
when = { le = ["rd", 128] }
vary = { elem = [1, 2], m = ["MULPS", "MULPD"] }
insts = ["MOVAPS {out}, {0}", "{m} {out}, {1}"]

[[lowering]]
op = "Vmul"
when = { le = ["rd", 128] }
insts = ["MOVAPS {out}, {0}", "PMULLD {out}, {1}"]

# ── Vdiv（仅浮点）──

[[lowering]]
op = "Vdiv"
when = { eq = ["rd", 256] }
vary = { elem = [1, 2], m = ["vdivps", "vdivpd"] }
insts = ["{m} {out}, {0}, {1}"]

[[lowering]]
op = "Vdiv"
when = { le = ["rd", 128] }
vary = { elem = [1], m = ["DIVPS"] }
insts = ["MOVAPS {out}, {0}", "{m} {out}, {1}"]

[[lowering]]
op = "Vdiv"
when = { le = ["rd", 128] }
insts = ["MOVAPS {out}, {0}", "DIVPD {out}, {1}"]

# ── Vneg（0 - x）──

[[lowering]]
op = "Vneg"
when = { eq = ["rd", 256] }
vary = { elem = [1, 2, 3, 4], x = ["VXORPS", "VXORPS", "VPXOR", "VPXOR"], m = ["vsubps", "vsubpd", "vpsubd", "vpsubq"] }
insts = ["{x} {out}, {out}, {out}", "{m} {out}, {out}, {0}"]

[[lowering]]
op = "Vneg"
when = { le = ["rd", 128] }
vary = { elem = [1, 2, 3], m = ["SUBPS", "SUBPD", "PSUBD"] }
insts = ["XORPS {out}, {out}", "{m} {out}, {0}"]

[[lowering]]
op = "Vneg"
when = { le = ["rd", 128] }
insts = ["XORPS {out}, {out}", "PSUBQ {out}, {0}"]

# ── Vabs（清符号位掩码 0x7FFFFFFF×4/×8）──

[[lowering]]
op = "Vabs"
when = { eq = ["rd", 256] }
insts = [
    "MOV_REG_IMM64 {g1}, 0x7FFFFFFF7FFFFFFF",
    "MOVQ_XMM_R64 {f1}, {g1}",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFF7FFFFFFF",
    "MOVQ_XMM_R64 {f2}, {g2}",
    "PUNPCKLDQ {f1}, {f2}",
    "MOVAPS {f3}, {f1}",
    "VINSERTF128 {f1}, {f1}, {f3}, 1",
    "VANDPS {out}, {0}, {f1}",
]

[[lowering]]
op = "Vabs"
insts = [
    "MOVAPS {out}, {0}",
    "MOV_REG_IMM64 {g1}, 0x7FFFFFFF7FFFFFFF",
    "MOVQ_XMM_R64 {f1}, {g1}",
    "MOV_REG_IMM64 {g2}, 0x7FFFFFFF7FFFFFFF",
    "MOVQ_XMM_R64 {f2}, {g2}",
    "PUNPCKLDQ {f1}, {f2}",
    "ANDPS {out}, {f1}",
]

# ── Vbitcast（同宽位重解释）──

[[lowering]]
op = "Vbitcast"
when = { eq = ["rd", 256] }
insts = ["vmovaps {out}, {0}"]

[[lowering]]
op = "Vbitcast"
insts = ["MOVAPS {out}, {0}"]

# ── Vextract（标量元素提取；imm0 = lane 索引）──

[[lowering]]
op = "Vextract"
priority = 1   # lane 0 快路径必须压过下面 V256 的三约束规则（特异性反了）
when = { and = [ { eq = ["imm0", 0] }, { eq = ["elem", 1] } ] }
insts = ["MOVSS {out}, {0}"]

[[lowering]]
op = "Vextract"
priority = 1
when = { and = [ { eq = ["imm0", 0] }, { eq = ["elem", 3] } ] }
insts = ["MOVD_IREG_FREG {out}, {0}"]

[[lowering]]
op = "Vextract"
priority = 1
when = { and = [ { eq = ["imm0", 0] }, { eq = ["elem", 2] } ] }
insts = ["MOVSD {out}, {0}"]

[[lowering]]
op = "Vextract"
priority = 1
when = { and = [ { eq = ["imm0", 0] }, { eq = ["elem", 4] } ] }
insts = ["MOVQ_R64_XMM {out}, {0}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 1] }, { le = ["imm0", 3] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 0", "PSHUFD {f1}, {f1}, {imm0}", "MOVSS {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 1] }, { ge = ["imm0", 4] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 1", "PSHUFD {f1}, {f1}, {imm0_sub4}", "MOVSS {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 3] }, { le = ["imm0", 3] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 0", "PSHUFD {f1}, {f1}, {imm0}", "MOVD_IREG_FREG {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 3] }, { ge = ["imm0", 4] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 1", "PSHUFD {f1}, {f1}, {imm0_sub4}", "MOVD_IREG_FREG {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 2] }, { le = ["imm0", 1] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 0", "PSHUFD {f1}, {f1}, 78", "MOVSD {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 2] }, { eq = ["imm0", 2] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 1", "MOVSD {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 2] }, { ge = ["imm0", 3] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 1", "PSHUFD {f1}, {f1}, 78", "MOVSD {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 4] }, { le = ["imm0", 1] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 0", "PSHUFD {f1}, {f1}, 78", "MOVQ_R64_XMM {out}, {f1}"]

[[lowering]]
op = "Vextract"
when = { and = [ { eq = ["rd", 256] }, { eq = ["elem", 4] }, { eq = ["imm0", 2] } ] }
insts = ["VEXTRACTF128 {0}, {f1}, 1", "MOVQ_R64_XMM {out}, {f1}"]

[[lowering]]
