[inst.SAR_RM_CL]
fields = { dest = "Ireg", src = "Ireg" }
encoding = "@shift_cl dest src 7"
asm = "sar {dest}, {src}"

# ROL/ROR r/m, CL — D3 /0, /1
[inst.ROL_RM_CL]
fields = { dest = "Ireg", src = "Ireg" }
encoding = "@shift_cl dest src 0"
asm = "rol {dest}, {src}"

[inst.ROR_RM_CL]
fields = { dest = "Ireg", src = "Ireg" }
encoding = "@shift_cl dest src 1"
asm = "ror {dest}, {src}"

