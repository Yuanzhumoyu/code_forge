# CMPXCHG r/m, r — REX.W + 0F B1 /r  |  Op/En: MR
# 比较 RAX 与 dest; 若相等: dest←src, ZF=1; 不等: RAX←dest, ZF=0
[inst.CMPXCHG_RM_R]
