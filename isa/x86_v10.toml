effect = "Read+Write"

# XADD r/m, r — REX.W + 0F C1 /r  |  Op/En: MR
# temp = dest+src; dest←src; src←temp
[inst.XADD_RM_R]
fields = { dest = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$modrm_0f_rr opsize 0xC1 src dest"
asm = "xadd {dest}, {src}"
effect = "Read+Write"

