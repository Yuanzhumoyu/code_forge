# ╔══════════════════════════════════════════════╗
# ║ MOVQ 双向编码 (GPR↔XMM)                       ║
# ║                                              ║
# ║ MOVQ xmm, r/m64 — 66 REX.W 0F 6E /r         ║
# ║ MOVQ r/m64, xmm — 66 REX.W 0F 7E /r         ║
# ║                                              ║
# ║ MOVQ_R64_XMM (XMM→GPR) 使用独立 asm          ║
# ║ "movq.to_gpr" 以避免 AsmResolver 歧义。      ║
# ║ 该变体未在任何 lowering 规则中使用。          ║
# ╚══════════════════════════════════════════════╝

[inst.MOVQ_XMM_R64]
fields = { dest = "Freg", src = "Ireg" }
encoding = "$sse_rr_w 0x66 0x6E dest src"
asm = "movq_to_xmm {dest}, {src}"

[inst.MOVQ_R64_XMM]
fields = { dest = "Ireg", src = "Freg" }
encoding = "$sse_rr_w 0x66 0x7E src dest"
asm = "movq_to_gpr {dest}, {src}"

