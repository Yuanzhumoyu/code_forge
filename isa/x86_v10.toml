# Ch.5 — 控制转移 & 栈操作

[inst.RET]
encoding = "{0xC3:[0;8]}"
asm = "ret"
effect = "Ret"

[inst.NOP]
encoding = "{0x90:[0;8]}"
asm = "nop"

[inst.JMP_REL32]
fields = { rel = "BlockTarget" }
encoding = "{0xE9:[0;8]} !rel4"
asm = "jmp .L{rel}"
effect = "Jump"

# CALL rel32 — E8 + 32-bit relative displacement. The target is a
# cross-function FuncRef; `func` carries the FuncRef number and @call_reloc32
# records a relocation against the "@N" symbol, resolved by the JIT's
# RelocPatcher at load time.
[inst.CALL_RIP_REL]
fields = { target = "i32" }
encoding = "@call_reloc32 target, 0xE8"
asm = "call {target}"
effect = "Call"
# x64 ABI:call 破坏全部 caller-saved(RAX/RCX/RDX/RSI/RDI/R8-R11)。
# regalloc 的 clobber 处理在 expire_dead 之后执行——发参 mov 的目标 XReg
# 在 call 点已释放(活区间终点=发参 mov),不会被误 spill;只 spill 真正
# 跨 call 活跃且被分配在 caller-saved 的 XReg(此前 clobbers 恒空导致
# 这些值在 call 后被破坏→运行期值错,如 Vec ptr 槽/GetStdHandle 返回值)。
implicit = ["RAX", "RCX", "RDX", "RSI", "RDI", "R8", "R9", "R10", "R11"]

# CALL r/m64 — FF /2 (indirect call through a register)
# r8-r15 需要 REX.B 前缀（target>=8 时加 0x41 系 REX，B=target bit3），
# 否则 r15 会编码成 rdi（低 3 位相同但缺 REX.B）。
[inst.CALL_RM]
fields = { target = "Ireg" }
encoding = "?target>=8 {0x4:[4;4]}{0:[3;1]}{0:[2;1]}{0:[1;1]}{target:[0;1;3]} {0xFF:[0;8]} {target:[0;3]}{0x2:[3;3]}{3:[6;2]}"
asm = "call *{target}"
effect = "Call"
implicit = ["RAX", "RCX", "RDX", "RSI", "RDI", "R8", "R9", "R10", "R11"]

[inst.JCC_REL32]
fields = { cond = "CondCode", rel = "BlockTarget" }
encoding = "{0x0F:[0;8]} {cond:[0;8]} !rel4"
asm = "j{cond} .L{rel}"
effect = "Branch"

[inst.UD2]
encoding = "{0x0F:[0;8]} {0x0B:[0;8]}"
asm = "ud2"
effect = "Trap"

# MFENCE — 0F AE F0
[inst.MFENCE]
encoding = "{0x0F:[0;8]} {0xAE:[0;8]} {0xF0:[0;8]}"
asm = "mfence"

# LOCK XADD [base], reg — F0 0F C1 /r (atomic read-modify-write)
[inst.XADD_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0xC1 src base 0 0xF0 0x0F"
asm = "xadd [{base}], {src}"

# XCHG [base], reg — 87 /r (implicitly locked, no F0 prefix)
[inst.XCHG_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0x87 src base 0"
asm = "xchg [{base}], {src}"

# LOCK SUB/AND/OR/XOR [base], reg — F0 + 29/21/09/31 /r
[inst.SUB_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0x29 src base 0 0xF0 0x0F"
asm = "locksub [{base}], {src}"

[inst.AND_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0x21 src base 0 0xF0 0x0F"
asm = "lockand [{base}], {src}"

[inst.OR_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0x09 src base 0 0xF0 0x0F"
asm = "lockor [{base}], {src}"

[inst.XOR_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0x31 src base 0 0xF0 0x0F"
asm = "lockxor [{base}], {src}"

# movabs rd, <global> — 48 B8+r + 8-byte absolute placeholder (@abs_reloc
# patches it against the "G{id}" symbol).
# ⚠ 废弃：绝对地址 + ADDR64 重定位在 ASLR 下不可靠（第 5+ 个重定位超出
#   .reloc VirtualSize 时不被 loader 应用 → 崩溃）。改用 LEA_RIP_REL。
[inst.MOVABS_GLOBAL]
fields = { dest = "Ireg", global = "i32" }
encoding = "{0x4:[4;4]}{1:[3;1]}{0:[2;1]}{0:[1;1]}{dest:[0;1;3]} {0x17:[3;5]}{dest:[0;3]} @abs_reloc global"
asm = "movabs_g {dest}, {global}"

# lea rd, [rip+disp32] — REX.W + 8D + ModRM(rm=101) + disp32（@lea_rip_rel，
# PC-relative 偏移与加载基址无关，ASLR 下天然正确，无需 .reloc 条目）。
[inst.LEA_RIP_REL]
fields = { dest = "Ireg", global = "i32" }
encoding = "@lea_rip_rel dest global"
asm = "lea_rip {dest}, [rip+{global}]"

# MOV r, [base] — 8B /r (mod=00 memory)
[inst.MOV_R_MEM]
fields = { dest = "Ireg", base = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0x8B dest base 0"
asm = "mov_mem {dest}, [{base}]"

# MOV [base], r — 89 /r (memory store)
[inst.STORE_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm_mem opsize 0x89 src base 0"
asm = "mov_sto [{base}], {src}"

# BSWAP r64 — 48 0F C8+r (byte-reverse, REX.W). REX.B = dest[3].
[inst.BSWAP_R]
fields = { dest = "Ireg", opsize = "Opsize" }
encoding = "@bswap_r dest opsize"
asm = "bswap {dest}"

# LZCNT/TZCNT/POPCNT r/m — F3 0F BD/BC/B8 /r（REX.W 按 opsize 动态：
# 32 位输入不得带 REX.W，否则 64 位计数（clz(1i32) 得 63 而非 31 的历史缺陷））
[inst.LZCNT_R]
fields = { dest = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@sse_rr_opsize 0xF3 0xBD opsize dest src"
asm = "lzcnt {dest}, {src}"

[inst.TZCNT_R]
fields = { dest = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@sse_rr_opsize 0xF3 0xBC opsize dest src"
asm = "tzcnt {dest}, {src}"

[inst.POPCNT_R]
fields = { dest = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "@sse_rr_opsize 0xF3 0xB8 opsize dest src"
asm = "popcnt {dest}, {src}"

[inst.PUSH]
asm = "push {reg}"
encoding = "@push_reg reg"
effect = "Write"
variants = [{ reg = "Ireg" }, { reg = "GprReg" }]

[inst.POP]
asm = "pop {reg}"
encoding = "@pop_reg reg"
variants = [{ reg = "Ireg" }, { reg = "GprReg" }]

[inst.MOV64_RR]
fields = { dest = "GprReg", src = "GprReg" }
# 0x89 /r = MOV r/m64, r64: ModRM.rm=dest, ModRM.reg=src → data flows src→dest
encoding = "{0x48:[0;8]} {0x89:[0;8]} {dest:[0;3]}{src:[3;3]}{3:[6;2]}"
asm = "mov64rr {dest}, {src}"

# ── Spill 模板指令：物理寄存器 ↔ [base+disp]（@modrm_mem 带 MemRef 字段）──
# [spill.GPR]/[spill.FPR] 模板引用这些指令，spill 编码全部来自 TOML。
# mem 字段（MemRef）：base=基址物理编号、offset=位移、width=数据宽度。
[inst.MOV64_RM]
fields = { dest = "GprReg", mem = "MemRef" }
encoding = "@modrm_mem 64 0x8B dest mem"
asm = "mov64rm {dest}, {mem}"
effect = "Read"

[inst.MOV64_MR]
fields = { src = "GprReg", mem = "MemRef" }
encoding = "@modrm_mem 64 0x89 src mem"
asm = "mov64mr {mem}, {src}"
effect = "Write"

# MOVSD xmm, [base+disp] / MOVSD [base+disp], xmm — F2 0F 10/11 /r
[inst.MOVSD_RM]
fields = { dest = "XmmReg", mem = "MemRef" }
encoding = "@modrm_mem 32 0x10 dest mem 0xF2 0x0F"
asm = "movsd_rm {dest}, {mem}"
effect = "Read"

[inst.MOVSD_MR]
fields = { src = "XmmReg", mem = "MemRef" }
encoding = "@modrm_mem 32 0x11 src mem 0xF2 0x0F"
asm = "movsd_mr {mem}, {src}"
effect = "Write"

# MOVSD xmm, [base] / [base], xmm — 寄存器 base 变体（Fload/Fstore lowering 用）
[inst.MOVSD_R_MEM]
fields = { dest = "Freg", base = "Ireg" }
encoding = "@modrm_mem 32 0x10 dest base 0 0xF2 0x0F"
asm = "movsd_mem {dest}, [{base}]"
effect = "Read"

# MOVSD xmm1, xmm2 — F2 0F 10 /r（Freg↔Freg 标量 64 位拷贝：f64 元素提取/插入）
[inst.MOVSD_RR]
fields = "Freg Freg"
encoding = "@sse_rr 0xF2 0x10 0 dest src"
asm = "movsd {dest}, {src}"

[inst.MOVSD_MEM_R]
fields = { base = "Ireg", src = "Freg" }
encoding = "@modrm_mem 32 0x11 src base 0 0xF2 0x0F"
asm = "movsd_sto [{base}], {src}"
effect = "Write"

[inst.MOV_RM8_R64]
fields = { dest = "Ireg", src = "GprReg", opsize = "Opsize" }
encoding = "@modrm opsize 0x89 src dest"
asm = "movrm {dest}, {src}"

# mov physical GPR → VReg (reverse of MOV_RM8_R64; used by call lowering to
# move call arguments into ABI registers: 8B direction, dest@reg, src@rm).
[inst.MOV_R8_RM64]
fields = { dest = "GprReg", src = "Ireg", opsize = "Opsize" }
encoding = "@modrm opsize 0x8B dest src"
asm = "movr8 {dest}, {src}"

[inst.CQO]
encoding = "{0x48:[0;8]} {0x99:[0;8]}"
asm = "cqo"
# cqo 把 RAX 符号扩展到 RDX：RDX 隐式破坏，分配器在本指令点避开。
implicit = ["RDX"]


# 帧管理 (Frame Management)
#
# SUB64_R_IMM32 / ADD64_R_IMM32 — @frame_alloc/@frame_free 使用
# REX.W + 81 /digit + ModRM(mod=3, digit, rm) + imm32

[inst.SUB64_R_IMM32]
fields = { dest = "GprReg", imm = "u32" }
encoding = "@op_rm_imm32 0x81 5 dest imm"
asm = "sub {dest}, {imm}"

[inst.ADD64_R_IMM32]
fields = { dest = "GprReg", imm = "u32" }
encoding = "@op_rm_imm32 0x81 0 dest imm"
asm = "add {dest}, {imm}"


# 条件码名称 (CC Names) — JCC opcode → asm suffix

[cc_names]
"0x84" = "e"
"0x85" = "ne"
"0x8C" = "l"
"0x8E" = "le"
"0x8F" = "g"
"0x8D" = "ge"
"0x82" = "b"
"0x86" = "be"
"0x87" = "a"
"0x83" = "ae"
"0x8A" = "p"
"0x8B" = "np"
"0x88" = "s"
"0x89" = "ns"
"0x80" = "o"
"0x81" = "no"


# 序言 / 尾声 (Prologue / Epilogue)

[emit.prologue]
# IMPORTANT: @move_args must run AFTER @push_callee. Argument VRegs can be
# allocated to callee-saved registers (e.g. R14/R15); moving args before the
# prologue saves those registers would clobber the caller's values, and the
# subsequent push would save the args instead of the originals — corrupting
# the caller on return (mixed-signature JIT crash in release builds).
insts = [
    "push RBP",
    "mov64rr RBP, RSP",
    "@push_callee",
    "@move_args",
    "@frame_alloc",
]

[emit.epilogue]
# rsp = rbp 后跳过 callee-saved 区（7×8=56，r15 在 rbp-56）再按序 pop。
insts = ["mov64rr RSP, RBP", "sub RSP, 56", "@pop_callee", "pop RBP", "ret"]

# Lowering 规则 (v11 AST 格式)
#
# 虚拟操作数: rd, rs1, rs2, iconst, fconst, VReg(N), val, target, cond, ...
# 所有 lowering 规则默认为 opsize=64.

# ── Integer ──

[lower.Iconst]
insts = ["mov_imm rd, iconst"]

# Call: move args into ABI registers (RCX/RDX/R8/R9 — Windows x64 integer
# arg regs), emit the relocatable CALL, and move the RAX return value back.
# `func` expands to the IR FuncRef number; @call_reloc32 records "@N".
# Beyond 4 args / float args are not yet lowered (recorded limitation).
[lower.Call]
insts = [
    "SUB64_R_IMM32 RSP, 32",
    "MOV_R8_RM64 RCX, arg0",
    "MOV_R8_RM64 RDX, arg1",
    "MOV_R8_RM64 R8, arg2",
    "MOV_R8_RM64 R9, arg3",
    "CALL_RIP_REL func",
    "ADD64_R_IMM32 RSP, 32",
    "MOV_RM8_R64 rd, RAX",
]
# 调用约定寄存器（参数 RCX/RDX/R8/R9 + 返回值 RAX）为架构必要：分配器在
# 序列内不得把它们分配给其他虚拟寄存器（RSP 是 sp_reg 已由分配器排除）。

[lower.CallIndirect]
# 间接调用（虚方法/函数指针）：CALL 后必须把 RAX 返回值 move 到结果 rd
#（与 [lower.Call] 的 "MOV_RM8_R64 rd, RAX" 一致）——否则结果 XReg 被
# regalloc 分配到任意寄存器（call 不写它，读到垃圾：dyn 用例返回 vtable+24）。
insts = ["CALL_RM rs1", "MOV_RM8_R64 rd, RAX"]
[lower.Iadd]
insts = ["mov rd, rs1", "add rd, rs2"]

[lower.Isub]
insts = ["mov rd, rs1", "sub rd, rs2"]

[lower.Imul]
insts = ["mov rd, rs1", "imul rd, rs2"]

[lower.Band]
insts = ["mov rd, rs1", "and rd, rs2"]

[lower.Bor]
insts = ["mov rd, rs1", "or rd, rs2"]

[lower.Bxor]
insts = ["mov rd, rs1", "xor rd, rs2"]

[lower.Ishl]
insts = ["mov rd, rs1", "mov %t, rs2", "shl rd, %t"]

[lower.Ushr]
insts = ["mov rd, rs1", "mov %t, rs2", "shr rd, %t"]

[lower.Sshr]
insts = ["movsxd rd, rs1", "mov %t, rs2", "sar rd, %t"]

[lower.Rotl]
insts = ["mov rd, rs1", "mov %t, rs2", "rol rd, %t"]

[lower.Rotr]
insts = ["mov rd, rs1", "mov %t, rs2", "ror rd, %t"]

[lower.Bnot]
insts = ["mov rd, rs1", "not rd"]

[lower.Udiv]
insts = ["xor RDX, RDX", "mov RAX, rs1", "div rs2", "mov rd, RAX"]
# div 隐式使用 RAX（被除数）与 RDX（高 64 位）：架构必要，序列内写死占用。

[lower.Sdiv]
insts = ["mov %t, rs2", "movsxd RAX, rs1", "cqo", "idiv %t", "mov rd, RAX"]

[lower.Urem]
insts = ["xor RDX, RDX", "mov RAX, rs1", "div rs2", "mov rd, RDX"]

[lower.Srem]
insts = ["mov %t, rs2", "movsxd RAX, rs1", "cqo", "idiv %t", "mov rd, RDX"]

# ── Identity ──

[lower.Copy]
insts = ["mov rd, rs1"]

[lower.Bitcast]
variants = [
  { when = "rs1elem==I64 && elem==F64", insts = ["movq_to_xmm rd, rs1"] },
  { when = "rs1elem==I64 && elem==F32", insts = ["movq_to_xmm rd, rs1"] },
  { when = "rs1elem==I32 && elem==F32", insts = ["movq_to_xmm rd, rs1"] },
  { when = "rs1elem==F64 && elem==I64", insts = ["movq_to_gpr rd, rs1"] },
  { when = "rs1elem==F32 && elem==I32", insts = ["movq_to_gpr rd, rs1"] },
]
insts = ["mov rd, rs1"]

[lower.Sextend]
insts = ["movsxd rd, rs1"]

# Uextend: 按源宽度零扩展。
# - bool/i8（≤8 位）：movzx 8→64
# - i16：movzx 16→64
# - i32：mov（32 位写自动零扩展高 32 位）
# - i64：mov 直拷（no-op）
# 修复历史缺陷：原 "mov rd, rs1" 直拷会携带窄值寄存器的高位垃圾。
[lower.Uextend]
variants = [
  { when = "rs1<=8", insts = ["movzx_b rd, rs1"] },
  { when = "rs1<=16", insts = ["movzx_w rd, rs1"] },
  { when = "rs1==32", insts = ["mov rd, rs1"] },
  { when = "rs1==64", insts = ["mov rd, rs1"] },
]

[lower.Ireduce]
insts = ["mov rd, rs1"]

# ── Memory ──

[lower.Load]
insts = ["mov_mem rd, [rs1]"]

# 浮点 load/store（Fload/Fstore）：普通 Load/Store 的 mov_mem/mov_sto 是 GPR 指令，
# 对 F64 值会把 FPR 当 GPR 编码；Mfload/Fstore 走 MOVSD_RM/MR（XMM↔内存）。
[lower.Fload]
insts = ["movsd_mem rd, [rs1]"]

# Store operands = [value, addr]（builder.store(value, addr)）——addr=rs2、value=rs1
[lower.Store]
insts = ["mov_sto [rs2], rs1"]

[lower.Fstore]
insts = ["movsd_sto [rs2], rs1"]

# ── Icmp ──
# 模板规则：template + conditions 展开为 Icmp.<Cond> 各条（$CC 替换）。
[lower.Icmp]
template = ["xor rd, rd", "cmp rs1, rs2", "set$CC rd"]
conditions = [
  ["Equal", "e"], ["NotEqual", "ne"],
  ["SignedLessThan", "l"], ["SignedLessThanOrEqual", "le"],
  ["SignedGreaterThan", "g"], ["SignedGreaterThanOrEqual", "ge"],
  ["UnsignedLessThan", "b"], ["UnsignedLessThanOrEqual", "be"],
  ["UnsignedGreaterThan", "a"], ["UnsignedGreaterThanOrEqual", "ae"],
]


[lower.IsNull]
insts = ["xor rd, rd", "test rs1, rs1", "sete rd"]

[lower.IsNotNull]
insts = ["xor rd, rd", "test rs1, rs1", "setne rd"]

# GetElementPtr: lea [base + index*4] (element size fixed at 4 — recorded).
[lower.GetElementPtr]
insts = ["lea rd, [rs1+rs2*4+0]"]

[lower.Smin]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovge rd, rs2"]

[lower.Smax]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovle rd, rs2"]

[lower.Umin]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovae rd, rs2"]

[lower.Umax]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovbe rd, rs2"]

# Overflow ops: result half in rd, flag half in r2 (setcc).
# setcc 只写 8 位（SETcc r/m8），必须先 xor 清零全寄存器，否则高 56 位残留
# 垃圾会在 uextend（mov 直拷）后污染 flag（曾得 0xFFFFFF01 而非 1）。
# ⚠ xor 会改写 OF/CF 等标志，必须放在算数指令（add/sub/imul）之前，
#   否则 setcc 读到的是 xor 后的标志（曾得 flag=0）。
[lower.SaddOverflow]
insts = ["xor r2, r2", "mov rd, rs1", "add rd, rs2", "seto r2"]

[lower.UaddOverflow]
insts = ["xor r2, r2", "mov rd, rs1", "add rd, rs2", "setb r2"]

[lower.SsubOverflow]
insts = ["xor r2, r2", "mov rd, rs1", "sub rd, rs2", "seto r2"]

[lower.UsubOverflow]
insts = ["xor r2, r2", "mov rd, rs1", "sub rd, rs2", "setb r2"]

[lower.SmulOverflow]
insts = ["xor r2, r2", "mov rd, rs1", "imul rd, rs2", "seto r2"]

[lower.UmulOverflow]
insts = [
    "mov rd, rs1",
    "imul rd, rs2",
    "xor r2, r2",
    "cmp rd, rs1",
    "setb r2",
    "xor r3, r3",
    "test rs2, rs2",
    "setne r3",
    "and r2, r3",
]

# SaddSat: saturating signed add.
# rd = a+b; on overflow (OF set) clamp to MAX/MIN by sign of a.
# clamp 常量按操作数宽度参数化（32 位用 0x7FFFFFFF/0x80000000，
# 64 位用 0x7FFFFFFFFFFFFFFF/0x8000000000000000）——修复 i32 输入
# 取 64 位常量低 32 位的缺陷。
[lower.SaddSat]
variants = [
  { when = "rs1==32", insts = [
      "mov rd, rs1", "add rd, rs2", "seto %t1",
      "mov_imm %t2, 0x7FFFFFFF", "mov_imm %t3, 0x80000000",
      "test rs1, rs1", "cmovns %t4, %t2", "cmovs %t4, %t3",
      "test %t1, %t1", "cmovne rd, %t4",
  ] },
  { when = "rs1==64", insts = [
      "mov rd, rs1", "add rd, rs2", "seto %t1",
      "mov_imm %t2, 0x7FFFFFFFFFFFFFFF", "mov_imm %t3, 0x8000000000000000",
      "test rs1, rs1", "cmovns %t4, %t2", "cmovs %t4, %t3",
      "test %t1, %t1", "cmovne rd, %t4",
  ] },
]

# UaddSat: unsigned saturating add — carry → MAX（全 1 常量，32/64 位低 32 位一致）。
[lower.UaddSat]
insts = [
    "mov rd, rs1",
    "add rd, rs2",
    "setb %t1",
    "mov_imm %t2, 0xFFFFFFFFFFFFFFFF",
    "test %t1, %t1",
    "cmovne rd, %t2",
]

# SsubSat: saturating signed sub — on overflow clamp by sign of a（同 SaddSat 宽度参数化）。
[lower.SsubSat]
variants = [
  { when = "rs1==32", insts = [
      "mov rd, rs1", "sub rd, rs2", "seto %t1",
      "mov_imm %t2, 0x7FFFFFFF", "mov_imm %t3, 0x80000000",
      "test rs1, rs1", "cmovns %t4, %t2", "cmovs %t4, %t3",
      "test %t1, %t1", "cmovne rd, %t4",
  ] },
  { when = "rs1==64", insts = [
      "mov rd, rs1", "sub rd, rs2", "seto %t1",
      "mov_imm %t2, 0x7FFFFFFFFFFFFFFF", "mov_imm %t3, 0x8000000000000000",
      "test rs1, rs1", "cmovns %t4, %t2", "cmovs %t4, %t3",
      "test %t1, %t1", "cmovne rd, %t4",
  ] },
]

# UsubSat: unsigned saturating sub — borrow (a<b) → 0.
[lower.UsubSat]
insts = [
    "mov rd, rs1",
    "sub rd, rs2",
    "setb %t1",
    "xor %t2, %t2",
    "test %t1, %t1",
    "cmovne rd, %t2",
]

# Abs: rd = |rs1| — neg %t; cmovl picks -rs1 when rs1 < 0.
[lower.Abs]
insts = ["mov %t, rs1", "neg %t", "mov rd, rs1", "test rs1, rs1", "cmovl rd, %t"]

# ── Trap / Freeze ──
[lower.Trap]
insts = ["UD2"]

[lower.Freeze]
insts = ["mov rd, rs1"]

[lower.Fence]
insts = ["mfence"]

# AtomicRmw: dispatched by op (AtomicRmw.<Op>). Old value loaded first.
# Add/Xchg/Sub/And/Or/Xor implemented; Nand/Max/Min/Umax/Umin need a
# cmpxchg loop (recorded).
# 操作数写法必须与指令定义 asm 模板一致：mov_mem {dest}, [{base}] / xadd [{base}], {src}
# 等——内存操作数（地址值 rs1）带方括号。
[lower.AtomicRmw.Add]
insts = ["mov_mem rd, [rs1]", "xadd [rs1], rs2"]

[lower.AtomicRmw.Xchg]
insts = ["mov_mem rd, [rs1]", "xchg [rs1], rs2"]

[lower.AtomicRmw.Sub]
insts = ["mov_mem rd, [rs1]", "locksub [rs1], rs2"]

[lower.AtomicRmw.And]
insts = ["mov_mem rd, [rs1]", "lockand [rs1], rs2"]

[lower.AtomicRmw.Or]
insts = ["mov_mem rd, [rs1]", "lockor [rs1], rs2"]

[lower.AtomicRmw.Xor]
insts = ["mov_mem rd, [rs1]", "lockxor [rs1], rs2"]

# Bitreverse: Hacker's Delight 64-bit reversal
# ((x>>n)&m)|((x&m)<<n) for n=1,2,4, then bswap.
# Scratch R11-R15 (precolored) — recorded: conflict risk when live.
[lower.Bitreverse]
insts = [
    "mov rd, rs1",
    "mov_imm %t1, 1",
    "mov_imm %t2, 0x5555555555555555",
    "mov %t3, rd",
    "shr %t3, %t1",
    "and %t3, %t2",
    "mov %t4, rd",
    "and %t4, %t2",
    "shl %t4, %t1",
    "or %t3, %t4",
    "mov_imm %t1, 2",
    "mov_imm %t2, 0x3333333333333333",
    "mov %t5, %t3",
    "shr %t5, %t1",
    "and %t5, %t2",
    "mov %t4, %t3",
    "and %t4, %t2",
    "shl %t4, %t1",
    "or %t5, %t4",
    "mov_imm %t1, 4",
    "mov_imm %t2, 0x0F0F0F0F0F0F0F0F",
    "mov %t3, %t5",
    "shr %t3, %t1",
    "and %t3, %t2",
    "mov %t4, %t5",
    "and %t4, %t2",
    "shl %t4, %t1",
    "or %t3, %t4",
    "bswap %t3",
    "mov rd, %t3",
]

# Fcopysign: (a & ~sign) | (b & sign) via GPR bit round-trip.
[lower.Fcopysign]
insts = [
    "movq_to_gpr %t1, rs1",
    "movq_to_gpr %t2, rs2",
    "mov_imm %t3, 0x8000000000000000",
    "mov %t4, %t3",
    "not %t4",
    "and %t1, %t4",
    "and %t2, %t3",
    "or %t1, %t2",
    "movq_to_xmm rd, %t1",
]

# GlobalAddr: PC-relative lea (RIP-relative disp32) — loader-independent,
# survives ASLR without .reloc entries (absolute movabs broke under ASLR:
# relocs beyond .reloc VirtualSize are never applied by the loader).
[lower.GlobalAddr]
insts = ["lea_rip rd, global"]

# Alloca: stack slot at [RSP-16] (fixed offset, single slot — recorded;
# dynamic stack-frame slot allocation needs compiler-level support).
# Alloca：帧槽 lea（预扫描分配槽偏移——`lea_off rd, [rbp+disp]`；替换旧
# `lea [rs1+rs2*1+0]`——Alloca 无操作数时 rs1/rs2 是垃圾寄存器（r14+r15）
# → 地址垃圾 → SEGV）。
[lower.Alloca]
insts = ["lea_off rd, alloca_offset"]

[lower.Clz]
insts = ["lzcnt rd, rs1"]

[lower.Ctz]
insts = ["tzcnt rd, rs1"]

[lower.Popcnt]
insts = ["popcnt rd, rs1"]

[lower.Bswap]
insts = ["bswap rd"]

[lower.Fmin]
insts = ["movsd rd, rs1", "minsd rd, rs2"]

[lower.Fmax]
insts = ["movsd rd, rs1", "maxsd rd, rs2"]

[lower.Fma]
insts = ["movsd rd, rs1", "mulsd rd, rs2", "addsd rd, rs3"]

# Ftrunc: truncate toward zero via int round-trip。
# 必须用 cvttsd2si（无条件截断）；cvtsd2si 受 MXCSR 舍入模式控制（默认
# round-to-nearest，ftrunc(42.7) 会得 43 而非 42——历史 bug）。
[lower.Ftrunc]
insts = ["movsd rd, rs1", "cvttsd2si %t, rd", "cvtsi2sd rd, %t"]

# Fptrunc（S3.4）：double → float（源 F64 在 rs1、结果 F32 在 rd）。
# movsd 拷 64 位源；cvtsd2ss 舍入转单精度（受 MXCSR 控制，与 clang 一致）。
[lower.Fptrunc]
insts = ["movsd rd, rs1", "cvtsd2ss rd, rs1"]

# Fpext（S3.4）：float → double（源 F32 在 rs1、结果 F64 在 rd）。
[lower.Fpext]
insts = ["movss rd, rs1", "cvtss2sd rd, rs1"]

# ROUNDSD-based rounding (0=near,1=floor,2=ceil).
[lower.Ffloor]
insts = ["movsd rd, rs1", "roundsd rd, rd, 1"]

[lower.Fceil]
insts = ["movsd rd, rs1", "roundsd rd, rd, 2"]

[lower.Fround]
insts = ["movsd rd, rs1", "roundsd rd, rd, 0"]

# ── Float ──

[lower.Fadd]
variants = [
  { when = "elem==F32", insts = ["movss rd, rs1", "addss rd, rs2"] },
]
insts = ["movsd rd, rs1", "addsd rd, rs2"]

[lower.Fsub]
variants = [
  { when = "elem==F32", insts = ["movss rd, rs1", "subss rd, rs2"] },
]
insts = ["movsd rd, rs1", "subsd rd, rs2"]

[lower.Fmul]
variants = [
  { when = "elem==F32", insts = ["movss rd, rs1", "mulss rd, rs2"] },
]
insts = ["movsd rd, rs1", "mulsd rd, rs2"]

[lower.Fdiv]
variants = [
  { when = "elem==F32", insts = ["movss rd, rs1", "divss rd, rs2"] },
]
insts = ["movsd rd, rs1", "divsd rd, rs2"]

[lower.Fconst]
insts = ["mov_imm %t, fconst", "movq_to_xmm rd, %t"]

[lower.Fsqrt]
variants = [{ when = "elem==F32", insts = ["movss rd, rs1", "sqrtss rd, rs1"] }]
insts = ["movsd rd, rs1", "sqrtsd rd, rs1"]

[lower.Fabs]
variants = [{ when = "elem==F32", insts = [
    "movss rd, rs1",
    "mov_imm %t, 0x7FFFFFFF",
    "movq_to_xmm %tf:fpr, %t",
    "andps rd, %tf:fpr",
] }]
insts = [
    "movsd rd, rs1",
    "mov_imm %t, 0x7FFFFFFFFFFFFFFF",
    "movq_to_xmm %tf:fpr, %t",
    "andpd rd, %tf:fpr",
]

[lower.Fneg]
variants = [{ when = "elem==F32", insts = [
    "movss rd, rs1",
    "mov_imm %t, 0x80000000",
    "movq_to_xmm %tf:fpr, %t",
    "xorps rd, %tf:fpr",
] }]
insts = [
    "movsd rd, rs1",
    "mov_imm %t, 0x8000000000000000",
    "movq_to_xmm %tf:fpr, %t",
    "xorpd rd, %tf:fpr",
]

# ── Fcmp ──（每条件一条：F32 → comiss / F64 → comisd——按元素类型分派）
[lower.Fcmp.Equal]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "sete rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "sete rd"]
[lower.Fcmp.NotEqual]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "setne rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "setne rd"]
[lower.Fcmp.LessThan]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "setb rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "setb rd"]
[lower.Fcmp.LessThanOrEqual]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "setbe rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "setbe rd"]
[lower.Fcmp.GreaterThan]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "seta rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "seta rd"]
[lower.Fcmp.GreaterThanOrEqual]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "setae rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "setae rd"]
[lower.Fcmp.Unordered]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "setp rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "setp rd"]
[lower.Fcmp.Ordered]
variants = [{ when = "elem==F32", insts = ["xor rd, rd", "comiss rs1, rs2", "setnp rd"] }]
insts = ["xor rd, rd", "comisd rs1, rs2", "setnp rd"]

# ── Select / StackAddr ──

[lower.Select]
# 2026-08 修复：原 "mov rd, rs2" 无条件复制 args[1]（true 臂）——cf5 嵌套 niche
# 判别与 Select 相关路径全错（forge-rustc 曾用算术公式规避）。现改为真正的
# 条件选择：rd 默认 = args[2]（else 臂），cond（args[0]）非零时 cmovne 取
# args[1]（then 臂）→ Select(cond, then, else) = cond ? then : else。
# 2026-08 修复：test 必须先于 mov rd, rs3——regalloc 在 cond 无后续使用时
# 会把 cond 与 rd 分配同寄存器，mov 覆盖 cond 导致选择恒为 else 臂。
insts = ["test rs1, rs1", "mov rd, rs3", "cmovne rd, rs2"]

[lower.StackAddr]
insts = ["lea_off rd, offset"]

# ── Pattern lowering (LEA optimization) ──
#
# 第二十九轮:IR 层模式融合由手写 standard_matcher 提供
# (forge-codegen/src/ext/pattern_isel.rs,标签 lea_sib/cmovcc/fma,
# components.rs 的 pattern_matcher() 硬编码返回之)——TOML 的
# [lower_pattern.*] 为死配置(DSL 不消费),已删除。

# ── Vector / SIMD（f32×4 / V128 语义；PS 指令族）──

# Vconst: 常量池 lane 位模式 → XMM。
# <4 x f32> 布局：vconst_lo = lanes[0]|lanes[2]<<32、vconst_hi = lanes[1]|lanes[3]<<32，
# 两个 64 位半经 punpckldq 交错恢复 [l0, l1, l2, l3]。
[lower.Vconst]
variants = [
  # V64（<2 x f32>）：64 位半部一次装入低 2 lane（movq_to_xmm），高 64 位不保证。
  { when = "rd==64 && elem==F32", insts = ["mov_imm %t1, vconst_lo2", "movq_to_xmm rd, %t1"] },
  # V128（<4 x f32> / <4 x i32>）：两个 64 位半部 punpckldq 交错恢复 4×32 位 lane。
  { when = "rd==128 && (elem==F32 || elem==I32)", insts = [
      "mov_imm %t1, vconst_lo",
      "movq_to_xmm %tf1:fpr, %t1",
      "mov_imm %t2, vconst_hi",
      "movq_to_xmm %tf2:fpr, %t2",
      "punpckldq %tf1:fpr, %tf2:fpr",
      "movaps rd, %tf1:fpr",
  ] },
  # V128（<2 x f64> / <2 x i64>）：两个 64 位元素 movq 装入 + punpcklqdq 交错。
  # vconst_lo/hi 对 2 元素布局恰好是 lanes[0]/lanes[1]（lanes[2]/lanes[3] 越界为 0）。
  { when = "rd==128 && (elem==F64 || elem==I64)", insts = [
      "mov_imm %t1, vconst_lo",
      "movq_to_xmm %tf1:fpr, %t1",
      "mov_imm %t2, vconst_hi",
      "movq_to_xmm %tf2:fpr, %t2",
      "punpcklqdq %tf1:fpr, %tf2:fpr",
      "movaps rd, %tf1:fpr",
  ] },
  # V256（<8 x f32> / <8 x i32>）：低/高 128 位各两个 64 位半部 punpckldq 恢复，vinsertf128 拼装。
  { when = "rd==256 && (elem==F32 || elem==I32)", insts = [
      "mov_imm %t1, vconst_lo",
      "movq_to_xmm %tf1:fpr, %t1",
      "mov_imm %t2, vconst_hi",
      "movq_to_xmm %tf2:fpr, %t2",
      "punpckldq %tf1:fpr, %tf2:fpr",
      "mov_imm %t3, vconst_lo_hi",
      "movq_to_xmm %tf3:fpr, %t3",
      "mov_imm %t4, vconst_hi_hi",
      "movq_to_xmm %tf4:fpr, %t4",
      "punpckldq %tf3:fpr, %tf4:fpr",
      "vinsertf128 rd, %tf1:fpr, %tf3:fpr, 1",
  ] },
  # V256（<4 x f64>）：4 个 64 位元素逐元素装入（vconst_q0..q3），
  # 分两组 punpcklqdq 恢复低/高 128 位 + vinsertf128 拼装。
  { when = "rd==256 && (elem==F64 || elem==I64)", insts = [
      "mov_imm %t1, vconst_q0",
      "movq_to_xmm %tf1:fpr, %t1",
      "mov_imm %t2, vconst_q1",
      "movq_to_xmm %tf2:fpr, %t2",
      "punpcklqdq %tf1:fpr, %tf2:fpr",
      "mov_imm %t3, vconst_q2",
      "movq_to_xmm %tf3:fpr, %t3",
      "mov_imm %t4, vconst_q3",
      "movq_to_xmm %tf4:fpr, %t4",
      "punpcklqdq %tf3:fpr, %tf4:fpr",
      "vinsertf128 rd, %tf1:fpr, %tf3:fpr, 1",
  ] },
  # 其他组合（整数 V256 需 AVX2 等）：经 vconcat 构造或后续。
  { when = "rd>=64", insts = ["ud2"] },
]

# 二元向量运算按元素类型分派：f32→PS、f64→PD、i32→PADDD、i64→PADDQ；
# 整数 mul/div（需 PMULLD/AVX2）与 >128 位整数（需 AVX2）落兜底 Unsupported。
[lower.Vadd]
variants = [
  { when = "rd==256 && elem==F32", insts = ["vaddps rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F32", insts = ["movaps rd, rs1", "addps rd, rs2"] },
  { when = "rd==256 && elem==F64", insts = ["vaddpd rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F64", insts = ["movaps rd, rs1", "addpd rd, rs2"] },
  # 整数 V256（AVX2）：<8 x i32> → vpaddd、<4 x i64> → vpaddq
  { when = "rd==256 && elem==I32", insts = ["vpaddd rd, rs1, rs2"] },
  { when = "rd==256 && elem==I64", insts = ["vpaddq rd, rs1, rs2"] },
  { when = "rd<=128 && elem==I32", insts = ["movaps rd, rs1", "paddd rd, rs2"] },
  { when = "rd<=128 && elem==I64", insts = ["movaps rd, rs1", "paddq rd, rs2"] },
]

[lower.Vsub]
variants = [
  { when = "rd==256 && elem==F32", insts = ["vsubps rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F32", insts = ["movaps rd, rs1", "subps rd, rs2"] },
  { when = "rd==256 && elem==F64", insts = ["vsubpd rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F64", insts = ["movaps rd, rs1", "subpd rd, rs2"] },
  { when = "rd==256 && elem==I32", insts = ["vpsubd rd, rs1, rs2"] },
  { when = "rd==256 && elem==I64", insts = ["vpsubq rd, rs1, rs2"] },
  { when = "rd<=128 && elem==I32", insts = ["movaps rd, rs1", "psubd rd, rs2"] },
  { when = "rd<=128 && elem==I64", insts = ["movaps rd, rs1", "psubq rd, rs2"] },
]

[lower.Vmul]
variants = [
  { when = "rd==256 && elem==F32", insts = ["vmulps rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F32", insts = ["movaps rd, rs1", "mulps rd, rs2"] },
  { when = "rd==256 && elem==F64", insts = ["vmulpd rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F64", insts = ["movaps rd, rs1", "mulpd rd, rs2"] },
  # i32×4 用 PMULLD（SSE4.1）、<8 x i32> 用 VPMULLD（AVX2）；i64 无 SIMD 乘法落兜底。
  { when = "rd==256 && elem==I32", insts = ["vpmulld rd, rs1, rs2"] },
  { when = "rd<=128 && elem==I32", insts = ["movaps rd, rs1", "pmulld rd, rs2"] },
]

[lower.Vdiv]
variants = [
  { when = "rd==256 && elem==F32", insts = ["vdivps rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F32", insts = ["movaps rd, rs1", "divps rd, rs2"] },
  { when = "rd==256 && elem==F64", insts = ["vdivpd rd, rs1, rs2"] },
  { when = "rd<=128 && elem==F64", insts = ["movaps rd, rs1", "divpd rd, rs2"] },
]

# Vneg = 0 - x：按元素类型分派减法指令（清零用 xorps 按位异或，与元素宽度无关）：
# f32 → subps、f64 → subpd、i32 → psubd、i64 → psubq；V256 仅浮点（整数 V256 需
# AVX2，落兜底 Unsupported）。
[lower.Vneg]
variants = [
  { when = "rd==256 && elem==F32", insts = ["vxorps rd, rd, rd", "vsubps rd, rd, rs1"] },
  { when = "rd==256 && elem==F64", insts = ["vxorps rd, rd, rd", "vsubpd rd, rd, rs1"] },
  # 整数 V256（AVX2）：vpxor 清零 + vpsubd/vpsubq
  { when = "rd==256 && elem==I32", insts = ["vpxor rd, rd, rd", "vpsubd rd, rd, rs1"] },
  { when = "rd==256 && elem==I64", insts = ["vpxor rd, rd, rd", "vpsubq rd, rd, rs1"] },
  { when = "rd<=128 && elem==F32", insts = ["xorps rd, rd", "subps rd, rs1"] },
  { when = "rd<=128 && elem==F64", insts = ["xorps rd, rd", "subpd rd, rs1"] },
  { when = "rd<=128 && elem==I32", insts = ["xorps rd, rd", "psubd rd, rs1"] },
  { when = "rd<=128 && elem==I64", insts = ["xorps rd, rd", "psubq rd, rs1"] },
]

# Vabs = 清符号位。andps 0x7FFFFFFF×4 是按位掩码，对 f32/i32（位 31）与
# f64/i64（位 63 = 第二个 32 位字 bit31）均清符号位——无需按元素分派。
# V256：128 位掩码复制后 vinsertf128 扩成 256 位（8×0x7FFFFFFF）+ vandps
[lower.Vabs]
variants = [
  { when = "rd==256", insts = [
      "mov_imm %t1, 0x7FFFFFFF7FFFFFFF",
      "movq_to_xmm %tf1:fpr, %t1",
      "mov_imm %t2, 0x7FFFFFFF7FFFFFFF",
      "movq_to_xmm %tf2:fpr, %t2",
      "punpckldq %tf1:fpr, %tf2:fpr",
      "vmovaps %tf3:fpr, %tf1:fpr",
      "vinsertf128 %tf1:fpr, %tf1:fpr, %tf3:fpr, 1",
      "vandps rd, rs1, %tf1:fpr",
  ] },
  { when = "rd<=128", insts = [
      "movaps rd, rs1",
      "mov_imm %t1, 0x7FFFFFFF7FFFFFFF",
      "movq_to_xmm %tf1:fpr, %t1",
      "mov_imm %t2, 0x7FFFFFFF7FFFFFFF",
      "movq_to_xmm %tf2:fpr, %t2",
      "punpckldq %tf1:fpr, %tf2:fpr",
      "andps rd, %tf1:fpr",
  ] },
]

# Vbitcast: 同宽位重解释（V128 movaps / V256 vmovaps 直拷）
[lower.Vbitcast]
variants = [
  { when = "rd==256", insts = ["vmovaps rd, rs1"] },
  { when = "rd<=128", insts = ["movaps rd, rs1"] },
]

# ExtractValue：聚合值在 GPR（≤64 位——compile 期已拒 >8 字节聚合）。
# lowering 把 default_opsize 设为聚合宽度（64）：`mov rd, rs1` 完整拷贝，
# 字段 0 即低 32 位；字段 N 逻辑右移 N×字段位宽（shr 64 位域），结果低
# 32 位为字段 N（高位零）。浮点字段无规则 → Unsupported（位模式在 GPR，
# 后续 FPR 消费需 movq 转换——未实现）。
[lower.ExtractValue]
variants = [
  { when = "imm0==0", insts = ["mov rd, rs1"] },
  { when = "elem==F64", insts = ["movq_to_xmm rd, rs1"] },
  { when = "elem==F32 && imm0==0", insts = ["movq_to_xmm rd, rs1"] },
  { when = "elem==F32", insts = ["mov %t, rs1", "mov_imm %t2, imm0_mul32", "shr %t, %t2", "movq_to_xmm rd, %t"] },
  { when = "elem==I64", insts = ["mov rd, rs1", "mov_imm %t, imm0_mul64", "shr rd, %t"] },
  { when = "elem==I32", insts = ["mov rd, rs1", "mov_imm %t, imm0_mul32", "shr rd, %t"] },
  { when = "elem==I16", insts = ["mov rd, rs1", "mov_imm %t, imm0_mul16", "shr rd, %t"] },
  { when = "elem==I8", insts = ["mov rd, rs1", "mov_imm %t, imm0_mul8", "shr rd, %t"] },
]

# InsertValue：字段写回（结果 = 聚合拷贝 + 字段替换，全部 64 位域）：
#   mov %t, rs1          完整拷贝（default_opsize=64）
#   mov_imm %t2, 掩码 + shl 到字段位 + not → 反掩码（清字段）
#   and %t, %t2          清字段位
#   mov %t3, rs2        字段值拷贝（不破坏源）
#   shl %t3, N×字段宽   字段值移到字段位
#   or %t, %t3           写入
#   mov rd, %t           结果
[lower.InsertValue]
variants = [
  { when = "elem==I64", insts = ["mov %t, rs1", "mov_imm %t2, 0xFFFFFFFFFFFFFFFF", "mov_imm %t4, imm0_mul64", "shl %t2, %t4", "not %t2", "and %t, %t2", "mov %t3, rs2", "shl %t3, %t4", "or %t, %t3", "mov rd, %t"] },
  { when = "elem==I32", insts = ["mov %t, rs1", "mov_imm %t2, 0xFFFFFFFF", "mov_imm %t4, imm0_mul32", "shl %t2, %t4", "not %t2", "and %t, %t2", "mov %t3, rs2", "shl %t3, %t4", "or %t, %t3", "mov rd, %t"] },
  { when = "elem==I16", insts = ["mov %t, rs1", "mov_imm %t2, 0xFFFF", "mov_imm %t4, imm0_mul16", "shl %t2, %t4", "not %t2", "and %t, %t2", "mov %t3, rs2", "shl %t3, %t4", "or %t, %t3", "mov rd, %t"] },
  { when = "elem==I8", insts = ["mov %t, rs1", "mov_imm %t2, 0xFF", "mov_imm %t4, imm0_mul8", "shl %t2, %t4", "not %t2", "and %t, %t2", "mov %t3, rs2", "shl %t3, %t4", "or %t, %t3", "mov rd, %t"] },
]

# Vextract 按元素类型 × 源宽度分派：
# - lane0：32 位元素 movss/movd 直取、64 位元素 movsd/movq_to_gpr 直取；
# - V256 f32 lane1-7：vextractf128 取半 + pshufd + movss；
# - V128 32 位元素 lane1-3：pshufd 旋转 + movss/movd；
# - 64 位元素 lane1（128 位向量 lane0/1）：pshufd 0x4E 旋转 64 位元素 + movsd/movq。
[lower.Vextract]
variants = [
  { when = "imm0==0 && elem==F32", insts = ["movss rd, rs1"] },
  { when = "imm0==0 && elem==I32", insts = ["movd_fr rd, rs1"] },
  { when = "imm0==0 && elem==F64", insts = ["movsd rd, rs1"] },
  { when = "imm0==0 && elem==I64", insts = ["movq_to_gpr rd, rs1"] },
  { when = "rs1==256 && imm0<4 && elem==F32", insts = ["vextractf128 %tf1:fpr, rs1, 0", "pshufd %tf1:fpr, %tf1:fpr, imm0", "movss rd, %tf1:fpr"] },
  { when = "rs1==256 && imm0>=4 && elem==F32", insts = ["vextractf128 %tf1:fpr, rs1, 1", "pshufd %tf1:fpr, %tf1:fpr, imm0_sub4", "movss rd, %tf1:fpr"] },
  # <8 x i32>：vextractf128 取半 + pshufd 提取 + movd_fr 落到 GPR（I32 结果）。
  { when = "rs1==256 && imm0<4 && elem==I32", insts = ["vextractf128 %tf1:fpr, rs1, 0", "pshufd %tf1:fpr, %tf1:fpr, imm0", "movd_fr rd, %tf1:fpr"] },
  { when = "rs1==256 && imm0>=4 && elem==I32", insts = ["vextractf128 %tf1:fpr, rs1, 1", "pshufd %tf1:fpr, %tf1:fpr, imm0_sub4", "movd_fr rd, %tf1:fpr"] },
  # <4 x f64>：lane0 直取 movsd（imm0==0 分支）；lane1 低半 pshufd 0x4E 旋转；
  # lane2 高半直取 movsd（高半低 64 位即 lane2）；lane3 高半 pshufd 0x4E 旋转。
  # <4 x i64> 同布局但结果落 GPR（movq_to_gpr，movsd 是 Freg 字段）。
  { when = "rs1==256 && imm0<2 && elem==F64", insts = ["vextractf128 %tf1:fpr, rs1, 0", "pshufd %tf1:fpr, %tf1:fpr, 78", "movsd rd, %tf1:fpr"] },
  { when = "rs1==256 && imm0==2 && elem==F64", insts = ["vextractf128 %tf1:fpr, rs1, 1", "movsd rd, %tf1:fpr"] },
  { when = "rs1==256 && imm0>=3 && elem==F64", insts = ["vextractf128 %tf1:fpr, rs1, 1", "pshufd %tf1:fpr, %tf1:fpr, 78", "movsd rd, %tf1:fpr"] },
  { when = "rs1==256 && imm0<2 && elem==I64", insts = ["vextractf128 %tf1:fpr, rs1, 0", "pshufd %tf1:fpr, %tf1:fpr, 78", "movq_to_gpr rd, %tf1:fpr"] },
  { when = "rs1==256 && imm0==2 && elem==I64", insts = ["vextractf128 %tf1:fpr, rs1, 1", "movq_to_gpr rd, %tf1:fpr"] },
  { when = "rs1==256 && imm0>=3 && elem==I64", insts = ["vextractf128 %tf1:fpr, rs1, 1", "pshufd %tf1:fpr, %tf1:fpr, 78", "movq_to_gpr rd, %tf1:fpr"] },
  { when = "imm0!=0 && elem==F32", insts = ["pshufd %tf1:fpr, rs1, imm0", "movss rd, %tf1:fpr"] },
  { when = "imm0!=0 && elem==I32", insts = ["pshufd %tf1:fpr, rs1, imm0", "movd_fr rd, %tf1:fpr"] },
  { when = "imm0!=0 && elem==F64", insts = ["pshufd %tf1:fpr, rs1, 78", "movsd rd, %tf1:fpr"] },
  { when = "imm0!=0 && elem==I64", insts = ["pshufd %tf1:fpr, rs1, 78", "movq_to_gpr rd, %tf1:fpr"] },
]

# Vinsert lane0: 32 位元素（movaps 复制整向量 + movss 覆盖低 32 位）
# 64 位元素（movaps + movsd）；V256 拆低半 → 插 lane0 → vinsertf128 拼回。
[lower.Vinsert]
variants = [
  { when = "rd==256 && (elem==F32 || elem==I32)", insts = ["vextractf128 %tf1:fpr, rs1, 0", "movss %tf1:fpr, rs2", "vinsertf128 rd, rs1, %tf1:fpr, 0"] },
  { when = "rd<=128 && (elem==F32 || elem==I32)", insts = ["movaps rd, rs1", "movss rd, rs2"] },
  { when = "rd==256 && (elem==F64 || elem==I64)", insts = ["vextractf128 %tf1:fpr, rs1, 0", "movsd %tf1:fpr, rs2", "vinsertf128 rd, rs1, %tf1:fpr, 0"] },
  { when = "rd<=128 && (elem==F64 || elem==I64)", insts = ["movaps rd, rs1", "movsd rd, rs2"] },
]

# Vbroadcast: 32 位元素（f32/i32）用 movss 取标量低 32 位 → 两次 punpckldq 自交错
# 成 [a,a,a,a]（i32 位模式等价）；V256 用 vbroadcastss 一次广播 8 lane。
# 64 位元素（f64/i64）：movsd+punpcklqdq（<2 x f64>）/vbroadcastsd（<4 x f64>）。
[lower.Vbroadcast]
variants = [
  { when = "rd==256 && (elem==F32 || elem==I32)", insts = ["vbroadcastss rd, rs1"] },
  { when = "rd<=128 && (elem==F32 || elem==I32)", insts = ["movss rd, rs1", "punpckldq rd, rd", "punpckldq rd, rd"] },
  { when = "rd==256 && (elem==F64 || elem==I64)", insts = ["vbroadcastsd rd, rs1"] },
  { when = "rd<=128 && (elem==F64 || elem==I64)", insts = ["movsd rd, rs1", "punpcklqdq rd, rd"] },
]

# ShuffleVector: SHUFPS 双源重排（dst=src1=a；imm8 由 mask 经 shufps_imm8 编码：
# dst[0]←src2[m0-4]、dst[1]←src1[m1]、dst[2]←src2[m2-4]、dst[3]←src1[m3]）
# V256（8 lane mask）：低/高 128 位各 vshufps（mask 低/高 4 lane）+ vinsertf128 拼装。
[lower.ShuffleVector]
variants = [
  { when = "rd==256 && elem==F32", insts = [
      "vextractf128 %tf1:fpr, rs1, 0",
      "vextractf128 %tf2:fpr, rs2, 0",
      "shufps %tf1:fpr, %tf2:fpr, shufps_imm8",
      "vextractf128 %tf3:fpr, rs1, 1",
      "vextractf128 %tf4:fpr, rs2, 1",
      "shufps %tf3:fpr, %tf4:fpr, shufps_imm8_hi",
      "vinsertf128 rd, %tf1:fpr, %tf3:fpr, 1",
  ] },
  { when = "rd<=128 && elem==F32", insts = ["movaps rd, rs1", "shufps rd, rs2, shufps_imm8"] },
]

# Vsplit: 宽向量 → 128 位片段（V256 → V128；imm0=0 低半 / 1 高半）
[lower.Vsplit]
variants = [
  { when = "imm0==0", insts = ["vextractf128 rd, rs1, 0"] },
  { when = "imm0==1", insts = ["vextractf128 rd, rs1, 1"] },
]

# Vconcat: 128 位片段拼接成 V256（lo 低半 + hi 高半 → vinsertf128 imm8=1）
[lower.Vconcat]
insts = ["vinsertf128 rd, rs1, rs2, 1"]

# ── Terminator lowering ──

[lower_term.Return]
# 用 movr8（0x8B：dest ← src）确保返回值 XReg → RAX 方向正确。
# 原 "mov RAX, val" 经 MOV_RM8_R64（0x89：dest ← src，字段为 Ireg←GprReg）
# 解析成 val ← RAX，方向反——返回值 XReg 分配到非 RAX 时 eax 保持垃圾。
insts = ["movr8 RAX, val", "movr8 RDX, val2"]

[lower_term.Jump]
insts = ["jmp target"]

[lower_term.Branch]
insts = ["test cond, cond", "je false_block", "jmp true_block"]

[lower_term.Unreachable]
insts = ["UD2"]
