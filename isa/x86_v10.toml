# ═══════════════════════════════════════════════
# Ch.5 — 控制转移 & 栈操作
# ═══════════════════════════════════════════════

[inst.RET]
encoding = "{0xC3:[0;8]}"
asm = "ret"
effect = "Ret"

[inst.NOP]
encoding = "{0x90:[0;8]}"
asm = "nop"

[inst.JMP_REL32]
fields = { rel = "BlockTarget" }
encoding = "{0xE9:[0;8]} !rel4"
asm = "jmp .L{rel}"
effect = "Jump"

# CALL rel32 — E8 + 32-bit relative displacement. The target is a
# cross-function FuncRef; `func` carries the FuncRef number and @call_reloc32
# records a relocation against the "@N" symbol, resolved by the JIT's
# RelocPatcher at load time.
[inst.CALL_RIP_REL]
fields = { target = "i32" }
encoding = "@call_reloc32 target, 0xE8"
asm = "call {target}"
effect = "Call"

# CALL r/m64 — FF /2 (indirect call through a register)
[inst.CALL_RM]
fields = { target = "Ireg" }
encoding = "{0xFF:[0;8]} {target:[0;3]}{0x2:[3;3]}{3:[6;2]}"
asm = "call *{target}"
effect = "Call"

[inst.JCC_REL32]
fields = { cond = "CondCode", rel = "BlockTarget" }
encoding = "{0x0F:[0;8]} {cond:[0;8]} !rel4"
asm = "j{cond} .L{rel}"
effect = "Branch"

[inst.UD2]
encoding = "{0x0F:[0;8]} {0x0B:[0;8]}"
asm = "ud2"
effect = "Trap"

# MFENCE — 0F AE F0
[inst.MFENCE]
encoding = "{0x0F:[0;8]} {0xAE:[0;8]} {0xF0:[0;8]}"
asm = "mfence"

# LOCK XADD [base], reg — F0 0F C1 /r (atomic read-modify-write)
[inst.XADD_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$lock_modrm_mem_rr opsize 0xC1 src base"
asm = "xadd [{base}], {src}"
effect = "Read+Write"

# XCHG [base], reg — 87 /r (implicitly locked, no F0 prefix)
[inst.XCHG_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$modrm_mem_rr opsize 0x87 src base"
asm = "xchg [{base}], {src}"
effect = "Read+Write"

# LOCK SUB/AND/OR/XOR [base], reg — F0 + 29/21/09/31 /r
[inst.SUB_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$lock_modrm_mem_rr opsize 0x29 src base"
asm = "locksub [{base}], {src}"
effect = "Read+Write"

[inst.AND_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$lock_modrm_mem_rr opsize 0x21 src base"
asm = "lockand [{base}], {src}"
effect = "Read+Write"

[inst.OR_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$lock_modrm_mem_rr opsize 0x09 src base"
asm = "lockor [{base}], {src}"
effect = "Read+Write"

[inst.XOR_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$lock_modrm_mem_rr opsize 0x31 src base"
asm = "lockxor [{base}], {src}"
effect = "Read+Write"

# movabs rd, <global> — 48 B8+r + 8-byte absolute placeholder (@abs_reloc
# patches it against the "G{id}" symbol).
[inst.MOVABS_GLOBAL]
fields = { dest = "Ireg", global = "i32" }
encoding = "{$REX_BASE:[4;4]}{1:[3;1]}{0:[2;1]}{0:[1;1]}{dest:[0;1;3]} {0x17:[3;5]}{dest:[0;3]} @abs_reloc global"
asm = "movabs_g {dest}, {global}"

# MOV r, [base] — 8B /r (mod=00 memory)
[inst.MOV_R_MEM]
fields = { dest = "Ireg", base = "Ireg", opsize = "Opsize" }
encoding = "$modrm_mem_rr opsize 0x8B dest base"
asm = "mov_mem {dest}, [{base}]"

# MOV [base], r — 89 /r (memory store)
[inst.STORE_MEM_R]
fields = { base = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$modrm_mem_rr opsize 0x89 src base"
asm = "mov_sto [{base}], {src}"

# BSWAP r64 — 48 0F C8+r (byte-reverse, REX.W). REX.B = dest[3].
[inst.BSWAP_R]
fields = { dest = "Ireg" }
encoding = "{0x48:[4;4]}{0:[3;1]}{0:[2;1]}{0:[1;1]}{dest:[0;1;3]} {0x0F:[0;8]} {dest:[0;3]}{0xC8:[3;5]}"
asm = "bswap {dest}"

# LZCNT/TZCNT/POPCNT r64, r/m64 — F3 0F BD/BC/B8 (REX.W, dest=reg)
[inst.LZCNT_R]
fields = { dest = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$sse_rr 0xF3 0xBD 1 dest src"
asm = "lzcnt {dest}, {src}"

[inst.TZCNT_R]
fields = { dest = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$sse_rr 0xF3 0xBC 1 dest src"
asm = "tzcnt {dest}, {src}"

[inst.POPCNT_R]
fields = { dest = "Ireg", src = "Ireg", opsize = "Opsize" }
encoding = "$sse_rr 0xF3 0xB8 1 dest src"
asm = "popcnt {dest}, {src}"

[inst.PUSH]
asm = "push {reg}"
encoding = "$push_reg reg"
effect = "Write"
variants = [{ reg = "Ireg" }, { reg = "GprReg" }]

[inst.POP]
asm = "pop {reg}"
encoding = "$pop_reg reg"
effect = "Read+Write"
variants = [{ reg = "Ireg" }, { reg = "GprReg" }]

[inst.MOV64_RR]
fields = { dest = "GprReg", src = "GprReg" }
# 0x89 /r = MOV r/m64, r64: ModRM.rm=dest, ModRM.reg=src → data flows src→dest
encoding = "{0x48:[0;8]} {0x89:[0;8]} {dest:[0;3]}{src:[3;3]}{3:[6;2]}"
asm = "mov64rr {dest}, {src}"

[inst.MOV_RM8_R64]
fields = { dest = "Ireg", src = "GprReg", opsize = "Opsize" }
encoding = "$modrm_rr opsize 0x89 src dest"
asm = "movrm {dest}, {src}"

# mov physical GPR → VReg (reverse of MOV_RM8_R64; used by call lowering to
# move call arguments into ABI registers: 8B direction, dest@reg, src@rm).
[inst.MOV_R8_RM64]
fields = { dest = "GprReg", src = "Ireg", opsize = "Opsize" }
encoding = "$modrm_rr opsize 0x8B dest src"
asm = "movr8 {dest}, {src}"

[inst.CQO]
encoding = "{0x48:[0;8]} {0x99:[0;8]}"
asm = "cqo"


# ═══════════════════════════════════════════════
# 帧管理 (Frame Management)
#
# SUB64_R_IMM32 / ADD64_R_IMM32 — @frame_alloc/@frame_free 使用
# REX.W + 81 /digit + ModRM(mod=3, digit, rm) + imm32
# ═══════════════════════════════════════════════

[inst.SUB64_R_IMM32]
fields = { dest = "GprReg", imm = "u32" }
encoding = "$op_rm_imm32 5 dest imm"
asm = "sub {dest}, {imm}"

[inst.ADD64_R_IMM32]
fields = { dest = "GprReg", imm = "u32" }
encoding = "$op_rm_imm32 0 dest imm"
asm = "add {dest}, {imm}"


# ═══════════════════════════════════════════════
# 条件码名称 (CC Names) — JCC opcode → asm suffix
# ═══════════════════════════════════════════════

[cc_names]
"0x84" = "e"
"0x85" = "ne"
"0x8C" = "l"
"0x8E" = "le"
"0x8F" = "g"
"0x8D" = "ge"
"0x82" = "b"
"0x86" = "be"
"0x87" = "a"
"0x83" = "ae"
"0x8A" = "p"
"0x8B" = "np"
"0x88" = "s"
"0x89" = "ns"
"0x90" = "o"
"0x91" = "no"


# ═══════════════════════════════════════════════
# 序言 / 尾声 (Prologue / Epilogue)
# ═══════════════════════════════════════════════

[emit.prologue]
# IMPORTANT: @move_args must run AFTER @push_callee. Argument VRegs can be
# allocated to callee-saved registers (e.g. R14/R15); moving args before the
# prologue saves those registers would clobber the caller's values, and the
# subsequent push would save the args instead of the originals — corrupting
# the caller on return (mixed-signature JIT crash in release builds).
insts = [
    "push RBP",
    "mov64rr RBP, RSP",
    "@push_callee",
    "@move_args",
    "@frame_alloc",
]

[emit.epilogue]
insts = ["@frame_free", "@pop_callee", "pop RBP", "ret"]


# ═══════════════════════════════════════════════
# Lowering 规则 (v11 AST 格式)
#
# 虚拟操作数: rd, rs1, rs2, iconst, fconst, VReg(N), val, target, cond, ...
# 所有 lowering 规则默认为 opsize=64.
# ═══════════════════════════════════════════════

# ── Integer ──

[lower.Iconst]
insts = ["mov_imm rd, iconst"]

# Call: move args into ABI registers (RCX/RDX/R8/R9 — Windows x64 integer
# arg regs), emit the relocatable CALL, and move the RAX return value back.
# `func` expands to the IR FuncRef number; @call_reloc32 records "@N".
# Beyond 4 args / float args are not yet lowered (recorded limitation).
[lower.Call]
insts = [
    "MOV_R8_RM64 RCX, arg0",
    "MOV_R8_RM64 RDX, arg1",
    "MOV_R8_RM64 R8, arg2",
    "MOV_R8_RM64 R9, arg3",
    "CALL_RIP_REL func",
    "MOV_RM8_R64 rd, RAX",
]

[lower.CallIndirect]
insts = ["CALL_RM rs1"]
[lower.Iadd]
insts = ["mov rd, rs1", "add rd, rs2"]

[lower.Isub]
insts = ["mov rd, rs1", "sub rd, rs2"]

[lower.Imul]
insts = ["mov rd, rs1", "imul rd, rs2"]

[lower.Band]
insts = ["mov rd, rs1", "and rd, rs2"]

[lower.Bor]
insts = ["mov rd, rs1", "or rd, rs2"]

[lower.Bxor]
insts = ["mov rd, rs1", "xor rd, rs2"]

[lower.Ishl]
insts = ["mov rd, rs1", "mov R11, rs2", "shl rd, R11"]

[lower.Ushr]
insts = ["mov rd, rs1", "mov R11, rs2", "shr rd, R11"]

[lower.Sshr]
insts = ["movsxd rd, rs1", "mov R11, rs2", "sar rd, R11"]

[lower.Rotl]
insts = ["mov rd, rs1", "mov R11, rs2", "rol rd, R11"]

[lower.Rotr]
insts = ["mov rd, rs1", "mov R11, rs2", "ror rd, R11"]

[lower.Bnot]
insts = ["mov rd, rs1", "not rd"]

[lower.Udiv]
insts = ["xor RDX, RDX", "mov RAX, rs1", "div rs2", "mov rd, RAX"]

[lower.Sdiv]
insts = ["mov R11, rs2", "movsxd RAX, rs1", "cqo", "idiv R11", "mov rd, RAX"]

[lower.Urem]
insts = ["xor RDX, RDX", "mov RAX, rs1", "div rs2", "mov rd, RDX"]

[lower.Srem]
insts = ["mov R11, rs2", "movsxd RAX, rs1", "cqo", "idiv R11", "mov rd, RDX"]

# ── Identity ──

[lower.Copy]
insts = ["mov rd, rs1"]

[lower.Bitcast]
insts = ["mov rd, rs1"]

[lower.Sextend]
insts = ["movsxd rd, rs1"]

[lower.Uextend]
insts = ["mov rd, rs1"]

[lower.Ireduce]
insts = ["mov rd, rs1"]

# ── Memory ──

[lower.Load]
insts = ["mov_mem rd, [rs1]"]

# Store operands = [value, addr]（builder.store(value, addr)）——addr=rs2、value=rs1
[lower.Store]
insts = ["mov_sto [rs2], rs1"]

# ── Icmp ──

[lower.Icmp.Equal]
insts = ["xor rd, rd", "cmp rs1, rs2", "sete rd"]

[lower.IsNull]
insts = ["xor rd, rd", "test rs1, rs1", "sete rd"]

[lower.IsNotNull]
insts = ["xor rd, rd", "test rs1, rs1", "setne rd"]

# GetElementPtr: lea [base + index*4] (element size fixed at 4 — recorded).
[lower.GetElementPtr]
insts = ["lea rd, [rs1+rs2*4+0]"]

[lower.Smin]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovge rd, rs2"]

[lower.Smax]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovle rd, rs2"]

[lower.Umin]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovae rd, rs2"]

[lower.Umax]
insts = ["mov rd, rs1", "cmp rs1, rs2", "cmovbe rd, rs2"]

# Overflow ops: result half in rd, flag half in r2 (setcc).
[lower.SaddOverflow]
insts = ["mov rd, rs1", "add rd, rs2", "seto r2"]

[lower.UaddOverflow]
insts = ["mov rd, rs1", "add rd, rs2", "setb r2"]

[lower.SsubOverflow]
insts = ["mov rd, rs1", "sub rd, rs2", "seto r2"]

[lower.UsubOverflow]
insts = ["mov rd, rs1", "sub rd, rs2", "setb r2"]

[lower.SmulOverflow]
insts = ["mov rd, rs1", "imul rd, rs2", "seto r2"]

[lower.UmulOverflow]
insts = ["mov rd, rs1", "imul rd, rs2", "setb r2"]

# SaddSat: saturating signed add.
# rd = a+b; on overflow (OF set) clamp to MAX/MIN by sign of a.
# Scratch R11-R14 (precolored) — recorded: register-conflict risk when live.
[lower.SaddSat]
insts = [
    "mov rd, rs1",
    "add rd, rs2",
    "seto R11",
    "mov_imm R12, 0x7FFFFFFFFFFFFFFF",
    "mov_imm R13, 0x8000000000000000",
    "test rs1, rs1",
    "cmovns R14, R12",
    "cmovs R14, R13",
    "test R11, R11",
    "cmovne rd, R14",
]

# UaddSat: unsigned saturating add — carry → MAX.
[lower.UaddSat]
insts = [
    "mov rd, rs1",
    "add rd, rs2",
    "setb R11",
    "mov_imm R12, 0xFFFFFFFFFFFFFFFF",
    "test R11, R11",
    "cmovne rd, R12",
]

# SsubSat: saturating signed sub — on overflow clamp by sign of a.
[lower.SsubSat]
insts = [
    "mov rd, rs1",
    "sub rd, rs2",
    "seto R11",
    "mov_imm R12, 0x7FFFFFFFFFFFFFFF",
    "mov_imm R13, 0x8000000000000000",
    "test rs1, rs1",
    "cmovns R14, R12",
    "cmovs R14, R13",
    "test R11, R11",
    "cmovne rd, R14",
]

# UsubSat: unsigned saturating sub — borrow (a<b) → 0.
[lower.UsubSat]
insts = [
    "mov rd, rs1",
    "sub rd, rs2",
    "setb R11",
    "xor R12, R12",
    "test R11, R11",
    "cmovne rd, R12",
]

# Abs: rd = |rs1| — neg R11; cmovl picks -rs1 when rs1 < 0.
[lower.Abs]
insts = ["mov R11, rs1", "neg R11", "mov rd, rs1", "test rs1, rs1", "cmovl rd, R11"]

[lower.Icmp.NotEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setne rd"]

[lower.Icmp.SignedLessThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "setl rd"]

[lower.Icmp.SignedLessThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setle rd"]

[lower.Icmp.SignedGreaterThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "setg rd"]

[lower.Icmp.SignedGreaterThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setge rd"]

[lower.Icmp.UnsignedLessThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "setb rd"]

[lower.Icmp.UnsignedLessThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setbe rd"]

[lower.Icmp.UnsignedGreaterThan]
insts = ["xor rd, rd", "cmp rs1, rs2", "seta rd"]

[lower.Icmp.UnsignedGreaterThanOrEqual]
insts = ["xor rd, rd", "cmp rs1, rs2", "setae rd"]

# ── Trap / Freeze ──
[lower.Trap]
insts = ["UD2"]

[lower.Freeze]
insts = ["mov rd, rs1"]

[lower.Fence]
insts = ["mfence"]

# AtomicRmw: dispatched by op (AtomicRmw.<Op>). Old value loaded first.
# Add/Xchg/Sub/And/Or/Xor implemented; Nand/Max/Min/Umax/Umin need a
# cmpxchg loop (recorded).
[lower.AtomicRmw.Add]
insts = ["MOV_R_MEM rd, rs1", "XADD_MEM_R rs1, rs2"]

[lower.AtomicRmw.Xchg]
insts = ["MOV_R_MEM rd, rs1", "XCHG_MEM_R rs1, rs2"]

[lower.AtomicRmw.Sub]
insts = ["MOV_R_MEM rd, rs1", "SUB_MEM_R rs1, rs2"]

[lower.AtomicRmw.And]
insts = ["MOV_R_MEM rd, rs1", "AND_MEM_R rs1, rs2"]

[lower.AtomicRmw.Or]
insts = ["MOV_R_MEM rd, rs1", "OR_MEM_R rs1, rs2"]

[lower.AtomicRmw.Xor]
insts = ["MOV_R_MEM rd, rs1", "XOR_MEM_R rs1, rs2"]

# Bitreverse: Hacker's Delight 64-bit reversal
# ((x>>n)&m)|((x&m)<<n) for n=1,2,4, then bswap.
# Scratch R11-R15 (precolored) — recorded: conflict risk when live.
[lower.Bitreverse]
insts = [
    "mov rd, rs1",
    "mov_imm R11, 1",
    "mov_imm R12, 0x5555555555555555",
    "mov R13, rd",
    "shr R13, R11",
    "and R13, R12",
    "mov R14, rd",
    "and R14, R12",
    "shl R14, R11",
    "or R13, R14",
    "mov_imm R11, 2",
    "mov_imm R12, 0x3333333333333333",
    "mov R15, R13",
    "shr R15, R11",
    "and R15, R12",
    "mov R14, R13",
    "and R14, R12",
    "shl R14, R11",
    "or R15, R14",
    "mov_imm R11, 4",
    "mov_imm R12, 0x0F0F0F0F0F0F0F0F",
    "mov R13, R15",
    "shr R13, R11",
    "and R13, R12",
    "mov R14, R15",
    "and R14, R12",
    "shl R14, R11",
    "or R13, R14",
    "bswap R13",
    "mov rd, R13",
]

# Fcopysign: (a & ~sign) | (b & sign) via GPR bit round-trip.
[lower.Fcopysign]
insts = [
    "movq_to_gpr R11, rs1",
    "movq_to_gpr R12, rs2",
    "mov_imm R13, 0x8000000000000000",
    "mov R14, R13",
    "not R14",
    "and R11, R14",
    "and R12, R13",
    "or R11, R12",
    "movq_to_xmm rd, R11",
]

# GlobalAddr: placeholder zero (global symbols are not resolved by the
# single-function JIT — recorded; needs module-level global relocation).
[lower.GlobalAddr]
insts = ["movabs_g rd, global"]

# Alloca: stack slot at [RSP-16] (fixed offset, single slot — recorded;
# dynamic stack-frame slot allocation needs compiler-level support).
[lower.Alloca]
insts = ["lea rd, [rs1+rs2*1+0]"]

[lower.Clz]
insts = ["lzcnt rd, rs1"]

[lower.Ctz]
insts = ["tzcnt rd, rs1"]

[lower.Popcnt]
insts = ["popcnt rd, rs1"]

[lower.Bswap]
insts = ["bswap rd"]

[lower.Fmin]
insts = ["movsd rd, rs1", "minsd rd, rs2"]

[lower.Fmax]
insts = ["movsd rd, rs1", "maxsd rd, rs2"]

[lower.Fma]
insts = ["movsd rd, rs1", "mulsd rd, rs2", "addsd rd, rs3"]

# Ftrunc: truncate toward zero via int round-trip (cvttsd2si is truncating).
[lower.Ftrunc]
insts = ["movsd rd, rs1", "cvtsd2si R11, rd", "cvtsi2sd rd, R11"]

# ROUNDSD-based rounding (0=near,1=floor,2=ceil).
[lower.Ffloor]
insts = ["movsd rd, rs1", "roundsd rd, rd, 1"]

[lower.Fceil]
insts = ["movsd rd, rs1", "roundsd rd, rd, 2"]

[lower.Fround]
insts = ["movsd rd, rs1", "roundsd rd, rd, 0"]

# ── Float ──

[lower.Fadd]
insts = ["movsd rd, rs1", "addsd rd, rs2"]

[lower.Fsub]
insts = ["movsd rd, rs1", "subsd rd, rs2"]

[lower.Fmul]
insts = ["movsd rd, rs1", "mulsd rd, rs2"]

[lower.Fdiv]
insts = ["movsd rd, rs1", "divsd rd, rs2"]

[lower.Fconst]
insts = ["mov_imm R10, fconst", "movq_to_xmm rd, R10"]

[lower.Fsqrt]
insts = ["movsd rd, rs1", "sqrtsd rd, rs1"]

[lower.Fabs]
insts = [
    "movsd rd, rs1",
    "mov_imm R10, 0x7FFFFFFFFFFFFFFF",
    "movq_to_xmm XMM0, R10",
    "andpd rd, XMM0",
]

[lower.Fneg]
insts = [
    "movsd rd, rs1",
    "mov_imm R10, 0x8000000000000000",
    "movq_to_xmm XMM0, R10",
    "xorpd rd, XMM0",
]

# ── Fcmp ──

[lower.Fcmp.Equal]
insts = ["xor rd, rd", "comisd rs1, rs2", "sete rd"]

[lower.Fcmp.NotEqual]
insts = ["xor rd, rd", "comisd rs1, rs2", "setne rd"]

[lower.Fcmp.LessThan]
insts = ["xor rd, rd", "comisd rs1, rs2", "setb rd"]

[lower.Fcmp.LessThanOrEqual]
insts = ["xor rd, rd", "comisd rs1, rs2", "setbe rd"]

[lower.Fcmp.GreaterThan]
insts = ["xor rd, rd", "comisd rs1, rs2", "seta rd"]

[lower.Fcmp.GreaterThanOrEqual]
insts = ["xor rd, rd", "comisd rs1, rs2", "setae rd"]

[lower.Fcmp.Unordered]
insts = ["xor rd, rd", "comisd rs1, rs2", "setp rd"]

[lower.Fcmp.Ordered]
insts = ["xor rd, rd", "comisd rs1, rs2", "setnp rd"]

# ── Select / StackAddr ──

[lower.Select]
insts = ["mov rd, rs2"]

[lower.StackAddr]
insts = ["lea_off rd, offset"]

# ── Pattern lowering (LEA optimization) ──
#
# Now uses V11 asm syntax — AsmResolver decomposes `[base+index*scale]`
# into {base, index, scale, disp} field bindings via decompose_mem_operand().

[lower_pattern.lea-merge-iadd-imul-1]
insts = ["lea rd, [rs1+rs2*1]"]

[lower_pattern.lea-merge-iadd-imul-2]
insts = ["lea rd, [rs1+rs2*2]"]

[lower_pattern.lea-merge-iadd-imul-4]
insts = ["lea rd, [rs1+rs2*4]"]

[lower_pattern.lea-merge-iadd-imul-8]
insts = ["lea rd, [rs1+rs2*8]"]

# ── Vector / SIMD ──

[lower.Vadd]
insts = ["movaps rd, rs1", "addps rd, rs2"]

[lower.Vsub]
insts = ["movaps rd, rs1", "subps rd, rs2"]

[lower.Vmul]
insts = ["movaps rd, rs1", "mulps rd, rs2"]

# Vextract: extract low dword from vector to scalar (lane 0 via MOVD)
# For non-zero lanes: PSHUFD + MOVD sequence needed
# NOTE: ShuffleVector mask pass-through not yet implemented — SHUFPS/PSHUFD
# instructions are defined and ready for future lowering.
[lower.Vextract]
insts = ["movd rd, rs1"]

# Vinsert: insert scalar into low dword of vector (lane 0 via MOVD)
[lower.Vinsert]
insts = ["movd rd, rs1"]

# ── Terminator lowering ──

[lower_term.Return]
insts = ["mov RAX, val", "mov RDX, val2"]

[lower_term.Jump]
insts = ["jmp target"]

[lower_term.Branch]
insts = ["test cond, cond", "je false_block", "jmp true_block"]

[lower_term.Unreachable]
insts = ["nop"]
