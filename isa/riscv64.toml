    "AND {g1}, {g}, {g2}",
    "SRLI {g3}, {g}, 2",
    "AND {g3}, {g3}, {g2}",
    "ADD {g}, {g1}, {g3}",
    "LUI {g2}, 0xf0f1",      # 绝对 0x0f0f1000
    "ADDI {g2}, {g2}, -0xf1",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "SRLI {g1}, {g}, 4",
    "ADD {g}, {g}, {g1}",
    "AND {g}, {g}, {g2}",
    "SRLI {g1}, {g}, 8",
    "ADD {g}, {g}, {g1}",
    "SRLI {g1}, {g}, 16",
    "ADD {g}, {g}, {g1}",
    "SRLI {g1}, {g}, 32",
    "ADD {g}, {g}, {g1}",
    "ANDI {out}, {g}, 0x7F",
]


# ── Nop / Undef / Poison / Bitreverse ──
# Undef/Poison 语义自由 → 返回 0（xor 清零，与 x86 一致）。

[[lowering]]
op = "Nop"
insts = ["NOP"]

[[lowering]]
op = ["Undef", "Poison"]
insts = ["XOR {out}, {out}, {out}"]

[[lowering]]
op = "Bitreverse"
insts = [
    "SRLI {g1}, {0}, 1",
    "LUI {g2}, 0x55555",     # 绝对 0x55555000
    "ADDI {g2}, {g2}, 0x555",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {0}, 1",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 2",
    "LUI {g2}, 0x33333",     # 绝对 0x33333000
    "ADDI {g2}, {g2}, 0x333",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 2",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 4",
    "LUI {g2}, 0xf0f1",      # 绝对 0x0f0f1000
    "ADDI {g2}, {g2}, -0xf1",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 4",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 8",
    "LUI {g2}, 0xff0",       # 绝对 0x0ff0000
    "ADDI {g2}, {g2}, 0xff",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 8",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 16",
    # mask = 0x0000FFFF0000FFFF：0x0000FFFF = lui 0x10 + addi -1
    # （0xFFFF 低 12 位 0xFFF 有符号 = -1，lui 需 +1 进位 0x10000）
    "LUI {g2}, 0x10",        # 绝对 0x10000
    "ADDI {g2}, {g2}, -1",
    "SLLI {g3}, {g2}, 32",
    "OR {g2}, {g2}, {g3}",
    "AND {g1}, {g1}, {g2}",
    "SLLI {g3}, {g}, 16",
    "AND {g3}, {g3}, {g2}",
    "OR {g}, {g1}, {g3}",
    "SRLI {g1}, {g}, 32",
    "SLLI {g}, {g}, 32",
    "OR {out}, {g}, {g1}",
]

# ═══════════════════════ 参数化模板（v18 S2c：单精度/双精度对）═══════════════════════
# 一处声明 → 两条指令（类型后缀、mnemonic 后缀、funct7 逐行给）。
# 助记符后缀由 `{p.lower}` 插值得到（`fadd.{p.lower}`），因此 `fadd.s` 这种**带点**的
# 助记符也能派生——旧 `[[families]]` 的 `{name}` 只能给"变体名小写"，表达不了。

# 浮点算术：**rm 是操作数**（它就是 `funct3` 那 3 位）。每族两条并列声明：
#   ① **显式 rm**（`fadd.s f1, f2, f3, rtz`）—— form `R_RM`，第 4 个操作数落 `funct3`；
#   ② **省略 rm**（`fadd.s f1, f2, f3`）—— 上游把省略写法当 **`dyn`（= 7）** 的别名，
#      所以这里 `funct3 = 7` 固定。**这不是"另一条指令"**，而是同一编码空间里最常用的一格：
#      声明序把 ① 放在前，于是 `..., dyn` 解出来落在 ①（文本带 `, dyn`，与上游 `CHECK-INST`
#      的写法一致），② 只承担"省略写法能装配"这一件事。
# 修这里同时修掉一处**字节错**：从前 ② 把 `funct3` 写成 `0`（= rne），而省略 rm 的语义是
# `dyn`——语料铺开后由 `fp-default-rounding-mode.s` 的上游期望字节直接守住。
[[templates]]
name = "FADD_RM"
body = { form = "R_RM", opcode = 0x53, fields = { funct7 = "{funct7}" }, ops = ["dst:fpr:out", "src:fpr", "src2:fpr", "rm:rm3"], asm = "fadd.{p.lower} {dst}, {src}, {src2}, {rm}" }
rows = [
  { inst = "FADD_S_RM", p = "S", funct7 = 0x00 },
  { inst = "FADD_D_RM", p = "D", funct7 = 0x01 },
]
[[templates]]
name = "FADD_DYN"
body = { form = "R", opcode = 0x53, fields = { funct3 = 7, funct7 = "{funct7}" }, ops = ["dst:fpr:out", "src:fpr", "src2:fpr"], asm = "fadd.{p.lower} {dst}, {src}, {src2}" }
rows = [
  { inst = "FADD_S", p = "S", funct7 = 0x00 },
  { inst = "FADD_D", p = "D", funct7 = 0x01 },
]
[[templates]]
name = "FSUB_RM"
body = { form = "R_RM", opcode = 0x53, fields = { funct7 = "{funct7}" }, ops = ["dst:fpr:out", "src:fpr", "src2:fpr", "rm:rm3"], asm = "fsub.{p.lower} {dst}, {src}, {src2}, {rm}" }
rows = [
  { inst = "FSUB_S_RM", p = "S", funct7 = 0x04 },
  { inst = "FSUB_D_RM", p = "D", funct7 = 0x05 },
]
[[templates]]
name = "FSUB_DYN"
body = { form = "R", opcode = 0x53, fields = { funct3 = 7, funct7 = "{funct7}" }, ops = ["dst:fpr:out", "src:fpr", "src2:fpr"], asm = "fsub.{p.lower} {dst}, {src}, {src2}" }
rows = [
  { inst = "FSUB_S", p = "S", funct7 = 0x04 },
  { inst = "FSUB_D", p = "D", funct7 = 0x05 },
]
[[templates]]
name = "FMUL_RM"
body = { form = "R_RM", opcode = 0x53, fields = { funct7 = "{funct7}" }, ops = ["dst:fpr:out", "src:fpr", "src2:fpr", "rm:rm3"], asm = "fmul.{p.lower} {dst}, {src}, {src2}, {rm}" }
rows = [
  { inst = "FMUL_S_RM", p = "S", funct7 = 0x08 },
  { inst = "FMUL_D_RM", p = "D", funct7 = 0x09 },
]
[[templates]]
name = "FMUL_DYN"
body = { form = "R", opcode = 0x53, fields = { funct3 = 7, funct7 = "{funct7}" }, ops = ["dst:fpr:out", "src:fpr", "src2:fpr"], asm = "fmul.{p.lower} {dst}, {src}, {src2}" }
