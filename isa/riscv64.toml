# ── 负向与解码向量（v19 V3a：四种形态都在这份谱里被真跑过）──

# 汇编负向：imm12 有符号范围 [-2048, 2047] 由**汇编匹配器**把关，越界文本直接匹配不上
# （所以断言的是 `no matching instruction`，而不是 encode 期错误——“谁先拒绝”由谱决定，
# 向量只钉“必须失败且消息可辨认”）。
[[vectors]]
asm = "addi X1, X2, 4096"
error = "no matching instruction"

# 汇编负向：未知助记符必须在 **assemble** 处报错。
[[vectors]]
asm = "nosuchins X1, X2"
error = "no matching instruction"

# 解码负向（截断输入）：1 字节不足以解码定宽 32 位字，且 `decode_partial` 应报"吃掉 1 字节"。
[[vectors]]
comment = "截断到 1 字节：decode 必须拒绝，且 decode_partial 报消费 1 字节"
bytes = [0x13]
error = "DECODE"
partial = 1

# 解码负向（整字）：opcode 0x00 未定义 ⇒ decode 必须失败（不猜低 7 位）。
[[vectors]]
bytes = [0x00, 0x00, 0x00, 0x00]
error = "DECODE"

# 解码正向：只给字节（不给 asm），要求 decode 吃满再编码逐字节一致。
[[vectors]]
comment = "nop 的字节（addi x0, x0, 0）：decode → encode 必须回到同一字节"
bytes = [0x13, 0x00, 0x00, 0x00]


