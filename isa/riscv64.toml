# `stack_arg_store`：调用方把传出实参（第 9+ 个命名实参、以及变参的未命名实参）写进传出区——
# S 形式是"值寄存器 + 基址寄存器 + 位移立即数"，生成器按**形状**（没有 Mem 槽）把基址填成 sp、
# 位移填调用方偏移（v20 V1/V6+）。
roles = ["callee_save", "stack_arg_store"]

# ── 控制流 ──

[[instructions]]
name = "JAL"
roles = ["call", "jump"]
form = "J"
opcode = 0x6F
ops = ["dst:gpr:out", "target:off_j"]
asm = "jal {dst}, {target}"

# `jal rd, rs` = `jalr rd, rs, 0` 的别名（LLVM 接受；语料 `rv32i-valid.s:88` 就是这么写的）。
# 与 `jal {dst}, {target}` 同首段 ⇒ 靠**第二操作数的槽类型**分派：reg 槽比标签/偏移槽更具体 ✓。
# form "I" 的 imm12 字段不绑定操作数 ⇒ 编码缺省发 0、解码的补集零守卫要求它为 0 ✓（正是别名语义）。
[[instructions]]
name = "JAL_R"
form = "I"
opcode = 0x67
fields = { funct3 = 0 }
ops = ["dst:gpr:out", "src:gpr"]
asm = "jal {dst}, {src}"

[[instructions]]
name = "JALR"
form = "I"
opcode = 0x67
fields = { funct3 = 0 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "jalr {dst}, {imm}({src})"

# 三操作数写法 `jalr rd, rs1, imm`（RISC-V 手册里的规范形）——与两操作数的 `jalr rd, imm(rs1)`
# **同编码**，只是文本不同；解码同键（叶 arm 按声明序取先者，渲染仍是两操作数形）。
[[instructions]]
name = "JALR3"
form = "I"
opcode = 0x67
fields = { funct3 = 0 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "jalr {dst}, {src}, {imm}"

