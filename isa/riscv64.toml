[[instructions]]
name = "FENCE"
# 裸 `fence` = `fence iorw, iorw`（顶层仍是 opcode + 两个 4 位字段常量；
# 与下面带操作数的 FENCE_PS 共用同一条 trie 边上的不同叶）
form = "FENCEPS"
opcode = 0x0F
fields = { pred = 15, succ = 15 }
asm = "fence"

# `fence pred, succ`：pred/succ 各是 i/o/r/w 的**字母集合**（新版能力 `kind = "bits"`）
[[instructions]]
name = "FENCE_PS"
form = "FENCEPS"
opcode = 0x0F
ops = ["pred:fence_set", "succ:fence_set"]
asm = "fence {pred}, {succ}"

# `fence.i`（= funct3 1）与 `fence.tso`（= `fence rw, rw` + fm=8）**不再用整字常量**：
# 三者共用 opcode 0x0F 这条 trie 边（整字常量会与 `fence pred, succ` 在 [0,7) 上判成同一条边）。
[[instructions]]
name = "FENCE_I"
form = "FENCEPS"
opcode = 0x0F
fields = { funct3 = 1 }
asm = "fence.i"

[[instructions]]
name = "FENCE_TSO"
form = "FENCEPS"
opcode = 0x0F
fields = { fm = 8, pred = 3, succ = 3 }
asm = "fence.tso"

# ────────────────────── W 变体（RV64 32 位语义）──────────────────────
# **立即数**移位的 W 变体是 opcode 0x1B（`slliw`/`srliw`/`sraiw`，shamt 5 位）——
# 与 0x3B 的寄存器移位（上面 WW 模板）是两条不同的指令，别再混。
# `shamt_w`（5 位）独立于 `shamt`（6 位）：共用 6 位槽会让 `slliw rd, rs1, 32..63`
# 静默编成别的位型。

[[instructions]]
name = "SLLIW"
only_variants = { xlen = [64] }
form = "SHIFT5"
opcode = 0x1B
fields = { funct3 = 1, funct7 = 0x00 }
ops = ["dst:gpr:out", "src:gpr", "imm:shamt_w"]
asm = "slliw {dst}, {src}, {imm}"

[[instructions]]
name = "SRLIW"
only_variants = { xlen = [64] }
form = "SHIFT5"
opcode = 0x1B
fields = { funct3 = 5, funct7 = 0x00 }
ops = ["dst:gpr:out", "src:gpr", "imm:shamt_w"]
asm = "srliw {dst}, {src}, {imm}"

[[instructions]]
name = "SRAIW"
only_variants = { xlen = [64] }
form = "SHIFT5"
opcode = 0x1B
fields = { funct3 = 5, funct7 = 0x20 }
ops = ["dst:gpr:out", "src:gpr", "imm:shamt_w"]
asm = "sraiw {dst}, {src}, {imm}"

# ── 字节/半字访存（RV32I/RV64I 基础族；与 lw/sw 同形，只差 funct3）──────────
# 上游语料里 `lb`/`lh`/`lbu`/`lhu`/`sb`/`sh` 遍地都是，谱里之前只有 32/64 位那几条，
# 于是整族落进 `no_prefix` 桶（"没有候选的首段能对上"）——字节 oracle 会逐条验编码。

[[instructions]]
name = "LB"
form = "I"
opcode = 0x03
fields = { funct3 = 0 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "lb {dst}, {imm}({src})"

[[instructions]]
name = "LH"
form = "I"
opcode = 0x03
fields = { funct3 = 1 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "lh {dst}, {imm}({src})"

[[instructions]]
name = "LBU"
form = "I"
opcode = 0x03
fields = { funct3 = 4 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "lbu {dst}, {imm}({src})"

[[instructions]]
name = "LHU"
form = "I"
opcode = 0x03
fields = { funct3 = 5 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "lhu {dst}, {imm}({src})"

[[instructions]]
name = "SB"
form = "S"
opcode = 0x23
fields = { funct3 = 0 }
ops = ["src:gpr", "src2:gpr", "imm:imm12"]
asm = "sb {src}, {imm}({src2})"

[[instructions]]
name = "SH"
form = "S"
opcode = 0x23
fields = { funct3 = 1 }
ops = ["src:gpr", "src2:gpr", "imm:imm12"]
asm = "sh {src}, {imm}({src2})"

[[instructions]]
name = "LW"
form = "I"
opcode = 0x03
fields = { funct3 = 2 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "lw {dst}, {imm}({src})"

[[instructions]]
name = "SW"
form = "S"
opcode = 0x23
fields = { funct3 = 2 }
ops = ["src:gpr", "src2:gpr", "imm:imm12"]
asm = "sw {src}, {imm}({src2})"

# RV64I 的 `lwu`（零扩展的 32 位载入）：真实语料里遍地都是，之前谱里没有
# （那会儿只按"解析不动"记账；字节 oracle 接通后按 ISA 完整性补上）。
[[instructions]]
name = "LWU"
only_variants = { xlen = [64] }
form = "I"
opcode = 0x03
fields = { funct3 = 6 }
ops = ["dst:gpr:out", "src:gpr", "imm:imm12"]
asm = "lwu {dst}, {imm}({src})"

# RET = jalr x0, 0(x1)（form I 全固定位域）
[[instructions]]
name = "RET"
roles = ["ret"]
form = "I"
opcode = 0x67
fields = { funct3 = 0, rd = 0, rs1 = 1, imm12 = 0 }
asm = "ret"

# ════════════════════════════════════════════════════════════
# B2：接入 TargetMachine（SysV rv64 子集 + 帧 + lowering）
# ════════════════════════════════════════════════════════════

[stack]
slot = 8
align = 16
fp_save = 8

# 返回寄存器（a0）；Return/Call lowering 的返回值移动目标

# Call 点被调用方破坏的寄存器（regalloc clobber 集）：ra(X1) + 参数 a0-a7
# (X10-X17) + 临时 t0-t2(X5-X7)/t3-t6(X28-X31) + 固定用途 X3/X4。
# s 系（X9/X18-X27）由帧件保存（roles = ["callee_save"]）→ 不在 clobber 集（跨调用存活
# 值留在 s 系安全）。X5/X6 是 spill scratch（regalloc 不可分配）。



[spill.GPR]
# 64 位专用：LD/SD 只在 RV64 存在（RV32 变体必须自己给一套 LW/SW 帧件——投影会整节丢掉）。
only_variants = { xlen = [64] }
# base = X8（fp = 入口 sp，等价 x86 rbp）：emission 的 sp_base =
# -(frame) - callee_saved_bytes 是**相对帧指针**的偏移。base 用 X2（sp）会
# 双重减 frame（spill 槽落帧外更深处），递归时与 callee 帧重叠（ra 槽被
# 覆盖 → ret 跳 0，实测 fault_fetch epc=0）。base = fp → spill 槽
# [fp - frame + off] = [sp + off] 帧内底部，递归帧在下方不重叠。
load = "LD {0}, X8, {1}"
store = "SD {0}, X8, {1}"
base = "X8"

[emit]
align_pad = 0
# return block 经 emit_epilogue_jump（jal x0, epilogue_label）跳到统一尾声：
# 多 return block 函数（fib 双 return）安全；label 槽块号 → 定宽 fixup。
epilogue_label = true

# ─────────────────────── lowering（64 位主；32 位 W 变体按 rs1_width）───────────────────────

[[lowering]]
op = "Iadd"
when = { eq = ["rs1_width", 32] }
insts = ["ADDW {out}, {0}, {1}"]

[[lowering]]
op = "Iadd"
insts = ["ADD {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
when = { eq = ["rs1_width", 32] }
insts = ["SUBW {out}, {0}, {1}"]

[[lowering]]
op = "Isub"
insts = ["SUB {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
when = { eq = ["rs1_width", 32] }
insts = ["MULW {out}, {0}, {1}"]

[[lowering]]
op = "Imul"
insts = ["MUL {out}, {0}, {1}"]

[[lowering]]
op = "Iconst"
when = { eq = ["rd", 64] }
insts = [
    "LUI {g1}, {iconst_hi32_hi20}",
    "ADDI {g1}, {g1}, {iconst_hi32_lo12}",
    "SLLI {g1}, {g1}, 32",
    "LUI {g2}, {iconst_lo32_hi20}",
    # lo32 LUI bit19=1 符号扩展污染高 32 位 → slli32+srli32 截断
    "SLLI {g2}, {g2}, 32",
    "SRLI {g2}, {g2}, 32",
    "ADDI {g2}, {g2}, {iconst_lo32_lo12}",
    "OR {out}, {g1}, {g2}",
]

[[lowering]]
op = "Iconst"
insts = ["LUI {out}, {iconst_hi20}", "ADDI {out}, {out}, {iconst_lo12}"]

[[lowering]]
op = "Load"
when = { eq = ["rd", 32] }
insts = ["LW {out}, {0}, 0"]

[[lowering]]
op = "Load"
insts = ["LD {out}, {0}, 0"]

[[lowering]]
op = "Store"
when = { eq = ["rs1_width", 32] }
insts = ["SW {0}, {1}, 0"]

[[lowering]]
op = "Store"
insts = ["SD {0}, {1}, 0"]

# Fload/Fstore：浮点访存（v20 V6+）——变参的**浮点支**要 f64 从栈/保存区读出来
# （`va_arg(ap, f64)` 由管线展开成 `Fload`，见 `forge-codegen/src/pipeline/va_expand.rs`），
# 此前 riscv 谱里 `FLD`/`FSD` 有指令却没有 lowering ⇒ 浮点变参编不出来。
[[lowering]]
op = "Fload"
when = { eq = ["rd", 32] }
insts = ["FLW {out}, {0}, 0"]

[[lowering]]
op = "Fload"
insts = ["FLD {out}, {0}, 0"]

[[lowering]]
op = "Fstore"
when = { eq = ["rs1_width", 32] }
insts = ["FSW {0}, {1}, 0"]

[[lowering]]
op = "Fstore"
insts = ["FSD {0}, {1}, 0"]

[[lowering]]
op = "StackAddr"
# 基准 X8（fp = 入口 sp，帧顶固定）：栈槽相对 fp（偏移 = v - 16，
# stack_slot_shift）→ 递归各帧独立（相对 sp 的 -4 跨帧重叠——fib_slot
# 结果错）；且避开 ra/fp 保存槽 [fp-16, fp)。
insts = ["ADDI {out}, X8, {off}"]

[[lowering]]
op = ["Copy", "Sextend", "Freeze"]
insts = ["MOV_RM8_R64 {out}, {0}"]
# ── 补全 lowering（B2 遗留：位运算/移位/比较/调用）──

[[lowering]]
op = "Band"
insts = ["AND {out}, {0}, {1}"]

[[lowering]]
op = "Bor"
insts = ["OR {out}, {0}, {1}"]

[[lowering]]
op = "Bxor"
insts = ["XOR {out}, {0}, {1}"]

[[lowering]]
op = "Bnot"
insts = ["XORI {out}, {0}, -1"]

[[lowering]]
op = "Ishl"
insts = ["SLL {out}, {0}, {1}"]

[[lowering]]
op = "Ushr"
insts = ["SRL {out}, {0}, {1}"]

[[lowering]]
op = "Sshr"
insts = ["SRA {out}, {0}, {1}"]

# Icmp：按 IntCC（icmp_id 1-10）分派。riscv 无 setcc——用 slt/sltu/xor/
# sltiu/xori 序列产生 0/1（矩阵 i1 语义）。eq = (a==b) = sltiu(xor(a,b),1)
#（xor==0 → 1）；ne = 其取反；sle/sge/ule/uge = 反向 slt/sltu 取反。
[[lowering]]
op = "Icmp"
when = { eq = ["cond", 1] } # Equal
insts = ["XOR {g}, {0}, {1}", "SLTIU {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 2] } # NotEqual
insts = ["XOR {g}, {0}, {1}", "SLTIU {g}, {g}, 1", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 3] } # SignedLessThan
insts = ["SLT {out}, {0}, {1}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 4] } # SignedLessThanOrEqual = !(b < a)
insts = ["SLT {g}, {1}, {0}", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 5] } # SignedGreaterThan = b < a
insts = ["SLT {out}, {1}, {0}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 6] } # SignedGreaterThanOrEqual = !(a < b)
insts = ["SLT {g}, {0}, {1}", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 7] } # UnsignedLessThan
insts = ["SLTU {out}, {0}, {1}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 8] } # UnsignedLessThanOrEqual = !(b <u a)
insts = ["SLTU {g}, {1}, {0}", "XORI {out}, {g}, 1"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 9] } # UnsignedGreaterThan = b <u a
insts = ["SLTU {out}, {1}, {0}"]

[[lowering]]
op = "Icmp"
when = { eq = ["cond", 10] } # UnsignedGreaterThanOrEqual = !(a <u b)
insts = ["SLTU {g}, {0}, {1}", "XORI {out}, {g}, 1"]

# Call：jal ra, @N（跨函数符号；RiscvRelocPatcher 编码 UJ 位段）
# 注意：Call 是 terminator 级 lowering（gen_call_lowering），不走此表——
# 该规则仅占位声明，实际接线见 integration.rs 的 call_inst 泛化。

# ── 除法/取模（32 位 W 变体按 rs1_width 分派）──

[[lowering]]
op = "Sdiv"
when = { eq = ["rs1_width", 32] }
insts = ["DIVW {out}, {0}, {1}"]

[[lowering]]
op = "Sdiv"
insts = ["DIV {out}, {0}, {1}"]

[[lowering]]
op = "Udiv"
when = { eq = ["rs1_width", 32] }
insts = ["DIVUW {out}, {0}, {1}"]

[[lowering]]
op = "Udiv"
insts = ["DIVU {out}, {0}, {1}"]

[[lowering]]
op = "Srem"
when = { eq = ["rs1_width", 32] }
insts = ["REMW {out}, {0}, {1}"]

[[lowering]]
op = "Srem"
insts = ["REM {out}, {0}, {1}"]

[[lowering]]
op = "Urem"
when = { eq = ["rs1_width", 32] }
insts = ["REMUW {out}, {0}, {1}"]

[[lowering]]
op = "Urem"
insts = ["REMU {out}, {0}, {1}"]

# ── min/max（基础指令序列，不依赖 Zbb——QEMU 11.0.92 默认/显式 CPU 均不
#    译码 Zbb 的 min/max（LLVM 确认编码规范，QEMU rc 版 TCG 未接）；用
#    `slt + neg + xor + and + xor` 算术选择：min(a,b) = b ^ ((a^b) & -(a<b))）──

[[lowering]]
op = "Smin"
insts = [
    "SLT {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {1}, {g}",
]

[[lowering]]
op = "Smax"
insts = [
    "SLT {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {0}, {g}",
]

[[lowering]]
op = "Umin"
insts = [
    "SLTU {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {1}, {g}",
]

[[lowering]]
op = "Umax"
insts = [
    "SLTU {g}, {0}, {1}",
    "SUB {g}, X0, {g}",
    "XOR {g2}, {0}, {1}",
    "AND {g}, {g2}, {g}",
    "XOR {out}, {0}, {g}",
]

# ── 旋转（基础序列，不依赖 Zbb）：rol(a,n) = (a<<n)|(a>>(64-n))；
#    `sub X0, n` 取 -n（移位量低 6 位 = 64-n；n=0 时 srl 移位 0 正确）──

[[lowering]]
op = "Rotl"
insts = [
    "SLL {g}, {0}, {1}",
    "SUB {g3}, X0, {1}",
    "SRL {g2}, {0}, {g3}",
    "OR {out}, {g}, {g2}",
]

[[lowering]]
op = "Rotr"
insts = [
    "SRL {g}, {0}, {1}",
    "SUB {g3}, X0, {1}",
    "SLL {g2}, {0}, {g3}",
    "OR {out}, {g}, {g2}",
]

# ── 扩展/截断：riscv 的 i32 值经 W 变体/ADDI 天然 64 位符号扩展 →
#    Sextend(i32→i64) = mv；Uextend 按源宽 andi 掩码（8/16）或
#    slli+srli 清零高 32 位（32→64）；Ireduce 按结果宽截断──

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 8] }
insts = ["ANDI {out}, {0}, 255"]

[[lowering]]
op = "Uextend"
when = { eq = ["rs1_width", 16] }
# 0xFFFF 超出 imm12 有符号范围 ±2047（旧 andi 65535 依赖掩码截断侥幸
# 正确）——用 slli/srli 清零高 48 位（与 32 位路径同模式）
insts = ["SLLI {out}, {0}, 48", "SRLI {out}, {out}, 48"]

[[lowering]]
op = ["Uextend", "Ireduce"]
insts = ["SLLI {out}, {0}, 32", "SRLI {out}, {out}, 32"]

[[lowering]]
op = "Ireduce"
when = { eq = ["rd", 8] }
insts = ["ANDI {out}, {0}, 255"]

[[lowering]]
op = "Ireduce"
when = { eq = ["rd", 16] }
# 0xFFFF 超出 imm12 有符号范围 ±2047（旧 andi 65535 依赖掩码截断侥幸
# 正确）——用 slli/srli 清零高 48 位
insts = ["SLLI {out}, {0}, 48", "SRLI {out}, {out}, 48"]

[[lowering]]
op = "Abs"
insts = [
    "SRAI {g}, {0}, 63",
    "XOR {out}, {0}, {g}",
    "SUB {out}, {out}, {g}",
]

# ── Select(cond, then, else)：cond 为 0/1 → (cond & then) | (!cond & else) ──
# 掩码法：c<<63>>63 得全0/全1 掩码（QEMU 11.1.0-rc2 的 TCG 对直接
# and/xori/and/or 序列有 host 寄存器 bug——实测 s8=0；掩码法规避）。

[[lowering]]
op = "Select"
insts = [
    "SLLI {g1}, {0}, 63",
    "SRAI {g1}, {g1}, 63",
    "AND {g2}, {g1}, {1}",
    "XORI {g3}, {g1}, -1",
    "AND {g4}, {g3}, {2}",
    "OR {out}, {g2}, {g4}",
]

# ── 空指针判断 / Freeze / Trap / Fence ──

[[lowering]]
op = "IsNull"
insts = ["SLTIU {out}, {0}, 1"]

[[lowering]]
op = "IsNotNull"
insts = ["SLTU {out}, X0, {0}"]

[[lowering]]
op = "Trap"
insts = ["EBREAK"]

[[lowering]]
op = "Fence"
insts = ["FENCE"]

# ── Alloca：栈槽地址（current_alloca_offset；基准 X8 = fp 与 StackAddr 一致）──

[[lowering]]
op = "Alloca"
insts = ["ADDI {out}, X8, {alloca}"]

# ── 溢出 6 条（{out}=值、{out2}=flag；32 位用例）。riscv 无标志位 →
#    比较序列。i32 值符号扩展后 bit63 = bit31，64 位 slti 检测 32 位符号 ✓。──

[[lowering]]
op = "UaddOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "SLLI {g1}, {0}, 32",
    "SRLI {g1}, {g1}, 32",
    "SLLI {g2}, {1}, 32",
    "SRLI {g2}, {g2}, 32",
    "ADD {out}, {g1}, {g2}",
    "SRLI {g3}, {out}, 32",
    "SLTU {out2}, X0, {g3}",
]

[[lowering]]
op = "UsubOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "SUB {out}, {0}, {1}",
    "SLTU {out2}, {0}, {1}",
]

[[lowering]]
op = "SaddOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "ADDW {out}, {0}, {1}",
    "SLLI {g1}, {out}, 32",
    "SRLI {g1}, {g1}, 63",
    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "OR {g4}, {g2}, {g3}",
    "XORI {g4}, {g4}, 1",
    "AND {g4}, {g4}, {g1}",
    "AND {g5}, {g2}, {g3}",
    "XORI {g1}, {g1}, 1",
    "AND {g5}, {g5}, {g1}",
    "OR {out2}, {g4}, {g5}",
]

[[lowering]]
op = "SsubOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "SUBW {out}, {0}, {1}",
    "SLLI {g1}, {out}, 32",
    "SRLI {g1}, {g1}, 63",
    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "XORI {g4}, {g2}, 1",
    "AND {g4}, {g4}, {g3}",
    "AND {g4}, {g4}, {g1}",
    "XORI {g5}, {g3}, 1",
    "AND {g5}, {g2}, {g5}",
    "XORI {g1}, {g1}, 1",
    "AND {g5}, {g5}, {g1}",
    "OR {out2}, {g4}, {g5}",
]

[[lowering]]
op = "SmulOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "MULW {out}, {0}, {1}",
    "MUL {g1}, {0}, {1}",
    "SUB {g2}, {g1}, {out}",
    "SLTU {out2}, X0, {g2}",
]

[[lowering]]
op = "UmulOverflow"
when = { eq = ["rs1_width", 32] }
insts = [
    "SLLI {g1}, {0}, 32",
    "SRLI {g1}, {g1}, 32",
    "SLLI {g2}, {1}, 32",
    "SRLI {g2}, {g2}, 32",
    "MUL {out}, {g1}, {g2}",
    "SRLI {g3}, {out}, 32",
    "SLTU {out2}, X0, {g3}",
]


# ── 浮点（可验证部分）：Fconst 位模式加载、Fcmp 条件、Fptosi/Fptoui 转换。
#    f64 用 D 变体、f32 用 S 变体（rs1_width 分派）；QEMU 默认 RV64GC 含 F/D。──

[[lowering]]
op = "Fconst"
when = { eq = ["rd", 64] }
insts = [
    "LUI {g1}, {fconst_hi32_hi20}",
    "ADDI {g1}, {g1}, {fconst_hi32_lo12}",
    "SLLI {g1}, {g1}, 32",
    "LUI {g2}, {fconst_lo32_hi20}",
    # 低 32 位 LUI 立即数 bit19=1 时符号扩展污染高 32 位（如 -42.7 的
    # 0x9999A → 0xFFFFFFFF9999A000）→ slli32+srli32 截断为零扩展
    "SLLI {g2}, {g2}, 32",
    "SRLI {g2}, {g2}, 32",
    "ADDI {g2}, {g2}, {fconst_lo32_lo12}",
    "OR {g1}, {g1}, {g2}",
    "FMV_D_X {out}, {g1}",
]

[[lowering]]
op = "Fconst"
insts = [
    "LUI {g1}, {fconst_lo32_hi20}",
    # 同上：低 32 位 LUI bit19=1 符号扩展 → 截断（fmv.w.x 只取低 32 位，
    # 但高位污染会带进 NaN-box 语义）
    "SLLI {g1}, {g1}, 32",
    "SRLI {g1}, {g1}, 32",
    "ADDI {g1}, {g1}, {fconst_lo32_lo12}",
    "FMV_W_X {out}, {g1}",
]

# Fcmp：riscv feq/flt/fle 直接给 GPR 0/1；Ordered/Unordered 用 feq(a,a)&feq(b,b)。
# 注意：**每条规则必须带显式宽度谓词**（64 位规则也要标 rs1_width=64）——生成器
# 按 TOML 顺序生成 if-else 链，无宽度规则的 `cond=N` 会截胡后面的 32 位规则
#（实测 f32 用例被 feq.d/flt.d 抢走 → QEMU NaN-box 语义下结果错）。
[[lowering]]
