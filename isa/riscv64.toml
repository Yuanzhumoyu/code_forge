# R 型的**浮点**变体：`funct3` 是 rm（舍入模式）⇒ 它是**操作数**而不是固定字段。
# 两条形态：三操作数（`fadd`/`fsub`/`fmul`/`fdiv`）与两操作数（`fsqrt`/`fcvt`，rs2 由指令固定）。
[[forms]]
name = "R_RM"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "rs2", "funct3"]

[[forms]]
name = "R_RM2"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "funct3"]

[[forms]]
name = "I"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "imm12"]

[[forms]]
name = "S"
opcode_field = "opcode"
operand_fields = ["rs2", "rs1", "imm_s"]

[[forms]]
name = "U"
opcode_field = "opcode"
operand_fields = ["rd", "imm20"]

[[forms]]
name = "B"
opcode_field = "opcode"
operand_fields = ["rs1", "rs2", "imm_b"]

[[forms]]
name = "J"
opcode_field = "opcode"
operand_fields = ["rd", "imm_j"]

[[forms]]
name = "SHIFT"
opcode_field = "opcode"
operand_fields = ["rd", "rs1", "shamt6"]

[[forms]]
