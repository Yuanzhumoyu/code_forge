# ── 向量区段结束

[machine]
# 机器事实（v20 A5）：溢出与栈参数收参用的 scratch（emission 的 spill load/store 也用它）。
spill_scratch = ["X5", "X6"]
# 帧为 callee-saved 预留的推入槽数（机器事实，v20 A6；与 `[abi.callee_saved]` 的 11 条同义）。
callee_saved_gpr = ["X9", "X18", "X19", "X20", "X21", "X22", "X23", "X24", "X25", "X26", "X27"]
callee_save_slots = 11
# regalloc 不可分配：X0=zero（写入无效）、X1=ra（prologue 保存 + call 返回
# 地址）、X3/X4=gp/tp（固定用途）——不排除会分配出垃圾（实测 subw x0）。
fixed_regs = ["X0", "X1", "X3", "X4"]
# 链接寄存器：Call 调用指令写返回地址（jal ra, @N）。x86 的 CALL 写栈，故 x86 不声明。
link_reg = "X1"
# 帧形状：ra/fp/callee_saved 保存槽在帧**内顶部**，帧分配立即数取负
#（`addi sp, sp, -N`）。min_frame_bytes(104 = fp_push 16 + 11×8)、
# callee_saved_bytes_override(0)、stack_slot_shift(16) 三个值全部由运行期推导
#（pipeline/frame_layout.rs::frame_layout_info），不手写魔法数。
[machine.frame]
sp = "X2"          # sp
fp = "X8"          # s0/fp
alloc_neg = true   # addi sp, sp, -frame_size
layout = "fp-inside"
fp_push_bytes = 16 # ra + fp 两个保存槽

# ── 立即数修饰（`[[conventions.imm_fn]]`）的字节钉住：语义在谱里，字节就该由谱内向量守 ──
# 期望字节取自上游语料注释（rv32i-valid.s 的 `encoding:` 行），逐字节相同。
[[vectors]]
asm = "lui a0, %hi(2)"
bytes = [0x37, 0x05, 0x00, 0x00]

[[vectors]]
asm = "lui s11, %hi(0x87000000)"
bytes = [0xB7, 0x0D, 0x00, 0x87]

[[vectors]]
# `%lo(2048)` 与 `-2048` 是同一批位（低 12 位按有符号读数）
asm = "jalr a0, %lo(2048)(a1)"
bytes = [0x67, 0x85, 0x05, 0x80]

[[vectors]]
asm = "lw a0, %lo(97)(a2)"
bytes = [0x03, 0x25, 0x16, 0x06]

# ── 第十批补的族：字节/半字访存 + W 立即数移位 + 一元 `!` 的字节钉住 ──
[[vectors]]
asm = "lb t0, 8(x1)"
# = 0x00808283：opcode 03、rd=t0(5)、funct3=0、rs1=x1、imm12=8
bytes = [0x83, 0x82, 0x80, 0x00]

[[vectors]]
asm = "sh t0, -8(x1)"
# = 0xFE509C23：opcode 23、funct3=1、rs1=x1、rs2=t0(5)、imm=-8
bytes = [0x23, 0x9C, 0x50, 0xFE]

[[vectors]]
asm = "slliw a0, a1, 3"
bytes = [0x1B, 0x95, 0x35, 0x00]

[[vectors]]
# 一元 `!` 是**逻辑非**（≠ 按位取反）：上游语料 `lh t1, !1(zero)` 期望位移 0
asm = "lh t1, !1(zero)"
bytes = [0x03, 0x13, 0x00, 0x00]

# ── 第十一批：分支补 BGEU、Zicsr 六条、fence.i/fence.tso 与别名 unimp ──
[[vectors]]
asm = "bgeu s8, sp, 512"
bytes = [0x63, 0x70, 0x2C, 0x20]

[[vectors]]
# CSR 号是 12 位**无符号**：0xfff 是 4095，不是 -1
asm = "csrrw t0, 0xfff, t1"
bytes = [0xF3, 0x12, 0xF3, 0xFF]

[[vectors]]
asm = "csrrsi t2, 0xfff, 31"
bytes = [0xF3, 0xE3, 0xFF, 0xFF]

[[vectors]]
asm = "fence.tso"
bytes = [0x0F, 0x00, 0x30, 0x83]

[[vectors]]
# `unimp` 是**别名**（= `csrrw x0, cycle, x0`），字节与那条指令相同
asm = "unimp"
bytes = [0x73, 0x10, 0x00, 0xC0]

# `fence pred, succ`：pred/succ 是命名位集合（i=8/o=4/r=2/w=1 的字母拼接）；字节取自上游注释
[[vectors]]
asm = "fence iorw, iorw"
bytes = [0x0F, 0x00, 0xF0, 0x0F]

[[vectors]]
# `io` = i|o = 12、`rw` = r|w = 3 —— "字母拼接"不是特例，就是位或
asm = "fence io, rw"
bytes = [0x0F, 0x00, 0x30, 0x0C]

[[vectors]]
asm = "fence r, w"
bytes = [0x0F, 0x00, 0x10, 0x02]

[[vectors]]
asm = "fence w, ir"
bytes = [0x0F, 0x00, 0xA0, 0x01]

[[vectors]]
