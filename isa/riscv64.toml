# ── 谱内测试向量（v19 V3））────────────────────────────────────────────
#
# 迁移来源：`crates/backend/forge-codegen/tests/riscv64_tests.rs` 的三张 oracle 表
# （`golden_gpr_spec_bytes` / `f_inst_spec_bytes`（`r_type(...)` 期望值已按同一布局算成字面量）/
# `s_type_spec_bytes`），2026-09-23 迁移（v19 V3a）。迁移前后字节集合 sha256 相同。
#
# 每条 = `asm` + `bytes`：`assemble → encode` 必须**逐字节等于** `bytes`，`decode(bytes)`
# 必须吃满且再编码一致。断言由生成物里的 `__spec_tests::spec_vector_*` 执行
# （`cargo test -p forge-codegen --lib`），也可单跑 `cargo run -p forge-isa -- test isa/riscv64.toml`。
# 字节 oracle 依据：RISC-V 规范位布局（R/I/S/J 型 + F 扩展；v11 的 F 索引与 S 型散布
# 曾是错的，谱内索引/规范布局才对——这些向量就是那两处修复的回归网）。

