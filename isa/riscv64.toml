#:schema ../isa-dsl.schema.json
# ============================================================
# RISC-V 64-bit (RV64IM) — ISA-DSL 唯一语法试点（迭代 2：定宽编码/解码/汇编）
# ============================================================
#
# 与 v11 (riscv64_v10.toml) 的关系：本文件是 迁移试点，生成**自包含**
# 模块（Inst/encode/decode/disassemble/assemble，仅依赖 std），在
# forge-codegen 中与 v11 后端并存、按字节 golden 对比。指令顺序与 v11
# 完全一致（解码声明序首匹配对齐）；[abi]/[lowering]/[emit] 迁移在迭代 5。
#
# 设计要点：
# - 指令不再写位偏移：位域位置在 [conventions.bitfields]，form 按位置绑定
#   （operand_fields）；操作数少于位域位置时多余位域取 fields 固定值或隐式 0
# - 散布位段（pieces）表达 S/U/B/J 立即数分段布局（编码/解码可逆）
# - 操作数槽定义值类型（reg → u32 物理索引；imm/label → i64，按槽宽度符号扩展）
# - asm 模板 = mnemonic + 操作数模板（{0}/{1}... 占位符；缺省 "{0}, {1}, ..."；
#   内存形式 "{off}({base})" / "({base})"）

[meta]
name = "riscv64"
version = "13.0"
# 参数化变体（v19 V5，只读投影）：`--params xlen=32` 时会丢掉标了
# `only_variants = { xlen = [64] }` 的条目（LD/SD 与 W 变体族），得到一个 RV32 视角的
# 指令清单。**不传 params 时完全不过滤**（默认行为与生成物逐字节不变）。
variants = { xlen = [32, 64] }
endian = "little"
mode = 64
case_insensitive_regs = true
# v13 语法键（显式化；缺省值一致）
comment_char = "#"
label_suffix = ":"
mnemonic_case = "insensitive"
directive_prefix = "."

# ─────────────────────────── 寄存器组 ───────────────────────────
[encoding]
kind = "fixed"
bits = 32

[reg.gpr8]
names = [
    "X0","X1","X2","X3","X4","X5","X6","X7",
    "X8","X9","X10","X11","X12","X13","X14","X15",
    "X16","X17","X18","X19","X20","X21","X22","X23",
    "X24","X25","X26","X27","X28","X29","X30","X31",
]
# ABI 别名（v20 V9 `[reg.*].aliases`）：**汇编解析认、渲染仍出 `x` 名**。
# 真实语料（上游 LLVM MC / GAS）几乎全用别名写法（`lwu sp, 4(gp)`、`addw a2, a3, a4`），
# 而我们的反汇编/黄金输出一直用 `x` 名——两者都要，别名表就是这件事的**唯一**位置
# （不再靠"再声明一份寄存器组"来兜）。注意 `x8` 同时是 `s0` 与 `fp`。
# 别名写成**子表**而不是 `aliases = { ... }` 内联表：严格 TOML 1.0 允许多行数组、
# **不允许多行内联表**（Rust 的 `toml` crate 收，别的解析器不一定收）——谱统一走严格 1.0 子集。
[reg.gpr8.aliases]
zero = 0
ra = 1
sp = 2
gp = 3
tp = 4
t0 = 5
t1 = 6
t2 = 7
s0 = 8
fp = 8
s1 = 9
a0 = 10
a1 = 11
a2 = 12
a3 = 13
a4 = 14
a5 = 15
a6 = 16
a7 = 17
s2 = 18
s3 = 19
s4 = 20
s5 = 21
s6 = 22
s7 = 23
s8 = 24
s9 = 25
s10 = 26
s11 = 27
t3 = 28
t4 = 29
t5 = 30
t6 = 31

[reg.fpr4]
names = [
    "F0","F1","F2","F3","F4","F5","F6","F7",
    "F8","F9","F10","F11","F12","F13","F14","F15",
    "F16","F17","F18","F19","F20","F21","F22","F23",
    "F24","F25","F26","F27","F28","F29","F30","F31",
]
# 浮点寄存器的 ABI 别名（与上面的 `[reg.gpr8.aliases]` 同款、同口径：**解析认、渲染仍出
# `F` 名**）。真实语料里浮点操作数**几乎全是**别名（`fadd.s fa0, fa1, fa2`、`fmv.d ft0, fa1`）
# ——上游 LLVM MC 的 FP 用例整篇如此，缺这张表会让它们**整文件**落在红桶里（实测语料里
# `ft*`/`fa*`/`fs*` 出现 1840 次，而 `f0` 这类数字名只有 47 次）。
#
# 映射就是 psABI 的那套：0–7 = ft0–ft7、8–9 = fs0–fs1、10–17 = fa0–fa7、
# 18–27 = fs2–fs11、28–31 = ft8–ft11。
[reg.fpr4.aliases]
ft0 = 0
ft1 = 1
ft2 = 2
ft3 = 3
ft4 = 4
ft5 = 5
ft6 = 6
ft7 = 7
fs0 = 8
fs1 = 9
fa0 = 10
fa1 = 11
fa2 = 12
fa3 = 13
fa4 = 14
fa5 = 15
fa6 = 16
fa7 = 17
fs2 = 18
fs3 = 19
fs4 = 20
fs5 = 21
fs6 = 22
fs7 = 23
fs8 = 24
fs9 = 25
fs10 = 26
fs11 = 27
ft8 = 28
ft9 = 29
ft10 = 30
ft11 = 31

# ─────────────────────── 命名位域（一次声明）───────────────────────

[conventions.bitfields]
rd     = { offset = 7,  width = 5 }
rs1    = { offset = 15, width = 5 }
rs2    = { offset = 20, width = 5 }
funct3 = { offset = 12, width = 3 }

funct7 = { offset = 25, width = 7 }
funct5 = { offset = 27, width = 5 }   # AMO 的 funct5（bits 31:27；aq=26、rl=25）
# AMO/LR/SC 的 aq/rl（RV64A 的 acquire/release 位）。**本后端只发 relaxed（两者恒 0）**，
# 但显式声明出来：一是把"这两位固定为 0"从注释变成谱里的数据（`--bits` 体检可核对），
# 二是将来要支持 acquire/release 时只改 lowering 的取值、不动编码定义。
aq     = { offset = 26, width = 1 }
rl     = { offset = 25, width = 1 }
funct6 = { offset = 26, width = 6 }   # 移位立即数高位（SLLI/SRLI/SRAI）
shamt6 = { offset = 20, width = 6 }
shamt5 = { offset = 20, width = 5 }   # W 变体移位（RV64：shamt 5 位，bit25 归 funct7）
opcode = { offset = 0,  width = 7 }
pred   = { offset = 24, width = 4 }  # FENCE 的前驱集合（i=8/o=4/r=2/w=1）
succ   = { offset = 20, width = 4 }  # FENCE 的后继集合
fm     = { offset = 28, width = 4 }  # FENCE 的 fm 字段（fence.tso = 8）
imm12  = { offset = 20, width = 12 }  # I 型
imm20  = { pieces = [ { offset = 12, width = 20, shift = 0 } ] }                        # U 型 LUI（**立即数就是字段值**，与 GAS/LLVM 一致：`lui a0, 2` → rd = 8192）
imm_s  = { pieces = [ { offset = 7,  width = 5, shift = 0 }, { offset = 25, width = 7, shift = 5 } ] }   # S 型
imm_b  = { pieces = [ { offset = 31, width = 1, shift = 12 }, { offset = 25, width = 6, shift = 5 },     # B 型
                       { offset = 8,  width = 4, shift = 1 },  { offset = 7,  width = 1, shift = 11 } ] }
imm_j  = { pieces = [ { offset = 31, width = 1, shift = 20 }, { offset = 21, width = 10, shift = 1 },    # J 型
                       { offset = 20, width = 1, shift = 11 }, { offset = 12, width = 8, shift = 12 } ] }

# ─────────────────────────── 操作数槽 ───────────────────────────

# 立即数修饰（谱声明的数据，DSL 不认识任何修饰名）：GAS/RISC-V 的 `%hi`/`%lo`。
# text = 源文本形态（`{0}` 是内层表达式）；expr = 值语义（`{0}` 是内层值，复用既有表达式语言）。
# `%pcrel_hi`/`%pcrel_lo`：**值与 `%hi`/`%lo` 同义**（装配侧只产出值；重定位**种类**是
# linker/patcher 的事，本仓库记在指令的 `[[reloc]]`/`reloc` 上）。
[[conventions.imm_fn]]
name = "pcrel_hi"
text = "%pcrel_hi({0})"
expr = "({0} + 0x800) >> 12"

[[conventions.imm_fn]]
name = "pcrel_lo"
text = "%pcrel_lo({0})"
expr = "(({0} & 0xfff) ^ 0x800) - 0x800"

[[conventions.imm_fn]]
name = "hi"
text = "%hi({0})"
expr = "({0} + 0x800) >> 12"

[[conventions.imm_fn]]
name = "lo"
# 低 12 位**按有符号读数**（0x800..0xfff → 负）：`%lo(2048)` 与 `-2048` 是同一批位，
# 也就落在 imm12 的有符号值域里（`jalr a0, %lo(2048)(a1)` == `jalr a0, -2048(a1)`）。
text = "%lo({0})"
expr = "(({0} & 0xfff) ^ 0x800) - 0x800"

# 命名位集合表（`kind = "bits"`）：RISC-V fence 的 pred/succ 是 i/o/r/w 的组合，
# 源文本就写成字母拼接（`iorw`、`io`、`r,w`），编码取位的或。表是**数据**。
[conventions.bitsets.fence]
i = 8
o = 4
r = 2
w = 1

# 命名立即数表（`kind = "imm"` + `names`）：**一个名字 = 一个值**（区别于上面的位集合表——
# 那是"若干名字拼接、按位或"）。CSR 名就是这张表：`csrrs t1, mstatus, zero` 与
# `csrrs t2, 0x300, zero` 同义；浮点舍入模式（`rtz`/`dyn`…）将来也走同一机制。
#
# 数据来源：上游 LLVM `llvm/lib/Target/RISCV/RISCVSystemOperands.td`（ref `llvmorg-19.1.0`），
# 机械展开（含 `foreach` 区间 `hpmcounter3..31`、`pmpaddr0..63` 与 `AltName`/`DeprecatedName`
# 别名），并用**语料自带的期望字节**逐条对账：语料里出现的 429 个名字全部命中、值零不符。
# **同值多名**（`stval`/`sbadaddr`、`satp`/`sptbr`、`mtval`/`mbadaddr`、`mucounteren`/`mcountinhibit`、
# `dscratch`/`dscratch0`）渲染取**字典序最小者**，与 `[conventions.cond]` 的"同码取字母序最小名"同口径。
#
# 运行时**双向**：解析认名字也认数字；渲染时值在表里就写名字（`disassemble → assemble` 闭合）。
# 改这张表＝改数据，不动生成器；名字非法/值超出槽的接受值域在 `validate` 期报错。
# 命名立即数表（`kind = "imm"` + `names`）：**一个名字 = 一个值**（区别于上面的位集合表——
# 那是"若干名字拼接、按位或"）。CSR 名就是这张表：`csrrs t1, mstatus, zero` 与
# `csrrs t2, 0x300, zero` 同义；浮点舍入模式（`rtz`/`dyn`…）将来也走同一机制。
#
# 数据来源：上游 LLVM `llvm/lib/Target/RISCV/RISCVSystemOperands.td`（ref `llvmorg-19.1.0`），
# **机械生成**——生成器 = `crates/tools/forge-tests/asm/gen-riscv-csr-table.mjs`，别手改这张表。
# 展开含 `foreach` 区间（`hpmcounter3..31`、`pmpaddr0..63`…）与 `AltName`/`DeprecatedName` 别名，
# 并用**语料自带的期望字节**逐条对账：语料里出现的 400 个名字全部命中、值零不符。
# **同值多名**（sbadaddr/stval、satp/sptbr、mcountinhibit/mucounteren、mbadaddr/mtval、dscratch/dscratch0）渲染取**字典序最小者**，
# 与 `[conventions.cond]` 的"同码取字母序最小名"同口径。
#
# 运行时**双向**：解析认名字也认数字；渲染时值在表里就写名字（`disassemble → assemble` 闭合）。
# 改这张表＝改数据，不动生成器；名字非法/值超出槽的接受值域在 `validate` 期报错。
# 浮点**舍入模式**（`rm`，RISC-V F/D 的 `funct3` 那 3 位）：与 CSR 名同一机制的第二张表。
# 汇编里既是显式操作数（`fadd.s f1, f2, f3, rtz`），也是"省略 rm"时的**缺省值 `dyn`**
# （`fadd.s f1, f2, f3` ≡ `fadd.s f1, f2, f3, dyn`——上游把省略写法当 `dyn` 的别名，
# 见 `asm/parse/riscv64/llvm-mc/fp-default-rounding-mode.s` 的 `CHECK-INST`）。
[conventions.imm_names.rm]
rne = 0
rtz = 1
rdn = 2
rup = 3
rmm = 4
dyn = 7

