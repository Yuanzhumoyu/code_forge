# ── GlobalAddr：auipc+addi PC-relative（v18 S3d：重定位来自 [[reloc]] 表；
#    encoder 对 imm<0 发 Relative(4,0) 的 "G{id}"；patcher 按 opcode
#    0x17=auipc 写 hi20、0x13=addi 写 lo12）──

[[reloc]]
name = "pcrel_hi"
semantics = "pc_relative"
slot = "imm20"

[[reloc]]
name = "pcrel_lo"
semantics = "pc_relative"
slot = "imm12"

# ── 汇编器伪指令（v18 S3e）：`li rd, imm` → lui + addi（32 位符号扩展形式）──
# 汇编期文本展开：实参按 `{名字}` 代入 emit 行，算术由既有表达式求值器算
#（`li a0, 0x1234` 与 `li a0, (1 << 12) + 0x234` 等价）。两条都按 **GAS/LLVM 的
# 写法**：`lui` 的立即数是**字段值**（`lui a0, 2` → rd = 8192），所以 hi 部分显式
# `>> 12`；lo12 取 `({imm} + 0x800)` 低 12 位的符号扩展——与 lowering 里 Iconst 的
# `{iconst_hi20}`/`{iconst_lo12}`（占位符里做同一套算术）一致。
# v20 V9 之前 `imm20` 是**预移位**位域（编码器负责 `>>12`），于是 `lui a0, 2` 在我们
# 这里被编成 imm20=0 —— 真实语料的字节对拍抓到了它（上游 `37 25 00 00`）。
[[pseudo]]
name = "li"
asm = "li {rd}, {imm}"
emit = [
    "lui {rd}, (({imm} + 0x800) >> 12)",
    "addi {rd}, {rd}, ((({imm} + 0x800) & 0xfff) - 0x800)",
]

# `unimp`：LLVM/GAS 把它定义为 `csrrw x0, cycle, x0`（0xC0001073）——它是**别名**，
# 不是新编码（真实位型与 CSRRW 撞车，而解码器按"编码不相交"建 trie）⇒ 用伪指令展开一条。
[[pseudo]]
name = "unimp"
asm = "unimp"
emit = ["csrrw X0, 0xc00, X0"]

[[lowering]]
op = "GlobalAddr"
insts = [
    "AUIPC_GLOBAL {out}, {global}",
    "ADDI_GLOBAL {out}, {out}, {global}",
]

# ── 原子：AtomicRmw op 判别值 = immediates[0]（Xchg=0、Add=1、Sub=2）──
# AMO 语义 rd=旧内存值，正合 AtomicRmw 返回值。Sub 无规范 amosub →
# neg（sub X0）+ amoadd。aq/rl=0（单线程 QEMU 无并发序需要）。
# 模板按 R 型 operand_fields=[rd,rs1,rs2] **位置**绑定：{out}→rd、
# {0}=addr→rs1、{1}/src→rs2（不能用括号——括号 token 判 mem 类型）。

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 0] }, { eq = ["rs1_width", 64] } ] }
insts = ["AMOSWAP_D {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 0] }, { eq = ["rs1_width", 32] } ] }
insts = ["AMOSWAP_W {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 1] }, { eq = ["rs1_width", 64] } ] }
insts = ["AMOADD_D {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 1] }, { eq = ["rs1_width", 32] } ] }
insts = ["AMOADD_W {out}, {0}, {1}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 2] }, { eq = ["rs1_width", 64] } ] }
insts = ["SUB {g}, X0, {1}", "AMOADD_D {out}, {0}, {g}"]

[[lowering]]
op = "AtomicRmw"
when = { and = [ { eq = ["imm0", 2] }, { eq = ["rs1_width", 32] } ] }
insts = ["SUB {g}, X0, {1}", "AMOADD_W {out}, {0}, {g}"]

# ── Cmpxchg：**无分支** LR/SC 序列（单线程 QEMU 下 sc.d 不失败，无需
#    重试循环；模板层无函数内 label）──
#    lr.d 读旧值 → 与期望比较 → 掩码选择写入值（匹配→new、不匹配→old
#    即无操作写回）→ sc.d；结果 = 旧值。32 位用 lr.w/sc.w + 掩码截断。
#    sc.d {out0}, {0}, {g4}：rd=成功标志（丢弃）、rs1=addr、rs2=写入值。

[[lowering]]
op = "Cmpxchg"
when = { eq = ["rs1_width", 64] }
insts = [
    "LR_D {g}, {0}",
    "XOR {g1}, {g}, {1}",
    "SLTU {g2}, X0, {g1}",
    "SLLI {g2}, {g2}, 63",
    "SRAI {g2}, {g2}, 63",
    "XORI {g3}, {g2}, -1",
    "AND {g4}, {2}, {g3}",
    "AND {g2}, {g}, {g2}",
    "OR {g4}, {g4}, {g2}",
    "SC_D {g5}, {0}, {g4}",
    "MOV_RM8_R64 {out}, {g}",
]

[[lowering]]
op = "Cmpxchg"
when = { eq = ["rs1_width", 32] }
insts = [
    "LR_W {g}, {0}",
    "XOR {g1}, {g}, {1}",
    "SLTU {g2}, X0, {g1}",
    "SLLI {g2}, {g2}, 63",
    "SRAI {g2}, {g2}, 63",
    "XORI {g3}, {g2}, -1",
    "AND {g4}, {2}, {g3}",
    "AND {g2}, {g}, {g2}",
    "OR {g4}, {g4}, {g2}",
    "SC_W {g5}, {0}, {g4}",
    "MOV_RM8_R64 {out}, {g}",
]

# ── 有符号饱和（32 位）：溢出检测（addw/subw 截断 + 符号位逻辑）+
#    掩码选择饱和值（正溢出 → 0x7FFFFFFF、负溢出 → 0x80000000 符号扩展）。
#    a 的符号位决定饱和方向：a_sign=0（正）→ 正饱和、a_sign=1 → 负饱和。
#    与 SaddOverflow/SsubOverflow 同源的位逻辑（slli32+srli63 取 bit31）。
[[lowering]]
op = "SaddSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "ADDW {g}, {0}, {1}",
    "SLLI {g1}, {g}, 32",
    "SRLI {g1}, {g1}, 63",
    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "XOR {g4}, {g2}, {g3}",
    "XORI {g4}, {g4}, 1",
    "XOR {g5}, {g1}, {g2}",
    "AND {g4}, {g4}, {g5}",
    "SLLI {g4}, {g4}, 63",
    "SRAI {g4}, {g4}, 63",
    "LUI {g3}, 0x80",        # 绝对 0x80000（= 0x80000000 的高 20 位）
    "XORI {g5}, {g3}, -1",
    "SLLI {g2}, {g2}, 63",
    "SRAI {g2}, {g2}, 63",
    "AND {g3}, {g3}, {g2}",
    "XORI {g2}, {g2}, -1",
    "AND {g5}, {g5}, {g2}",
    "OR {g3}, {g3}, {g5}",
    "AND {g3}, {g3}, {g4}",
    "XORI {g4}, {g4}, -1",
    "AND {g}, {g}, {g4}",
    "OR {out}, {g}, {g3}",
]

[[lowering]]
op = "SsubSat"
when = { eq = ["rs1_width", 32] }
insts = [
    "SUBW {g}, {0}, {1}",
    "SLLI {g1}, {g}, 32",
    "SRLI {g1}, {g1}, 63",
    "SLLI {g2}, {0}, 32",
    "SRLI {g2}, {g2}, 63",
    "SLLI {g3}, {1}, 32",
    "SRLI {g3}, {g3}, 63",
    "XOR {g4}, {g2}, {g3}",
    "XOR {g5}, {g1}, {g2}",
    "AND {g4}, {g4}, {g5}",
    "SLLI {g4}, {g4}, 63",
    "SRAI {g4}, {g4}, 63",
    "LUI {g3}, 0x80",        # 绝对 0x80000（= 0x80000000 的高 20 位）
    "XORI {g5}, {g3}, -1",
