# ── R 型整数 + Zbb R（opcode 0x33；funct3/funct7 区分）──

[[templates]]
name = "RR"
body = { form = "R", opcode = 0x33, ops = ["dst:gpr:out", "src:gpr", "src2:gpr"], asm = "{inst.lower} {dst}, {src}, {src2}" }
rows = [
  { inst = "ADD", fields = { funct3 = 0, funct7 = 0x00 } },
  { inst = "SUB", fields = { funct3 = 0, funct7 = 0x20 } },
  { inst = "SLL", fields = { funct3 = 1, funct7 = 0x00 } },
  { inst = "SLT", fields = { funct3 = 2, funct7 = 0x00 } },
  { inst = "SLTU", fields = { funct3 = 3, funct7 = 0x00 } },
  { inst = "XOR", fields = { funct3 = 4, funct7 = 0x00 } },
  { inst = "SRL", fields = { funct3 = 5, funct7 = 0x00 } },
  { inst = "SRA", fields = { funct3 = 5, funct7 = 0x20 } },
  { inst = "OR", fields = { funct3 = 6, funct7 = 0x00 } },
  { inst = "AND", fields = { funct3 = 7, funct7 = 0x00 } },
  { inst = "MUL", fields = { funct3 = 0, funct7 = 0x01 } },
  { inst = "DIV", fields = { funct3 = 4, funct7 = 0x01 } },
  { inst = "DIVU", fields = { funct3 = 5, funct7 = 0x01 } },
  { inst = "REM", fields = { funct3 = 6, funct7 = 0x01 } },
  { inst = "REMU", fields = { funct3 = 7, funct7 = 0x01 } },
  { inst = "ROL", fields = { funct3 = 1, funct7 = 0x30 } },
  { inst = "ROR", fields = { funct3 = 5, funct7 = 0x30 } },
  { inst = "MIN", fields = { funct3 = 0, funct7 = 0x05 } },
  { inst = "MAX", fields = { funct3 = 1, funct7 = 0x05 } },
  { inst = "MINU", fields = { funct3 = 4, funct7 = 0x05 } },
  { inst = "MAXU", fields = { funct3 = 5, funct7 = 0x05 } },
]
# ── I 型立即数 ALU（opcode 0x13；ADDI 保留顶层：roles + 与 MOV/ADDI_GLOBAL 同键）──
[[templates]]
name = "II"
body = { form = "I", opcode = 0x13, ops = ["dst:gpr:out", "src:gpr", "imm:imm12"], asm = "{inst.lower} {dst}, {src}, {imm}" }
rows = [
  { inst = "SLTI", fields = { funct3 = 2 } },
  { inst = "SLTIU", fields = { funct3 = 3 } },
  { inst = "XORI", fields = { funct3 = 4 } },
  { inst = "ORI", fields = { funct3 = 6 } },
  { inst = "ANDI", fields = { funct3 = 7 } },
]
# ── B 型分支（opcode 0x63；funct3 区分）──
[[templates]]
name = "BB"
body = { form = "B", opcode = 0x63, ops = ["src:gpr", "src2:gpr", "target:off_b"], asm = "{inst.lower} {src}, {src2}, {target}" }
rows = [
  { inst = "BEQ", fields = { funct3 = 0 }, roles = ["branch"] },
  { inst = "BNE", fields = { funct3 = 1 } },
  { inst = "BLT", fields = { funct3 = 4 } },
  { inst = "BGE", fields = { funct3 = 5 } },
  { inst = "BLTU", fields = { funct3 = 6 } },
  { inst = "BGEU", fields = { funct3 = 7 } },
]
# ── W 变体 R 型（opcode 0x3B）──
# 移位的 W 变体（`sllw`/`srlw`/`sraw`）也是 **R 型寄存器移位**（rs2 = 移位量），
# 与 ADDW…REMUW 同形 ⇒ 同一个模板加三行。**立即数**那条是 0x1B 的
# `slliw`/`srliw`/`sraiw`（见下方 SHIFT5 三条），两者的操作码不同、别混。
[[templates]]
name = "WW"
body = { only_variants = { xlen = [64] }, form = "R", opcode = 0x3b, ops = ["dst:gpr:out", "src:gpr", "src2:gpr"], asm = "{inst.lower} {dst}, {src}, {src2}" }
rows = [
  { inst = "ADDW", fields = { funct3 = 0, funct7 = 0x00 } },
  { inst = "SUBW", fields = { funct3 = 0, funct7 = 0x20 } },
  { inst = "SLLW", fields = { funct3 = 1, funct7 = 0x00 } },
  { inst = "SRLW", fields = { funct3 = 5, funct7 = 0x00 } },
  { inst = "SRAW", fields = { funct3 = 5, funct7 = 0x20 } },
  { inst = "MULW", fields = { funct3 = 0, funct7 = 0x01 } },
  { inst = "DIVW", fields = { funct3 = 4, funct7 = 0x01 } },
  { inst = "DIVUW", fields = { funct3 = 5, funct7 = 0x01 } },
  { inst = "REMW", fields = { funct3 = 6, funct7 = 0x01 } },
  { inst = "REMUW", fields = { funct3 = 7, funct7 = 0x01 } },
]
# ─────────────────────────── 指令（顺序 = v11 声明序）───────────────────────────
# ADDI 复制（收参用）；与 ADDI 同编码（imm=0），解码首匹配
[[instructions]]
name = "MOV_RM8_R64"
data_width = 64
form = "I"
opcode = 0x13
fields = { funct3 = 0 }
effect = ["Move"]
ops = ["dst:gpr:out", "src:gpr"]
asm = "mv {dst}, {src}"

# ── R 型整数（opcode 0x33）──

[[instructions]]
name = "FSGNJ_S"
form = "R"
opcode = 0x53
fields = { funct3 = 0, funct7 = 0x10 }
ops = ["dst:fpr:out", "src:fpr", "src2:fpr"]
asm = "fsgnj.s {dst}, {src}, {src2}"
# 寄存器搬移（32 位）：`fsgnj.s rd, rs, rs`（汇编伪指令 `fmv.s`）——`data_width = 32`
# 生成器按**位宽表**取这条角色（`FpMovWidths`），三操作数时自动把第三槽也填成源。
data_width = 32

# 双精度档：`fsgnj.d rd, rs, rs`（伪指令 `fmv.d`）——`data_width = 64`。2026-10-01 补：
# 此前谱里只有单精度 `FSGNJ_S`，f64 的寄存器搬移无处申报 ⇒ riscv 的浮点参数/返回/变参的
# 浮点支**全部编不出来**（矩阵里三条浮点用例因此 Skip）。
[[instructions]]
name = "FSGNJ_D"
form = "R"
opcode = 0x53
fields = { funct3 = 0, funct7 = 0x11 }
ops = ["dst:fpr:out", "src:fpr", "src2:fpr"]
asm = "fsgnj.d {dst}, {src}, {src2}"
data_width = 64

[[instructions]]
name = "FSGNJN_S"
form = "R"
opcode = 0x53
fields = { funct3 = 1, funct7 = 0x10 }
ops = ["dst:fpr:out", "src:fpr", "src2:fpr"]
asm = "fsgnjn.s {dst}, {src}, {src2}"

[[instructions]]
name = "FSGNJX_S"
form = "R"
opcode = 0x53
fields = { funct3 = 2, funct7 = 0x10 }
ops = ["dst:fpr:out", "src:fpr", "src2:fpr"]
asm = "fsgnjx.s {dst}, {src}, {src2}"

# ── 浮点转换（`fcvt.*`）：rm 是操作数（`funct3`）；**省略 rm = `dyn`** ──
#
# 与浮点算术同一格局，每族两条并列声明：
#   ① `<名>`     —— 显式 rm 操作数（`fcvt.w.s a0, fs5, dyn`、`..., rne`…），form `R_RM2`；
#   ② `<名>_DYN` —— **省略 rm** 的写法（`fcvt.w.s a0, fs5`）：上游把它当 `dyn` 的别名，
#      所以 `funct3 = 7` 固定。声明序把 ① 放前 ⇒ 解码走 ①（渲染出 `, dyn`，与上游一致）。
#
# 从前这里把"省略写法"写成 `funct3 = 0`（= `rne`）——那是**字节错**（上游的缺省是 `dyn`），
# 由 `fp-default-rounding-mode.s` 的上游期望字节直接守住。`rs2` 挑转换源类型
# （`fcvt.w.s`/`fcvt.wu.s`/`fcvt.l.s`/`fcvt.lu.s` = rs2 0/1/2/3）：编译期固定字段，不是操作数。
# L/LU 那 8 条（`fcvt.l.s`、`fcvt.s.l`…）是 **RV64-only**，标 `only_variants`。

# ── 浮点转换（`fcvt.*`）：rm 是操作数（`funct3`）；**省略 rm = `rne`(0)** ──
#
# 与浮点算术同一格局，每族两条并列声明：
#   ① `<名>`     —— 显式 rm 操作数（`fcvt.w.s a0, fs5, dyn`、`..., rne`…），form `R_RM2`；
#   ② `<名>_RNE` —— **省略 rm** 的写法（`fcvt.w.s a0, fs5`）：`funct3 = 0` 固定。
#      声明序把 ① 放前 ⇒ 解码走 ①（渲染出 `..., 0` 的名字）。`rs2` 挑转换源类型
#      （`fcvt.w.s`/`fcvt.wu.s`/`fcvt.l.s`/`fcvt.lu.s` = rs2 0/1/2/3）：编译期固定字段。
#
# **为什么算术族是 `dyn` 而转换族是 `rne`**：这不是猜的，是从语料自带的期望字节里**量**出来的
# （`rv32d-valid.s:15 fadd.s f26, f27, f28` = funct3 7；`rv32d-valid.s:98/120/126`、
# `rv32zdinx-valid.s:61/83/89`、`rv32zfhmin-valid.s:53/62`、`rv64zhinxmin-valid.s:9`
# 的 `fcvt.*` 省略写法全是 funct3 0）。两者都是上游自己的 `CHECK-ASM: encoding`。
# L/LU 那 8 条（`fcvt.l.s`、`fcvt.s.l`…）是 **RV64-only**，标 `only_variants`。

# ── 浮点转换（`fcvt.*`）：rm 是操作数（`funct3`）；**省略 rm = `rne`(0)** ──
#
# 与浮点算术同一格局，每族两条并列声明：
#   ① `<名>`     —— 显式 rm 操作数（`fcvt.w.s a0, fs5, dyn`、`..., rne`…），form `R_RM2`；
#   ② `<名>_RNE` —— **省略 rm** 的写法（`fcvt.w.s a0, fs5`）：`funct3 = 0` 固定。
#      声明序把 ① 放前 ⇒ 解码走 ①（渲染出 `..., 0` 的名字）。`rs2` 挑转换源类型
#      （`fcvt.w.s`/`fcvt.wu.s`/`fcvt.l.s`/`fcvt.lu.s` = rs2 0/1/2/3）：编译期固定字段。
#
# **为什么算术族是 `dyn` 而转换族是 `rne`**：这不是猜的，是从语料自带的期望字节里**量**出来的
# （`rv32d-valid.s:15 fadd.s f26, f27, f28` = funct3 7；`rv32d-valid.s:98/120/126`、
# `rv32zdinx-valid.s:61/83/89`、`rv32zfhmin-valid.s:53/62`、`rv64zhinxmin-valid.s:9`
# 的 `fcvt.*` 省略写法全是 funct3 0）。两者都是上游自己的 `CHECK-ASM: encoding`。
# L/LU 那 8 条（`fcvt.l.s`、`fcvt.s.l`…）是 **RV64-only**，标 `only_variants`。

# ── 浮点转换（`fcvt.*`）：rm 是操作数（`funct3`）；**省略 rm = `rne`(0)** ──
#
# 与浮点算术同一格局，每族两条并列声明：
#   ① `<名>`     —— 显式 rm 操作数（`fcvt.w.s a0, fs5, dyn`、`..., rne`…），form `R_RM2`；
#   ② `<名>_RNE` —— **省略 rm** 的写法（`fcvt.w.s a0, fs5`）：`funct3 = 0` 固定。
#      声明序把 ① 放前 ⇒ 解码走 ①（渲染出 `..., 0` 的名字）。`rs2` 挑转换源类型
#      （`fcvt.w.s`/`fcvt.wu.s`/`fcvt.l.s`/`fcvt.lu.s` = rs2 0/1/2/3）：编译期固定字段。
#
# **为什么算术族是 `dyn` 而转换族是 `rne`**：这不是猜的，是从语料自带的期望字节里**量**出来的
# （`rv32d-valid.s:15 fadd.s f26, f27, f28` = funct3 7；`rv32d-valid.s:98/120/126`、
# `rv32zdinx-valid.s:61/83/89`、`rv32zfhmin-valid.s:53/62`、`rv64zhinxmin-valid.s:9`
# 的 `fcvt.*` 省略写法全是 funct3 0）。两者都是上游自己的 `CHECK-ASM: encoding`。
# L/LU 那 8 条（`fcvt.l.s`、`fcvt.s.l`…）是 **RV64-only**，标 `only_variants`。

[[instructions]]
name = "FCVT_W_S"
form = "R_RM2"
opcode = 0x53
fields = { funct7 = 0x60, rs2 = 0 }
ops = ["dst:gpr:out", "src:fpr", "rm:rm3"]
asm = "fcvt.w.s {dst}, {src}, {rm}"

[[instructions]]
name = "FCVT_W_S_RNE"
