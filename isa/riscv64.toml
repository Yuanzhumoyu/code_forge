# **类间位搬移**（v20 V7）：GPR 的位模式 → FPR。用于"ABI 落点的寄存器类与值的类**不同**"的
# 场合——psABI 的**整数约定收浮点**：RISC-V 的变参一律按整数约定传（浮点也不例外，见
# `docs/plans/varargs-plan.md` §5）、Zfinx/软浮点约定。缺这条角色 ⇒ 那条落点在生成物里
# fail-closed（拿同类搬移顶上会把 FPR 的号当 GPR 号用 = **静默错值**）。
data_width = 32

