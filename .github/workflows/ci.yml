name: CI

on:
  push:
    branches: [main, v14-forge-ir-redesign]
  pull_request:
    branches: [main, v14-forge-ir-redesign]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustfmt
      - run: rustup override set nightly-2026-09-05
      - run: cargo fmt --all -- --check

  # Clippy (exclude forge-rustc which needs rustc_private)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: clippy, rustc-dev
      - run: rustup override set nightly-2026-09-05
      - name: Clippy gate
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude forge-rustc --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Emit clippy failure details
        if: failure()
        run: |
          ERR=$(grep -E '^(error|warning|  -->)' /tmp/clippy.log | tail -60 | tr '\r\n' ' ' | head -c 7000)
          echo "::error file=clippy.log,title=Clippy failure::${ERR}"
      - name: Upload clippy log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: /tmp/clippy.log
          if-no-files-found: ignore

  # Tests on Linux (exclude forge-rustc)
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      # P0-18：安装 QEMU（qemu-system-misc 含 riscv64 模拟器）——riscv 矩阵
      # 必须真实执行（此前 CI 无 QEMU → 矩阵全 Skip 仍 PASS，假绿）。
      # P3：qemu-system-arm 提供 qemu-system-aarch64——arm64_v12 jit_matrix
      # 经 semihosting 真跑（forge-tests lib 用例），避免 arm64 执行回归无门禁。
      - name: Install QEMU (riscv64 + aarch64)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc qemu-system-arm
      # ⚠️ forge-codegen lib 测试（jit feature 109 个）在 ubuntu **不可通过**：
      # 串行实证 `runtime::jit::tests::test_jit_atomic_rmw_basic` 确定性
      # SIGSEGV（Windows 从不复现）——x86 机器码按 Windows x64 ABI 生成，在
      # SysV（Linux）宿主上经 extern "C" 调用参数寄存器错位 → 解引用崩溃。
      # 该测试集由 test-windows（Windows x64 ABI 一致）覆盖，Linux 排除。
      # 默认 features（jit 等）；**不带 --all-features**——all-features 会把
      # forge-tests 的 nightly feature 打开 → 依赖 forge-rustc（rustc_private
      # dylib，linux/macOS 需链接 libLLVM 且 macOS arm64 分支受 edition 2024
      # unsafe extern 约束），该套件由独立 job「forge-tests (nightly)」覆盖
      #（Windows 上跑，dylib 链接环境与本地一致）。
      # ⚠️ 步骤拆分（2026-09 P3）：arm64/riscv QEMU 矩阵独立成步——此前整个
      # workspace run 的失败（forge-tests 内非 QEMU 的宿主执行测试在 Linux
      # 偶发）会连带淹没 QEMU 门禁结果。矩阵单独跑：arm64 jit_matrix 真跑
      # 门禁成立 + 失败可定位到具体矩阵用例。
      - name: Test arm64 QEMU matrix (real exec)
        run: cargo test -p forge-tests --lib jit_matrix_arm64_v12 -- --nocapture
      - name: Test riscv64 QEMU matrix (real exec)
        run: |
          set -o pipefail
          cargo test -p forge-tests --lib jit_matrix_riscv64_v12 -- --nocapture 2>&1 | tee /tmp/riscv.log
      - name: Emit riscv matrix failure details
        if: failure()
        run: |
          ERR=$(grep -E 'FAIL|panicked|error|assert' /tmp/riscv.log | tail -40 | tr '\r\n' ' ' | head -c 6000)
          echo "::error file=riscv.log,title=riscv matrix failure::${ERR}"
      - name: Test remaining workspace (no forge-rustc/forge-codegen/forge-tests)
        run: cargo test --workspace --exclude forge-rustc --exclude forge-codegen --exclude forge-tests
      - name: Test forge-tests lib (host-exec tests)
        run: cargo test -p forge-tests --lib

  # Tests on Windows
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo test --workspace --exclude forge-rustc

  # Tests on macOS
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo test --workspace --exclude forge-rustc

  # forge-rustc 编译检查（rustc_private 依赖 nightly + rustc-dev；P4.6 纳入 CI）
  forge-rustc-check:
    name: forge-rustc (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustc-dev
      - run: rustup override set nightly-2026-09-05
      - run: cargo check -p forge-rustc

  # forge-rustc 端到端真值测试（Windows：需 MSVC 链接器；rust-src 供
  # e2e 的 cargo +nightly -Z build-std 流程。全部 job 钉版
  # nightly-2026-09-05（1.100，与本地验证工具链及 rustc_compat.rs
  # 适配版本一致；forge-rustc 需 2026-08-31 起的 LangItem 路径，
  # 更早的 1.99 无法编译）。bump 时同步 tests/e2e.rs 的 NIGHTLY。
  forge-rustc-e2e:
    name: forge-rustc (e2e, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustc-dev, rust-src
      - run: rustup override set nightly-2026-09-05
      # P0-21：先构建 wrapper（e2e.rs 断言 wrapper.exe 存在；此前 CI
      # fresh checkout 无此产物 → job 必红）。
      - name: Build forge-rustc-wrapper
        run: cargo build --manifest-path tools/forge-rustc-wrapper/Cargo.toml
      # --test-threads=1：e2e binary 内 6 个测试并发各起嵌套 rustc/cargo
      # 编译——CI 2 核 runner 上互抢导致偶发 compile/run 超时（simd/alloc
      # 用例假败）；串行化后嵌套编译独占资源。
      - run: cargo test -p forge-rustc --test e2e -- --test-threads=1
      # cargo-forge cli_tests（真跑位）：上一步已产出 target/debug/forge_rustc.dll，
      # 本 job 有 rust-src；FORGE_CLI_TOOLCHAIN 钉版使嵌套 cargo 用已装 channel
      #（缺省会找 +nightly 别名 → rustup 自动下载最新 nightly，与钉版 dll 错配）。
      # cli_tests 的 SKIP 门（dll && rust-src）在本环境放行 → 6 条真跑。
      - name: cargo-forge cli_tests
        env:
          FORGE_CLI_TOOLCHAIN: "+nightly-2026-09-05"
        run: cargo test -p cargo-forge --test cli_tests -- --test-threads=1

  # forge-tests nightly（forge-rustc 后端集成；需 nightly + rustc-dev 组件）。
  # 放 Windows：forge-rustc 是 crate-type=dylib 的 rustc_private 后端——Linux
  # rustup 工具链缺 libLLVM-*.so（rust-lld: unable to find library -lLLVM-*，
  # minimal profile + rustc-dev 不含）无法链接，Windows 与本机开发环境一致。
  forge-tests-nightly:
    name: forge-tests (nightly / forge-rustc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustc-dev
      - run: rustup override set nightly-2026-09-05
      - run: cargo test -p forge-tests --features nightly

  # Docs check
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Benchmarks compile check
  bench-check:
    name: Benchmarks (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo bench --no-run --workspace --exclude forge-rustc

  # Code coverage via cargo-tarpaulin
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - uses: taiki-e/install-action@cargo-tarpaulin
      - name: Generate coverage
        # 默认 features（不开 --all-features：那会启用 forge-tests 的 nightly
        # → 编译 rustc_private 的 forge-rustc dylib，Linux 缺 libLLVM 无法链接）。
        # ⚠️ 临时排除 forge-codegen：其 lib 测试在 ubuntu 并行下 SIGSEGV（与
        # test-linux 同因，见该 job 探针注释）——tarpaulin 无法串行；根修后恢复。
        run: cargo tarpaulin --out xml --workspace --exclude forge-rustc --exclude forge-codegen
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false


