name: CI

on:
  push:
    branches: [main, v14-forge-ir-redesign]
  pull_request:
    branches: [main, v14-forge-ir-redesign]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy (exclude forge-rustc which needs rustc_private)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustc-dev
      - run: cargo clippy --workspace --exclude forge-rustc --all-targets --all-features -- -D warnings

  # Tests on Linux (exclude forge-rustc)
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev
      - run: cargo test --workspace --exclude forge-rustc --all-features

  # Tests on Windows
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev
      - run: cargo test --workspace --exclude forge-rustc --all-features

  # Tests on macOS
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev
      - run: cargo test --workspace --exclude forge-rustc --all-features

  # forge-rustc 编译检查（rustc_private 依赖 nightly + rustc-dev；P4.6 纳入 CI）
  forge-rustc-check:
    name: forge-rustc (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev
      - run: cargo check -p forge-rustc

  # forge-rustc 端到端真值测试（Windows：需 MSVC 链接器；rust-src 供
  # e2e 的 cargo +nightly -Z build-std 流程。nightly 用最新——rustc API
  # 漂移由 rustc_compat.rs 适配层兜底，CI 能提前暴露漂移）
  forge-rustc-e2e:
    name: forge-rustc (e2e, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev, rust-src
      - run: cargo test -p forge-rustc --test e2e

  # forge-tests nightly（forge-rustc 后端集成；需 nightly + rustc-dev 组件）
  forge-tests-nightly:
    name: forge-tests (nightly / forge-rustc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-dev
      - run: cargo test -p forge-tests --features nightly

  # Docs check
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Benchmarks compile check
  bench-check:
    name: Benchmarks (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo bench --no-run --workspace --exclude forge-rustc

  # Code coverage via cargo-tarpaulin
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-tarpaulin
      - name: Generate coverage
        run: cargo tarpaulin --out xml --all-features --workspace --exclude forge-rustc
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: cobertura.xml
          fail_ci_if_error: false
