name: CI

on:
  push:
    branches: [main, v14-forge-ir-redesign]
  pull_request:
    branches: [main, v14-forge-ir-redesign]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Format check
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustfmt
      - run: rustup override set nightly-2026-09-05
      - run: cargo fmt --all -- --check

  # Clippy (exclude forge-rustc which needs rustc_private)
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: clippy, rustc-dev
      - run: rustup override set nightly-2026-09-05
      - name: Clippy gate
        run: |
          set -o pipefail
          cargo clippy --workspace --exclude forge-rustc --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.log
      - name: Upload clippy log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-log
          path: /tmp/clippy.log
          if-no-files-found: ignore

  # Tests on Linux (exclude forge-rustc)
  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      # P0-18：安装 QEMU（qemu-system-misc 含 riscv64 模拟器）——riscv 矩阵
      # 必须真实执行（此前 CI 无 QEMU → 矩阵全 Skip 仍 PASS，假绿）。
      # P3：qemu-system-arm 提供 qemu-system-aarch64——arm64_v12 jit_matrix
      # 经 semihosting 真跑（forge-tests lib 用例），避免 arm64 执行回归无门禁。
      - name: Install QEMU (riscv64 + aarch64)
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc qemu-system-arm
      # ⚠️ forge-codegen lib 测试（jit feature 109 个）在 ubuntu **不可通过**：
      # 串行实证 `runtime::jit::tests::test_jit_atomic_rmw_basic` 确定性
      # SIGSEGV（Windows 从不复现）——x86 机器码按 Windows x64 ABI 生成，在
      # SysV（Linux）宿主上经 extern "C" 调用参数寄存器错位 → 解引用崩溃。
      # 该测试集由 test-windows（Windows x64 ABI 一致）覆盖，Linux 排除。
      # 默认 features（jit 等）；**不带 --all-features**——all-features 会把
      # forge-tests 的 nightly feature 打开 → 依赖 forge-rustc（rustc_private
      # dylib，linux/macOS 需链接 libLLVM 且 macOS arm64 分支受 edition 2024
      # unsafe extern 约束），该套件由独立 job「forge-tests (nightly)」覆盖
      #（Windows 上跑，dylib 链接环境与本地一致）。
      # ⚠️ 步骤拆分（2026-09 P3）：arm64/riscv QEMU 矩阵独立成步——此前整个
      # workspace run 的失败（forge-tests 内非 QEMU 的宿主执行测试在 Linux
      # 偶发）会连带淹没 QEMU 门禁结果。矩阵单独跑：arm64 jit_matrix 真跑
      # 门禁成立 + 失败可定位到具体矩阵用例。
      - name: Test arm64 QEMU matrix (real exec)
        run: cargo test -p forge-tests --lib jit_matrix_arm64_v12 -- --nocapture
      - name: Test riscv64 QEMU matrix (real exec)
        run: |
          set -o pipefail
          cargo test -p forge-tests --lib jit_matrix_riscv64_v12 -- --nocapture 2>&1 | tee /tmp/riscv.log
      - name: Test remaining workspace (no forge-rustc/forge-codegen/forge-tests)
        run: cargo test --workspace --exclude forge-rustc --exclude forge-codegen --exclude forge-tests
      - name: Test forge-tests lib (host-exec tests)
        run: cargo test -p forge-tests --lib

  # Tests on Windows
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo test --workspace --exclude forge-rustc

  # Tests on macOS
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo test --workspace --exclude forge-rustc

  # forge-rustc 编译检查（rustc_private 依赖 nightly + rustc-dev；P4.6 纳入 CI）
  forge-rustc-check:
    name: forge-rustc (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustc-dev
      - run: rustup override set nightly-2026-09-05
      - run: cargo check -p forge-rustc

  # forge-rustc 端到端真值测试（Windows：需 MSVC 链接器；rust-src 供
  # e2e 的 cargo +nightly -Z build-std 流程。全部 job 钉版
  # nightly-2026-09-05（1.100，与本地验证工具链及 rustc_compat.rs
  # 适配版本一致；forge-rustc 需 2026-08-31 起的 LangItem 路径，
  # 更早的 1.99 无法编译）。bump 时同步 tests/e2e.rs 的 NIGHTLY。
  forge-rustc-e2e:
    name: forge-rustc (e2e, Windows)
    # 机型实验（2026-09-11，已做毕）：vec_push / vec_iter_enumerate 的确定性 AV
    # 曾被怀疑与 OS SKU 相关，故把本 job 临时钉到 windows-2022 单变量验证——
    # 结果 **Server 2022 的 AMD 机型同样 20/20 AV**（`.text` 指纹与本机仍逐字节
    # 相同）⇒ 变量是**机型（实测均 AMD Family 25）**而非 OS SKU，钉版无益，回退。
    # 详见 docs/plans/forge-rustc-vec_push-plan.md §9.5。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustc-dev, rust-src
      - run: rustup override set nightly-2026-09-05
      # P0-21：先构建 wrapper（e2e.rs 断言 wrapper.exe 存在；此前 CI
      # fresh checkout 无此产物 → job 必红）。
      - name: Build forge-rustc-wrapper
        run: cargo build --manifest-path tools/forge-rustc-wrapper/Cargo.toml
      # --test-threads=1：e2e binary 内 6 个测试并发各起嵌套 rustc/cargo
      # 编译——CI 2 核 runner 上互抢导致偶发 compile/run 超时（simd/alloc
      # 用例假败）；串行化后嵌套编译独占资源。
      # 取证（2026-09-10）：5 个 FLAKY 用例的偶发失败在本机 ≈1/100，只有失败轮的
      # `KNOWN <case> error: …` 文案 + 产物能定性（此前 CI 失败即随 runner 销毁）；
      # 见 docs/plans/forge-rustc-vec_push-plan.md §9.1。故：tee 落盘 + 开
      # FORGE_E2E_KEEP（失败轮工作目录不删） + 失败时上传 e2e-evidence。
      # 严格模式（2026-09-10 起，试运行）：FLAKY 用例**只容忍超时**（已定性宿主侧
      # 环境性，仍有同产物复跑兜底），**错码按 FAIL 硬失败**——把 5 例的正确性重新
      # 纳入门禁。run #25/#26 由此抓到 CI 稳定 AV（0xC0000005）的 vec_push /
      # vec_iter_enumerate（容忍口径下被 KNOWN 掩盖成 passed: 101/103）。
      - name: Run e2e (stage A + M4 parallel)
        env:
          FORGE_E2E_KEEP: "1"
          FORGE_E2E_STRICT_FLAKY: "1"
          # libtest 捕获"通过"测试的 stdout ⇒ 被容忍的 KNOWN/CI-ENV-AV/RETRY 在日志里
          # 看不见（run #28 就是全绿但无法判断有没有踩到环境性 AV）。落事件文件，
          # 由下方 if: always() 步骤打印。
          FORGE_E2E_EVENTS: "${{ github.workspace }}/target/tmp/e2e_events.txt"
        run: |
          New-Item -ItemType Directory -Force -Path target\tmp | Out-Null
          Remove-Item target\tmp\e2e_events.txt -ErrorAction SilentlyContinue
          cargo test -p forge-rustc --test e2e -- --test-threads=1 2>&1 |
            Tee-Object -FilePath "${{ runner.temp }}/e2e.log" -Encoding utf8
          exit $LASTEXITCODE
      - name: Show e2e events (always)
        if: always()
        run: |
          if (Test-Path target\tmp\e2e_events.txt) {
            '--- e2e events ---'
            Get-Content target\tmp\e2e_events.txt
          } else { '--- e2e events: (file absent) ---' }
      # CI 环境 AV 的**概率**探针（always）：产物与本机逐字节相同却只在 runner 上
      # AV，机制未定位（OS/安全策略候选）。这里不依赖"本轮是否恰好命中"——用
      # FORGE_E2E_ONLY + FORGE_E2E_TIMEOUT_SECS=0 让 harness 当轮"失败"从而保留
      # 刚构建的产物，再对**同一 exe** 连跑 20 次给退出码直方图：
      # 全 AV ⇒ 该 runner 上确定性；混合 ⇒ 与地址随机化/时序相关的环境性。
      # （本机对照：两例各 20 次全为正确退出，0 AV。）
      - name: Probe CI-env AV rate (always)
        if: always()
        run: |
          Remove-Item Env:FORGE_E2E_EVENTS -ErrorAction SilentlyContinue
          $env:FORGE_E2E_KEEP = '1'
          $env:FORGE_E2E_TIMEOUT_SECS = '0'
          foreach ($c in 'vec_push', 'vec_iter_enumerate') {
            $env:FORGE_E2E_ONLY = $c
            cargo test -p forge-rustc --test e2e -- --nocapture e2e_stage_a_scalar_cases 2>&1 | Out-Null
            $d = Get-ChildItem "$env:TEMP" -Directory -Filter 'forge_rustc_e2e*' -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $d) { "[probe] $c : 未找到保留的工作目录"; continue }
            $exe = Join-Path $d.FullName "$c.exe"
            if (-not (Test-Path $exe)) { "[probe] $c : 产物缺失 ($($d.FullName))"; continue }
            $codes = @()
            for ($i = 1; $i -le 20; $i++) {
              $p = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
              if ($p.WaitForExit(15000)) { $codes += $p.ExitCode } else { $p.Kill(); $codes += 'HANG' }
            }
            $plain = ($codes | Group-Object | ForEach-Object {
                if ($_.Name -eq 'HANG') { $_.Name }
                elseif ([int]$_.Name -eq -1073741819) { "AVx$($_.Count)" }
                else { "$($_.Name)x$($_.Count)" }
              }) -join ' '
            "[probe] $c 20 runs: $plain   (text_sha256=$(& crates\tools\forge-rustc\tests\pe_text_hash.ps1 $exe | ForEach-Object { ($_ -split ' ')[0] }))"
            Remove-Item -Recurse -Force $d.FullName -ErrorAction SilentlyContinue
          }
          Remove-Item Env:FORGE_E2E_ONLY, Env:FORGE_E2E_KEEP, Env:FORGE_E2E_TIMEOUT_SECS -ErrorAction SilentlyContinue
          # 分配路径逐步裁剪（诊断）：new_only / one_push / two_push / six_push /
          # iter_enum + bump 分配器对照 —— 哪一步先 AV，崩溃点就落在哪条路径上；
          # bump 变体通过而 naive 变体 AV ⇒ 触发条件就是"每次 alloc 返回同一地址"。
          '--- alloc-step probe (diagnostic) ---'
          cargo test -p forge-rustc --test e2e -- --nocapture e2e_alloc_step_probe 2>&1 |
            Select-String -Pattern '^PROBE |test result:'
          # runner 指纹：同一份机器码只在某些机上崩 ⇒ 把机型/OS 版本/缓解策略打出来，
          # 与本机（无 AV）对照，才能说清"机器相关的那个变量"是什么。
          # （只用注册表 + 环境变量，`Get-CimInstance` 在受限环境里可能不可用。）
          '--- runner fingerprint ---'
          "OS: " + [System.Environment]::OSVersion.VersionString
          $cv = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -ErrorAction SilentlyContinue
          "Build: $($cv.CurrentBuild).$($cv.UBR)  DisplayVersion: $($cv.DisplayVersion)  Product: $($cv.ProductName)"
          "CPU: $env:PROCESSOR_IDENTIFIER  cores: $env:NUMBER_OF_PROCESSORS"
          # WER 崩溃记录（含 exception code 与 fault offset）——本机有逐字节相同的
          # .text，拿到偏移即可反查是哪条指令在崩（机制定位的最后一块拼图）。
          '--- Application Error (WER) entries ---'
          Get-WinEvent -FilterHashtable @{
              LogName      = 'Application'
              ProviderName = 'Application Error'
              StartTime    = (Get-Date).AddMinutes(-15)
            } -MaxEvents 8 -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Message -replace "`r?`n", ' | ' }
          # 探针里的 cargo test 是"故意失败"（TIMEOUT_SECS=0 + passed>0 守卫），
          # 不能让它的退出码把 job 弄红——本步骤永远成功返回。
          exit 0
      # ⚠️ runner.temp（D:\a\_temp）≠ 测试进程的 %TEMP%（C:\Users\RUNNER~1\…）——
      # run #25/#26 的 artifact 因此只有 e2e.log、没有保留的失败工作目录。本步按
      # `$env:TEMP` 收集：打印每个产物的 `.text` SHA256（跨机可比指纹，见
      # crates/tools/forge-rustc/tests/pe_text_hash.ps1），并**只回传失败用例**的
      # `.rs/.exe`（保留目录含全部 103 例，全传是 ~10 MB 级噪声）。
      - name: Collect e2e evidence (.text digests + kept workdirs)
        if: failure()
        run: |
          . crates\tools\forge-rustc\tests\pe_text_hash.ps1
          $log = "${{ runner.temp }}/e2e.log"
          $dst = 'target\tmp\e2e_keep'
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          $lines = @()
          $keepLine = Select-String -Path $log -Pattern '\[keep\] 失败用例 \[(.*?)\]' -ErrorAction SilentlyContinue |
            Select-Object -Last 1
          $failed = @()
          if ($keepLine) {
            $failed = [regex]::Matches($keepLine.Line, '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          }
          $lines += "[evidence] 失败用例: " + ($failed -join ', ')
          foreach ($d in Get-ChildItem "$env:TEMP" -Directory -Filter 'forge_rustc_e2e*' -ErrorAction SilentlyContinue) {
            $lines += "[keep] $($d.FullName)"
            foreach ($exe in Get-ChildItem $d.FullName -Filter '*.exe' -ErrorAction SilentlyContinue) {
              $lines += ("[evidence] {0,-26} bytes={1,-8} text_sha256={2}" -f `
                  $exe.Name, $exe.Length, (Get-PeTextSha256 -Path $exe.FullName))
            }
            foreach ($c in $failed) {
              Copy-Item (Join-Path $d.FullName "$c.rs") $dst -Force -ErrorAction SilentlyContinue
              Copy-Item (Join-Path $d.FullName "$c.exe") $dst -Force -ErrorAction SilentlyContinue
            }
          }
          $lines += "[evidence] uploaded: " + ((Get-ChildItem $dst -ErrorAction SilentlyContinue | ForEach-Object Name) -join ', ')
          $lines | Tee-Object -FilePath $log -Append
      - name: Upload e2e evidence (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-evidence
          path: |
            ${{ runner.temp }}/e2e.log
            target/tmp/e2e_events.txt
            target/tmp/e2e_keep/**
          if-no-files-found: ignore
      # cargo-forge cli_tests（真跑位）：上一步已产出 target/debug/forge_rustc.dll，
      # 本 job 有 rust-src；FORGE_CLI_TOOLCHAIN 钉版使嵌套 cargo 用已装 channel
      #（缺省会找 +nightly 别名 → rustup 自动下载最新 nightly，与钉版 dll 错配）。
      # cli_tests 的 SKIP 门（dll && rust-src）在本环境放行 → 6 条真跑。
      # ⚠️ cli_file_mode_alloc 在 CI Windows runner 环境性 AV（run12-18 实证，
      # 5 次重试后仍偶发）——产物经 artifact 双证与本地等价且本地运行正确
      #（见 cli_tests.rs assert_exit_alloc 注释），非代码/后端缺陷。
      - name: cargo-forge cli_tests
        env:
          FORGE_CLI_TOOLCHAIN: "+nightly-2026-09-05"
        run: cargo test -p cargo-forge --test cli_tests -- --test-threads=1

  # forge-tests nightly（forge-rustc 后端集成；需 nightly + rustc-dev 组件）。
  # 放 Windows：forge-rustc 是 crate-type=dylib 的 rustc_private 后端——Linux
  # rustup 工具链缺 libLLVM-*.so（rust-lld: unable to find library -lLLVM-*，
  # minimal profile + rustc-dev 不含）无法链接，Windows 与本机开发环境一致。
  forge-tests-nightly:
    name: forge-tests (nightly / forge-rustc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
          components: rustc-dev
      - run: rustup override set nightly-2026-09-05
      - run: cargo test -p forge-tests --features nightly

  # Docs check
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # Benchmarks compile check
  bench-check:
    name: Benchmarks (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: cargo bench --no-run --workspace --exclude forge-rustc

  # Code coverage via cargo-tarpaulin
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-05
      - run: rustup override set nightly-2026-09-05
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        # 白名单纯逻辑库 crate + llvm-cov（非 ptrace）：tarpaulin 在 ubuntu
        # runner 上稳定 "Test failed during run"（连纯库白名单也崩——
        # ptrace 与 runner 环境不兼容）；llvm-cov 走正常子进程执行无
        # 该问题。执行面（QEMU 矩阵/JIT/x86 宿主）由 test-linux/test-windows
        # 覆盖，coverage 只报告纯库。
        # 默认 features（不开 --all-features：forge-tests nightly → rustc_private
        # dylib，Linux 缺 libLLVM 无法链接）。
        run: cargo llvm-cov --no-clean --workspace --exclude forge-rustc --exclude forge-codegen --exclude forge-tests --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false


