# cargo-deny 配置（CI job `supply-chain` 使用；本地复跑：
#   cargo deny --config .github/deny.toml check advisories licenses
# 放 .github/ 下而不是仓库根：本文件只服务 CI 供应链检查，不属于 crate 构建输入。
[graph]
targets = []
all-features = true

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
yanked = "warn"
notice = "warn"
ignore = []

[licenses]
version = 2
# 本仓库自身是 MIT OR Apache-2.0；依赖白名单按 Rust 生态常见宽松/弱 copyleft 许可列。
# 命中未知许可时 job 红 → 人工复审后在此登记，而不是放宽成 allow-all。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "Unlicense",
]
confidence-threshold = 0.9
# 工作区内的自有 crate 不逐个声明许可来源。
private = { ignore = true }
exceptions = []
